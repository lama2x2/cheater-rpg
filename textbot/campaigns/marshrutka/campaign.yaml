# «Маршрутка» — своя история в духе классического Стикса. Режим real: без интерфейса, одна жизнь.
id: marshrutka
title: "Маршрутка"
version: 1
mode: real
order: 2
length: "30–40 минут"
about: "Вечер, пробка, кислый туман и восемь попутчиков. Одна жизнь."
teaser: >
  Маршрутка №47 стоит в пробке на въезде на мост. Жара, духота, водитель ругается с диспетчером,
  который не отвечает. С реки ползёт туман — густой, с кислым привкусом. Восемь пассажиров.
  К утру не все из них останутся людьми.
start: bus

vars:
  sick:   { start: 0 }   # сколько обращающихся в вашей группе (не запертых)
  allies: { start: 0 }   # сколько живых спутников дошло
  doubt:  { start: 0 }   # подозрения насчёт Рустама

items:
  water:   { name: "Бутылка воды" }
  pipe:    { name: "Обрезок трубы" }
  kit:     { name: "Аптечка" }

time:
  limit: 16
  label: "С начала тумана: {time} ч"
  on_limit: too_late

death:
  real: ending
  real_final: death_end
