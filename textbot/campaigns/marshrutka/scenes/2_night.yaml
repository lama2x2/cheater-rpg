# Глава 2. Ночь: школа или маршрутка.

- id: school_run
  text: |
    Михалыч открывает дверь, матерясь. Двести метров тумана. Кислый воздух режет горло, под
    ногами хрустит стекло, где-то рядом кто-то урчит — низко, как голодная собака. Вы бежите
    к тёмному зданию с колоннами и вывеской «Школа №12», которой, как шепчет Дэн, здесь
    тоже вчера не было.

    Дверь в спортзал не заперта. Внутри пахнет резиной и пылью.
  on_enter:
    - "var.sick = 0"
    - { if: "flag.g_timur", then: ["var.sick += 1"] }
    - { if: "flag.g_zoya", then: ["var.sick += 1"] }
    - { if: "flag.g_viktor", then: ["var.sick += 1"] }
    - { if: "flag.g_mih", then: ["var.sick += 1"] }
    - "time += 1"
  choices:
    - label: "Забаррикадировать дверь матами"
      goto: school

- id: school
  chapter: "Ночь"
  checkpoint: true
  text: |
    Спортзал, маты под дверью, свет только от телефонов, которые всё равно ни на что не
    годятся. За окнами — туман и звуки, от которых хочется заткнуть уши.

    Люди сидят кучками и не смотрят друг другу в глаза.
  again: "Вы возвращаетесь в спортзал. Кто-то дремлет на матах, кто-то смотрит в темноту."
  extra:
    - if: "flag.g_liza"
      text: "Лиза сидит рядом с вами и молча обнимает тубус."
    - if: "flag.g_vera"
      text: "Вера проверяет, у кого какие таблетки с собой."
    - if: "flag.g_dan"
      text: "Дэн сидит у окна с ножом-бабочкой и делает вид, что ему не страшно."
    - if: "flag.g_rustam"
      text: "Рустам стоит у окна и слушает рацию, прижав её к уху."
    - if: "flag.g_timur"
      text: "Тимур жуёт что-то из термосумки — и всё время чешет шею."
    - if: "flag.g_zoya"
      text: "Зоя Петровна кашляет в платок. Платок красный."
    - if: "flag.g_viktor"
      text: "Виктор Палыч требует, чтобы все слушались его, и щурится на каждый огонёк."
    - if: "flag.g_mih"
      text: "Михалыч ходит из угла в угол и скребёт шею."
  choices:
    - label: "Попросить Веру осмотреть всех (1 ч)"
      if: "flag.g_vera and not flag.examined"
      effects: ["set flag.examined", "time += 1"]
      goto: examine
    - label: "Отделить тех, кто чешется и кашляет (1 ч)"
      if: "var.sick > 0 and not flag.examined and not flag.separated"
      effects: ["set flag.separated", "time += 1"]
      goto: separate
    - label: "Обыскать школу (1 ч)"
      if: "not flag.searched"
      effects: ["set flag.searched", "time += 1"]
      goto: search
    - label: "Залезть на крышу школы и осмотреться (1 ч)"
      if: "not flag.roof"
      effects: ["set flag.roof", "time += 1"]
      goto: school_roof
    - label: "Найти Лизу на кухне"
      if: "flag.g_liza and not flag.liza_talk"
      effects: ["set flag.liza_talk"]
      goto: kitchen
    - label: "Поговорить с Рустамом у окна"
      if: "flag.g_rustam and not flag.r_talk"
      effects: ["set flag.r_talk"]
      goto: rustam_talk
    - label: "Вызваться дежурить первым (5 ч)"
      if: "flag.g_dan"
      effects: ["time += 5"]
      goto: watch
    - label: "Лечь спать (5 ч)"
      effects: ["time += 5"]
      goto:
        - { if: "var.sick > 0", goto: night_turn }
        - { goto: night_quiet }

- id: school_roof
  text: |
    Пожарная лестница ведёт на плоскую крышу. Туман внизу, как молоко в кастрюле, а над ним
    торчат верхушки домов — чужих, незнакомых. Пожары в трёх местах. Мост, на котором
    стояла маршрутка, — в тумане целиком.

    А на востоке, за рекой, на холме — огоньки. Не пожар: ровные, жёлтые, как окна. И
    прожектор, который медленно шарит по склону.
  on_enter: ["set flag.saw_lights"]
  choices:
    - label: "Спуститься к остальным"
      goto: school

- id: kitchen
  text: |
    Лиза сидит в школьной столовой, на столе — электрочайник без тока и пачка печенья.
    — Я архитектор, — говорит она, не поднимая глаз. — Почти. Я этот город знаю по чертежам,
    каждый квартал. И этих домов на чертежах нет. Понимаешь? Это не наш город. Нас куда-то…
    перенесли. Вместе с куском улицы.

    Она протягивает вам печенье. Руки у неё не трясутся — уже нет.
  choices:
    - label: "«Мы выберемся»"
      text: "— Конечно, — говорит она. Не верит. Но кивает."
      goto: school
    - label: "«Нарисуй, что видела с моста»"
      effects: ["set flag.liza_map"]
      text: "Лиза достаёт из тубуса лист и за пять минут рисует план: река, мост, холм на востоке, пешеходный мостик выше по течению. — Вот тут, — она стучит карандашом, — самый узкий переход."
      goto: school

- id: watch
  text: |
    Вы с Дэном сидите у забаррикадированной двери. Он долго молчит, потом говорит в темноту:
    — У меня мать на том берегу. Ну, на том, который был. Я ей утром нахамил. Последнее, что
    сказал, — «отстань». Прикинь.

    Вы не знаете, что ответить. Дэн хмыкает.
  extra:
    - if: "flag.g_rustam"
      text: "— И этот ваш Рустам, — добавляет Дэн тише, — ночью по рации с кем-то трёт. Я слышал слово «клетки». Я не дурак."
  on_enter:
    - { if: "flag.g_rustam", then: ["var.doubt += 1"] }
  choices:
    - label: "Досидеть до рассвета"
      goto:
        - { if: "var.sick > 0", goto: night_turn }
        - { goto: night_quiet }

- id: examine
  text: |
    Вера обходит всех с фонариком телефона: зрачки, лоб, шея, пульс. Возвращается к вам и
    говорит очень тихо, чтобы слышали только вы.
  extra:
    - if: "var.sick == 0"
      text: "— Все чистые. Странно, но все. Можно спать."
    - if: "flag.g_timur"
      text: "— Курьер. Температура под сорок, зрачки как точки. И он ест сырое."
    - if: "flag.g_zoya"
      text: "— Бабушка. Кашель с кровью и… она укусила меня, когда я мерила пульс. Не сильно. Пока."
    - if: "flag.g_viktor"
      text: "— Мужик в костюме. Глаза не реагируют на свет совсем. Он уже почти не здесь."
    - if: "flag.g_mih"
      text: "— Водитель. Шея расчёсана до мяса. Он не чувствует боли."
    - if: "var.sick > 0"
      text: "— Я не знаю, что это. Но к утру они будут как те, на мосту. Я уверена."
  choices:
    - label: "Запереть их в кабинете труда — для их же блага"
      if: "var.sick > 0"
      effects: ["var.sick = 0", "set flag.locked"]
      text: "Вы врёте им про «карантин до утра». Они верят. Дверь кабинета труда железная, ключ в замке."
      goto: school
    - label: "Сказать им уйти"
      if: "var.sick > 0"
      effects: ["var.sick = 0", "set flag.expelled"]
      text: "Они уходят в туман, не понимая за что. Виктор Палыч обещает жаловаться. Вера отворачивается."
      goto: school
    - label: "Ничего не делать. Может, Вера ошибается"
      goto: school

- id: separate
  text: |
    Без врача вы можете полагаться только на то, что видели сами. Вы отводите в сторону тех,
    кто показался вам больным, и уговариваете их переночевать в соседнем классе — «чтобы не
    заражать остальных».
  on_enter:
    - { if: "flag.g_timur and flag.t_timur", then: ["var.sick -= 1", "set flag.sep_timur"] }
    - { if: "flag.g_zoya and flag.t_zoya", then: ["var.sick -= 1", "set flag.sep_zoya"] }
    - { if: "flag.g_viktor and flag.t_viktor", then: ["var.sick -= 1", "set flag.sep_viktor"] }
    - { if: "flag.g_mih and flag.t_mih", then: ["var.sick -= 1", "set flag.sep_mih"] }
  extra:
    - if: "flag.sep_timur"
      text: "Тимур уходит с термосумкой, обиженно хохотнув."
    - if: "flag.sep_zoya"
      text: "Зоя Петровна уходит, кашляя и извиняясь."
    - if: "flag.sep_viktor"
      text: "Виктор Палыч уходит, обещая всех «запомнить»."
    - if: "flag.sep_mih"
      text: "Михалыч уходит, хлопнув дверью класса."
    - if: "var.sick > 0"
      text: "Кого-то вы, похоже, не разглядели. Кто-то в спортзале всё ещё чешется в темноте."
    - if: "var.sick == 0"
      text: "Похоже, вы разглядели всех, кого надо."
  choices:
    - label: "Вернуться к остальным"
      goto: school

- id: search
  text: |
    Коридоры пустые, двери классов распахнуты. В учительской — электрочайник и печенье.
    В медкабинете — аптечка, почти полная. В мастерской — обрезки труб.
  extra:
    - if: "flag.g_rustam"
      text: "На обратном пути вы слышите голос Рустама за углом. Он говорит в рацию: «…свежих семеро, двое крепкие. К утру приведу к Пристани. Да. Как договаривались». Вы замираете. Он не видит вас."
  on_enter:
    - "item.kit += 1"
    - "item.pipe += 1"
    - "item.water += 1"
    - { if: "flag.g_rustam", then: ["var.doubt += 2", "set flag.heard_radio"] }
  choices:
    - label: "Вернуться в спортзал"
      goto: school

- id: rustam_talk
  text: |
    — Ты не бойся, — Рустам говорит тихо и тепло. — Я такое видел. Это не конец света, это
    просто… переезд. Утром выведу всех к реке. Там Пристань, там люди с оружием, еда, порядок.
    Таких, как мы, они берут.

    — Каких «таких»?
  extra:
    - if: "flag.g_dan"
      text: "Дэн, проходя мимо, едва слышно бросает вам: «Он на нас смотрит, как на мясо на рынке»."
  on_enter:
    - { if: "flag.g_dan", then: ["var.doubt += 1"] }
  choices:
    - label: "«Откуда вы всё это знаете?»"
      effects: ["var.doubt += 1"]
      text: "— Работа такая, — Рустам улыбается шире, и улыбка не доходит до глаз. — Ложись спать. Утро вечера мудренее."
      goto: school
    - label: "Кивнуть. С ним спокойнее"
      goto: school

- id: night_quiet
  text: |
    Ночь проходит в полудрёме. За окнами кто-то бродит и урчит. Около четырёх в дверь
    спортзала скребутся — долго, терпеливо. Потом шаги удаляются.
  extra:
    - if: "flag.locked"
      text: "Из кабинета труда под утро доносится урчание. Ключ в замке вы не поворачиваете."
    - if: "flag.expelled"
      text: "Вы стараетесь не думать о тех, кого выгнали в туман."
  choices:
    - label: "Дождаться рассвета"
      goto: dawn

- id: night_turn
  text: |
    Вы просыпаетесь от крика. В темноте спортзала кто-то бьётся на матах, кто-то воет. Луч
    телефона выхватывает лицо — серое, с пустыми глазами и разинутым ртом. Это уже не человек.
    Оно стоит над кем-то из ваших.
  extra:
    - if: "var.sick >= 2"
      text: "И таких в зале не один."
  choices:
    - label: "Броситься на помощь ☠"
      roll:
        chance: "70 - var.sick * 15 + item.pipe * 15"
        success:
          text: "Вы бьёте — тем, что под рукой, — снова и снова, пока оно не перестаёт дёргаться. Ваши живы. Все."
          effects: ["var.sick = 0"]
          goto: dawn
        fail:
          text: "Вы бьёте — и промахиваетесь в темноте. Серое лицо поворачивается к вам."
          effects: ["die 'ночь в спортзале'"]
    - label: "Бежать к выходу"
      text: "Вы выскакиваете в коридор. Сзади кричат — и перестают. Утром вы вернётесь и увидите, кого вы оставили."
      effects:
        - "var.sick = 0"
        - if: "flag.g_liza"
          then: ["clear flag.g_liza", "set flag.lost_liza"]
          else:
            - if: "flag.g_vera"
              then: ["clear flag.g_vera", "set flag.lost_vera"]
              else:
                - { if: "flag.g_dan", then: ["clear flag.g_dan", "set flag.lost_dan"] }
      goto: dawn

- id: bus_night
  text: |
    Вы остаётесь. Двери заперты, окна в тумане. Михалыч включает аварийку, и маршрутка
    мигает оранжевым, как маяк для всего, что бродит снаружи.

    В три часа ночи Михалыч перестаёт ругаться. Совсем. Он медленно поворачивается в
    водительском кресле — и вы видите его глаза.
  choices:
    - label: "Выбить окно и бежать в туман с теми, кто ближе ☠"
      roll:
        chance: 50
        success:
          text: "Стекло лопается под ногой. Вы вываливаетесь наружу, следом — Лиза и Дэн. Сзади, в маршрутке, кричат. Вы бежите к тёмному зданию школы и до рассвета сидите в раздевалке."
          effects: ["set flag.g_liza", "set flag.g_dan", "time += 5"]
          goto: dawn
        fail:
          text: "Стекло не поддаётся с первого удара. Со второго — тоже. Михалыч уже рядом."
          effects: ["die 'маршрутка №47'"]
    - label: "Ударить его огнетушителем ☠"
      roll:
        chance: 35
        success:
          text: "Огнетушитель тяжёлый, удар выходит один. Но сзади уже кашляет Зоя Петровна — и кашель переходит в урчание. Вы распахиваете дверь и выводите тех, кто ещё человек: Веру, Лизу, Дэна."
          effects: ["set flag.g_vera", "set flag.g_liza", "set flag.g_dan", "time += 5"]
          goto: dawn
        fail:
          text: "Огнетушитель скользит в потных руках, удар уходит в подголовник. Михалыч не чувствует боли — и не промахивается."
          effects: ["die 'маршрутка №47'"]

- id: alone_night
  text: |
    Улица незнакомая. Пятиэтажки, которых не было, киоск с надписями на русском, но с
    чужими названиями. Вы забиваетесь в разбитый газетный киоск и сидите там всю ночь,
    сжимая в руке кусок кирпича. Мимо дважды кто-то проходит. Оба раза — урча.
  on_enter: ["time += 6"]
  choices:
    - label: "Дождаться рассвета"
      goto: dawn
