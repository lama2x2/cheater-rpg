# Глава 1. Пробка. Восемь попутчиков.
# Обратятся к утру: водитель Михалыч, Зоя Петровна, Виктор Палыч, курьер Тимур.
# Иммунные: студентка Лиза, медсестра Вера, Дэн; Рустам — иммунный-ветеран, наводчик охотников.

- id: bus
  chapter: "Пробка"
  checkpoint: true
  text: |
    Маршрутка №47 третий час стоит на въезде на мост. Жара не по сезону, окна не открываются,
    кондиционер умер ещё весной. Водитель Михалыч орёт в рацию — диспетчер молчит. Телефоны
    у всех показывают «Нет сети», и это злит людей сильнее пробки.

    Вы сидите у двери, на откидном. Вас здесь никто не знает, и вы никого. Восемь
    попутчиков — восемь чужих людей, с которыми вы почему-то застряли в одной консервной банке.

    С реки поднимается туман. Он ползёт по мосту между машинами, низкий и белёсый.
  choices:
    - label: "Присмотреться к тем, кто впереди"
      goto: front
    - label: "Присмотреться к тем, кто сзади"
      goto: back
    - label: "Смотреть в окно"
      goto: fog_window

- id: front
  text: |
    Впереди: водитель Михалыч — красная шея, золотая цепь, в зеркале злые глаза. За ним,
    у кабины, Зоя Петровна — бабушка с тележкой на колёсиках, в которой гремят банки.
    Мужчина в костюме, Виктор Палыч, — галстук ослаблен, лицо мокрое, говорит громче всех.
    И Дэн — пацан лет семнадцати, капюшон, наушники, ноги на сиденье напротив.
  choices:
    - label: "Заговорить с Михалычем"
      if: "not flag.t_mih"
      effects: ["set flag.t_mih"]
      text: "— Чё надо? — Михалыч скребёт шею так, что под ногтями кровь. — Сиди, сказал. Двери не открою, у меня инструкция. Жарко, блин… Чешется всё, как от комаров. Какие в апреле комары?"
    - label: "Помочь Зое Петровне с тележкой"
      if: "not flag.t_zoya"
      effects: ["set flag.t_zoya"]
      text: "— Спасибо, сынок. — Она кашляет, долго и мокро. — С рынка еду, внучку кормить. Котлеты везу, мясо свежее… — она заглядывает в тележку и сглатывает. — Ох, есть-то как хочется. Прямо сырое бы ела, прости господи."
    - label: "Спросить Виктора Палыча, что происходит"
      if: "not flag.t_viktor"
      effects: ["set flag.t_viktor"]
      text: "— Теракт, — уверенно говорит он, вытирая лоб. — Связь глушат. Сейчас приедут и разберутся. Главное — без паники, я в администрации работаю, я знаю. — Глаза у него красные, будто он не спал неделю, и он щурится даже на тусклый свет."
    - label: "Сесть рядом с Дэном"
      if: "not flag.t_dan"
      effects: ["set flag.t_dan"]
      text: "Дэн снимает один наушник. — Ты тоже заметил, да? — говорит он тихо. — Туман кислый. И дома на том берегу не те. Я тут каждый день езжу. Там была заправка. Её нет."
    - label: "Вернуться на своё место"
      goto: bus_hub

- id: back
  text: |
    Сзади: студентка Лиза с тубусом для чертежей — грызёт ногти и смотрит в окно. Курьер Тимур
    с огромной жёлтой термосумкой — весёлый, болтливый, всех угощает жвачкой. Медсестра Вера —
    сразу видно по зелёным брюкам от формы и усталым рукам. И Рустам — спокойный мужчина
    лет сорока с рацией на поясе. Единственный, кто не нервничает.
  choices:
    - label: "Заговорить с Лизой"
      if: "not flag.t_liza"
      effects: ["set flag.t_liza"]
      text: "— У меня защита диплома завтра, — Лиза нервно смеётся. — Я, кажется, не успею. Ты тоже чувствуешь кислое? Как будто батарейку лизнул."
    - label: "Поболтать с Тимуром"
      if: "not flag.t_timur"
      effects: ["set flag.t_timur"]
      text: "Тимур открыл чей-то заказ — шаурму — и выедает из неё мясо, выбрасывая лаваш. — Да клиент всё равно не дождётся, — подмигивает он. — Жрать охота — жуть. Мясо, прикинь, только мясо хочется. — Шея у него расчёсана в кровь."
    - label: "Спросить Веру, что с людьми"
      if: "not flag.t_vera"
      effects: ["set flag.t_vera"]
      text: "Вера смотрит поверх очков. — Я восемь лет в приёмном. Смотри: Михалыч чешется, бабушка кашляет, у мужика в костюме зрачки на свет не реагируют. Это не жара. Я не знаю, что это. Но держалась бы от них подальше."
    - label: "Поговорить с Рустамом"
      if: "not flag.t_rustam"
      effects: ["set flag.t_rustam"]
      text: "— Туман как туман, — Рустам улыбается. — Бывает. Ты, главное, держись меня, если что. Я тут кое-что знаю. — Рация у него на поясе шипит, и он убавляет звук раньше, чем вы успеваете что-то разобрать."
    - label: "Вернуться на своё место"
      goto: bus_hub

- id: fog_window
  text: |
    Туман облепил стёкла. Сквозь него проступают силуэты машин — и что-то не так с городом за
    ними. Высотка, которая всегда стояла справа, исчезла. Вместо неё — старые пятиэтажки,
    которых вы никогда здесь не видели. Рекламный щит с незнакомым логотипом.

    Воздух в маршрутке кислит на языке. Кто-то на мосту кричит — коротко, и замолкает.
  on_enter: ["set flag.saw_change"]
  choices:
    - label: "Отойти от окна"
      goto: bus_hub

- id: bus_hub
  text: |
    Вы снова на откидном у двери. Туман густеет. Кто-то спит, кто-то ругается, кто-то молится.
    Михалыч глушит мотор: — Бензин не казённый.
  extra:
    - if: "flag.saw_change"
      text: "Вы видели: город за туманом — не тот. Но как сказать это вслух и не выглядеть сумасшедшим?"
  choices:
    - label: "Ещё присмотреться к передним местам"
      goto: front
    - label: "Ещё присмотреться к задним местам"
      goto: back
    - label: "Попросить Михалыча включить рацию погромче"
      if: "not flag.heard_dispatch"
      effects: ["set flag.heard_dispatch"]
      goto: dispatch
    - label: "Ждать, что будет дальше"
      effects: ["time += 1"]
      goto: knock

- id: dispatch
  text: |
    Михалыч ворчит, но выкручивает громкость. Сквозь треск пробивается чужой голос — не
    диспетчер, мужской, усталый, без всяких «приём»:

    «…всем, кто слышит. Не выходите в туман. Не подпускайте к себе тех, кто чешется и
    хочет мяса. Утром идите на дым. Дым — это люди. Повторяю…»

    Треск. Голос пропадает. Михалыч выключает рацию и долго смотрит на свою расчёсанную
    шею в зеркале.
  choices:
    - label: "Вернуться на место"
      goto: bus_hub

- id: knock
  text: |
    В переднюю дверь стучат. Снаружи, в тумане, — мужчина в разорванной рубашке, рука
    замотана окровавленным платком. — Пустите! Ради бога! Там… там люди людей…

    Виктор Палыч кричит: «Не открывать!». Зоя Петровна крестится. Вера смотрит на его руку —
    на платок, сквозь который проступает свежая кровь, — и качает головой.
  choices:
    - label: "Потребовать, чтобы Михалыч открыл"
      effects: ["set flag.let_in"]
      text: "Дверь шипит. Мужчина вваливается внутрь, бормоча спасибо. Через десять минут он затихает на заднем сиденье. Через двадцать — начинает урчать. Его выталкивают наружу вчетвером, и никто больше не смотрит друг на друга."
      goto: panic
    - label: "Промолчать"
      text: "Он стучит ещё минуту. Потом стук обрывается, и снаружи доносятся звуки, которые вы потом будете слышать во сне."
      goto: panic

- id: panic
  chapter: "Туман"
  checkpoint: true
  text: |
    Из тумана выбегает человек. Он бежит между машинами, спотыкается, падает — и на него
    падают сверху двое других. Не дерутся. Едят. Звуки, которые доносятся снаружи,
    невозможно ни с чем спутать.

    В маршрутке визжат. Виктор Палыч орёт, что надо сидеть тихо и ждать полицию. Вера
    говорит, что ждать нечего. Рустам спокойно показывает в окно: — Школа. Двести метров.
    Там двери железные.
  choices:
    - label: "Остаться в маршрутке на ночь"
      goto: bus_night
    - label: "Бежать в школу — и решить, кого звать"
      goto: pick_group
    - label: "Выскочить и уйти одному, пока все орут ☠"
      roll:
        chance: 50
        success:
          text: "Туман глотает вас. Вы бежите вдоль перил, не оглядываясь, и выбегаете на какую-то улицу за мостом."
          goto: alone_night
        fail:
          effects: ["die 'туман на мосту'"]

- id: pick_group
  text: |
    На раздумья — минута. Дверь Михалыч откроет, если на него как следует наорать. Кого вы
    позовёте с собой? Кого — нет? Тех, кого не позовёте, никто не держит: останутся в
    маршрутке.
  extra:
    - if: "flag.t_vera"
      text: "Вера говорила: подальше от тех, кто чешется, кашляет и щурится."
  choices:
    - label: "Позвать Лизу"
      if: "not flag.g_liza"
      effects: ["set flag.g_liza"]
    - label: "Позвать Веру"
      if: "not flag.g_vera"
      effects: ["set flag.g_vera"]
    - label: "Позвать Дэна"
      if: "not flag.g_dan"
      effects: ["set flag.g_dan"]
    - label: "Позвать Рустама"
      if: "not flag.g_rustam"
      effects: ["set flag.g_rustam"]
    - label: "Позвать Тимура"
      if: "not flag.g_timur"
      effects: ["set flag.g_timur"]
    - label: "Позвать Зою Петровну"
      if: "not flag.g_zoya"
      effects: ["set flag.g_zoya"]
    - label: "Позвать Виктора Палыча"
      if: "not flag.g_viktor"
      effects: ["set flag.g_viktor"]
    - label: "Позвать Михалыча"
      if: "not flag.g_mih"
      effects: ["set flag.g_mih"]
    - label: "Хватит. Бежим!"
      goto: school_run
