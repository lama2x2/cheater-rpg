# Глава 3. Утро: когда уходить и с кем. Концовки.

- id: dawn
  chapter: "Утро"
  checkpoint: true
  text: |
    Туман редеет к рассвету. Город проступает из него — и это не ваш город. Улицы те же по
    ширине, но дома другие, вывески другие, на перекрёстке стоит памятник, которого вы
    никогда не видели. По улицам бредут люди. Медленно, неровно, без цели. Урчат.

    Где-то на востоке, за рекой, на холме поднимается тонкий столб дыма. Ровный, как от
    печки. Кто-то там жив — и не боится, что его увидят.
  again: "Вы снова на перекрёстке. Дым на холме поднимается всё так же ровно."
  extra:
    - if: "flag.g_liza"
      text: "Лиза рядом. Тубус она так и не бросила."
    - if: "flag.g_vera"
      text: "Вера перевязывает кому-то руку и считает таблетки."
    - if: "flag.g_dan"
      text: "Дэн уже нашёл где-то лом и держит его как бейсбольную биту."
    - if: "flag.g_rustam"
      text: "Рустам ждёт у двери, рация на поясе молчит. — Ну что, идём к реке?"
    - if: "flag.lost_liza or flag.lost_vera or flag.lost_dan"
      text: "Кого-то из ваших этой ночью не стало. Вы знаете, чья это вина."
    - if: "flag.heard_radio"
      text: "Вы помните голос из-за угла: «Свежих семеро. К Пристани»."
    - if: "flag.let_in"
      text: "У маршрутки на мосту бродит мужчина в разорванной рубашке, с платком на руке. Вы его впустили вчера. Он вас не узнаёт."
  choices:
    - label: "Обыскать аптеку на углу (1 ч)"
      if: "not flag.pharmacy"
      effects: ["set flag.pharmacy", "time += 1"]
      goto: pharmacy
    - label: "Идти за Рустамом к реке, на Пристань"
      if: "flag.g_rustam"
      goto: rustam_route
    - label: "Идти к дыму на холме"
      goto: river
    - label: "Переждать ещё пару часов, пока не рассосётся (2 ч)"
      if: "not flag.waited_dawn"
      effects: ["set flag.waited_dawn", "time += 2"]
      text: "Не рассасывается. Урчащих на улицах только больше — они просыпаются вместе с городом."

- id: pharmacy
  text: |
    Стеклянная дверь аптеки разбита, внутри пусто — почти. За прилавком на полу сидит
    провизорша в белом халате и жуёт собственный рукав. Медленно. Она вас не видит.
    Полки с водой и бинтами — в двух шагах от неё.
  choices:
    - label: "Тихо взять воду и бинты"
      roll:
        chance: 70
        success:
          text: "Вы двигаетесь как в замедленной съёмке. Она не поднимает головы."
          effects: ["item.water += 1", "item.kit += 1"]
          goto: dawn
        fail:
          text: "Под ногой хрустит стекло. Она поднимает голову. Вы вылетаете из аптеки ни с чем."
          goto: dawn
    - label: "Не рисковать"
      goto: dawn

- id: rustam_route
  text: |
    Рустам ведёт уверенно — дворами, по задам гаражей, ни разу не ошибаясь с поворотом.
    Урчащих он обходит так, будто знает их привычки. К реке выходите через час. На берегу —
    лодка, а на том берегу — дощатая пристань, бочки, вышка с прожектором и люди в
    камуфляже. Один машет рукой.

    У сарая за пристанью стоят клетки. В одной кто-то сидит, обхватив колени.
  on_enter: ["time += 1"]
  extra:
    - if: "var.doubt >= 2"
      text: "Всё складывается: рация, «свежих семеро», «приведу к Пристани». Вы не люди для них. Вы груз."
  choices:
    - label: "Сесть в лодку"
      goto: hunters_end
    - label: "Рвануть в камыши, пока лодка у этого берега ☠"
      if: "var.doubt >= 2"
      locked: "Причин не доверять Рустаму вы пока не видите"
      roll:
        chance: 60
        success:
          text: "Вы ныряете в камыши, по колено в ледяной воде. Сзади ругань, выстрел в воздух, потом тишина: гоняться за вами не стали — у них есть те, кто сел в лодку."
          effects: ["clear flag.g_rustam", "time += 2"]
          goto: river
        fail:
          effects: ["die 'выстрел с Пристани'"]

- id: river
  text: |
    Чтобы попасть к холму, надо перейти реку. Автомобильный мост — там, где маршрутка, в
    тумане и в урчащих. Выше по течению должен быть пешеходный мостик. Или не должен:
    город-то чужой.
  extra:
    - if: "flag.liza_map"
      text: "Лиза разворачивает свой ночной чертёж: пешеходный мостик в двух кварталах вверх по течению. Узкий. Пустой, если повезёт."
    - if: "flag.saw_lights"
      text: "С крыши школы вы видели огни на холме. Значит, там правда люди."
    - if: "flag.heard_dispatch"
      text: "«Утром идите на дым». Голос из рации был прав, кем бы он ни был."
  choices:
    - label: "К пешеходному мостику по Лизиному чертежу"
      if: "flag.liza_map"
      locked: "Где он, этот мостик, — никто не знает"
      text: "Лиза ведёт уверенно. Мостик пуст. Вы переходите реку, слыша только собственные шаги."
      goto: hill_route
    - label: "Искать переход вдоль берега (2 ч)"
      effects: ["time += 2"]
      roll:
        chance: 60
        success: { text: "Через два часа поисков — железнодорожный мост с узким настилом. Вы перебираетесь по шпалам.", goto: hill_route }
        fail: { text: "Берег упирается в забор завода. Приходится возвращаться и идти через автомобильный мост.", goto: car_bridge }
    - label: "Через автомобильный мост, мимо маршрутки"
      goto: car_bridge

- id: car_bridge
  text: |
    Мост забит машинами. В некоторых кто-то есть — и этот кто-то поворачивает голову вам
    вслед. Маршрутка №47 стоит, где стояла, двери нараспашку, внутри пусто.

    Между машинами бродят урчащие. Много.
  extra:
    - if: "not flag.g_timur"
      text: "В проходе маршрутки валяется жёлтая термосумка Тимура. Самого Тимура нигде нет — или он среди тех, кто бродит."
  choices:
    - label: "Ползком, под машинами ☠"
      roll:
        chance: 60
        success: { text: "Асфальт, днища, масло, чужие ноги в паре метров. Вы выползаете на том берегу грязные с головы до пят — но живые.", goto: hill_route }
        fail: { effects: ["die 'мост с маршруткой'"] }
    - label: "По крышам машин, бегом ☠"
      roll:
        chance: 45
        success: { text: "Гром жести под ногами, урчащие тянут руки, кто-то хватает за штанину — и отпускает. Вы на том берегу.", goto: hill_route }
        fail: { effects: ["die 'мост с маршруткой'"] }

- id: hill_route
  chapter: "Дым на холме"
  checkpoint: true
  text: |
    К холму ведёт длинная улица частных домов. Заборы, собачьи будки — пустые, цепи
    оборваны. Тишина такая, что слышно, как гудят провода, хотя тока в них нет.

    На середине улицы из калитки выходит тварь. Не урчащий — другой: худой, высокий, на
    длинных ногах, кожа как мятая бумага. Он поворачивает голову, как птица, и смотрит прямо
    на вас.
  choices:
    - label: "Замереть и ждать, пока он отвернётся ☠"
      roll:
        chance: 45
        success: { text: "Целую вечность он смотрит. Потом что-то хлопает в соседнем дворе — и он прыгает туда.", goto: scouts }
        fail: { goto: runner_fight }
    - label: "Бросить бутылку в соседний двор — отвлечь"
      if: "item.water > 0"
      locked: "Бросить нечего"
      effects: ["item.water -= 1"]
      text: "Бутылка разбивается о будку. Тварь срывается на звук, перемахнув забор. Вы проходите улицу на цыпочках."
      goto: scouts
    - label: "Встретить его трубой"
      if: "item.pipe > 0"
      locked: "Нечем встречать"
      goto: runner_fight

- id: runner_fight
  text: |
    Он прыгает. Мир сужается до когтей, вони и собственного крика.
  extra:
    - if: "flag.g_dan"
      text: "Дэн с ломом оказывается рядом раньше, чем вы успеваете испугаться."
  choices:
    - label: "Бить, пока он не перестанет ☠"
      roll:
        chance: "40 + item.pipe * 20"
        success:
          text: "Удар, ещё удар. Он падает в пыль у забора и больше не встаёт. Вас трясёт. Руки в чужой крови."
          goto: scouts
        fail:
          effects: ["die 'тварь на длинных ногах'"]
    - label: "Прикрыться и звать Дэна ☠"
      if: "flag.g_dan"
      roll:
        chance: 75
        success:
          text: "Дэн бьёт ломом сбоку, как по мячу. Тварь отлетает к забору. — Не благодари, — говорит он, и голос у него дрожит."
          goto: scouts
        fail:
          effects: ["die 'тварь на длинных ногах'"]

- id: scouts
  text: |
    У подножия холма из-за поваленного дерева поднимаются двое — в разномастном камуфляже, с
    ружьями. Не целятся, но и не опускают стволы. Старший, бородатый, разглядывает вас долго.

    — Новенькие, — говорит он наконец. — Вчерашний прилёт. Укушенные есть? Только честно.
    У нас за враньё — за ворота.
  extra:
    - if: "flag.g_vera and flag.g_zoya and flag.examined"
      text: "Вера молча смотрит на свою руку: ночью её укусила Зоя Петровна. След уже почти зажил."
  choices:
    - label: "Сказать правду про все укусы и царапины"
      text: "Бородатый кивает. — Раз до сих пор не урчите — значит, иммунные. Иммунных укус не берёт. Вам повезло, остальным — нет. Пошли."
      goto: hill_gate
    - label: "«Никто не укушен»"
      effects: ["set flag.lied_bite"]
      text: "Бородатый смотрит ещё дольше. Потом пожимает плечами: проверят на воротах."
      goto: hill_gate

- id: hill_gate
  text: |
    Холм обнесён забором из сваренных листов железа. На воротах — пулемётное гнездо из мешков
    с песком. Дым идёт из трубы бани. Над воротами кто-то масляной краской написал:
    «Стаб Горка. Заражённых — стреляем. Своих — пускаем. Кто свой — решаем мы».

    — Стоять! — кричат сверху. — Сколько вас? Кто покусанный — шаг вперёд, честно.
  on_enter:
    - "var.allies = 0"
    - { if: "flag.g_liza", then: ["var.allies += 1"] }
    - { if: "flag.g_vera", then: ["var.allies += 1"] }
    - { if: "flag.g_dan", then: ["var.allies += 1"] }
  extra:
    - if: "flag.lied_bite and flag.g_vera and flag.g_zoya and flag.examined"
      text: "Вера бледнеет и прячет руку за спину — там, где ночью укусила бабушка. Вы соврали за неё внизу; теперь врать придётся ей самой."
  choices:
    - label: "Поднять руки и идти к воротам"
      goto:
        - { if: "var.allies >= 1", goto: together_end }
        - { goto: alone_end }

- id: too_late
  chapter: "Слишком поздно"
  checkpoint: true
  text: |
    Вы тянули слишком долго. К полудню город просыпается окончательно: урчащих на улицах
    сотни, они бредут волнами, как толпа с концерта, и в этой толпе мелькают другие —
    быстрые, на длинных ногах.

    Отсюда надо уходить прямо сейчас. Или уже никогда.
  choices:
    - label: "По крышам гаражей, к холму ☠"
      roll:
        chance: 40
        success:
          text: "Крыша, прыжок, крыша, прыжок. Внизу волна урчащих тянет руки. Из ваших до края гаражей добегаете только вы."
          effects: ["clear flag.g_liza", "clear flag.g_vera", "clear flag.g_dan", "clear flag.g_rustam"]
          goto: hill_gate
        fail:
          effects: ["die 'город в полдень'"]
    - label: "Забаррикадироваться и ждать ночи ☠"
      effects: ["die 'город в полдень'"]

# ---------- концовки ----------

- id: together_end
  text: |
    Ворота открывают на щель. Вас обыскивают, светят в глаза, смотрят шеи и руки. Потом
    пускают — в баню, к еде, к людям, которые знают, что происходит, и объясняют это
    странными словами: «кластер», «перезагрузка», «иммунные». Вы — иммунные. Вы не обратились.
    Поэтому и живы.

    Вы дошли не одни. На Континенте это значит больше, чем любое оружие.
  extra:
    - if: "flag.g_liza"
      text: "Лиза ставит тубус в угол бани и впервые за сутки плачет. Диплом подождёт. Наверное, навсегда."
    - if: "flag.g_vera"
      text: "Вера через час уже работает в местном медпункте. Здесь таких рук не хватает."
    - if: "flag.g_dan"
      text: "Дэн делает вид, что ему всё равно. Но держится рядом с вами."
    - if: "flag.locked"
      text: "Про кабинет труда вы рассказываете коменданту. Он кивает: правильно сделал. Легче от этого не становится."
    - if: "flag.expelled"
      text: "Про тех, кого вы выгнали в туман, вы никому не рассказываете."
    - if: "flag.lost_liza or flag.lost_vera or flag.lost_dan"
      text: "Одного места в бане не хватает. Того, кого вы оставили ночью в спортзале."
  ending: { id: together, title: "Дошли вместе" }

- id: alone_end
  text: |
    Ворота открывают на щель — для одного. Вас обыскивают, светят в глаза и пускают внутрь,
    к людям, которые говорят странными словами: «кластер», «перезагрузка», «иммунные».

    Вы дошли. Один. Иногда это единственный способ дойти. Иногда — просто цена, которую
    вы заплатили за других.
  extra:
    - if: "flag.lost_liza or flag.lost_vera or flag.lost_dan"
      text: "Ночь в спортзале будет сниться вам долго."
    - if: "flag.g_rustam"
      text: "Рустама вы больше не видите. Говорят, на Пристани опять кого-то продали."
  ending: { id: alone, title: "Дошёл один" }

- id: hunters_end
  text: |
    Лодка мягко стукается о доски пристани. Люди в камуфляже улыбаются — так же, как Рустам.
    Вас вежливо просят сдать «что есть острого» и пройти к сараю. Потом дверь клетки
    закрывается, и улыбки заканчиваются.

    — Свежие, крепкие, — говорит кто-то снаружи. — Иммунные-новички дорого идут. Рустам, с меня.
  extra:
    - if: "flag.g_liza or flag.g_vera or flag.g_dan"
      text: "В соседней клетке — ваши. Вы привели их сюда сами."
    - if: "var.doubt >= 2"
      text: "Вы ведь знали. Слышали. И всё равно сели в лодку."
  ending: { id: hunters, title: "Товар" }

- id: death_end
  text: |
    Всё заканчивается быстро — так быстро, что вы не успеваете испугаться по-настоящему.
    Город за туманом получил ещё одного жителя. Он будет бродить по улицам, которых не было,
    и урчать.

    Жизнь была одна.
  ending: { id: death, title: "Одна жизнь" }
