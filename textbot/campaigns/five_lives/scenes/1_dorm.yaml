# Глава 1. Общежитие: первая жизнь и петля возрождений.

- id: wake
  chapter: "Жизнь первая"
  checkpoint: true
  text: |
    Потолок в жёлтых разводах. Пружины кровати впиваются в спину, пахнет чужими носками
    и жареным луком. Вы садитесь — и понимаете, что не помните ничего. Ни этой комнаты,
    ни города за окном, ни собственного имени.

    Только в голове крутится короткое, как кличка, слово: Рок. Пусть будет Рок.

    А в воздухе, прямо перед глазами, висят полупрозрачные строчки. Моргаете — не исчезают.
  extra:
    - if: "meta.runs > 1"
      text: "Странное чувство: будто всё это уже было. Будто вы уже сидели вот так — и чем-то это кончилось."
  system: "Объект зарегистрирован. Кластер 311-07-52. Регион: Западное побережье. Жизней: {lives}. До перезагрузки кластера: данные скрыты."
  choices:
    - label: "Сосредоточиться на строчках"
      goto: menu
    - label: "Осмотреть комнату и себя"
      goto: room

- id: menu
  text: |
    Стоит пожелать — и строчки разворачиваются в подобие меню. Пункты без подсказок,
    семь цветных полосок без подписей, раздел «Умения» пуст, будто над вами издеваются.
    Кнопку «Выход» вы ищете долго и честно. Её нет.
  system: "Цели: выжить; отыскать своё; понять правила; кому-нибудь помочь; задать главный вопрос. Подсказка: торопливых Континент не любит."
  choices:
    - label: "Свернуть меню и осмотреться"
      goto: room

- id: room
  text: |
    Комната на четверых, две кровати пусты. На тумбочке — ваш бумажник: немного денег,
    скидочная карта гипермаркета, билет в кино и визитка стрелкового клуба. Документов нет.
    Правое колено обмотано старым эластичным бинтом и ноет, как перед дождём.

    За стеной гремит музыка, в коридоре кто-то ржёт. Соседи по комнате, Серый и
    рыжий Годя, режутся в карты и косятся на вас с ленивым любопытством.
  again: "Вы снова посреди комнаты. Серый и Годя шлёпают картами по тумбочке."
  choices:
    - label: "Выглянуть в окно"
      if: "not flag.saw_window"
      effects: ["set flag.saw_window"]
      goto: window
    - label: "Прищуриться на соседей — как на строчки"
      if: "not flag.gazed"
      effects: ["set flag.gazed"]
      goto: gaze
    - label: "Спросить у соседей, кто вы такой"
      goto: neighbors
    - label: "Выйти на улицу прямо сейчас"
      goto: street_night

- id: window
  text: |
    Вечер, третий этаж, двор-колодец. Жара не по сезону: деревья голые, а люди внизу в майках.
    Над крышами дрожит марево, и где-то за ним одна за другой гаснут рекламные вывески —
    не все сразу, а по кварталам, будто кто-то идёт по городу и щёлкает выключателями.

    Внизу мужчина в костюме стоит посреди детской площадки и смотрит в небо. Стоит уже долго.
    Не шевелится.
  choices:
    - label: "Отойти от окна"
      goto: room

- id: gaze
  text: |
    Вы смотрите на Серого и как бы «желаете увидеть». Над его головой вспыхивает зелёная
    табличка: номер из цифр и букв, рост, вес, «опасности не представляет». Как бирка на
    товаре в магазине.

    Переводите взгляд на Годю. Табличка та же, только внизу появляется строка, которой у
    Серого нет: «Состояние: нестабильное».
  system: "Пристальный взгляд: доступен. Расширенные данные: требуется уровень."
  on_enter: ["set flag.k_turn"]
  choices:
    - label: "Сделать вид, что ничего не заметили"
      goto: room

- id: neighbors
  text: |
    — Ты чё, совсем поплыл? — Серый ухмыляется. — Колёса твои, брат. Я говорил: не бери у того
    кадра. Память отшибает напрочь. Проспишься — вспомнишь.

    Годя молча чешет шею. Шея у него красная, расчёсанная до крови, и он чешет её снова и снова.
    Серый протягивает белую таблетку: снотворное, мол, лучшее лекарство.
  again: "Серый опять ухмыляется про «колёса» и тянет вам белую таблетку. Годя опять чешет шею — до крови."
  choices:
    - label: "«Как меня зовут? Откуда я?»"
      if: "not flag.asked_name"
      effects: ["set flag.asked_name"]
      text: "— Да откуда я знаю, — Серый тасует карты. — Ты на прошлой неделе въехал, всё молчал. Спортсмен, вроде. Колено у тебя, с колена и начинали разговор."
    - label: "«Годя, что с тобой?»"
      if: "not flag.asked_godya"
      effects: ["set flag.asked_godya"]
      text: "Годя поднимает глаза — мутные, с красными прожилками. — Жарко, — говорит он. — Чешется всё. И жрать охота. Прям мяса. Сырого бы…"
    - label: "Выпить таблетку и лечь"
      effects: ["set flag.took_pill"]
      goto: night_dorm
    - label: "Сделать вид, что выпил, и лечь, не смыкая глаз"
      goto: dorm_awake
    - label: "Отказаться и уйти на улицу"
      goto: street_night

- id: night_dorm
  text: |
    Будит вас урчание. Низкое, утробное, как у голодной собаки. В темноте над кроватью стоит
    Годя — голый по пояс, с разинутым ртом. Глаза пустые. За ним шевелится Серый.

    Тело действует раньше головы: вы скатываетесь на пол, хватаете стул и бьёте. Ещё раз.
    Ещё. Хруст, тишина, тяжёлое дыхание. В коридоре кто-то кричит — и тянет дымом.
  again: "Урчание, Годя над кроватью, стул в руках — всё повторяется. В коридоре опять кричат, и тянет дымом."
  extra:
    - if: "flag.took_pill"
      text: "Голова ватная от таблетки, руки как чужие. Спасибо, Серый."
  system: "Уничтожен заражённый. Уровень: 0. Шанс ценных трофеев: 0. Физическая сила: +3 к прогрессу. Гуманность: +1."
  on_enter: ["var.humanity += 1", "set flag.k_turn"]
  choices:
    - label: "Прыгать в окно — второй этаж, внизу кусты ☠"
      effects: ["set flag.k_fire"]
      roll:
        chance: "30 + var.luck * 5"
        success:
          text: "Кусты спасают ноги, но не колено: вы встаёте, хромая, посреди визжащей улицы."
          system: "Удача: сработала."
          goto: street_night
        fail:
          text: "Внизу не кусты. Внизу — те, кто урчит."
          effects: ["die 'прыжок к заражённым под окнами'"]
    - label: "Через коридор, сквозь дым ☠"
      effects: ["set flag.k_fire"]
      roll:
        chance: "15 + var.luck * 5"
        success:
          text: "Вы ползёте под дымом, на ощупь, и вываливаетесь на крыльцо, кашляя до рвоты."
          goto: street_night
        fail:
          text: "Дым густеет с каждым шагом. Вы ползёте на ощупь и теряете сначала стену, потом пол, потом себя."
          effects: ["die 'дым в коридоре общежития'"]

- id: dorm_awake
  text: |
    Вы лежите с закрытыми глазами и считаете вдохи. Музыка за стеной стихает. Около трёх ночи
    скрипит соседняя кровать. Шаги — шаркающие, неровные. И звук: тихое влажное урчание
    прямо над вашим лицом.
  again: "Вы снова лежите с закрытыми глазами и ждёте трёх часов ночи. Скрип кровати. Шаркающие шаги. Урчание над самым лицом."
  choices:
    - label: "Ударить первым — стул стоит у изголовья"
      effects: ["var.humanity += 1", "set flag.k_turn"]
      system: "Уничтожен заражённый. Физическая сила: +3 к прогрессу. Гуманность: +1."
      text: "Годя падает. Серый урчит в углу, но не встаёт. Снизу, с первого этажа, тянет гарью."
      goto: dorm_escape
    - label: "Замереть и надеяться ☠"
      text: "Вы не шевелитесь. Урчание всё громче, всё ближе — у самого горла. И обрывается вместе со всем остальным."
      effects: ["set flag.k_turn", "die 'сосед по комнате'"]

- id: dorm_escape
  text: |
    Пожар внизу разгорается быстро — кто-то поджёг вахту и смеётся в дыму. У вас минута,
    может, меньше. Колено ноет. В руке ножка от стула.
  choices:
    - label: "По лестнице вниз, пока огонь не дошёл"
      effects: ["set flag.k_fire"]
      text: "Вы проскакиваете мимо горящей вахты. Сзади лопаются стёкла."
      goto: street_night
    - label: "Вернуться за бумажником ☠"
      text: "Бумажник вы находите. Обратно — уже нет: лестница внизу горит, а дым поднимается быстрее, чем вы бежите."
      effects: ["set flag.k_fire", "die 'пожар в общежитии'"]

- id: street_night
  text: |
    Ночная улица ведёт себя странно. Фонари мигают, светофоры погасли. У перекрёстка толпа
    глазеет на перевёрнутую «газель» — из кузова торчат газовые баллоны, а какой-то парень
    со смехом поджигает тряпку в горлышке бутылки.

    Связи нет: у всех вокруг телефоны показывают пустые экраны. Где-то воет сирена — одна,
    потом другая, потом сразу много.
  again: "Снова ночная улица: мигающие фонари, мёртвые светофоры, толпа у перевёрнутой «газели» с баллонами. Парень с бутылкой уже поджигает тряпку."
  system: "Подсказка: потенциально заражённые психически нестабильны. Избегайте скоплений людей."
  extra:
    - if: "flag.k_crowd"
      text: "Вы помните, чем кончается этот смех. Вспышкой."
  choices:
    - label: "Протиснуться через толпу к проспекту ☠"
      roll:
        chance: "20 + var.luck * 5"
        success:
          text: "Вы успеваете отойти на квартал, когда за спиной вздрагивает земля."
          effects: ["set flag.k_crowd"]
          goto: basement_wait
        fail:
          text: "Выбраться из толпы вы не успеваете. Вспышка — и звука уже не слышно."
          effects: ["set flag.k_crowd", "die 'взрыв газовых баллонов в толпе'"]
    - label: "Свернуть во дворы, подальше от людей"
      if: "flag.k_crowd"
      locked: "Пока кажется, что толпа — самое безопасное место"
      goto: basement_wait
    - label: "Остановиться и посмотреть, что будет ☠"
      text: "Парень бросает бутылку. Огонь лижет баллоны, кто-то смеётся — а потом вспышка накрывает весь перекрёсток."
      effects: ["set flag.k_crowd", "die 'взрыв газовых баллонов в толпе'"]

- id: basement_wait
  text: |
    Дверь подвала в соседнем дворе не заперта. Внутри сухо, пахнет котами и картошкой. Вы
    садитесь на трубу и слушаете, как город сходит с ума: сирены, хлопки, чей-то бесконечный
    визг. К утру всё стихает до ровного гула, будто город перешёл на другую частоту.
  again: "Тот же подвал: сухо, пахнет котами и картошкой. Вы пересиживаете ночь на трубе, слушая, как город сходит с ума."
  choices:
    - label: "Дождаться рассвета и выйти"
      goto: street_morning

- id: respawn
  text: |
    Темнота. Тишина. Перед глазами медленно тикает счётчик — секунды до возвращения.
    Потом счётчик гаснет, и вы чувствуете спиной знакомые пружины.
  again: "Снова темнота и счётчик секунд. Снова пружины под спиной."
  choices:
    - label: "Открыть глаза"
      goto:
        - if: "(flag.ate_pearls or flag.ate_one) and not flag.unique_seen"
          goto: unique
        - goto: respawn_hub

- id: respawn_hub
  chapter: "Новая жизнь"
  checkpoint: true
  text: |
    Та же комната. Те же разводы на потолке, тот же запах лука. Серый и Годя режутся в карты,
    будто ничего не было. Только номер кластера в строчке перед глазами — другой.

    Система не объясняет. Город за окном ещё не знает, что его ждёт. А вы — уже немного знаете.
  again: "Опять та же комната: разводы на потолке, запах лука, Серый и Годя за картами. Город за окном ещё ничего не знает."
  extra:
    - if: "flag.k_turn"
      text: "Годя опять чешет шею. Вы знаете, кем он станет к трём часам ночи."
    - if: "flag.k_fire"
      text: "Ночью здесь будет пожар. Вахта загорится первой."
    - if: "flag.k_crowd"
      text: "У перекрёстка будет толпа, «газель» и баллоны. Туда не надо."
    - if: "flag.k_crash"
      text: "Проспект днём превратится в мясорубку: фура, бронетранспортёр, железо."
    - if: "deaths >= 3"
      text: "Жизней осталось {lives}. Цифра уже не кажется большой."
  choices:
    - label: "Прожить вечер заново: поговорить с соседями"
      goto: neighbors
    - label: "Уйти из общаги сейчас, пока тихо"
      goto: street_night
    - label: "Просидеть ночь на лестнице у открытой двери и уйти с рассветом"
      if: "flag.k_fire"
      text: "Вы встречаете пожар у выхода, с курткой на голове, и выходите первым."
      goto: street_morning
