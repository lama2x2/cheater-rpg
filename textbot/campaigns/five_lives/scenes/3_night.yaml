# Глава 3. Ночь: буханка, элита, три жемчужины. И концовки.

- id: roof_night
  text: |
    Ночь на крыше длинная. Внизу кто-то бродит и урчит, иногда — дерётся. Около полуночи
    со стороны реки начинается стрельба: пулемёт, потом гулкий хлопок, от которого
    звенят стёкла, потом рёв — такой, что вы зажимаете уши.

    А в два часа скрипит пожарная лестница. Кто-то лезет к вам.
  choices:
    - label: "Ждать у края с ножом"
      if: "item.knife > 0"
      locked: "Нужно хоть какое-то оружие"
      text: "Голова показывается над краем — и вы бьёте. Один раз, как учил Слепень: в основание черепа. Лестница пустеет."
      effects: ["var.humanity += 1"]
      goto: dawn_city
    - label: "Сбросить его ногой, когда покажется голова ☠"
      roll:
        chance: "45 + var.luck * 5"
        success: { text: "Удар пяткой, хруст, долгое падение. Больше никто не лезет.", goto: dawn_city }
        fail: { effects: ["die 'гость с пожарной лестницы'"] }
    - label: "Спуститься по водостоку с другой стороны и идти на выстрелы"
      goto: uaz

- id: dawn_city
  text: |
    Рассвет приходит серым и тихим. Город внизу больше не кричит — он урчит, ровно и сыто.
    Вы живы. Вы всё ещё на крыше, и затёкшие колени разгибаются не сразу.

    При свете с крыши видно далеко: река, рыжие фермы обрушенного моста, а за ними — лес,
    в котором ничего не горит.
  choices:
    - label: "Пробираться к мосту"
      goto: bridge_night

- id: night_flat
  chapter: "Ночь"
  checkpoint: true
  text: |
    Первая же открытая квартира — с выбитой дверью и тишиной внутри. На кухне из крана идёт
    тёплая ржавая вода, и вы пьёте её, пока не начинает болеть живот. Холодильник пуст,
    но в шкафчике находится пачка печенья.

    Дальше — дворами к реке. Колено держит, если не бежать.
  choices:
    - label: "Дворами, к реке"
      goto: night_yards
    - label: "Остаться в квартире до утра"
      effects: ["set flag.stayed_city"]
      text: "Вы двигаете к двери шкаф и засыпаете на чужом диване под вой сирен."
      goto: dawn_flat

- id: dawn_flat
  text: |
    Рассвет приходит серым и тихим. Город за окном больше не кричит — он урчит, ровно и сыто.
    Вы живы. Шкаф у двери стоит, где стоял; в него за ночь никто не ломился.

    Из окна чужой кухни, с девятого этажа, видно далеко: река, рыжие фермы обрушенного моста,
    а за ними — лес, в котором ничего не горит.
  choices:
    - label: "Пробираться к мосту"
      goto: bridge_night

- id: night_yards
  text: |
    Дворы ночью — как лабиринт без стен. Под ногами хрустит стекло, где-то хлопает на ветру
    дверь подъезда. У мусорных баков сидит тварь: не урчащий — другой, поджарый, с длинными
    ногами, коленями назад. Цокает когтями по асфальту и нюхает воздух.

    Он между вами и рекой.
  extra:
    - if: "flag.knee_wrapped"
      text: "Колено в бинте держит. Бегать нельзя — но и не придётся, если не сглупить."
  choices:
    - label: "Обойти через подъезд насквозь"
      roll:
        chance: "55 + var.luck * 5"
        success: { text: "Подъезд сквозной. Вы выходите с другой стороны дома, и цоканье остаётся позади.", goto: uaz }
        fail: { text: "Дверь заперта. Цоканье за спиной.", goto: yard_fight }
    - label: "Бросить бутылку подальше — пусть бежит на звук"
      if: "item.water > 0"
      locked: "Бросить нечего"
      effects: ["item.water -= 1"]
      text: "Бутылка разбивается у гаражей. Прыгун срывается с места, как собака за мячом. Путь свободен."
      goto: uaz
    - label: "Напасть первым, пока он не видит"
      if: "item.knife > 0"
      locked: "Голыми руками на такое не нападают"
      goto: yard_fight

- id: yard_fight
  text: |
    Он прыгает — с места, на три метра, и вы успеваете только выставить руки. Удар, вкус
    крови, вонь гнилого мяса у самого лица.
  choices:
    - label: "Бить ножом в горло, снизу ☠"
      if: "item.knife > 0"
      locked: "Ножа нет"
      roll:
        chance: "55 + var.luck * 5"
        success:
          text: "Нож входит по рукоять. Тварь бьётся, потом обмякает. Вы долго не можете отдышаться."
          system: "Уничтожен заражённый. Уровень: 4. Сила: +6. Ловкость: +2. Гуманность: +2."
          effects: ["var.humanity += 2"]
          goto: uaz
        fail:
          effects: ["die 'прыгун во дворе'"]
    - label: "Вырываться и бежать к реке ☠"
      roll:
        chance: "30 + var.luck * 5"
        success: { text: "Вы выкатываетесь из-под него и ковыляете прочь, пока он грызёт ваш рукав.", goto: uaz }
        fail: { effects: ["die 'прыгун во дворе'"] }

- id: uaz
  text: |
    Набережная. Свет фар, рёв мотора: «буханка» с пулемётом на крыше пятится задом, а за ней
    по асфальту прёт нечто ростом с маршрутку — бугристое, в костяных пластинах, с руками,
    которые достают до земли. Табличка над ним мигает красным: «Элита».

    Пулемёт бьёт в упор. Из окна высовывается боец с трубой гранатомёта — хлопок, вспышка.
    Тварь шатается, делает последний рывок — и боец исчезает в её лапе. Потом падает и она.
  choices:
    - label: "Подойти, когда всё стихнет"
      goto: dying
    - label: "Бежать прочь от этого места"
      goto: bridge_night

- id: dying
  text: |
    Буханка, ревя, уезжает — кто-то внутри орёт, что сейчас набегут ещё. На асфальте остаётся
    боец, которого тварь отшвырнула. Он жив, но это ненадолго: вы видите это по его лицу.
    Он видит вашу белую табличку.

    — Нулёвка… — он хрипит. — Затылок ей вскрой. Нож у меня на поясе. Там мешок…
    всё бери. Жемчуг не жри. Слышишь? Догу снеси… заплатит…
  extra:
    - if: "flag.met_immunes"
      text: "Это Усатый. Тот, что у ларька смеялся над вашими тапками."
  choices:
    - label: "Сначала перетянуть ему рану"
      effects: ["var.humanity += 1"]
      text: "Вы стягиваете ремень у него на бедре, но кровь уже не важна. Он кивает — спасибо — и перестаёт дышать."
      goto: sack
    - label: "Взять нож и к твари"
      goto: sack

- id: sack
  text: |
    На затылке элиты, между пластинами, — нарост, похожий на гриб. Нож входит с хрустом.
    Внутри слизь и белёсые нити, а в них, как в гнезде, — сокровища: горсть серо-зелёных
    комочков, несколько горошин, звёздочка, янтарная капля.

    И три шарика размером с вишню. Чёрный, красный, зелёный. Они тёплые.
  system: "Обнаружены трофеи. Спораны: 6. Горошина: 3. Звезда: 1. Янтарь: 1. Жемчуг: 3. Внимание: сильнодействующие трофеи."
  on_enter: ["item.spores += 6"]
  choices:
    - label: "Проглотить все три — вдруг это и есть сила ☠"
      effects: ["set flag.ate_pearls", "die 'три жемчужины разом'"]
    - label: "Проглотить одну, на пробу ☠"
      effects: ["set flag.ate_one", "item.pearls += 2"]
      goto: fever
    - label: "Ссыпать жемчуг в карман и уходить к мосту"
      effects: ["item.pearls += 3"]
      goto: bridge_night
    - label: "Догнать буханку и отдать жемчуг его людям"
      effects: ["var.humanity += 2"]
      goto: uaz_crew

- id: fever
  text: |
    Чёрная. Вы выбрали чёрную. Она проскальзывает в горло, как ледяная капля, а через минуту
    внутри разгорается печка. Пальцы немеют. Кожа на руках становится сухой и шершавой,
    будто вы постарели на двадцать лет.

    Два оставшихся шарика жгут карман.
  system: "Принят трофей: жемчуг. Внимание: изменения организма. Наблюдение продолжается."
  choices:
    - label: "Проглотить и остальные две — будь что будет ☠"
      effects: ["set flag.ate_pearls", "item.pearls -= 2", "die 'три жемчужины'"]
    - label: "Стиснуть зубы и идти к мосту"
      goto: bridge_night

- id: uaz_crew
  text: |
    Буханка стоит за два квартала, мотор урчит вхолостую. Из окна на вас смотрит ствол.
    Потом — лицо, перемазанное копотью.

    Вы молча разжимаете ладонь. Три шарика: чёрный, красный, зелёный. Боец долго смотрит
    на них, потом на вас. — Залезай, — говорит он. — Едем к Догу.
  extra:
    - if: "flag.met_immunes"
      text: "Это Дюбель. Он узнаёт вас — и, кажется, впервые смотрит без насмешки."
  choices:
    - label: "Залезть в буханку"
      effects: ["set flag.dog_crew"]
      goto: dog_end

- id: bridge_night
  chapter: "Мост"
  checkpoint: true
  text: |
    Обрушенный мост в темноте — как скелет кита. Оцепление ушло, бронетранспортёр брошен
    с открытыми люками, у перевёрнутого автобуса что-то шевелится и урчит.

    Две половины моста смотрят друг на друга через пустоту, и только рыжие фермы ведут
    с одного берега на другой.
  extra:
    - if: "flag.k_bridge"
      text: "Дюбель говорил: на север, к мосту. Вот он, север."
    - if: "flag.ate_one"
      text: "Жар внутри не утихает. Руки шелушатся, как старая краска."
  choices:
    - label: "Лезть по фермам сейчас ☠"
      roll:
        chance: "50 + var.luck * 5"
        success:
          text: "Ржавчина под ладонями, вода чёрная внизу. Вы спрыгиваете на тот берег и долго лежите на траве."
          goto:
            - { if: "flag.ate_one", goto: quaz_turn }
            - { goto: far_bank }
        fail:
          effects: ["die 'сорвался с ферм моста'"]
    - label: "Переждать до рассвета под опорой и лезть при свете"
      text: "Под опорой сыро и тихо. На рассвете фермы выглядят не такими страшными."
      goto:
        - { if: "flag.ate_one", goto: quaz_turn }
        - { goto: far_bank }

- id: far_bank
  chapter: "Тот берег"
  checkpoint: true
  text: |
    На той стороне — табличка «Конец кластера», которой нет ни на одной карте, и трещина в
    асфальте, ровная, как по линейке. Вы переступаете её — и строчки перед глазами
    вздрагивают.

    Дальше лес. Однопутная железка, ржавые рельсы в траве. Из-за деревьев выходят трое
    урчащих — медленные, грязные, у одного на затылке торчит нарост, как гриб.
  system: "Вы покинули кластер. Открыта шкала: споровый баланс. Внимание: шкала падает."
  choices:
    - label: "Найти в траве арматуру и драться"
      roll:
        chance: "50 + var.luck * 5"
        success:
          text: "Арматура тяжёлая, удар выходит один, зато какой. Потом второй. Третий уходит сам."
          system: "Уничтожен заражённый. Уровень: 1. Шанс ценных трофеев: 18%. Сила: +4. Гуманность: +1."
          effects: ["var.humanity += 1"]
          goto: careful_end
        fail:
          text: "Арматура выскальзывает. Вы отступаете в кусты, оцарапанный и злой, и обходите их стороной."
          goto: careful_end
    - label: "Обойти их лесом"
      text: "Лес принимает вас без звука. Через час урчание стихает позади."
      goto: careful_end

- id: unique
  chapter: "Уникальная ситуация"
  checkpoint: true
  text: |
    Вы открываете глаза — и мир какой-то не такой. Не комната: комната та же. Не город:
    город ещё ничего не знает. Не такой — вы сами. Будто внутри повернули выключатель,
    о котором вы не знали.

    Строчки перед глазами бегут так быстро, что приходится читать их дважды.
  system: "Зафиксирована уникальная ситуация: гибель новичка от одновременного приёма трёх сильнодействующих трофеев. Квазиморфоз отменён иммунитетом нулёвки. Компенсация: Удача +27. Открыта характеристика: Грани Таланта — 7. Подсказка: сильные трофеи принимают по одному и с перерывами."
  extra:
    - if: "flag.ate_one and not flag.ate_pearls"
      text: "Одна чёрная жемчужина — и смерть сверху. Система посчитала это достаточно уникальным."
  on_enter: ["set flag.unique_seen", "var.luck += 27"]
  choices:
    - label: "Встать. Теперь вы знаете, что делать"
      goto: cheater_road

- id: cheater_road
  text: |
    Вы не говорите с соседями и не ждёте пожара — просто встаёте и уходите, пока Годя чешет
    шею. На лестнице вам навстречу поднимается вахтёрша с ведром, и вы впервые за все эти
    жизни говорите ей: «Уходите отсюда до ночи». Она крутит пальцем у виска. Конечно.

    Ночь вы пережидаете в подвале соседнего двора, сухом, пахнущем котами и картошкой. Утром прокат
    велосипедов у парка открыт — парень за стойкой узнаёт в вас какого-то футболиста и не
    берёт залог. Колено перетянуто бинтом. Вы знаете, где будет авария, и объезжаете
    проспект за три квартала.

    У обрушенного моста толпа и полиция, но вам удивительно везёт: никто не смотрит в вашу
    сторону, пока вы перетаскиваете велосипед по фермам.
  system: "Вы покидаете кластер. Открыта шкала: споровый баланс."
  choices:
    - label: "На ту сторону, к лесу"
      goto: cheater_forest

- id: cheater_forest
  text: |
    В лесу вас встречают пятеро урчащих. Раньше вы бы побежали. Теперь вы бросаете в них
    велосипед, подхватываете арматуру и дерётесь — и каждый раз, когда должно не повезти,
    везёт: удар приходится в висок, когти рвут воздух, гнилой корень подламывается под
    ногой твари, а не под вашей.

    Когда всё кончается, вы стоите посреди пятерых тел и смеётесь — нервно, глупо.
  system: "Уничтожено заражённых: 5. Сила: +5. Ловкость: +1. Выносливость: +1. Гуманность: +3. Удача: работает."
  on_enter: ["var.humanity += 3"]
  choices:
    - label: "Вскрыть наросты на затылках — теперь вы знаете, что там"
      text: "Три спорана, одна горошина. Мелочь — но первая ваша, честная."
      effects: ["item.spores += 3"]
      goto: cheater_end
    - label: "Ехать дальше, не задерживаясь"
      goto: cheater_end

# ---------- концовки ----------

- id: cheater_end
  text: |
    За мостом — лес, однопутная железная дорога, грунтовка. Позади горит город, который
    завтра перезагрузится и будет гореть снова, уже без вас.

    Вы едете на север, и каждая случайность складывается в вашу пользу: ветка не хлестнёт,
    камень не попадёт под колесо, урчащий на обочине отвернётся. Удача — это не везение.
    Это характеристика. И у вас она больше, чем у ветеранов с годами на Континенте.

    Вы ещё не знаете слова, которым вас назовут. Но Система уже знает.
  extra:
    - if: "var.humanity >= 3"
      text: "И гуманность у вас высокая: те, кого вы встретите, увидят в табличке зелёный цвет."
    - if: "flag.saved_girl"
      text: "Иногда вы будете вспоминать рюкзак в форме совы. Цифра, копия — да. Но вы её вытащили."
    - if: "flag.met_immunes"
      text: "Где-то там, в новостройке, Дог так и не узнает, куда делся его жемчуг."
    - if: "meta.ending.careful"
      text: "Однажды вы уже прошли этот день осторожно — и ушли ни с чем. Не в этот раз."
  ending: { id: cheater, title: "Читер (как в книге)" }

- id: careful_end
  text: |
    Тот берег встречает тишиной и запахом мокрой травы. Позади город доедает сам себя.
    Вы — нулёвка: ноль по всем характеристикам, ни уровня, ни имени, ни друзей. Но живой.
    А на Континенте это уже немало.

    Дальше будет лес, потом стаб, потом кто-то, кто объяснит правила. Вы станете обычным
    иммунным — осторожным, медленным, без куша. Таких тут тысячи. Большинство живёт долго.
  extra:
    - if: "item.pearls > 0"
      text: "В кармане перекатываются шарики жемчуга. Вы ещё не знаете, что каждый стоит больше, чем вся эта ночь. Продадите — и купите себе спокойную жизнь."
    - if: "flag.stayed_city"
      text: "Вы пересидели первую ночь в городе. Не геройство. Зато вот вы здесь."
    - if: "flag.left_slepen"
      text: "Слепня вы больше не встретите. Иногда вы будете думать, что зря от него ушли."
    - if: "flag.slepen_knife"
      text: "Нож Слепня останется с вами надолго."
    - if: "flag.saved_girl"
      text: "Девочку с рюкзаком-совой вы больше не увидите: город перезагрузится вместе с ней. Но этой ночью она была жива."
    - if: "flag.looked_away"
      text: "Детский крик у остановки будет сниться вам долго. Осторожность тоже имеет цену."
    - if: "meta.ending.cheater"
      text: "Где-то в другой жизни вы проглотили три шарика разом. Здесь — нет. Может, оно и к лучшему."
  ending: { id: careful, title: "Осторожный нулёвка" }

- id: dog_end
  text: |
    Новостройка, мешки в окнах, запах солярки и пороха. Дог смотрит на вас дольше, чем на
    других, и кивает: остаёшься. Таскать, сторожить, бегать — пока не дорастёшь до ствола.

    Вы не станете читером. Вы станете своим в стае: с кормёжкой, с крышей, с чужими
    приказами. Иммунные Дога не бросают своих — но и не прощают.
  extra:
    - if: "flag.dog_crew"
      text: "Дог долго вертит в пальцах три шарика жемчуга. Потом прячет их и говорит: «Честный. Это реже, чем жемчуг». Вас берут не шестёркой — бойцом."
    - if: "not flag.dog_crew"
      text: "Проверку вы прошли. Шестёрка — тоже должность, говорит Дюбель и хлопает по плечу."
  ending: { id: dog, title: "В стае Дога" }

- id: quaz_turn
  text: |
    На том берегу жар наконец уходит — и забирает с собой что-то ещё. Кожа на руках серая и
    твёрдая, как кора. Вы слышите урчание и не сразу понимаете, что урчите сами.

    Разум ваш. Тело — уже нет. Иммунные будут стрелять в вас, не дослушав. Заражённые будут
    принимать за своего. Вы — кваз, ни те, ни эти.
  system: "Статус изменён: квазиморф. Доступ в большинство стабов: закрыт. Рекомендация: белый жемчуг. Где его взять — не сообщается."
  extra:
    - if: "item.pearls > 0"
      text: "Два шарика всё ещё в кармане. Теперь вы знаете, чего они стоят — и чем."
  ending: { id: quaz, title: "Квазик" }

- id: final_death
  text: |
    Счётчик доходит до нуля и не начинает отсчёт заново.

    Пять жизней — это много, если не тратить их на один и тот же день.
  system: "Жизни исчерпаны. Объект снят с учёта. Спасибо за участие."
  ending: { id: final, title: "Окончательная смерть" }
