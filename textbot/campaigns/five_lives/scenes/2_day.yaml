# Глава 2. День: иммунные, такси, Слепень, первая фаза, крыша.

- id: street_morning
  chapter: "Утро"
  checkpoint: true
  text: |
    Утро жаркое, как июль, хотя на деревьях едва проклюнулись листья. Люди идут на работу
    в пиджаках и обливаются потом. Половина светофоров мертва, у банкомата очередь,
    в очереди спорят до крика.

    На каждом встречном, если прищуриться, вспыхивает зелёная табличка: номер, рост,
    «опасности не представляет». Как ценник на товаре.
  again: "Снова жаркое утро: мёртвые светофоры, очередь у банкомата, зелёные таблички над прохожими."
  choices:
    - label: "Зайти в магазин на углу"
      if: "not flag.shopped"
      effects: ["set flag.shopped"]
      goto: shop
    - label: "Идти к центру, туда, где больше людей"
      goto: immunes
    - label: "Сразу ловить такси — куда-нибудь подальше"
      goto: taxi

- id: shop
  text: |
    В магазине полутемно: свет мигает, кассирша считает на калькуляторе и ругается. Денег
    из бумажника хватит на немногое. У полки с водой мужчина набивает тележку до верха и
    рычит на каждого, кто подходит близко. Табличка над ним зелёная. Пока.
  choices:
    - label: "Взять бутылку воды"
      if: "item.water == 0"
      effects: ["item.water += 1"]
      text: "Вы успеваете раньше, чем мужчина с тележкой решает, что вода — его."
    - label: "Взять эластичный бинт в аптечном отделе"
      if: "item.bandage == 0"
      effects: ["item.bandage += 1"]
      text: "Колено скажет вам спасибо. Возможно, очень скоро."
    - label: "Расплатиться и выйти"
      goto: immunes

- id: immunes
  text: |
    У закрытого ларька курят двое. Камуфляж, разгрузки, короткие автоматы на ремнях — и никто
    вокруг не обращает на оружие внимания. Над ними таблички не зелёные, а белые: «Иммунный.
    Гуманность: низкая положительная».

    Тот, что с усами, смотрит на вас и хмыкает: — Гляди, Дюбель, нулёвка. Свеженький.
    Ещё в тапках.
  again: "У ларька курят те же двое: камуфляж, автоматы, белые таблички. Усатый снова хмыкает: «Нулёвка. Ещё в тапках»."
  extra:
    - if: "flag.k_crash or flag.k_crowd or flag.k_fire"
      text: "Вы знаете: эти двое — первые здесь, кто понимает, что происходит."
  choices:
    - label: "Спросить, что значит «нулёвка»"
      goto: immunes_talk
    - label: "Попроситься к ним"
      goto: immunes_beg
    - label: "Обойти их стороной"
      goto: taxi

- id: immunes_talk
  text: |
    — Ноль по всем статам, вот и нулёвка, — Дюбель сплёвывает. — Прищурься на себя: везде
    нули. Живой, и то хлеб.

    Усатый отвинчивает фляжку и суёт вам: — Хлебни. Гадость, но баланс поднимет. Потом
    объясняют, что это за баланс, — не мы.
  choices:
    - label: "Глотнуть из фляжки"
      if: "item.flask == 0"
      effects: ["item.flask += 1", "set flag.met_immunes"]
      text: "Кисло, горько и отдаёт дрожжами. Усатый машет рукой: забирай, у нас ещё есть."
      system: "Споровый баланс: 90%. Внимание: шкала открыта не полностью."
    - label: "Спросить, куда идти"
      if: "not flag.k_bridge"
      effects: ["set flag.k_bridge", "set flag.met_immunes"]
      text: "— На север, к мосту, — говорит Дюбель. — Город к ночи станет кормушкой. Найди железку потяжелее и бей в голову или по хребту."
    - label: "Попроситься к ним"
      goto: immunes_beg
    - label: "Кивнуть и идти своей дорогой"
      effects: ["set flag.met_immunes"]
      goto: taxi

- id: immunes_beg
  text: |
    — Не, — Усатый даже не задумывается. — Дог нулёвок не берёт. Ты ж нас первый день
    будешь тормозить, а второй — хоронить. Без обид.

    Дюбель смотрит внимательнее, будто прикидывает цену.
  choices:
    - label: "«Я знаю, где сегодня разобьётся колонна на проспекте»"
      if: "flag.k_crash"
      effects: ["set flag.met_immunes"]
      text: "Дюбель перестаёт улыбаться. — Откуда? … Ладно. Пойдёшь с нами. Дог сам решит."
      goto: dog_base
    - label: "Пойти за ними следом, тайком"
      effects: ["set flag.met_immunes"]
      roll:
        chance: "35 + var.luck * 5"
        success:
          text: "Вы держитесь в квартале позади. Они не оборачиваются — или делают вид."
          goto: dog_base
        fail:
          text: "За углом вас встречает приклад. Небо, асфальт, звон. Когда вы встаёте, их уже нет."
          goto: taxi
    - label: "Пожать плечами и уйти"
      effects: ["set flag.met_immunes"]
      goto: taxi

- id: dog_base
  chapter: "Новостройка"
  checkpoint: true
  text: |
    Недостроенная многоэтажка на окраине, окна первого этажа заложены мешками. Внутри — человек
    двенадцать, все с белыми табличками. На ящике сидит грузный мужик с бритой головой и
    рассматривает вас, как бракованную деталь. Это Дог.

    — Нулёвку притащили, — говорит он без вопроса. — Ну, покажи, что умеешь. Через дорогу
    продуктовый. Там двое уже урчат. Принеси воды — оставлю.
  choices:
    - label: "Бегом, напрямую ☠"
      roll:
        chance: "40 + var.luck * 5"
        success: { text: "Вы влетаете в магазин и обратно раньше, чем урчащие понимают, что произошло.", goto: dog_talk }
        fail: { text: "На полпути из-за прилавка поднимаются двое урчащих — быстрее, чем вы думали. Дог смотрит из окна новостройки и не двигается.", effects: ["die 'проверка Дога'"] }
    - label: "Вдоль стены, медленно, не дыша ☠"
      roll:
        chance: "60 + var.luck * 5"
        success: { text: "Шаг, шаг, ещё шаг. Двое у кассы жуют что-то и не поднимают голов.", goto: dog_talk }
        fail: { text: "Под ногой хрустит стекло. Двое у кассы поднимают головы одновременно.", effects: ["die 'проверка Дога'"] }
    - label: "«Нет уж». Уйти"
      text: "Дог пожимает плечами. Никто вас не держит — и никто не провожает."
      goto: taxi

- id: dog_talk
  text: |
    Дог забирает воду, отвинчивает крышку и пьёт сам, не предлагая. Потом кивает на ящик:
    садись.

    — Порядок такой, — говорит он. — Здесь все кому-то должны. Ты должен мне — за крышу и
    за то, что тебя не пристрелили у ларька. Отработаешь — получишь ствол и долю. Сбежишь —
    найду. Врать будешь — у меня есть человек, который ложь нюхом чует.
  choices:
    - label: "«Договорились»"
      goto: dog_end
    - label: "«А если я хочу уйти завтра?»"
      text: "— Завтра этот город перезагрузится, — Дог усмехается. — И ты уйдёшь с нами. Или останешься тут — с новыми жильцами. Выбор есть всегда. Просто он обычно плохой."
      goto: dog_end

- id: taxi
  chapter: "Проспект"
  checkpoint: true
  text: |
    Такси ловится неожиданно легко: таксист, пожилой и разговорчивый, рад любому живому
    пассажиру. — Куда? К мосту? Да хоть на край света, всё равно диспетчер молчит.

    Он гонит по проспекту, ругая правительство, жару и колонну военных грузовиков, которая
    ползёт навстречу.
  again: "Снова такси и тот же разговорчивый таксист. Он гонит по проспекту, ругая жару, а навстречу ползёт колонна грузовиков."
  extra:
    - if: "flag.k_crash"
      text: "Вы узнаёте этот проспект. Через пару минут здесь станет очень тесно."
  choices:
    - label: "«Что по радио говорят?»"
      if: "not flag.taxi_radio"
      effects: ["set flag.taxi_radio"]
      text: "— А ничего! — таксист крутит ручку: шипение на всех частотах. — С утра одно шипение. И телефоны. И диспетчер. Жена говорит — конец света. А я говорю: конец света — это когда бензин по сотке."
    - label: "«Вы видели людей, которые… урчат?»"
      if: "not flag.taxi_urch"
      effects: ["set flag.taxi_urch"]
      text: "Таксист долго молчит. — Видел, — говорит он наконец. — Ночью у вокзала. Я думал, пьяные. Пьяные так не ходят."
    - label: "Ехать как едем"
      goto: crash
    - label: "«Сверните во дворы, я покажу дорогу»"
      if: "flag.k_crash"
      text: "Таксист ворчит, но сворачивает. Позади, на проспекте, что-то грохочет, долго и страшно."
      goto: bridge_day

- id: crash
  text: |
    Сначала визг тормозов. Потом фура, которую несёт боком через три полосы. Бронетранспортёр
    колонны, лихач на седане, автобус — всё складывается в одну железную кучу, и ваше такси
    летит прямо в неё.

    Есть доля секунды.
  again: "Визг тормозов, фура боком через три полосы — всё как в прошлый раз. И снова доля секунды."
  choices:
    - label: "Сползти вниз, за спинку сиденья"
      roll:
        chance: "55 + var.luck * 5"
        success:
          text: "Удар. Звон. Темнота — короткая. Вы открываете глаза под смятой крышей; таксист не дышит."
          effects: ["set flag.k_crash"]
          goto: slepen
        fail:
          text: "Удар выбивает из вас сознание. Сколько вы лежали — неизвестно. Таксист не дышит, у вас рассечён лоб и звенит в ушах."
          effects: ["set flag.k_crash"]
          goto: slepen
    - label: "Распахнуть дверь и прыгать на ходу ☠"
      roll:
        chance: "25 + var.luck * 5"
        success:
          text: "Асфальт сдирает кожу с локтей, но вы катитесь в сторону от мясорубки."
          effects: ["set flag.k_crash"]
          goto: slepen
        fail:
          text: "Дверь распахивается, асфальт бьёт в плечо — и прямо на вас, боком, несёт фуру."
          effects: ["set flag.k_crash", "die 'прыжок из такси под колёса'"]

- id: bridge_day
  text: |
    Таксист высаживает вас за квартал до реки и уезжает, не взяв денег. У моста — оцепление:
    полиция, автобусы, бронетранспортёр поперёк дороги. Сам мост обрушен посередине: две
    половины смотрят друг на друга, между ними — пустота и рыжие фермы.

    Днём здесь не пройти незамеченным. Ночью — может быть.
  choices:
    - label: "Лезть по фермам прямо сейчас ☠"
      roll:
        chance: "35 + var.luck * 5"
        success:
          text: "Полицейские орут вслед, кто-то стреляет в воздух. Вы ползёте по ржавому железу и спрыгиваете на тот берег."
          goto: careful_end
        fail:
          text: "Ржавая ферма проворачивается под ладонью. Вода внизу далеко — и очень быстро становится близко."
          effects: ["die 'сорвался с ферм моста'"]
    - label: "Вернуться в город и переждать до темноты"
      goto: roof

- id: slepen
  chapter: "Слепень"
  checkpoint: true
  text: |
    Кто-то вытаскивает вас из-под железа за шиворот, как котёнка. Над вами — здоровенный
    мужик лет сорока, небритый, с цепочкой на шее; на цепочке — чёрный камень.
    Табличка белая.

    — Живой, Незнайка? — он ухмыляется. — Повезло. Первый день, а уже в кашу. Пошли, пока
    тут всё не загорелось. Меня Слепнем зовут.
  system: "Получено приглашение в отряд. Принято автоматически: у объекта нет идентификатора."
  choices:
    - label: "«Что здесь происходит?»"
      if: "not flag.asked_phases"
      effects: ["set flag.asked_phases"]
      text: "— Первая фаза, — Слепень кивает на горящую витрину. — Люди съезжают с катушек. Поджигают, прыгают, режут. Вторая — встанут те, кто урчит. Третья — те, кто ест урчащих. К утру нормальных тут не останется."
    - label: "«Кто эти люди? Почему у них зелёные таблички?»"
      if: "not flag.asked_npc"
      effects: ["set flag.asked_npc"]
      text: "— Цифры, — Слепень пожимает плечами. — Копия. Город прилетел сюда с ними вместе. Жалко их, конечно. Но живые тут — мы с тобой. Белые."
    - label: "«Как отсюда выйти? Где кнопка выхода?»"
      if: "not flag.asked_exit"
      effects: ["set flag.asked_exit"]
      text: "— Нету кнопки, — он смеётся, долго и не зло. — И не ищи. Торопыг тут наказывают. Прислонись к бывалому, слушай и не геройствуй."
    - label: "Идти за ним"
      goto: slepen_walk
    - label: "Поблагодарить и уйти одному"
      effects: ["set flag.left_slepen"]
      goto: knee

- id: slepen_walk
  text: |
    Слепень идёт быстро и говорит на ходу, не оборачиваясь, — как экскурсовод, который
    водил эту экскурсию сотню раз. Шкалы, мол, у тебя сейчас полупустые, разберёшься.
    Таблички белые — свои, зелёные — цифры, красные — беги.
  choices:
    - label: "«Что такое гуманность?»"
      if: "not flag.asked_hum"
      effects: ["set flag.asked_hum"]
      text: "— Совесть по-здешнему. Бьёшь урчащих — растёт. Бьёшь своих, кто тебя не трогал, — падает. Уйдёшь в минус — станешь красным, и тебя будут стрелять без разговоров. Даже свои."
    - label: "«Что было во фляжке у тех, с автоматами?»"
      if: "item.flask > 0 and not flag.asked_flask"
      effects: ["set flag.asked_flask"]
      text: "— Живчик. Споровый раствор. Без него иммунный за пару дней сохнет и помирает. Варят из споранов — это то, что у урчащих в затылке растёт. Береги фляжку."
    - label: "«Откуда вы знаете, что я нулёвка?»"
      if: "not flag.asked_zero"
      effects: ["set flag.asked_zero"]
      text: "— По тапкам, — он хмыкает. — И по глазам. У всех новеньких глаза одинаковые: будто ищут, где тут кнопка «назад»."
    - label: "Догнать его и идти молча"
      goto: first_phase

- id: first_phase
  text: |
    Слепень ведёт вас дворами, обходя проспекты. Город горит в трёх местах. На детской площадке
    сидит мужчина и аккуратно, по одной, бросает в песочницу горящие спички.

    Из-за гаражей выходит нечто — сутулое, с длинными руками, кожа как мятая бумага. Слепень
    не стреляет. Он просто смотрит на тварь, и тварь пятится, скуля, будто увидела что-то
    страшнее себя.
  extra:
    - if: "flag.asked_phases"
      text: "Вторая фаза пришла раньше, чем он обещал."
  choices:
    - label: "Спросить, как он это сделал"
      text: "— Умение, — бросает он. — Будет уровень — будут и у тебя. Если доживёшь."
      goto: crawler
    - label: "Молча идти дальше"
      goto: crawler

- id: crawler
  text: |
    У подъезда ползёт урчащий — ноги не слушаются, но руки цепкие. Слепень останавливается и
    протягивает вам обрезок трубы.

    — Добей. Это не человек уже. Тебе надо качаться, Незнайка, иначе ты так нулём и помрёшь.
  choices:
    - label: "Добить"
      effects: ["var.humanity += 1"]
      system: "Уничтожен заражённый. Уровень: 0. Сила: +3 к прогрессу. Гуманность: +1."
      text: "Это проще, чем должно быть. И от этого страшнее."
      goto: knee
    - label: "«Не могу»"
      text: "Слепень вздыхает и делает это сам. — Научишься, — говорит он. — Или не научишься."
      goto: knee

- id: knee
  text: |
    На перекрёстке вас замечают. Из переулка выскакивают двое — быстрые, угловатые, цокают
    по асфальту, будто на копытах.

    Вы бросаетесь бежать. На третьем шаге правое колено щёлкает, как сломанная ветка, и вы
    падаете на асфальт.
  extra:
    - if: "not flag.left_slepen"
      text: "Слепень, крикнувший «бегом!», уже на углу — и не оглядывается."
    - if: "flag.left_slepen"
      text: "Слепня рядом нет — вы сами отказались идти с ним. Цоканье всё ближе."
  choices:
    - label: "Перетянуть колено бинтом и ковылять дальше"
      if: "item.bandage > 0"
      locked: "Бинта нет — надо было зайти в аптеку"
      effects: ["item.bandage -= 1", "set flag.knee_wrapped"]
      text: "Бинт держит. Бежать нельзя, но идти — можно. Вы ковыляете в подворотню, пока цокающие разбираются с кем-то другим."
      goto: under_car
    - label: "Крикнуть Слепню"
      if: "not flag.left_slepen"
      roll:
        chance: "25 + var.luck * 5"
        success:
          text: "Он возвращается — на три секунды. Суёт вам в руку нож: — Под машину, живо. Ночью к реке. Не жди меня."
          effects: ["item.knife += 1", "set flag.slepen_knife"]
          goto: under_car
        fail:
          text: "Он даже не оборачивается. Может, не слышит. Может, так здесь принято."
          goto: under_car
    - label: "Заползти под припаркованную машину"
      goto: under_car

- id: under_car
  text: |
    Под днищем пахнет маслом и горячим железом. Цокающие проносятся мимо, останавливаются,
    нюхают воздух. Вы не дышите. Через минуту они уходят на чей-то крик.

    Весь день вы видите улицу с высоты асфальта: голые грязные люди бредут, натыкаясь на
    столбы. Кожа у них сморщенная, серая. Таблички над ними меняются с «человек» на
    «заражённый» — одна за другой.
  choices:
    - label: "Смотреть дальше"
      goto: transform
    - label: "Рвануть к реке прямо сейчас ☠"
      roll:
        chance: "20 + var.luck * 5"
        success:
          text: "Хромая, перебежками, вы уходите из этого квартала в сторону реки. Солнце садится в дым, а до воды ещё далеко."
          goto: night_flat
        fail:
          text: "Вы выползаете из-под машины, встаёте — и слышите за спиной цоканье. Колено не даёт бежать."
          effects: ["die 'цокающие на перекрёстке'"]

- id: transform
  text: |
    Напротив, у остановки, женщина в офисной юбке опускается на колени. Её трясёт. Рядом стоит
    девочка лет семи с рюкзаком в форме совы и дёргает её за рукав: «Мам. Мам, вставай».

    Табличка над женщиной мигает и меняется: «Заражённый. Уровень: 0». Над девочкой —
    по-прежнему «Человек». Женщина поднимает голову. Глаза пустые. Она начинает урчать.
  choices:
    - label: "Выскочить и утащить девочку под машину ☠"
      roll:
        chance: "50 + var.luck * 5"
        success:
          text: "Вы хватаете девочку за рюкзак и ныряете обратно под днище. Она не кричит — только дрожит. Женщина бредёт мимо, нюхая воздух."
          effects: ["var.humanity += 2", "set flag.saved_girl"]
          goto: girl
        fail:
          text: "Вы выскакиваете из-под машины. Женщина оборачивается на движение раньше, чем вы успеваете схватить рюкзак."
          effects: ["die 'вылез из-под машины за чужим ребёнком'"]
    - label: "Отвернуться. Это цифры. Копия. Так сказал Слепень"
      text: "Вы закрываете глаза. Детский крик обрывается быстро. Тишина хуже крика."
      effects: ["set flag.looked_away"]
      goto: roof

- id: girl
  text: |
    Под машиной тесно. Девочка смотрит на вас огромными глазами; табличка над ней зелёная —
    «цифра», копия, часть прилетевшего города. Слепень говорил: жалко, но живые тут — белые.

    Она спрашивает, где мама. Вы не отвечаете. К вечеру во дворе напротив загорается окно,
    и оттуда кто-то машет: живые, обычные люди, забаррикадировались в квартире.
  choices:
    - label: "Довести её до того подъезда"
      effects: ["var.humanity += 1"]
      text: "Дверь открывают на три секунды — ровно чтобы втащить девочку. Перед вами её захлопывают. Правильно делают."
      goto: roof
    - label: "Оставить её под машиной — до утра она там в безопасности"
      goto: roof

- id: roof
  chapter: "Крыша"
  checkpoint: true
  text: |
    Козырёк подъезда, потом крыша гаража, потом пожарная лестница. Наверху — гудрон, раскалённый
    за день, и вид на город, который больше не город. Дым столбами, зарево над портом.

    Ночь наступает быстро, как будто её включили. Пить хочется так, что темнеет в глазах.
  extra:
    - if: "item.water == 0"
      text: "Воды нет. Еды нет. Есть только эта крыша."
    - if: "item.water > 0"
      text: "В кармане — бутылка воды из магазина. Вы делаете два глотка и заставляете себя остановиться: ночь будет длинной."
    - if: "item.knife > 0"
      text: "Нож Слепня оттягивает карман. Единственное, что у вас есть."
    - if: "item.flask > 0"
      text: "Во фляжке плещется кислое пойло иммунных — пить его не хочется, но, может, придётся."
  choices:
    - label: "Открыть меню Системы — вдруг там что-то новое"
      if: "not flag.roof_menu"
      effects: ["set flag.roof_menu"]
      text: "В меню появился раздел «Чаты». Пустой. И строка: «До перезагрузки кластера: 31:12:04». Город, получается, проживёт чуть больше суток. А потом — снова. С начала."
    - label: "Остаться на крыше до утра"
      effects: ["set flag.stayed_city"]
      goto: roof_night
    - label: "Спуститься в темноте за водой и идти к реке"
      goto: night_flat
