# Главы 17–21 книги: бегство с раненой Няшей, гроза, деревня, кусач, «ты читер», Ромео.

- id: l9_carry
  chapter: "Хозяин деревни"
  checkpoint: true
  on_enter: ["var.stage = 9"]
  text: |
    Пуля раздробила Няше голень. Вы накладываете шину из веток, сажаете её себе на шею,
    берёте чехлы с оружием и идёте в лес. Она лёгкая, но не пушинка, а колено напоминает
    о себе на каждом корне.

    На привалах она объясняет. Бывают стабильные кластеры — они не перезагружаются
    никогда, там поселения, знахари, торговцы. До нормального стаба отсюда — сотни три
    километров. Бутылка живчика осталась в сгоревшей машине. Шкалы полные, падать будут
    примерно сутки. Значит, нужны укрытие, вода, еда и спораны.
  again: "Вы снова идёте по лесу с Няшей на плечах, и колено отзывается на каждый корень."
  choices:
    - label: "«Держись, малышка, донесу»"
      if: "not flag.l9_baby"
      effects: ["set flag.l9_baby"]
      text: "— Ещё раз назовёшь малышкой — переломаю ноги, — холодно сообщает Няша с вашей шеи. — Тогда сама пойдёшь, — резонно отвечаете вы. Она фыркает, но, кажется, чуть-чуть улыбается."
    - label: "«Как ты поняла про пять пуль? Издали же»"
      if: "not flag.l9_eyes"
      effects: ["set flag.l9_eyes"]
      text: "— У меня уровни, а у тебя костыль вместо колена. Глаза у меня зорче. — Она молчит, потом спрашивает, какая у вас меткость. — Пять. — Пять — это ничего. Компенсация такой не бывает, Рокки. Ты стрелял, как машина. Что-то тут не сходится."
    - label: "Идти дальше, не останавливаясь"
      goto: l9_storm

- id: l9_storm
  text: |
    К вечеру небо наливается неестественной синевой, потом чернеет, как гудрон. Духота
    липнет к коже.

    — Нехорошие тучи, — говорит Няша. — Где-то рядом перезагрузился большой кластер,
    погода от этого сходит с ума. Тут бывают дожди, от которых мясо слезает с костей.

    Ветер гнёт сосны. Капли падают редкие, огромные, тяжёлые, как камешки. Лес кончается
    вспаханным полем — новый кластер. За полем, за скирдой соломы, — короткая улица
    деревенских домиков. По полю, не касаясь вас, проходит смерч.
  choices:
    - label: "Через поле напрямик, как велит Няша"
      text: "Вы бредёте по раскисшей пашне. Молния бьёт в трактор посреди поля, и тут небо обрушивается целиком — ливень такой, что не видно собственных рук. Вы идёте вслепую, по Няшиным командам, как лошадь по вожжам."
      effects: ["var.bond += 1"]
      goto: l9_house
    - label: "По дороге в обход — по твёрдому"
      text: "«Напрямик ближе!» — «По пашне я рухну». Вы идёте по дороге — и ливень накрывает вас на полпути, плотный, как стена. Вы бредёте вслепую, по Няшиным командам, как лошадь по вожжам."
      goto: l9_house

- id: l9_house
  text: |
    Покосившийся дом со ставнями, внутри неожиданно чисто. Вы укладываете Няшу на диван.

    — Только холодильник не открывай, — говорит она. Через минуту вы понимаете почему:
    электричества тут нет давно.

    Дальше она командует. Обойти дом, проверить каждую дверь. Рассыпать у входов битое
    стекло, поставить вёдра — пусть гремят. Набрать дождевой воды. За кухней — хлев,
    оттуда несёт тухлятиной: в загонах кости, обглоданные начисто. Кто-то съел здесь всю
    скотину.

    Колено в конце концов сдаётся. Няша сама туго бинтует его полосками, которые нарезала
    из простыни, пока вы ходили. Сама она даже не морщится — со своей пулей в кости.
  choices:
    - label: "«Ты здесь не месяц, как говорила. Минимум год»"
      if: "not flag.l9_year"
      effects: ["set flag.l9_year"]
      text: "— С чего ты взял? — Слишком уж ты привычная. — Думать — это не твоё, Рокки. — Но злости в голосе нет. Она говорит, что болевой порог у прокачанных ниже. И что она с самого начала была со странностями."
    - label: "Спросить, какой у неё уровень"
      if: "not flag.l9_lvl"
      effects: ["set flag.l9_lvl"]
      text: "— Тебе этого знать не надо. — Я твой вижу, в настройках отряда, — добавляет она. — А ты мой — нет. Так настроила."
    - label: "Поужинать сухим печеньем и лечь"
      text: "План у Няши такой: пару-тройку дней отлёживаться. Потом вы с топором и ружьём обойдёте деревню. — Если тут остался один мертвяк, — говорит она, засыпая, — это не простой мертвяк. Одиночки в пустых деревнях — самые жирные. — Под шум ливня вы проваливаетесь в сон."
      goto: l9_night

- id: l9_night
  text: |
    Будят вас среди ночи. Няша сидит рядом с винтовкой на коленях и шипит: «Тихо!»

    — Зараженный. Один. Не мелочь. Сильно выше двадцать пятого. Кусач, похоже.

    Она поставила на него метку — это её умение: теперь она чувствует, где он, даже сквозь
    стены. Тварь кружит у дома, но не лезет. Ждёт. Дождь слабеет, а такие воду не любят.
    Значит, когда дождь кончится, придёт.

    Патроны у вас охотничьи, не бронебойные. Голову такой твари не пробить. Глаза узкие,
    прикрыты роговыми пластинками. Пасть изнутри — мягкая.
  again: "Ночь, шум дождя, Няша с винтовкой на коленях. Тварь кружит у дома и ждёт, когда кончится ливень."
  choices:
    - label: "Предложить план: выманить его в хлев — на себя"
      text: "Самый крепкий самогон из погреба — в бутылку, тряпку в горлышко. Вы бросаете бутылку в хлев, тварь лезет на огонь, вы стреляете ей в открытую пасть. — Бредовый план, — говорит Няша. — Огонь, шум… Ладно. Другого нет. — Она смотрит на вас странно. — Почему не я приманка? — Потому что ты интересная, — отвечаете вы. — Ещё понравишься мне ненароком."
      effects: ["var.bond += 1"]
      goto: l9_kusach
    - label: "Сидеть в доме и ждать утра"
      if: "not flag.l9_wait"
      effects: ["set flag.l9_wait"]
      text: "— Утром дождь кончится, — шепчет Няша. — И тогда он сам выберет, когда войти. Брус для его когтей — что картон. Здесь он нас и возьмёт, в тесноте."
    - label: "Выскочить и стрелять, пока он не ждёт ☠"
      roll:
        chance: "15 + var.luck"
        success:
          text: "Вы вылетаете на крыльцо. Тварь в двадцати шагах, поворачивает голову — и вы стреляете в распахнутую пасть раньше, чем она успевает прыгнуть. Невероятная удача."
          system: "Удача: сработала."
          goto: l9_loot
        fail:
          text: "Вы выскакиваете на крыльцо и не видите ничего, кроме дождя. Тварь видит вас. Удар приходит сбоку, из темноты."
          effects: ["die 'кусач, хозяин деревни'"]

- id: l9_kusach
  text: |
    Дождь ледяной, с крыши хлещет. Вы пробираетесь через хлев по навозу и костям,
    чиркаете зажигалкой и швыряете бутылку. Звон, синеватые языки пламени по доскам.

    Тварь вылетает из-за угла быстрее, чем вы успеваете вскинуть винтовку. Она огромная —
    рыцарь в доспехах, помноженный на акулу, — и неправдоподобно быстрая. Бежать нет
    смысла. Вы стреляете, почти не целясь, в распахнутую пасть.

    А потом вас сносит, вбивает в навоз, и сверху наваливается туша весом с машину.
  choices:
    - label: "Выбираться из-под туши"
      goto: l9_loot

- id: l9_loot
  intro:
    - if: "from == 'l9_night'"
      text: "Тварь валится на ступени крыльца и бьётся в агонии."
  text: |
    Перед глазами красное: «Опасный заражённый уничтожен вами лично. Уровень: 37».
    Тридцать семь! Пуля прошла через пасть прямо в мозг.

    Няша сама разделывает затылок — её мечом вскрыть мешок проще простого. Трофеи она
    раскладывает на столе, как ювелир: девять споранов, два янтарных шарика, четыре
    зерна, орех. И звезда — иссиня-чёрная, тёплая. Самая дорогая из звёзд, говорит Няша.

    Из споранов и самогона она тут же разводит живчик. А потом задаёт вопрос, который,
    видно, мучил её с самого вертолёта:

    — Рокки. Сколько жизней ты здесь прожил?

    — Это пятая.
  extra:
    - if: "deaths > 4"
      text: "Если честно, больше: пару раз вы умирали совсем по-глупому. Но об этом Няше знать необязательно."
  system: "Получено 30 нераспределённых очков основных характеристик. Получен уровень 2."
  on_enter: ["var.level += 1", "item.spores += 9"]
  choices:
    - label: "Рассказать всё: про элиту и три шарика"
      goto: l10_cheat

# ── глава: читер ───────────────────────────────────────────────────────────────

- id: l10_cheat
  chapter: "Читер"
  checkpoint: true
  on_enter: ["var.stage = 10"]
  text: |
    Вы рассказываете про ночной город, «буханку», элиту и умирающего Усатого. Про грибок
    на затылке и про три шарика — чёрный, красный, зелёный, — которые вы проглотили
    разом под переворачивающимся грузовиком.

    Няша слушает, приоткрыв рот. Потом долго молчит.

    — Это жемчуг, — говорит она наконец. — Его едят по одной, раз в полтора дня.
    Кто съест неправильно — станет квазом: страшный, как мертвяк, умения и уровни слетают.
    А ты съел три разом — и ничего. Потому что у новичка, пока все основные — ноль, есть
    иммунитет. Пара дней. Никто про это не знает, Рокки. Никто.
  choices:
    - label: "«И что теперь?»"
      text: "— А то, что Система перестраховалась. За колено тебе положена компенсация — меткость, как у снайпера. Жемчуг вкачал тебе Грани Таланта, а удача улетела до двадцати восьми, потому что такого никогда не случалось. — Она смотрит на вас почти с завистью. — Ты нашёл дырку в правилах. Ты сломал Систему. Ты — читер."
      goto: l10_house

- id: l10_house
  text: |
    — Читер, — повторяете вы. — Звучит как ругательство.

    — Это и есть ругательство. Но тебе подходит. — Няша рассказывает, что ещё бывает
    в мешках тварей. Спораны — для живчика и как деньги. Жёлтые горошины — их пьют
    с уксусом, они качают ментальную силу. Зерно на несколько часов усиливает одну из
    основных характеристик, орех — дополнительную. Звёзды поднимают шкалы. А на десятом
    уровне иммунный получает первый дар — умение. На тридцатом второй, на шестидесятом
    третий.

    На следующий день вы переезжаете в другой дом, со ставнями покрепче. Няша сшивает
    из одеял спальные мешки, вы находите примус. Колено заживает на глазах: кривое,
    но почти не болит.
  extra:
    - if: "flag.w1_refused"
      text: "Вы вспоминаете Слепня с его «пойдёшь со мной?». Пошли бы — никакой Няши и никакого читерства. Странно думать, что от одного «нет» столько зависело."
  choices:
    - label: "Спросить, от кого она прячется"
      goto: l10_romeo

- id: l10_romeo
  text: |
    Няша долго молчит, глядя в щель ставня.

    — Ромео. Основатель, из самых старых. Тоже читер, как ты, только по-плохому: он нашёл,
    как обмануть шкалу удовольствия. Если обычный человек долго творит зверства, ему
    становится тошно жить — Система следит. А Ромео — нет. Ему нравится. Он красный,
    садист, и людей ломать — его хобби.

    Она была в отряде Валькирии — одни девчонки. Была война с Ромео. Валькирия погибла.
    А Ромео с тех пор охотится за Няшей. Ему нужна она живая. Как трофей, как вещь.
    — Ещё он ищет золотой жемчуг. Но меня — сильнее.
  choices:
    - label: "«Я тебя ему не отдам»"
      if: "not flag.l10_promise"
      effects: ["set flag.l10_promise", "var.bond += 1"]
      text: "— Рыцари мне уже обещали, — невесело усмехается Няша. — Красиво обещали. Не надо, Рокки. Ты и себя-то не знаешь: в голове у тебя пусто."
    - label: "«Почему не уйти в другой регион, подальше?»"
      if: "not flag.l10_region"
      effects: ["set flag.l10_region"]
      text: "— Регион меняют после пяти смертей подряд, за короткое время. Дальше интервалы растут. Регионы разделены чернотой, болотами, мёртвыми мегаполисами. Континент — размером с Евразию, а в море хозяйничают нолды, туда лучше не соваться. — Она отворачивается. — И жизни у меня, Рокки, не бесконечные."
    - label: "Наутро собираться в путь"
      text: "Через пару дней погода налаживается, нога у Няши заживает куда быстрее, чем полагается раздробленной кости. — Пора уходить, — говорит она. — Слишком долго сидим на одном месте."
      goto: l11_forest

# ── случайная смерть в пятой жизни: дорога назад, к деревне ────────────────────

- id: l9_retry
  text: |
    Новая общага, новый сосед, новый кластер. Чат с Няшей серый: она далеко, сигнал не
    доходит. Вы почти бегом выбираетесь из города, выменяв у какого-то студента карту.

    Двое суток вы идёте назад — по лесам, полям, вдоль дорог, ориентируясь по солнцу и
    вышкам. На второй вечер строка «Няша — Ноль» загорается снова. Одно слово: «Придурок».
    Значит, жива.
  again: "Опять общага, серый чат и двое суток дороги назад. На второй вечер строка «Няша — Ноль» снова загорается: «Придурок»."
  extra:
    - if: "var.stage == 9"
      text: "Деревня всё та же. Тварь тоже: Няша чует её метку. Вашу винтовку она сберегла — та стоит у дивана."
  on_enter:
    - { if: "item.rifle == 0", then: ["item.rifle += 1"] }
  choices:
    - label: "Вернуться к Няше"
      goto: l9_night
