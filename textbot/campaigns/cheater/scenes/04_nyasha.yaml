# Главы 12–16 книги: пятая жизнь. Чат с Няшей, крестины, живчик, банкомат, оружейный, тайник, погоня, вертолёт.

- id: l7_wake
  chapter: "Крёстная"
  checkpoint: true
  text: |
    Вы открываете глаза в очередной проклятой общаге и, не слушая соседа, который
    ошалело спрашивает, чем это вы сейчас светились, натягиваете рубашку.

    За дверью туман и морось. Вы сворачиваете за угол, садитесь на крыльцо чужого
    подъезда и открываете чат. Строка «Няша — Ноль» мигает, будто злится.

    «Господи, ну и придурок!»

    «Я кому говорила — Глобуса первым?!»

    «Эй, тупорылый, ты писать разучился?»
  intro:
    - if: "flag.l6_fought"
      text: "Не успели погаснуть цифры отсчёта, как посыпались запоздалые строчки. «Вами лично уничтожен иммунный Баклан, 29-й уровень». «Вами лично уничтожен иммунный Рельса». «Отрядом уничтожен иммунный Дирижёр». И последняя, самая длинная: «Получен уровень 1».\n"
  extra:
    - if: "flag.l6_obeyed"
      text: "Упрёк про Глобуса несправедлив: его-то вы и стреляли первым. Видно, такие, как он, умирают не с первой пули."
    - if: "flag.l6_silent or flag.l6_punched"
      text: "Отдельной строкой, позже остальных: «Выбралась сама. Без тебя. Спасибо, что не мешал»."
  system: "Кластер 197-33-02. Возрождений: 95. Подсказка: у противника могут быть умения Континента — таких убирают первыми."
  on_enter:
    - "var.stage = 7"
    - { if: "flag.l6_fought", then: ["var.level += 1", "var.humanity += 280"] }
  choices:
    - label: "Ответить вежливо — она тут единственная, кто что-то объясняет"
      text: "«Звонок в чате у меня не работал, я тебя не слышал», — набираете вы. «Потому что придурок. Жми значок слева. Где ты?» — «У какой-то общаги на Листопадной». — «Ага. Те, кого ты уложил, — муры, Континент их тут быстро воскресит. Тебе нельзя одному. Пойдёшь со мной?» — «Да». — «Правильно. Я твой единственный шанс. Иди на проспект Металлургов»."
      effects: ["var.bond += 1"]
      goto: l7_meet
    - label: "Огрызнуться — но согласиться"
      text: "«Тебе больше хамить некому?» — «Не нравлюсь — уходи из отряда и кидай меня в игнор». — «Знать бы ещё, где он». Пауза. Потом: «Те уроды скоро вернутся сюда, Континент их воскресит. Одного тебя прибьют за час. Пойдёшь со мной или нет?» — «Пойду». — «Проспект Металлургов. Шевелись»."
      goto: l7_meet

- id: l7_meet
  text: |
    На перекрёстке с проспектом вы садитесь на пустую лавочку и пишете: «Я на месте.
    Никаких колобков на ножках-спичках не вижу». Ответ короткий: «Колобок, значит? Ну жди».

    Пока ждёте, вы от скуки решаете, какие девушки вам нравятся. Высокие, светлые,
    с мягкими чертами и длинными ногами. Вот это — точно.

    А по тротуару идёт ровно противоположное: тощая темноволосая девчонка, острое лицо,
    большой рот, шорты, зелёный топ, бижутерия, каблучки. Цокает прямо к вам.

    — Ну и чего расселся? Отлепи взгляд от асфальта и пошли, придурок.

    Вы щуритесь. Белая табличка: «Иммунный. Гуманность: низкая отрицательная. Няша».
  choices:
    - label: "«Погоди… Ты же была толстая! И голос не тот!»"
      if: "not flag.l7_shock"
      effects: ["set flag.l7_shock"]
      text: "— А какой мне быть после двух суток в чёрном болоте? — Няша закатывает глаза. — Потом коллектор, пуля, кляп во рту. Толщина — это защита под тряпьём, грязь — для маскировки. Голос — сам подумай, с разбитым ртом."
    - label: "«Где ты была так долго?»"
      if: "not flag.l7_hair"
      effects: ["set flag.l7_hair"]
      text: "— В парикмахерской, — невозмутимо отвечает Няша. — Волосы отросли, длинные — это кошмар: в глаза лезут, за всё цепляются. А чего? Неплохо подстригли, правда?"
    - label: "Идти за ней"
      goto: l7_cafe

- id: l7_cafe
  text: |
    Няша заводит вас в убогое уличное кафе и с интересом листает меню.

    — Будем отмечать твоё крещение, — говорит она. — Я твоя крёстная.

    Крестины тут — не про церковь. У нулёвки нет своего опознавательного номера, и без
    него всё работает вполсилы: умения растут плохо, опыта меньше, о скрытых способностях
    Система не сообщает. Крёстным становится иммунный, который даёт тебе прозвище. Если
    ты соглашаешься — оно приклеивается. В первые дни крёстный может разок его поменять.

    — Рок? Так тебя цифра в общаге назвал? Плохая примета — крёстный-цифра. Я, между
    прочим, ещё никого не крестила. Был один новичок, но не дожил.
  choices:
    - label: "«Пусть будет Рокки. Мне без разницы»"
      text: "— Без разницы ему, — Няша смотрит с укором. — Это имя, придурок, к нему серьёзнее надо. Ну ладно. Рокки. Как боксёр. Лицо у тебя как раз подходящее."
      goto: l7_name
    - label: "«Выбери сама. Ты же крёстная»"
      text: "Няша склоняет голову набок и думает всерьёз, по-настоящему. — На рокера ты не похож, — решает она. — Скорее на боксёра, битого. Рокки."
      effects: ["var.bond += 1"]
      goto: l7_name

- id: l7_name
  text: |
    Перед глазами вспыхивает: «Игрок Няша предлагает вам новое имя: Рокки.
    Согласны — произнесите „да“».

    — Да, — говорите вы. И ничего не чувствуете. Ни грома, ни ангелов. Только Няша
    вдруг довольна, как кошка у миски.

    — Рокки, — пробует она на вкус. — Всё, теперь ты человек. Ну, почти. Я спиртного в рот
    не беру, и ты не будешь. Так что символически — минералки.
  system: "Имя «Рокки» принято. Индивидуальный номер присвоен."
  choices:
    - label: "Показать ей колено — вдруг здесь такое лечится"
      if: "not flag.l7_knee"
      effects: ["set flag.l7_knee"]
      text: "Няша разглядывает ваши шрамы и говорит: калек Континент обязан чем-то компенсировать — это закон. Она встаёт, делает сальто назад и приземляется на ноги, как кошка. — У меня вместо позвоночника был лом. Теперь — гимнастика. А у тебя что-нибудь такое было? Абонемент, кружок? — Рекламка стрелкового клуба в бумажнике. — Поздравляю, — Няша просияла. — Тебе досталась меткость."
    - label: "Спросить, вернётся ли память"
      if: "not flag.l7_memory"
      effects: ["set flag.l7_memory"]
      text: "— По кусочку, — говорит Няша. — С уровнями блоки слетают. Я вот уже до старших классов вспомнила. Целиком — никто не вспомнил, но имя вернуть можно. Так что качайся."
    - label: "Спросить, что это за мир"
      if: "not flag.l7_world"
      effects: ["set flag.l7_world"]
      text: "— Континент. Что это — не знаем. Выйти можно? Не знаем. Похоже на игру, но не игра. — Она достаёт кристалл на шнурке и крутит в пальцах. — В городе ещё четверо иммунных. Нам повезло: значит, твои муры воскресли где-то ещё. Людей тут убивают постоянно, но если убьёшь без причины — человечность уйдёт в минус. Таких зовут красными."
    - label: "Пойти за ней — она требует ваши деньги «на водку»"
      text: "— Деньги давай, — Няша протягивает ладонь. — Нам нужна водка. Без неё не проживёшь ни ты, ни я. — Вы смеётесь: вот это правильная девочка. Она смотрит так, что смех застревает в горле."
      goto: l7_vodka

- id: l7_vodka
  text: |
    Пить водку Няша не собирается. Она достаёт из кармана шортиков зелёный комочек —
    точь-в-точь как те, что вы выковыривали из элиты, — давит его в стакане с водкой,
    процеживает через бинт и разбавляет водой.

    — Это живчик. Смотри и нюхай: этот запах надо узнавать с закрытыми глазами. Это — жизнь.

    Шкала спорового баланса — одна из семи полосок без подписей. У новичка она на десять
    единиц, с уровнем растёт. Падает от нагрузок, ран, умений. Ниже половины — слабость
    и тупость, на нуле — смерть и респ. Глоток живчика — примерно одна единица.

    Вы делаете три глотка. Гадость, конечно, но гадость знакомая.
  system: "Споровый баланс: 11 из 11."
  choices:
    - label: "«Я себя роботом чувствую: масло, бензин, заправка»"
      if: "not flag.l7_robot"
      effects: ["set flag.l7_robot"]
      text: "— Не говори так, — неожиданно серьёзно отвечает Няша. — Мы прежние люди. Это всё снаружи, напускное. Внутри — мы."
    - label: "Идти за ней дальше"
      goto: l7_atm

- id: l7_atm
  text: |
    Деньги Няша тратит мгновенно — на дешёвую жареную картошку без масла. Новые деньги
    находит ещё быстрее. Посреди улицы она хватает вас за рукав: «Прикрой меня», — и
    встаёт к банкомату. Банкомат без электричества мёртв, но из щели вдруг вываливается
    пачка купюр. Ещё одна.

    — Все иммунные — экстрасенсы, у каждого свои умения, — шепчет она. — У меня есть
    телекинез. Нет, ты — не экстрасенс. Ты придурок.

    — К нам полицейские идут, — сообщаете вы.

    — Тебя же просили — прикрой!

    — Я тебе что, ширма раздвижная?
  choices:
    - label: "Встать между ней и полицейскими"
      text: "Вы шагаете навстречу патрулю. «Сержант такой-то, предъявите документы». Няша, засовывая купюры в карман, проскальзывает мимо вас — и через секунду оба полицейских лежат на асфальте. Вы даже не поняли, что она сделала."
      effects: ["var.bond += 1"]
      goto: l7_cops
    - label: "Смотреть, что она будет делать"
      text: "«Банкомат не работает, ваши документы», — говорит сержант. — Вечно у вас, цифр, одна пластинка, — вздыхает Няша. Полторы секунды — и оба полицейских лежат на асфальте."
      goto: l7_cops

- id: l7_cops
  text: |
    Няша спокойно выдёргивает у полицейских пистолеты и наручники и суёт один пистолет вам:
    «Спрячь под рубашку».

    — Сейчас тут всё оцепят!

    — Хорошо бы, — мечтательно отвечает она. — У оцепления оружие получше. А спецназ —
    вообще праздник: у них всё самое лучшее.

    Вы хромаете за ней и думаете, что эта девчонка весит килограммов сорок пять и рассуждает
    об оцеплении, как о распродаже. Что-то с ней не так. Колено ноет. Няша оборачивается:
    пешком вы далеко не уйдёте. План на остаток дня — обед, тряпки, оружейный магазин.
    А потом надо ждать какого-то звонка, без которого уезжать нельзя.
  on_enter: ["item.pistol += 1"]
  choices:
    - label: "«Мы что, оружейный грабить собрались?!»"
      text: "— Когда гаснет свет, их закрывают: сигнализация не работает, — объясняет Няша, как маленькому. — Продавцы сидят внутри и сторожат. Так что не грабить. Почти."
      goto: l8_gunshop

# ── глава: звонок ──────────────────────────────────────────────────────────────

- id: l8_gunshop
  chapter: "Звонок"
  checkpoint: true
  text: |
    Охранник оружейного не успевает даже испугаться: Няша мелькает рядом — и он оседает.
    Вы затаскиваете тушу за прилавок, а она уже звенит железом.

    — Возьми винтовку. К плечу. Как ощущения?

    — Вроде понятно…

    — Плохо. Раз нет чёткого ощущения — не рискуем. — Но охотничью винтовку с оптикой и
    дробовик она всё равно пакует в чехлы, туда же патроны, камуфляж, ножи, аптечку.

    Посреди грабежа она вдруг замирает у двери и прислушивается.
  on_enter: ["var.stage = 8", "item.rifle += 1"]
  choices:
    - label: "Сгрести ещё патронов"
      if: "not flag.l8_ammo"
      effects: ["set flag.l8_ammo"]
      text: "Вы хватаете пару пачек — и понимаете, что это не те: пулевые к дробовику, а не к винтовке. Няша шипит: «Бросай!»"
    - label: "«Что там?»"
      goto: l8_truck

- id: l8_truck
  text: |
    — Уходим! — Няша уже тащит вас к чёрному ходу.

    Теперь и вы слышите надсадный гул мотора. К магазину подползает грузовик, обваренный
    стальными листами, решётками и заточенной арматурой, — самодельный броневик.
    Из кузова лезут люди с автоматами.

    — Иммунные так ездят, — шепчет Няша. — Нормальной брони на всех не хватает.
    Конкуренты. Нормальные или нет — не знаю, проверять не хочу.

    Вы прячетесь этажом выше в соседнем доме. Новенькие заходят в магазин. И Няша вдруг
    дёргается и шепчет: «Ну наконец-то! Звонок!»
  choices:
    - label: "«Какой звонок? Телефоны же не работают»"
      text: "— Не тот звонок, придурок, — Няша уже спускается по лестнице. — Бегом. Где катается одна такая команда — там и другие. А меня тут любой готов грохнуть: гуманность у меня в минусе, за меня ничего не будет. Да ещё Ромео награду объявил."
      goto: l8_cache

- id: l8_cache
  text: |
    Мотоцикл стоит за домом, будто ждал. Няша водит его как ненормальная: вы дважды чуть
    не врезаетесь, но она даже не моргает. На заброшенной стройке она разгребает бетонные
    обломки — и вытаскивает чёрный кейс, которого минуту назад тут быть не могло.

    Через пять минут из-за угла выходит другая Няша: в странной куртке, обтягивающей и
    грубой одновременно, а за спиной — меч.

    — Видишь? Посмотри как следует.

    «Кусака. Меч. Происхождение: чёрные земли. Усилен. Известных свойств нет, скрытые — имеются».

    — Я его почти что крестила, — говорит Няша. — Он привязан ко мне. И одежда тоже.
  choices:
    - label: "«Привязан — это как?»"
      if: "not flag.l8_bound"
      effects: ["set flag.l8_bound"]
      text: "— За каждые десять единиц силы даётся место под одну привязанную вещь. Умрёшь — они появятся на новом месте, рядом с тобой. Не сразу: приходит знак, что вещи прибыли. Вот это и был звонок. Сломай меч, сожги одежду — всё равно вернутся."
    - label: "Сесть на мотоцикл"
      text: "— Будь готов к проблемам, — бросает Няша, газуя. — Ты ещё не видел, как я гоняю. — А я и не хочу, — честно говорите вы. — Придётся, Рокки. Придётся."
      goto: l8_chase

- id: l8_chase
  text: |
    Город сходит с ума у вас на глазах: дым, мечущиеся люди, кто-то бьёт витрины. Из двора
    стреляет мужик с охотничьим ружьём. Мотоцикл кувыркается, вы катитесь по асфальту.
    Няша перелетает через капот припаркованной машины, мимоходом касается стрелка — и тот
    падает. Она достаёт ключи у него из кармана.

    Дальше вы едете на его машине. Коробка-автомат, Няша рулит хуже некуда, бортом цепляет
    бордюр. Следом гонится какой-то псих с ружьём, потом полицейская машина.

    — Цифры нас чуют, — объясняет она. — На иммунных у многих нюх. А на меня — особенно:
    я в минусе по гуманности, таких они ненавидят. Держи руль!
  choices:
    - label: "«Давай я по полиции стрельну!»"
      if: "not flag.l8_police"
      effects: ["set flag.l8_police"]
      text: "— В полицию?! — Няша чуть не бросает руль. — Ты меня в минуса загнать хочешь? Того психа можно: он первый полез. А полицейские нас не трогали. Вырубить — можно, убить — нельзя. Система всё видит."
    - label: "Держать руль, пока она высовывается с пистолетом"
      text: "Вы держите руль, а Няша наполовину вылезает в окно. Один выстрел — по колесу полицейской машины. Та виляет и уходит в столб. Няша плюхается обратно: «Рисковала. Могла в человека попасть»."
      goto: l8_border

- id: l8_border
  text: |
    Машину встряхивает на ровном месте. — Граница кластера, — бросает Няша. — Тут всегда
    трясёт: асфальт склеен из двух кусков. — Дальше дорога пустая, лес по сторонам. Она
    протягивает вам бутылку живчика: колену нужно.

    — Далеко на машине не уедем. Мертвяки считают машину чем-то вроде танка — бегут на
    звук со всей округи. Скоро бросим.

    И тут сверху по асфальту хлещут пули. Вертолёт. Крышу прошивает очередь, Няша
    вскрикивает — коротко, зло. Позади хлопает пробитый бак. Машина слетает на просёлок,
    подпрыгивает на кочке и встаёт.

    — Беги! — Няша плачет, но голос злой. — Пуля в кость, отбегалась я! Беги, придурок!
  choices:
    - label: "Подставить ей спину: «Ты лёгкая, донесу»"
      if: "not flag.l8_carry"
      effects: ["set flag.l8_carry", "var.bond += 1"]
      text: "Няша отпихивает вас и падает на спину: «Беги, сказала!» Вертолёт разворачивается неспешно, по-хозяйски. С ней на плечах до леса не дойти — его накроют раньше."
    - label: "Бежать, как она велит"
      if: "not flag.l8_flee"
      effects: ["set flag.l8_flee", "var.bond -= 1"]
      text: "Вы делаете три шага к лесу. Четыре. И останавливаетесь. Ноги отказываются нести дальше — без неё."
    - label: "Выдернуть из чехла винтовку"
      goto: l8_heli

- id: l8_heli
  text: |
    Охотничья винтовка, непристрелянная. Пять патронов, крупных: будто Няша знала, на кого
    охотиться. Вертолёт заходит прямо на вас, собирается зависнуть и расстрелять, как в тире.

    Вы ловите кабину в прицел и жмёте на спуск. Отдача бьёт в плечо, грохот глушит. Ещё.
    Ещё. Ещё. На пятом выстреле вертолёт вдруг клюёт носом, заваливается набок и врезается
    в поле. Чёрный дым, огонь.

    Вы даже не понимаете, что сделали. Просто стреляли быстро, потому что медлить было
    некогда.
  system: "Безумец уничтожен вами лично. Уровень: 2. Ещё один безумец, уровень 2, — тоже ваш."
  choices:
    - label: "Подбежать к Няше с аптечкой"
      text: "— Рокки? — Няша смотрит на вас так, будто впервые видит. — Винтовка же не пристреляна. А ты положил в кабину пять из пяти. Пять, Рокки! Я видела."
      goto: l9_carry
