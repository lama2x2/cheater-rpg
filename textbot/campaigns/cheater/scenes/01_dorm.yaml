# Главы 1–2 книги: первая и вторая жизнь в общаге. Плюс общие сцены возрождения.

- id: wake
  chapter: "Жизнь первая. Общага"
  checkpoint: true
  text: |
    Снилась широкая лестница из каменных плит, блестящий лифт и вы сами — зачем-то в пиджаке.
    Потом лестница кончилась, и осталась темнота с горящей строкой.

    Вы открываете глаза. Узкая койка, облезлые обои, на соседних кроватях — груды одеял.
    Пахнет носками и вчерашним пивом. И самое скверное: вы не знаете, кто вы. Не помните
    имени. Не помните вообще ничего, кроме той лестницы.

    А строчки из сна никуда не делись. Висят прямо в воздухе, полупрозрачные, и не гаснут,
    сколько ни моргай.
  extra:
    - if: "meta.runs > 1"
      text: "Где-то на самом дне головы шевелится чувство, что всё это уже было. И кончилось плохо."
  system: "Новичок, добро пожаловать в новый мир. Число возрождений ограничено — берегите их. Кластер 145-33-29, регион Западное Побережье. Возрождений: 99. Задания: выжить, искать, узнать тайное, помочь, задать правильный вопрос. До перезагрузки кластера: 100 секунд. Удачной игры."
  choices:
    - label: "Сказать вслух «Привет» — проверить, умеете ли говорить"
      text: "— Привет, — говорите вы пустой комнате. Голос слушается. А комната, оказывается, не пустая: дальняя груда одеял сипло отвечает «И тебе привет»."
      goto: l1_sery
    - label: "Вчитаться в строчки"
      goto: l1_menu

- id: l1_menu
  text: |
    Сто секунд до какой-то перезагрузки. Девяносто девять жизней. Задания, похожие на
    загадки из дешёвого квеста. Вы пробуете сказать про себя «Меню» — и поле зрения
    захлёстывает мешанина цветных плашек. Сказать ещё раз — исчезает.

    Ни одной понятной кнопки. Семь полосок без подписей, пустой раздел «Умения». Если
    это игра, то делал её садист.

    С дальней койки доносится сиплое: «И тебе привет». Похоже, последнее слово вы
    всё-таки произнесли вслух.
  choices:
    - label: "Повернуться к соседу"
      goto: l1_sery

- id: l1_sery
  text: |
    Из-под одеял выглядывает всклокоченная голова — брюнет лет двадцати с помятым после
    вчерашнего лицом.

    — Рок, ты под чем? — спрашивает он вместо «доброго утра». Его зовут Серый, это вы
    выясняете быстро. А вот «Рок» — явно не имя, а кличка. Но другого у вас нет.

    Серый говорит, что вы тут раньше жили, что вы спортсмен и почти кандидат наук, что
    в аспирантской общаге вам место, а не здесь. Свет не горит, роутер мёртв, телефон не
    ловит сеть. Серый ругается и косится на вас всё подозрительнее.
  again: "Серый ворочается под одеялами и поглядывает на вас как на ненормального."
  intro:
    - if: "from == 'l1_menu'"
      text: "Вы смахиваете меню и садитесь на койке."
  choices:
    - label: "«Как меня зовут? По-настоящему?»"
      if: "not flag.l1_name"
      effects: ["set flag.l1_name"]
      text: "Серый мнётся, отводит глаза и мелет про какую-то Светку, Паровоза и Мишку из меда. Имени он так и не произносит — будто боится, что тогда вы не вспомните сами."
    - label: "«Что со мной? Почему я ничего не помню?»"
      if: "not flag.l1_pills"
      effects: ["set flag.l1_pills"]
      text: "— Колёса, — уверенно ставит диагноз Серый. — Хапнул чего-то у барыг, вот и накрыло. К врачам не ходи, они анализ возьмут — проблем не оберёшься."
    - label: "Принять снотворное, которое он протягивает"
      text: "Серый вытаскивает из-под кровати коробку, долго роется в шуршащих упаковках и выдаёт белую таблетку: «Рецептурное, мощное. Проспишься — само пройдёт». Вы глотаете. Минут через пять голова становится ватной."
      effects: ["set flag.l1_pill"]
      goto: l1_night
    - label: "Отказаться и ждать, пока что-нибудь вспомнится"
      goto: l1_wait

- id: l1_wait
  text: |
    Вы сидите на койке и честно пытаетесь вспомнить. Час. Другой. За окном стрекочут
    сирены, в коридоре кто-то хохочет, потом визжит. Серый убредает «узнать насчёт
    воды» и возвращается злой: вода еле капает.

    В голове пусто, как в выметенной комнате. Лестница, лифт, пиджак. Больше ничего.
    К вечеру усталость наваливается сама — без всяких таблеток. Вы ложитесь, чтобы
    полежать пять минут с закрытыми глазами.
  choices:
    - label: "Провалиться в сон"
      goto: l1_night

- id: l1_night
  text: |
    Будит вас тяжесть. Кто-то навалился сверху, койка прогнулась, и в шею, у самого плеча,
    впиваются зубы. Не кусают — грызут, жадно, с урчанием, как голодный кот над миской.

    Тело соображает раньше головы. Колено в живот, удар локтем в зубы — хрустит. Вы
    скатываетесь на пол, хватаете стул и бьёте по тёмной голове. Стул разлетается, в руках
    остаются две ножки. Вы бьёте ими. Ещё. Ещё, пока урчание не обрывается.
  extra:
    - if: "flag.l1_pill"
      text: "Руки как ватные — спасибо Серому и его рецептурному снотворному."
  system: "Заражённый уничтожен. Уровень: 0. Шанс ценных трофеев: 0. Физическая сила: +3 к прогрессу. Гуманность: +1."
  on_enter: ["var.humanity += 1"]
  choices:
    - label: "Навалиться на дверь — в коридоре урчит целый хор"
      goto: l1_door
    - label: "Сразу к окну"
      text: "Вы не ждёте, пока хор из коридора доберётся до двери."
      goto: l1_window

- id: l1_door
  text: |
    Вы хватаетесь за ручку двери, и в тот же миг с той стороны в неё врезаются — раз,
    другой, с такой дурной силой, что замок жалобно звякает. А сзади вас хватают за
    лодыжку: тот, на полу, ещё жив.

    Вы лягаете назад, не глядя, пока хватка не разжимается. А потом из коридора доносится
    новое урчание — низкое, утробное, такое, какого не выдаст человеческое горло. Чтобы так
    урчать, надо вырасти размером с тигра.
  system: "Заражённый уничтожен. Уровень: 0. Физическая сила: +3 к прогрессу. Гуманность: +1."
  on_enter: ["var.humanity += 1"]
  choices:
    - label: "К окну — дверь этого не выдержит"
      goto: l1_window
    - label: "Держать дверь до последнего ☠"
      text: "Дверь держится ровно до той секунды, когда тигриное урчание оказывается прямо за ней. Потом её просто нет — вместе с вами."
      effects: ["var.life = 2", "die 'то, что урчало в коридоре'"]

- id: l1_window
  text: |
    Окно не открыть — пока нащупаете шпингалеты в темноте, будет поздно. Вы бьёте в стекло
    стулом, и оно осыпается. Ступни режет осколками, но это сейчас мелочь.

    Снаружи ночь подсвечена красным: где-то внизу горит. Под окном — третий этаж и
    раскидистое дерево, до ветвей пара метров. Серый, кажется, рассказывал, что вы уже
    однажды выходили через это окно. И выжили.
  choices:
    - label: "Прыгнуть на ветки ☠"
      text: "Вы прыгаете, ловите ветку — и она с треском ломается. Тонкая. Удар о землю выбивает дух, а потом сверху наваливается тяжёлое, урчащее, и становится легко."
      effects: ["var.life = 2", "die 'падение к заражённым под окном'"]
    - label: "Прыгнуть подальше, за кусты ☠"
      text: "Кусты не спасают: под ними асфальт. Хруст, боль — и сразу несколько тяжёлых тел, урчащих над вами."
      effects: ["var.life = 2", "die 'падение к заражённым под окном'"]

# ── возрождение ────────────────────────────────────────────────────────────────

- id: respawn
  text: |
    Темнота. Ни тела, ни звуков. Только красные цифры перед глазами, и они уменьшаются:
    сто семьдесят три, сто семьдесят две…

    Кто вы? Где вы? И главное — как отсюда выбраться? Цифры не отвечают. Они просто
    тикают.
  again: "Снова темнота и красные цифры обратного отсчёта. Секунды тянутся, тела нет."
  extra:
    - if: "var.life == 5 and var.stage >= 7"
      text: "Обидно до слёз: Няша осталась там, а вас унесёт куда-то в новую общагу."
  choices:
    - label: "Дождаться конца отсчёта"
      goto:
        - { if: "flag.finale", goto: epilogue }
        - { if: "var.life == 2 and var.stage < 2", goto: l2_wake }
        - { if: "var.life == 3 and var.stage < 3", goto: l3_wake }
        - { if: "var.life == 4 and var.stage < 5", goto: l5_wake }
        - { if: "var.life == 5 and var.stage < 7", goto: l7_wake }
        - { if: "var.stage >= 12", goto: l12_retry }
        - { if: "var.stage == 11", goto: l11_retry }
        - { if: "var.stage >= 9", goto: l9_retry }
        - { if: "var.stage >= 5", goto: l5_retry }
        - { goto: l3_retry }

# ── глава 2 ────────────────────────────────────────────────────────────────────

- id: l2_wake
  chapter: "Жизнь вторая. День сурка"
  checkpoint: true
  on_enter: ["var.stage = 2", "var.luck = 1"]
  text: |
    Те же облезлые обои. Та же продавленная койка. Почти та же комната — только тапок нет,
    а из-под одеял у окна вылезает не Серый, а щуплый рыжий парень.

    — Дрон, ты чего такой? — спрашивает он. Его зовут Годя. Вас он упорно зовёт Дроном.
    Вы пробуете ухватиться: Дрон — это Андрей? Годя крутит пальцем у виска: какой ещё
    Андрей?

    Вы трогаете шею. Ни следа от зубов. Будто ничего не было. Но вы помните всё — и
    хруст, и урчание, и асфальт.
  system: "Кластер 434-09-62. Возрождений: 98. Вы погибли впервые, не продвинувшись ни в одной основной характеристике. Компенсация: удача +10 к прогрессу. Удача теперь 1. Подсказка: при гибели теряется часть прогресса основных характеристик."
  choices:
    - label: "Присмотреться к Годе — как тогда, к строчкам"
      if: "not flag.l2_gaze"
      effects: ["set flag.l2_gaze"]
      text: "Стоит прищуриться, и Годя будто мигает, как картинка на мониторе. Рядом всплывает зелёная табличка: «Человек. Потенциальный заражённый. Номер из пятнадцати цифр. Назвался Годей. Безоружен». Перестаёте щуриться — и табличка гаснет."
      system: "Пристальный взгляд: доступен."
    - label: "Сыграть в пророка: «Света нет, связи нет, а в коридоре кто-то таращится в стену»"
      if: "not flag.l2_prophet"
      effects: ["set flag.l2_prophet"]
      text: "Годя выглядывает в коридор и медленно поворачивается к вам. — Откуда ты знал? Ты же не вставал. — Он предлагает таблетку. Хорошую, говорит, снотворное. Вы вежливо отказываетесь — так, что он больше не предлагает."
    - label: "«Годя, где тут больница?»"
      text: "— Студенческая — за вторым корпусом, — Годя пожимает плечами. — Прямо иди, за башней. Не перепутаешь. — Вы натягиваете джинсы и выходите, не оборачиваясь: у выхода стоит кто-то ссутуленный, очень похожий на того, кто грыз вас ночью."
      goto: l2_street

- id: l2_street
  text: |
    Улица бьёт солнцем по глазам. Небо чистое, жарит как в июле — а деревья голые,
    и студенты на крыльце обсуждают «аномальную жару». Кто-то морщится: пахнет кислым.

    Город ведёт себя странно. Светофоры не горят, у людей мёртвые телефоны, над крышами
    в трёх местах поднимается дым. Навстречу несётся мелкая собачонка с оборванным
    поводком; вы машинально щуритесь — зелёная табличка: «Собака. Размер безопасный».

    Колено, о котором вы до сих пор не думали, начинает ныть. Потом колоть. Потом болеть
    на каждом шаге.
  choices:
    - label: "Хромать дальше к больнице"
      goto: l2_crowd

- id: l2_crowd
  text: |
    Впереди толпа: легковушка на полном ходу влетела в столб. Водитель жив, лоб рассечён,
    он прижимает к ране платок и ругается так, что заслушаешься.

    Вы щуритесь на него — и вместо зелёной таблички видите белую: «Иммунный. Гуманность:
    ноль. Не идентифицирован. Безоружен». Ни номера, ни «потенциального заражённого».
    Он чем-то отличается от всех остальных — так же, как вы?

    И тут в памяти щёлкает. Минуту назад вы проходили мимо грузовичка с газовыми баллонами
    в кузове. Рядом возился парень в оранжевой спецовке — и в руке у него была бутылка
    с тряпкой в горлышке.
  system: "Подсказка: потенциальные заражённые психически нестабильны. Избегайте скоплений людей."
  choices:
    - label: "Заорать: «Бегите, сейчас рванёт!» ☠"
      text: "Вы орёте во всё горло. На вас оборачиваются, кто-то крутит пальцем у виска, кто-то смеётся. Никто не бежит. Даже вы не успеваете отбежать далеко — улица вспыхивает белым, и звук приходит уже в темноте."
      effects: ["var.life = 3", "var.humanity += 1", "set flag.l2_warned", "die 'взрыв газовых баллонов в толпе'"]
    - label: "Молча проталкиваться прочь, работая локтями ☠"
      text: "Вы пробиваетесь сквозь зевак, вас толкают в ответ, кто-то орёт вслед. Ещё десяток шагов, ещё пять… Мир вспыхивает огнём и болью раньше, чем вы выбираетесь на свободное место."
      effects: ["var.life = 3", "die 'взрыв газовых баллонов в толпе'"]
    - label: "Подбежать к белому водителю — он может знать, что происходит ☠"
      text: "— Ты кто такой? — Водитель отшатывается от вас, как от психа. Вы успеваете сказать: «Я тоже без номера» — и улица за спиной взрывается."
      effects: ["var.life = 3", "set flag.l2_immune", "die 'взрыв газовых баллонов в толпе'"]
