# Главы 8–11 книги: четвёртая жизнь. Разрезанный мост, лес, лесопилка, Няша и Глобус.
# Развилка «что если» №2 — сдать Няшу Глобусу (w2_).

- id: l5_wake
  chapter: "Разрезанный мост"
  checkpoint: true
  on_enter: ["var.stage = 5", "var.luck = 28"]
  text: |
    На этот раз приветствие сбоит: строчки заедают, рвутся, сыплются мусорными значками,
    будто у Системы икота. Потом текст оживает и ползёт дальше, будто ничего и не случилось.

    Вы садитесь на койке. Злость такая, что хочется грызть подушку. Никому здесь нельзя
    верить. Даже умирающим. Даже себе: это же вы сами затолкали в рот три шарика.

    Но в углу горят зелёные огоньки роутера, а на столе светится монитор. Сеть ещё есть.
  extra:
    - if: "flag.tried_give"
      text: "Вы ведь хотели отдать их Усатому. Не успели. Он так и остался лежать там, у мёртвой туши."
  system: "Кластер 197-33-91. Возрождений: 96. Внимание: третья жизнь потеряна без собственного прогресса в характеристиках. Ситуация признана уникальной. Удача: +4000 к прогрессу, удача теперь 28. Открыты Грани Таланта. Подсказка: сильные трофеи принимают с перерывами, никогда не по несколько сразу."
  choices:
    - label: "Успеть что-нибудь найти в сети"
      if: "not flag.l5_net"
      effects: ["set flag.l5_net"]
      text: "Два запроса — и в выдаче ничего путного: сонники, форумы про амнезию, реклама. Третий повисает, браузер пишет про отсутствие сети. Надо было думать над вопросами заранее. В следующий раз."
    - label: "Растолкать соседа: деньги, оружие?"
      if: "not flag.l5_neighbor"
      effects: ["set flag.l5_neighbor"]
      text: "Сосед зовёт вас Лосем и спросонья спрашивает, сдал ли он какой-то зачёт. Денег — сотня до стипендии. Оружие? «Иди к ментам за справкой, месяца через два купишь». — Через час здесь без пулемёта будет туго, — говорите вы и выходите."
    - label: "Составить план и выходить"
      goto: l5_prep

- id: l5_prep
  text: |
    План простой, как у первоклассника: вода, карта, аптека, велосипед.

    Карту вы проглатываете глазами с планшета какого-то студента. Город зажат между морем
    и широкой рекой, через реку — мост. Там, где река впадает в море, наверняка и сидят
    оседлые; значит, туда не надо. А стаб, раз уж все про него твердят, — за мостом.

    В аптеке — эластичный бинт, колено вы туго заматываете прямо на лавочке. В киоске —
    вода. В прокате велосипедов с вас отказываются брать залог: парень за стойкой узнал
    футболиста. Как зовут футболиста, он, конечно, не помнит.
  choices:
    - label: "Катить к мосту"
      goto: l5_bridge

- id: l5_bridge
  text: |
    Спуск к реке длинный, и вы разгоняетесь так, что свистит в ушах. За поворотом —
    затор: полиция, броневик, автобусы, толпа. Все смотрят на реку.

    Мост обрывается за несколько пролётов до того берега. Нет, не обрывается: там его
    продолжает другой мост, совсем другой, в ином стиле, и концы не сходятся — висят
    рваным железом друг над другом. Будто два чужих снимка склеили по линейке.

    — Эй, парень, ты куда?! — кричит полицейский.

    — Подальше от вас, — бурчите вы и выкатываете велосипед на мост.
  again: "Снова тот же мост: затор, полиция, толпа зевак — и два чужих пролёта, висящих рваным железом друг над другом."
  intro:
    - if: "from == 'l5_retry'"
      text: "Вы скатываетесь к реке уже знакомой дорогой."
  choices:
    - label: "Перебираться медленно, перетаскивая велосипед на руках"
      text: "Вы переносите велосипед через смятые машины и рваные балки, по шагу, проверяя каждую опору. Колено ноет, руки исцарапаны, но вот и тот берег."
      goto: l5_forest
    - label: "Пробежать по перилам — так быстрее ☠"
      roll:
        chance: "50 + var.luck"
        success:
          text: "Перила гудят под ногами, внизу река, но вы проскакиваете и спрыгиваете на тот берег вместе с велосипедом."
          system: "Удача: сработала."
          goto: l5_forest
        fail:
          text: "Перила обрываются там, где кончается один мост и начинается другой. Река внизу оказывается очень далеко и очень твёрдой."
          effects: ["die 'падение с разрезанного моста'"]

- id: l5_forest
  text: |
    Здесь даже берег другой: ни домов, ни порта — светлый сосняк, однопутная железная
    дорога, раскисшая грунтовка. Из груды обломков у моста вы выдёргиваете арматурину
    и приматываете её к раме. Теперь вы не с пустыми руками.

    Со стороны города доносятся выстрелы: там началось. Вы крутите педали.

    Через пару километров дорогу наискосок переходят двое — в резиновых сапогах, грязные,
    как грибники после недели в болоте. Идут неровно. Урчат.
  system: "Вы покидаете исходный кластер. Открыта шкала спорового баланса: она падает от нагрузок, умений и ран. Если она упадёт до нуля, вы лишитесь возрождения."
  on_enter: ["item.rebar += 1"]
  choices:
    - label: "Встретить их с насыпи арматурой"
      text: "Вы взбегаете на насыпь и ждёте. Первому арматурина входит в глаз, второму вы раскалываете лоб. Колено отзывается болью на каждый удар, но всё кончается за полминуты."
      system: "Заражённый уничтожен. Уровень: 2. Шанс ценных трофеев: 22%. Физическая сила: +5 к прогрессу. Гуманность: +2. Заражённый уничтожен. Уровень: 2. Физическая сила: +5. Физическая сила достигла единицы."
      effects: ["var.humanity += 4"]
      goto: l5_bite
    - label: "Проехать мимо, не связываясь"
      text: "Вы налегаете на педали, но грунтовка раскисла, колесо вязнет, и двое оказываются рядом. Приходится драться прямо с седла: арматура в глаз, арматура в лоб."
      system: "Заражённый уничтожен. Уровень: 2. Физическая сила: +5 к прогрессу. Гуманность: +2. Заражённый уничтожен. Уровень: 2. Физическая сила достигла единицы."
      effects: ["var.humanity += 4"]
      goto: l5_bite

- id: l5_bite
  text: |
    Из карманов — мятая пачка сигарет и копеечная зажигалка. Трофеи так себе. Вы катите
    велосипед дальше и вскоре нарываетесь на вторую пару. Один обычный. Второй — другой:
    быстрый, цепкий, молча терпит удар и бросается.

    Его когти распахивают вам левое предплечье, прежде чем арматурина проламывает ему
    голову. Вы перетягиваете руку тряпкой, ругая себя: аптека была, а перекиси вы не купили.

    У этого, второго, на затылке нарост — бородавка с бороздками, как у той элиты. Маленький
    гриб. Значит, вот откуда берутся спораны.
  system: "Заражённый уничтожен. Уровень: 3. Шанс ценных трофеев: 33%. Физическая сила: +6. Ловкость: +1. Гуманность: +3."
  on_enter: ["var.humanity += 3"]
  choices:
    - label: "Ехать дальше"
      text: "Не успеваете вы поставить велосипед на колёса, как из-за поворота вылетает третий: голый, жилистый, бегущий так, будто ставит мировой рекорд."
      goto: l5_armor

- id: l5_armor
  text: |
    Удрать на велосипеде не выходит: впереди подъём, скорость падает до пешеходной.
    Вы разворачиваетесь, сжимая арматуру, и орёте твари какую-то чушь вроде «К ноге!».

    Тварь готовится к прыжку — и падает, захлёбываясь кровью: ей пробило грудь. Из-за
    деревьев неспешно выползает броневик, обвешанный ржавыми листами. Двое с автоматами
    проносятся мимо вас и добивают тварь.

    Из машины выпрыгивает мужик и идёт прямо к вам.

    — Вовремя вы, — начинаете вы. — Я уж хотел великом отмахиваться…

    Он сплёвывает и бьёт вас прикладом в висок.
  choices:
    - label: "…"
      goto: l6_wake

# ── глава: лесопилка ───────────────────────────────────────────────────────────

- id: l6_wake
  chapter: "Лесопилка"
  checkpoint: true
  on_enter: ["var.stage = 6"]
  text: |
    Голова гудит, колено пылает, руки вздёрнуты над головой и стянуты пластиковыми
    хомутами вокруг доски стеллажа. Пахнет смолой, опилками и чем-то тошнотворным.

    Навес без половины стен, штабеля досок — склад лесопилки. Напротив, под потолочной
    балкой, висит второй пленник: руки вывернуты кверху, к связанным ногам привешен
    рваный мешок с чем-то вонючим. Коротышка, раздутый, как бочка, в грязном тряпье, лицо
    в корке грязи, во рту кляп. Только ноги странно стройные.

    Он раскачивается и трёт хомут о балку. Упорно, без остановки.
  system: "Получен негативный эффект: оглушение. Кластер 197-33-96. Возрождений: 96. Статус: возврат в игру."
  choices:
    - label: "«Тебя эти уроды, гляжу, любят ещё меньше, чем меня»"
      goto: l6_invite

- id: l6_invite
  text: |
    Пленник замирает и яростно мычит. Глаза — как у загнанного зверя, который твёрдо
    решил подороже продать шкуру. Потом он вдруг обмякает, а у вас перед глазами
    всплывает строчка:

    «Игрок Няша приглашает вас в отряд. Добыча делится свободно».

    Вы щуритесь на висящего: «Иммунный. Гуманность: низкая отрицательная. Имя: Няша.
    Не вооружена». Не вооружена. Вот оно что — не парень. Девушка. Хотя назвать эту
    бочку в тряпье девушкой у вас язык не поворачивается, а прозвище Няша звучит как
    издевательство.
  choices:
    - label: "Сказать «Вступить»"
      text: "— Вступить, — говорите вы. Строчка гаснет. И всё. Ничего больше не происходит. Няша смотрит на вас так, что впору задымиться."
      goto: l6_gag
    - label: "Ухмыльнуться: «Няша? Сама придумала?»"
      if: "not flag.l6_joke"
      effects: ["set flag.l6_joke", "var.bond -= 1"]
      text: "Пленница мычит что-то такое, отчего даже кляп, кажется, краснеет. Приглашение вспыхивает перед глазами снова — настойчиво, как звонок в дверь."

- id: l6_gag
  text: |
    Няша кривит лицо с такой силой, что корка грязи идёт трещинами. Хруст, кровь — и
    изжёванный деревянный кляп вываливается из-под бинта вместе с парой зубов.

    — Придурок! — шипит она, сплёвывая кровью. — Я из-за тебя без зубов осталась! Удачу
    на сколько поднял?

    — Двадцать восемь.

    — Блин, да ты придурок, каких поискать. — Она быстро, сквозь кровь, объясняет:
    меню, потом «чаты», окно вниз, там мигает «Няша — Ноль». Ноль — это вы. А руки…
    — Пили кисть об пилу. По суставу. Запястьем дотянешься.
  choices:
    - label: "«Мужем своим командуй, клуша»"
      text: "— Совсем больной? — Няша на миг осекается. — А, новенький… — Но поругаться всласть вы не успеваете: снаружи хрустят шаги. — Доболтался, придурок, — шепчет она обречённо."
      effects: ["var.bond -= 1"]
      goto: l6_out
    - label: "«Руку пилить? Ты в своём уме?»"
      text: "— Это хоть какой-то шанс! — шипит она. — Пили, говорю! — Но поздно: снаружи хрустят шаги. — Доболтались, — Няша обвисает в путах. — Надо было в чате."
      goto: l6_out
    - label: "«Понял. Меню, чаты, мигающее окно. Что дальше?»"
      text: "Няша смотрит на вас с удивлением — будто увидела говорящую табуретку. — Хоть что-то, — говорит она. Но договорить не успевает: снаружи хрустят шаги."
      effects: ["var.bond += 1"]
      goto: l6_out

- id: l6_out
  text: |
    Четверо в полувоенном вытаскивают вас наружу, не забывая пинать по рёбрам. Няшу не
    трогают — хотя она приветствует их словом «придурки» таким тонким голоском, какого
    от бочки не ждёшь.

    Поляна посреди леса, штабеля бруса, тот самый броневик. На стопке досок сидит
    коротышка в тёмных очках, потрёпанный, с лицом, застывшим в вечной злобе. Белая
    табличка: «Иммунный. Гуманность: высокая отрицательная. Пистолет СР-1, нож». Он
    прикуривает сигарету от собственного пальца.

    — Что тут делает это мясо?

    — Глобус, это Хасан по дороге подобрал. Крепкий, приложили прикладом — а ему хоть бы
    что. Может, на ферму?

    — Тащить ещё. — Глобус морщится. — Глаза у него хитрые. Не люблю хитрых.
  choices:
    - label: "Пока они болтают, разобраться с меню"
      goto: l6_globus

- id: l6_globus
  text: |
    Глобус лениво подходит к Няше и дышит ей в лицо дымом. С неё при свете отваливается
    грязь, и становится видно: толщина — это что-то вроде брони, намотанной под тряпьём,
    а на лице — нарочно намалёванный узор.

    — Личико грязное, Няшенька. Будешь хорошей — дам тёплой воды.

    — Себе оставь, тебе нужнее, — огрызается она. Бандиты ржут. Глобус бьёт её по лицу —
    коротко, без замаха — и тут же снова улыбается: мол, нервы. Ромео, говорит, уже едет.
    Они дотянулись до него по рации с горки. Ромео очень хочет её увидеть.

    — Пусть по дороге шею свернёт, — отвечает Няша.

    А вы тем временем, мысленно проклиная того, кто придумывал эти меню, находите
    мигающее окно чата.
  choices:
    - label: "Написать ей"
      goto: l6_chat

- id: l6_chat
  text: |
    Вы набираете по букве, полминуты на строчку: «Давай пока не гавкаться. Что делать?»

    Ответ прилетает через секунду:

    «Ты им не нужен — новичок, за тебя много не дадут. Просто завалят. Освободи руки.
    И включи звонок на чате, придурок!»

    «Я не фокусник».

    «Скажи Глобусу гадость про родителей. Погрубее. Он развяжет: любит убивать голыми
    руками, по-честному. Берегись его ладони — ребром может голову снести. Как только
    у тебя будет пистолет — Глобуса первым. Того, кто держит меня, не трогай».

    Какой пистолет? Откуда? Похоже на подставу.
  choices:
    - label: "Сделать, как она говорит"
      goto: l6_insult
    - label: "Сдать её: «Глобус, она мне в чат пишет!»"
      goto: w2_betray
    - label: "Промолчать и не дёргаться ☠"
      text: "Вы молчите. Глобус докуривает, смотрит на вас пару секунд, как на мебель, и кивает своим: «Мясо — в расход». Выстрел вы уже не слышите."
      effects: ["var.life = 5", "set flag.l6_silent", "die 'Глобус решил, что мясо лишнее'"]

- id: l6_insult
  text: |
    — Глобус, — говорите вы со всей серьёзностью, — а ведь я твоего отца знал.

    — Чё?

    — Его весь район знал. Он на рынке гнилую картошку за молодую выдавал, пока его
    мешком не накрыли. А мамаша твоя — та вообще…

    Шутки так себе, вы и сами понимаете. Но Глобус, вместо того чтобы взорваться,
    улыбается почти по-дружески: «Глядите, клоуна привезли». Кладёт на доски пистолет
    и нож, подходит, касается хомута на ваших запястьях — пластик плавится, руки свободны.

    — Даю тебе право разок врезать. Почётное. Потом моя очередь — и твоей уже не будет.
    — Он подставляет щёку и стучит по ней пальцем.

    От него тянет чем-то нехорошим, будто от оголённого провода. А внизу, в чате, давно
    мигает: «Кивни, когда готов! Лови! Глобуса первым!»
  choices:
    - label: "Кивнуть"
      goto: l6_fight
    - label: "Врезать ему, раз разрешил ☠"
      text: "Вы бьёте — и попадаете в пустоту: Глобуса там уже нет. Ребро его ладони приходит сбоку, и мир гаснет, не успев заболеть."
      effects: ["var.life = 5", "set flag.l6_punched", "die 'ладонь Глобуса'"]

- id: l6_fight
  text: |
    Пистолет Глобуса вдруг срывается с досок, будто его сдуло ураганом, и летит прямо
    к вам. Вы не готовы, но ладонь сама ловит рукоять. Чужой пистолет, впервые в жизни —
    а пальцы знают, где предохранитель.

    Краем глаза: тот, кто держал Няшу, уже лежит с вывернутой шеей, а сама она взлетает
    в немыслимом прыжке, каких не бывает у бочек.

    Время будто замедлилось. Глобус безоружен. Автоматчик в трёх шагах уже вскидывает
    ствол.
  choices:
    - label: "Сперва автоматчика — он опаснее ☠"
      text: "Первая пуля — в автоматчика, точно в лицо. Разворот — вторая в голову Глобусу, третья — во второго бандита. Глобус падает странно, будто не падает, а уходит с линии огня… Додумать вы не успеваете. Мир выключается, как свет."
      effects: ["var.life = 5", "set flag.l6_fought", "die 'пуля в затылок на лесопилке'"]
    - label: "Сперва Глобуса, как велела Няша ☠"
      text: "Первая пуля — Глобусу в голову. Он падает как-то неправильно, словно нырком. Вторая — в автоматчика, третья — в того, что у штабеля. Вы ещё успеваете удивиться своей меткости. Потом мир выключается, как свет."
      effects: ["var.life = 5", "set flag.l6_fought", "set flag.l6_obeyed", "var.bond += 1", "die 'пуля в затылок на лесопилке'"]

# ── «что если» №2: сдать Няшу ──────────────────────────────────────────────────

- id: w2_betray
  text: |
    — Глобус! — кричите вы. — Она мне в чат пишет. Говорит, чтобы я тебя оскорбил, а она
    пистолет мне подкинет.

    Тишина. Бандиты переглядываются. Няша смотрит на вас — не со злостью даже. С какой-то
    усталой брезгливостью, как на таракана, которого ждала увидеть.

    Глобус долго молчит, потом хохочет и хлопает себя по коленям.

    — А говорил — хитрые глаза! Правильно говорил. Хасан, срежь ему хомуты. Такие нам
    нужны: смекалистые и без глупостей. — Он поворачивается к Няше. — Видишь, Няшенька,
    даже нулёвки за тебя не держатся.
  on_enter: ["var.humanity -= 30", "var.bond -= 5"]
  choices:
    - label: "Взять протянутый автомат"
      goto: w2_end

- id: w2_end
  text: |
    Ромео приезжает к вечеру: белобрысый, холёный, с тонкими усиками. Он платит Глобусу,
    и Няшу уводят в его машину. Она не кричит и не смотрит в вашу сторону. Больше вы её
    никогда не видите — и стараетесь не думать о ней.

    Вы остаётесь в банде. Таскаете ящики, стоите на стрёме, учитесь стрелять. Цифры
    гуманности медленно краснеют, и вы перестаёте их проверять. Живёте вы неплохо. Сытно.

    Только иногда, если в чате мигает строка «Няша — Ноль», серая и давно мёртвая, вы
    закрываете меню побыстрее.
  system: "Гуманность: отрицательная. Задание «помочь»: провалено."
  ending: { id: globus, title: "Шестёрка Глобуса" }

# ── случайная смерть в четвёртой жизни: снова мост ─────────────────────────────

- id: l5_retry
  text: |
    Общага, сосед, зелёные огоньки роутера. Новая жизнь, а день всё тот же.

    Теперь у вас есть план, и вы проходите его, как по списку: аптека, бинт на колено,
    вода, прокат велосипедов. Парень за стойкой опять узнаёт футболиста и опять не берёт
    залог.
  again: "Опять общага и тот же день. Аптека, бинт, вода, велосипед — вы проходите список почти не думая."
  choices:
    - label: "Катить к мосту"
      goto: l5_bridge
