# Главы 22–25 книги: лес, засада Чугуна и Карася, лодка, река, мост-кладбище, озеро, плотина.

- id: l11_forest
  chapter: "Лес и лодка"
  checkpoint: true
  on_enter: ["var.stage = 11"]
  text: |
    Погода наладилась. Вы снова несёте Няшу — она так и не стала легче — и вдобавок
    два спальника, на которые ушло четыре одеяла. Бросить их Няша не даёт: замёрзнем —
    упадёт шкала удовольствия, а это плохо.

    Лагерь она выбирает на холме, в старом оплывшем окопе: снизу его не видно, а сверху
    видно всё. Вы спускаетесь в лес за жердями для навеса. Винтовку Няша велела взять —
    вы взяли только пистолет. Тяжело же.

    Вы нагибаетесь за палкой — и краем глаза ловите движение. Мертвяк. Не кусач, но и
    не медляк: быстрый, крупный, уже в десяти шагах.
  again: "Вы снова в лесу под холмом, с охапкой жердей. И снова из-за деревьев выходит быстрый крупный мертвяк — уже в десяти шагах."
  choices:
    - label: "Бросить палки и стрелять ему в глаза"
      text: "Вы вскидываете оружие и жмёте на спуск, почти не целясь, — раз, два, три, четыре. Тварь падает ничком в двух шагах. С холма гулко бьёт винтовка: второй мертвяк, подбиравшийся с другой стороны, катится по склону. Няша не спала."
      goto: l11_kill
    - label: "Бежать к холму ☠"
      roll:
        chance: "30 + var.luck"
        success:
          text: "Вы несётесь к холму, тварь — за вами. С вершины бьёт винтовка: Няша сносит её на бегу. И сразу второй выстрел — по другому мертвяку, которого вы даже не видели."
          goto: l11_kill
        fail:
          text: "Колено подводит на первом же подъёме. Вы падаете, и тварь оказывается сверху раньше, чем вы успеваете перевернуться."
          effects: ["die 'мертвяк в лесу у окопа'"]

- id: l11_kill
  text: |
    Перед глазами строчки: «Личная победа: уничтожен опасный зараженный, уровень 22».
    «Отрядная победа: уровень 11». И — «Получен уровень 3».

    — Баран, куда ты прёшься?! — кричит сверху Няша. — Мешки потроши! И потом сюда!

    Вы вскрываете затылки чужим ножом, морщась, и выгребаете спораны в карман. Обидно:
    она права. Пока вы таращились по сторонам, за вашей спиной мог стоять третий.
  on_enter: ["var.level += 1", "var.humanity += 5", "item.spores += 3"]
  choices:
    - label: "Подняться к ней"
      goto: l11_magnet

- id: l11_magnet
  text: |
    Няша стоит на вершине и смотрит в лес. Лицо у неё нехорошее.

    — Они пришли с двух сторон разом. Сюда, в глушь, где их быть не должно. Их что-то
    тянет. Не место — нас. — Она вынимает Кусаку и вертит перед лицом. — Это оружие
    сделали не люди. Есть такие вещицы с чёрных земель — с магией, если хочешь. Кусака
    копит силу несколько часов и потом может ударить так, что разрубит что угодно.
    Один раз. Но он со мной давно, в нём я уверена.

    А куртку и ещё пару вещей она купила недавно, по случаю. И раз мертвяки находят вас
    в чистом лесу — значит, что-то из этого светит им, как маяк.

    — Бросаем спальники. Уходим. Сейчас.
  choices:
    - label: "Обрадоваться, что спальники больше тащить не надо"
      if: "not flag.l11_bags"
      effects: ["set flag.l11_bags"]
      text: "— Ну наконец-то, — вы с наслаждением скидываете тюки. Няша смотрит так, что улыбку приходится спрятать. — Может, просто молча уйдём? — Молчу."
    - label: "Сажать Няшу на шею и уходить"
      goto: l11_chugun

- id: l11_chugun
  text: |
    Час вы ломитесь через лес, потом через кусты, потом через такие заросли, что впору
    прорубаться. Внизу, под обрывом, течёт река, затянутая ряской. Вы оставляете Няшу в
    кустах и идёте разведать тропку вдоль берега.

    Узкое место, кусты стеной — и удар в голову. Темнота.

    «Негативный эффект: оглушение». Голоса. Один хриплый, другой молодой и нудный.

    — Чугун, а откуда он тут такой красивый?

    — Карась, задрал. Карманы проверь.

    Вас пинают в бок. Вы садитесь. Двое: постарше — с арбалетом, помоложе — с вашей
    винтовкой. На земле рядом валяется тупой арбалетный болт.
  choices:
    - label: "«Я тут один. Одиночка я»"
      text: "Чугун смотрит вам в глаза пару секунд и вдруг бьёт кулаком в лицо. — Считать разучился? Винтовка такая на одного — дороговата. Мутный ты, мил-человек. Не просматриваешься."
      goto: l11_shots
    - label: "Молчать и смотреть исподлобья"
      text: "— Молчун, — ласково говорит Чугун и бьёт вас кулаком в лицо. — Ничего, разговоришься. Винтовка у тебя дорогая для одиночки. Мутный ты, мил-человек."
      goto: l11_shots

- id: l11_shots
  text: |
    Из кустов позади оглушительно бьёт винтовка. Ещё раз. Ещё. Карась вскрикивает и
    валится с обрыва в реку. Чугун хватает вас, прижимает к себе, прикрываясь, и вскидывает
    отобранную винтовку одной рукой:

    — Эй! Ещё раз пальнёте — вашему мальчику конец!

    Что-то со свистом рассекает воздух. Знакомый звук. Чугун хрипит и оседает: в боку у
    него торчит Кусака — Няша бросила его своим телекинезом прямо из кустов.

    Чугун ещё дёргается, тянется к арбалету.
  choices:
    - label: "Выдернуть меч и добить Чугуна"
      text: "Вы перерезаете о лезвие хомуты на руках — меч острый до жути, пластик распадается от касания, — и бьёте. Чугун затихает только после третьего удара. Вы вытираете руки о траву и стараетесь не думать о крови."
      goto: l11_boat
    - label: "Выбить у него арбалет и не добивать"
      text: "Вы пинком отшвыриваете арбалет. Чугун скалится, шарит у пояса — нож! — и из кустов снова бьёт винтовка. Всё. Вы вытаскиваете Кусаку, перерезаете о лезвие хомуты на руках. Меч острый до жути."
      effects: ["var.humanity += 1"]
      goto: l11_boat

- id: l11_boat
  text: |
    — Тише ты! — Няша лежит между кустами с винтовкой. — Чего орёшь?

    — Ты могла в меня попасть!

    — Не попала же. Лодку нашёл?

    — Какую лодку?

    — Блин, ну как с тобой тяжело… Посмотри по берегу. Там должна быть.

    И правда: под упавшим деревом, ниже по течению, прячется лодка. Как она догадалась —
    непонятно. Вы возвращаетесь за ней — и навстречу уже гремят выстрелы. Няша, белая
    от боли, стоит на ногах — на сломанной! — и палит из пистолета по мертвякам,
    лезущим из зарослей.
  choices:
    - label: "Подхватить её и бежать к воде"
      text: "Вы хватаете Няшу как ребёнка. — Кусака! — орёт она. — Не оставляй Кусаку! — Меч вы и так держите в другой руке. Мелководье, вода по пояс; вы швыряете Няшу в лодку — грубо, не до нежностей — и отталкиваетесь от дна."
      goto: l12_river

# ── глава: плотина ─────────────────────────────────────────────────────────────

- id: l12_river
  chapter: "Плотина"
  checkpoint: true
  on_enter: ["var.stage = 12"]
  text: |
    Три мертвяка бредут за вами по мелководью, потом десяток по берегу. Вы хватаетесь
    за винтовку.

    — Хватит патроны переводить! Греби! Мелочь на глубину не полезет.

    Грести вы не умеете — явно не байдарочник в прошлой жизни. Но учитесь быстро.
    Мертвяки отстают, хотя и бредут следом вдоль берега.

    Вы считаете патроны: у вас двадцать шесть, пистолет пуст. У Няши два полных магазина
    и ещё семнадцать штук. В рюкзаках бандитов — армейские пайки, граната, оранжевая
    фляга с живчиком, больше литра, и тубус от сигары. А в тубусе — шприц.
  choices:
    - label: "«Ты же не куришь. А это что?»"
      if: "not flag.l12_spek"
      effects: ["set flag.l12_spek"]
      text: "— Лайт-спек, — Няша нюхает шприц. — Наркотик. Простой спек делают из паутины споровых мешков, два кило на дозу. А этот — из четырёх кило и пяти радиоактивных споранов. Боли нет, сил на время — как у быка. Привыкание страшное. Если уколоться, Рокки, я бы и со сломанной ногой побежала. Недолго."
    - label: "«Почему Система ничего не дала за этих двоих?»"
      if: "not flag.l12_green"
      effects: ["set flag.l12_green"]
      text: "— Глобус и его шестёрки были красные, вот за них и сыпалось. А эти, видно, нет. Убил — и ни плюса, ни минуса. Система сама решает, кто тут прав."
    - label: "Грести дальше"
      goto: l12_bridge

- id: l12_bridge
  text: |
    Река петляет, меняется на глазах: Няша говорит, что Система сшивает куски разных
    кластеров по рекам, дорогам и проводам, и не всегда ровно.

    Впереди — мост, забитый ржавыми машинами, как кладбище. На нём ждут мертвяки: семь
    штук, и они видят лодку. Вы стреляете с качающегося борта — и тратите девять патронов
    на семерых. Непростительно для читера: если жать на спуск, когда лодка ныряет, пуля
    уходит куда попало. Остаётся семнадцать.

    За мостом река разливается в огромное круглое озеро. Мертвяки на берегу отстают —
    большую воду они не любят. Вдали, километрах в десяти, виднеются высотки города.
    А впереди — бетонная дамба с маленькой электростанцией.
  choices:
    - label: "Причалить к плотине"
      text: "— Посидим тут пару дней, — говорит Няша, глядя на станцию. — А потом расстанемся. Дальше ты пойдёшь один. — Шутишь? Ты без меня даже не поползёшь. — Через пару дней поползу. И не только. Это не обсуждается, Рокки."
      goto: l12_dam

- id: l12_dam
  text: |
    На станции пахнет смертью. Внизу, в машинном зале, висит на верёвке работник — цифра.
    На столе тетрадь: его укусил коллега, коллегу он запер в соседней комнате, а сам,
    боясь превратиться, повесился. Подпись: Павел.

    — Бывают такие цифры, — задумчиво говорит Няша. — Альфы. Не заражаются, живут среди
    наших, если их признают. Этот, видно, был не из них.

    Наверху вы устраиваете Няшу в чёрном офисном кресле у окна. Из солярки, слитой
    с брошенной на стоянке фуры, вы мастерите горелку и кипятите воду — чай!

    Вы смотрите, как она пьёт, держа кружку двумя руками, и понимаете страшную вещь:
    вы по уши влюблены в эту невозможную, колючую, совершенно не в вашем вкусе девчонку.
  again: "Вы снова на станции, в комнате наверху. Няша сидит в чёрном кресле у окна и смотрит на берег."
  choices:
    - label: "Сказать ей об этом"
      if: "not flag.l12_love"
      effects: ["set flag.l12_love"]
      text: "Вы открываете рот — и Няша, не оборачиваясь, говорит: «Не надо, Рокки». Будто прочитала. — Через пару дней мы расстаёмся. Помни об этом."
    - label: "Пойти на лодке вдоль берега — там бродят мертвяки, а нам нужны спораны"
      text: "— Куда пошёл?! — летит в спину. — Жить надоело?! Стоять! — Привыкаю к самостоятельной жизни, — бросаете вы. — Сама же сказала: дальше мы порознь. — Умом вы понимаете, что ведёте себя как мальчишка. Но ноги уже несут вас к лодке."
      effects: ["var.bond -= 1", "set flag.l12_foray"]
      goto: l12_foray
    - label: "Остаться с ней и караулить у двери"
      text: "Вы остаётесь. Няша молчит, глядя в окно. К сумеркам мертвяки, бредущие вдоль берега, всё-таки сворачивают к плотине."
      goto: l12_door

- id: l12_foray
  text: |
    Вы отгоняете лодку от берега, кладёте в неё топор, два ломика из подсобки и ждёте.
    Мертвяки выходят на голый берег вчетвером — четвёртого-пятого уровня, не страшные.

    Вы причаливаете и метаете топор, когда до первого остаётся шагов семь. Топор входит
    точно в лоб. Ломик во второго — тоже в цель. Меткость, оказывается, работает не только
    с пулями. Третьего вы бьёте ломиком в азарте и промахиваетесь, четвёртый вцепляется
    вам в предплечье — когти проходят глубоко. Вы ломаете об его голову весло.

    Два спорана. Глубокая царапина на левой руке. И пьянящее чувство, что вы кое-что
    умеете.
  on_enter: ["item.spores += 2", "var.humanity += 4"]
  choices:
    - label: "Плыть дальше вдоль берега за новыми ☠"
      roll:
        chance: "35 + var.luck"
        success:
          text: "Следующая пара бродит у самой воды. Вы снимаете обоих метким броском топора и ломика и понимаете, что пора возвращаться: солнце садится."
          effects: ["item.spores += 1"]
          goto: l13_night
        fail:
          text: "Из тростника выходит не мелочь. Тварь крупная, быстрая, и брошенный топор отскакивает от её башки, как от брони."
          effects: ["die 'тварь в тростнике у озера'"]
    - label: "Перевязать руку и вернуться к Няше"
      goto: l13_night

- id: l12_door
  text: |
    Четверо мертвяков бредут по дамбе к станции, принюхиваясь к луже солярки у входа.
    Вы выходите им навстречу с топором и ломиками.

    Топор вы метаете шагов с семи — и он входит точно в лоб. Ломик во второго — тоже
    в цель. Меткость, оказывается, работает не только с пулями. Третий цепляет вас когтями
    за левое предплечье, прежде чем вы его добиваете. Четвёртого снимает Няша — одним
    выстрелом из окна.

    Два спорана. Глубокая царапина на руке. И чувство, что вы кое-что умеете.
  on_enter: ["item.spores += 2", "var.humanity += 3", "var.bond += 1"]
  choices:
    - label: "Перевязать руку и подняться к Няше"
      goto: l13_night

# ── случайная смерть у озера: дорога назад, к плотине ──────────────────────────

- id: l12_retry
  text: |
    Новая общага, серый чат и двое суток пути назад, к озеру с плотиной. На второй вечер
    строка «Няша — Ноль» загорается: «Придурок. Я так и знала».

    Она ждёт вас там же, в чёрном кресле у окна, с винтовкой на коленях. Нога у неё уже
    почти держит. Вашу винтовку она сберегла. Говорить с вами она не желает.
  again: "Опять общага, опять двое суток пути назад к озеру. Чат загорается одним словом: «Придурок»."
  on_enter:
    - "var.bond -= 1"
    - { if: "item.rifle == 0", then: ["item.rifle += 1"] }
  choices:
    - label: "Подняться к ней"
      goto: l12_dam

# ── случайная смерть в лесу: дорога назад, к холму ─────────────────────────────

- id: l11_retry
  text: |
    Новая общага, серый чат и двое суток пути назад, через чужие кластеры. На второй
    вечер строка «Няша — Ноль» загорается: «Придурок. Я же говорила — винтовку бери».

    Она так и сидит в окопе на холме, бледная, злая, с винтовкой на коленях. Вокруг
    окопа лежат три мёртвые твари. Вашу винтовку она сберегла.
  again: "Опять общага и двое суток пути назад, к холму с окопом. Чат загорается: «Придурок»."
  on_enter:
    - "var.bond -= 1"
    - { if: "item.rifle == 0", then: ["item.rifle += 1"] }
  choices:
    - label: "Спуститься за жердями ещё раз — теперь с винтовкой"
      text: "На этот раз вы берёте винтовку, хоть она и тяжёлая."
      goto: l11_forest
