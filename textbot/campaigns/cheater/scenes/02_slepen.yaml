# Главы 3–7 книги: третья жизнь. Дюбель и Усатый, такси, проспект, Слепень, город чудовищ, три шарика.
# Развилка «что если» №1 — догнать Слепня (w1_).

- id: l3_wake
  chapter: "Жизнь третья. Незнайка"
  checkpoint: true
  on_enter: ["var.stage = 3", "var.luck = 2"]
  text: |
    Вы подскакиваете на койке, ещё не открыв толком глаза. Обои, одеяла, сосед под грудой
    тряпья — декорации те же. Но теперь вы знаете: у этого дня есть расписание. Сначала
    отключатся связь и свет. Потом начнутся пожары и аварии. Потом соседи начнут урчать.

    Вы сдёргиваете одеяло с соседа — рыжего, сонного, обозвавшего вас «Пеле недоделанным»,
    — и прозвище само прилипает к нему: Поляк. Одежда на стуле — шорты, рубашка, шлёпанцы.
    За окном конец мая, жара третий день, девушки ходят чуть ли не в купальниках.
  extra:
    - if: "flag.l2_warned"
      text: "В прошлый раз вы орали людям «бегите» — никто не послушал. Здесь тоже никто не послушает. Значит, спасать придётся только себя."
  system: "Кластер 252-88-26. Возрождений: 97. Компенсация за гибель без прогресса: удача +10. Удача теперь 2. Подсказка: потенциальные заражённые опасны на дорогах. Избегайте толп."
  choices:
    - label: "Заставить Поляка искать в сети, пока она есть"
      if: "not flag.l3_net"
      effects: ["set flag.l3_net"]
      text: "Вы диктуете ему запросы про потерю памяти, повторяющийся день и строчки перед глазами. Поляк печатает и смотрит на вас всё испуганнее. За окном что-то гулко бухает, стёкла звенят — и сеть пропадает. Ни одного ответа вы так и не прочитали."
    - label: "Перерыть свои карманы"
      if: "not flag.l3_wallet"
      effects: ["set flag.l3_wallet"]
      text: "Бумажник: немного денег, скидочная карта супермаркета, билет в кино на какой-то фильм и рекламка стрелкового клуба. Ни паспорта, ни студенческого. Даже клочка бумаги с именем нет."
    - label: "Предупредить Поляка — и уйти"
      text: "— Вали отсюда, пока не поздно, — бросаете вы с порога. — И к толпам не подходи. — Поляк хлопает глазами. Вы спускаетесь по лестнице, которую теперь знаете наизусть, и выходите в чужой, незнакомый двор: общага другая, улица другая, город другой."
      goto: l3_yard

- id: l3_yard
  text: |
    Вы сворачиваете в проход между бетонной стеной и недостроенной высоткой — подальше от
    людей. И почти сразу натыкаетесь на двоих.

    Обоим за тридцать, оба в поношенном камуфляже, и это не форма, а одежда для работы.
    У одного автомат, у другого — винтовка с оптикой и роскошные усы. Вы щуритесь: белые
    таблички. «Иммунный. Гуманность: низкая положительная. Хорошо вооружён».

    — Парень, шагай мимо, — автоматчик лениво поводит стволом. — Мы тебя не видели.

    — Дюбель, глянь, — усатый прищуривается. — Это ж не цифра. Нулёвка. Свеженький.
  again: "Опять бетонная стена, недостроенная высотка и те двое в камуфляже — Дюбель с автоматом и Усатый с винтовкой."
  intro:
    - if: "from == 'l3_retry'"
      text: "Вы почти бегом сворачиваете в знакомый проход."
  extra:
    - if: "flag.l2_immune"
      text: "Белые таблички, как у того водителя у столба. Значит, такие, как вы, тут есть."
  choices:
    - label: "Ответить на их вопрос про удачу"
      if: "not flag.l3_luck"
      effects: ["set flag.l3_luck"]
      text: "— Удачу на сколько подняли? — спрашивает Усатый. — Ну, там пишут: в качестве компенсации… — Два, — вырывается у вас. Они знают даже то, что вам пишут после смерти. — Нулёвка из нулёвок, — сочувственно тянет Дюбель."
    - label: "Попросить взять с собой"
      if: "not flag.l3_ask"
      effects: ["set flag.l3_ask"]
      text: "Усатый уже кивает на высотку, но Дюбель качает головой: «Дог огорчится». Их на крыше и так пятеро, прикрывать некому. — Извиняй, парень, — Усатый разводит руками. — Сам понимаешь."
    - label: "«Объясните хоть что-нибудь!»"
      if: "not flag.l3_explain"
      effects: ["set flag.l3_explain"]
      text: "Они перебивают друг друга, торопливо, как дети, которых зовут домой. Скоро от слияния рек прибегут оседлые. У моста не задерживайся — уходи на север, к стабу. Найди хоть какое-то оружие. Бей в голову или по хребту. — Кого бить? — Сам поймёшь, — ухмыляется Дюбель."
    - label: "Взять протянутую фляжку"
      text: "Дюбель суёт вам плоскую фляжку: «Пей залпом, не нюхай». Вы глотаете — и чуть не выплёвываете. Вкус такой, будто в спирте неделю вымачивали шахтёрские портянки. Эти двое ржут: «Глотай давай!»"
      system: "Усвоена порция спорового раствора. Споровый баланс: 90%."
      goto: l3_flask

- id: l3_flask
  text: |
    — Ну как наш компотик? — с фальшивой заботой интересуется Дюбель.

    Ответить вы не успеваете: у Усатого хрипит рация. Злой искажённый голос спрашивает,
    где их черти носят, и велит бегом наверх. Усатый вскидывает винтовку на плечо и
    виновато разводит руками:

    — Что успели, то сказали. Если прижмёт — лупи их в голову. И к мосту, слышишь? К мосту!

    Через минуту их уже нет. Вы стоите один посреди пустого прохода. На углу, на полпути
    к супермаркету, дремлет такси.
  choices:
    - label: "Пойти следом за ними к высотке"
      if: "not flag.l3_follow"
      effects: ["set flag.l3_follow"]
      text: "Из-за угла высотки на вас смотрит ствол автомата. Дюбель даже не злится — просто качает головой. Вы поднимаете руки и пятитесь."
    - label: "Сесть в такси и ехать к мосту"
      goto: l3_taxi

- id: l3_taxi
  text: |
    Таксист сидит, уткнувшись в смартфон, и тычет в мёртвый экран. На вашу просьбу
    отвезти за мост, побыстрее и тихими улицами, он долго молчит, потом говорит: по
    счётчику выйдет под девяносто. Вы предлагаете двести, не торгуясь, — и вы уже едете.

    — А я тебя вспомнил, — вдруг говорит водитель. — Ты футболист.

    Сердце ухает. — А как меня зовут?

    — Да я по футболу не очень. Мне бокс больше нравится.

    Вы прикрываете ладонью колено. Шрамы там знатные — хирурги резали, не жалея.
  choices:
    - label: "Тайком открыть меню и поискать кнопку «Выход»"
      if: "not flag.l3_exit"
      effects: ["set flag.l3_exit"]
      text: "Вы шевелите губами: «Меню». Плашки, полоски, пустые разделы. Вы перебираете всё, до чего дотягивается взгляд. Кнопки «Выход» нет. Похоже, меню нарочно сделали так, чтобы новичок в нём заблудился."
    - label: "Спросить, что творится в городе"
      if: "not flag.l3_driver"
      effects: ["set flag.l3_driver"]
      text: "— Дурдом, — водитель уворачивается от очередного лихача. — Навигатор спутники не видит, связи нет, носятся все как ненормальные. Восьмой год тут живу — первый раз такое."
    - label: "Смотреть на дорогу"
      goto: l3_prospect

- id: l3_prospect
  text: |
    Таксист петляет дворами мимо гаражей и пятиэтажек и выныривает к проспекту. Навстречу
    тянется колонна: полиция, автобусы с силовиками, броневик. Все — в сторону моста.
    Водитель воровато выруливает следом, как только хвост колонны скрывается.

    И тут сзади прорывает пробку. Машины несутся по проспекту так, будто это гоночная
    трасса. Кто-то тормозит юзом, кто-то влетает в него — и вас бьют в корму. Голова
    мотается, шея хрустит.

    А по встречной, по всем полосам сразу, уже летит грузовик. За ним — фура.
  choices:
    - label: "Выскочить из машины и катиться прочь, на газон"
      text: "Вы вываливаетесь из двери и катитесь по асфальту за миг до того, как грузовик врезается в автобус, а фура — лоб в лоб в броневик. Скрежет, грохот, огонь. Сзади, там, где стояло такси, что-то взрывается."
      goto: l3_slepen
    - label: "Пригнуться и вцепиться в сиденье ☠"
      text: "Вы сжимаетесь в комок за спинкой водительского кресла. Грузовик сметает всё на своём пути, и такси вместе с вами — тоже."
      effects: ["die 'авария на проспекте'"]

- id: l3_slepen
  text: |
    Вы сидите на краю газона, ошалело глядя на побоище: десятки смятых машин, дым, крики.
    На голове набухает шишка, пальцы мокрые от крови. Мысли текут медленно, как кисель.

    Кто-то подхватывает вас под мышку и вздёргивает на ноги, как ребёнка. Мужик лет сорока,
    рыхлый, красномордый, на шее цепочка с чёрным кристаллом.

    — Имя есть?! — орёт он в ухо. — Нулевой, да? Удачу на сколько поднял?

    — На два, — выдавливаете вы. — Пока Роком зовусь.

    — По-детски. Ладно, не торопись: Континент торопливых наказывает. Я Слепень. А ты —
    Незнайка. — Он кивает на горящий проспект. — Это? Да брось. Это пока цветочки,
    сущий базар на пожаре.
  again: "Слепень нетерпеливо дёргает вас за рукав: «Ну, Незнайка, идём или сидим?»"
  choices:
    - label: "«Я сам дойду до моста»"
      if: "not flag.l3_alone"
      effects: ["set flag.l3_alone"]
      text: "Слепень хохочет: — Сам он! Сиди, сиди. К вечеру тут такие котики набегут — сам до моста дойдёшь, только по частям. — Мимо вас проносится горящий человек. Вы встаёте."
    - label: "Пойти со Слепнем"
      text: "Слепень хватает вас за руку и тянет прочь от проспекта, не оглядываясь."
      goto: l4_city

# ── глава 4: город чудовищ ─────────────────────────────────────────────────────

- id: l4_city
  chapter: "Три шарика"
  checkpoint: true
  on_enter: ["var.stage = 4"]
  text: |
    Слепень тащит вас через квартал, расталкивая людей и покрикивая: «С дороги, цифра!»
    Трамвай, сошедший с ума, сметает машины на перекрёстке. С тротуара отлетает детская
    коляска и катится под уклон, прямо к дороге.

    Вы дёргаетесь к ней — и не можете сдвинуться. Хватка у Слепня железная.

    — Уймись, спасатель, — говорит он совсем спокойно. — Там не ребёнок. Там кукла из мяса.
    Цифра. Они тут все цифры: внутри та же требуха, что у нас, а души нет. Массовка. А мы —
    игроки. Ну, называй так, если хочешь.
  again: "Слепень снова тянет вас по улицам горящего города, покрикивая на прохожих."
  intro:
    - if: "from == 'l3_retry'"
      text: "Вы опять на тротуаре у горящего проспекта, и опять чья-то лапища тянет вас прочь."
  choices:
    - label: "Рвануться к коляске изо всех сил"
      if: "not flag.l4_pram"
      effects: ["set flag.l4_pram", "var.humanity += 1"]
      text: "Вы выкручиваетесь, бьёте его по руке — бесполезно, как бить по столбу. Коляска исчезает за углом. Слепень смотрит на вас почти с жалостью: «Ничего, перебесишься»."
    - label: "«Так это игра? Отсюда можно выйти?»"
      if: "not flag.l4_exit"
      effects: ["set flag.l4_exit"]
      text: "Слепень ржёт так, что сгибается пополам. — Ну Незнайка, ну уморил! Самый любимый вопрос всех желторотиков. Никто не знает, понял? А кто знает — помалкивает. Не игра это. Не пойми что."
    - label: "Шагать за ним дальше"
      goto: l4_phases

- id: l4_phases
  text: |
    Где-то впереди вспыхивает пальба — десятки стволов разом, потом всё реже. Туда ушла
    колонна. Слепень ухмыляется: оседлые добрались до силовиков, и стрелять тем осталось
    недолго.

    Он объясняет на ходу. Это первая фаза: горожане сходят с ума, поджигают, прыгают
    с крыш. Через сутки нормальных не останется — вторая фаза, медлительные мертвяки.
    А дальше те, кто нажрался, растут в настоящих тварей. Из тварей добывают спораны,
    из споранов делают живчик, а «кач» — это когда ты их бьёшь и растёшь сам.

    Колено ноет всё злее. На лестнице вы его подвернули, и теперь оно будто рассыпается.
  choices:
    - label: "Пожаловаться на колено"
      if: "not flag.l4_knee"
      effects: ["set flag.l4_knee"]
      text: "— Бракованный ты, — Слепень сплёвывает. — Таким обычно что-то компенсируют, но это всегда сюрприз. Живчика бы тебе. Ладно, потом разберёмся."
    - label: "Хромать за ним, пока он не убежал"
      text: "По газону вдруг шарахаются коты. Слепень замирает, потом с воплем «Незнайка, держи штаны! Коты — значит, близко!» бросается через проспект. Вы ковыляете следом, закусив губу."
      goto: l4_monster

- id: l4_monster
  text: |
    Через кусты ломится что-то огромное. Выше двух метров даже сгорбленное, руки до колен,
    кожа морщинистая и жёлтая, на плечах расплылись татуировки — когда-то это был человек.
    Оно урчит с клёкотом, и от этого звука хочется лечь и не шевелиться.

    — Младший братишка! — радостно орёт Слепень и машет ему рукой, как собаке.

    Тварь прыгает. Слепень выставляет пустую ладонь — и её отшвыривает назад, будто
    невидимый великан отбил её ракеткой. Тварь встаёт, шатаясь, и, к вашему изумлению,
    удирает.

    — Незнайка, догоняй! — Слепень бросается следом. — Кинь в него хоть камнем — тогда
    на двоих засчитают!
  choices:
    - label: "Бежать за Слепнем изо всех сил"
      roll:
        chance: "35 + var.luck * 5"
        success:
          text: "Колено стреляет болью, но держит. Вы несётесь по аллее за Слепнем, подхватив на бегу обломок кирпича, — и не отстаёте."
          system: "Удача: сработала."
          goto: w1_catch
        fail:
          text: "На третьем десятке шагов в колене что-то щёлкает, и нога подгибается. Вы падаете, встаёте, снова падаете. Слепень и тварь исчезают за деревьями."
          goto: l4_under_car
    - label: "Беречь колено — не гнаться"
      text: "Вы переходите на шаг, потом на хромоту. Слепень и тварь исчезают за деревьями, и последнее, что вы слышите, — его азартный вопль."
      goto: l4_under_car

# ── «что если» №1: колено выдержало ────────────────────────────────────────────

- id: w1_catch
  text: |
    Тварь петляет между деревьями, Слепень бьёт её издали — раз, другой, — и она валится.
    Вы с разбегу швыряете кирпич ей в голову. Попадаете. Слепень довольно хрюкает и
    добивает тварь чем-то невидимым, от чего у неё лопается затылок.

    Перед глазами вспыхивает: «Слепень предлагает вам вступить в отряд». Вы говорите
    «Вступить». Следом — строки о победе, об очках прогресса, о каких-то споранах.

    — Фартовый ты, Незнайка, — Слепень вытирает руки о штаны. — Колено не развалилось,
    кирпичом не промазал. Ну что, пойдёшь со мной? До стаба доведу, научу кой-чему.
    Мальчик на побегушках мне не помешает.
  system: "Отрядная победа: уничтожен заражённый. Физическая сила: +4 к прогрессу. Гуманность: +2."
  on_enter: ["var.humanity += 2"]
  choices:
    - label: "Пойти со Слепнем к стабу"
      goto: w1_end
    - label: "Поблагодарить и идти своей дорогой, к мосту"
      text: "— Ну и дурак, — без обиды говорит Слепень и выходит из отряда. Вы ковыляете к мосту один. Через три квартала колено, сжалившееся на время, всё-таки щёлкает — и нога подгибается."
      effects: ["set flag.w1_refused"]
      goto: l4_under_car

- id: w1_end
  text: |
    Слепень выводит вас из города задолго до темноты — тропками, о которых не знает ни
    одна цифра. Мост, потом лес, потом поселение за стенами у слияния рек: стаб. Там он
    крестит вас, как обещал, и с ухмылкой оставляет то самое имя — Незнайка.

    Вы таскаете ему патроны, чистите стволы, бегаете в рейды на подхвате. Колено лечит
    знахарь, удача растёт медленно, уровни — ещё медленнее. Вы живёте долго и осторожно.

    Иногда в баре стаба рассказывают про девчонку с дурацким прозвищем Няша, за которой
    охотится какой-то Ромео. Вы слушаете вполуха. Вам-то что.
  extra:
    - if: "meta.ending.cheater"
      text: "Только по ночам иногда снится лесопилка, грязная пленница под потолком и строчка «Вы исключены из отряда». Глупый сон. Вы же никогда там не были."
  system: "Задание «задать правильный вопрос»: не выполнено."
  ending: { id: slepen, title: "Незнайка при Слепне" }

# ── книжный путь: под машиной, на крыше, ночью ─────────────────────────────────

- id: l4_under_car
  text: |
    Вы остаётесь одни посреди чужого города. Вокруг стреляют, где-то бьётся стекло.
    Вы заползаете под машину у спортплощадки и лежите, прижавшись щекой к асфальту.

    Мимо цокают твари — у некоторых на ногах будто подковы. Пробегают и люди: вы видите
    только ноги, грязные, босые, у кого-то совсем голые. Чем грязнее ноги, тем страннее
    походка. Так вот как выглядит вторая фаза. Город превращается у вас на глазах.
  choices:
    - label: "Дождаться затишья и забраться на крышу ближайшего дома"
      goto: l4_roof
    - label: "Ползти к реке прямо сейчас, пока светло ☠"
      roll:
        chance: "25 + var.luck * 5"
        success:
          text: "Вы ползёте, перебегаете, снова ползёте. Два квартала — и силы кончаются. Вы забиваетесь в подъезд и лезете наверх: идти дальше днём — самоубийство."
          goto: l4_roof
        fail:
          text: "На втором перекрёстке вас замечают. Цокот подков приближается быстрее, чем вы успеваете оглянуться."
          effects: ["die 'твари со спортплощадки'"]

- id: l4_roof
  text: |
    Крыша пятиэтажки, бортик по краю, будка вентиляции. Вы сидите за ней весь день.
    Солнце жарит, над городом стоит дым, и ветер то и дело гонит его на вас. Внизу, в
    подъезде, кто-то кричит, потом долго, на разные голоса, урчит.

    К полудню приходит жажда. К вечеру она становится главным, о чём вы способны думать.
    Ну что стоило купить бутылку воды? Те двое советовали найти оружие — а у вас нет даже
    бинта на колено. Правильно Слепень смеялся: вам ещё умирать и умирать.
  choices:
    - label: "Терпеть до сумерек"
      goto: l4_flat
    - label: "Спуститься за водой прямо сейчас ☠"
      roll:
        chance: "40 + var.luck * 5"
        success:
          text: "Вы крадётесь по ступеням, ступая через осколки и что-то, что лучше не разглядывать. Внизу тихо. Вам везёт."
          goto: l4_flat
        fail:
          text: "На четвёртом этаже из темноты квартиры на вас бросается то, что урчало весь день."
          effects: ["die 'тварь в подъезде'"]

- id: l4_flat
  intro:
    - if: "from == 'l4_roof'"
      text: "Когда небо темнеет, вы спускаетесь."
  text: |
    В подъезде воняет. Под ногами хрустит стекло и что-то ещё. Стальная дверь на пятом
    этаже вынесена изнутри — не тараном, тут и места для тарана нет. Остаётся надеяться,
    что тот, кто её вынес, ушёл.

    На кухне из крана сочится тонкая холодная струйка. Вы пьёте долго, как верблюд, пока
    не начинает ломить зубы. Жить сразу хочется сильнее.
  choices:
    - label: "Поискать, чем отбиваться"
      if: "not flag.l4_weapon"
      effects: ["set flag.l4_weapon"]
      text: "Нож для хлеба. Сковородка. Скалка. Вы выбираете нож и тут же понимаете, как смешно он выглядит против того, кто вынес дверь."
    - label: "Выйти в ночь и пробираться к реке"
      goto: l4_night

- id: l4_night
  text: |
    Ночь, город без единого фонаря, только над дальними кварталами багровое зарево. Вы
    идёте дворами, от угла к углу. Где-то впереди должна быть река.

    Рёв мотора вырастает внезапно. В узкую улочку влетает «буханка» с пулемётом на крыше,
    а следом за ней — что-то огромное, быстрое, в мельтешении вспышек похожее на ожившую
    гору. Позади, на перекрёстке, полыхает выстрел гранатомёта, и гора падает.

    И встаёт. Тварь медленно, тяжело разворачивается к стрелку — и обрушивает на него
    последний удар, прежде чем рухнуть сама. «Буханка» с рёвом уносится прочь. Тишина.
  choices:
    - label: "Затаиться за разбитой машиной"
      goto: l4_dying

- id: l4_dying
  text: |
    — Парень… — хрипит темнота у мёртвой туши. — Я знаю, ты там… Подойди.

    Вы подходите. Луна выглядывает в прореху туч. Ноги у него вывернуты, рук нет, лица
    почти нет — только один глаз и половина роскошных усов. Усатый.

    — Нулёвка… До моста, значит, не дошёл… Слушай. В левом берце нож, в правом фонарик.
    У элиты на затылке гриб, костяной капюшон сверху. Режь по канавкам. Что внутри — всё
    твоё. Кроме жемчуга. Жемчуг — мне. В рот. Быстрее, я минуту продержусь… может, две.
  choices:
    - label: "«Что ещё за жемчуг?»"
      if: "not flag.l4_pearl_q"
      effects: ["set flag.l4_pearl_q"]
      text: "— Вот зараза… да ты же нулёвка, — его единственный глаз закатывается от злости. — Шарики! Блестящие! Бегом!"
    - label: "Достать нож и фонарик из его ботинок"
      effects: ["item.knife += 1"]
      goto: l4_elite

- id: l4_elite
  text: |
    Вблизи тварь в пять раз больше, чем казалась. Голова — как холодильник. На затылке
    чёрный нарост под толстым костяным козырьком, весь в бороздках, как гриб на берёзе.
    Нож не берёт его, пока вы наугад не тычете в канавку — и тогда оболочка расходится.

    Туша вздрагивает и ревёт. Она жива! Сердце в ней ещё бьётся — еле-еле. Вы вываливаете
    на ладонь чёрный ком спутанных нитей, а в нём — зелёные комочки, жёлтые горошины,
    янтарные капли и три шарика: чёрный, тёплый на ощупь, красный и зелёный.

    И тут прямо над головой раздаётся урчание. Второй. Брат того, что лежит.
  choices:
    - label: "Бросить фонарик в сторону и закатиться под грузовик"
      text: "Фонарик летит в одну сторону, вы катитесь в другую — под днище брошенного грузовика. Удар сотрясает кузов. Ещё один. Грузовик начинает крениться."
      goto: l4_truck

- id: l4_truck
  text: |
    Грузовик кренится всё сильнее — тварь переворачивает его, как игрушку. Сейчас днище
    уйдёт вверх, и между вами и ней не останется ничего.

    В кулаке три шарика. Если это и правда игра, то вот он, шанс: волшебная таблетка,
    которая спасёт героя в последний момент. Какую из трёх? Нет времени выбирать.
  choices:
    - label: "Проглотить все три разом ☠"
      text: "Вы закидываете шарики в рот и глотаете. Ничего. Совсем ничего. Вы сжимаетесь, ожидая когтей, — и тело сводит судорогой такой силы, что хрустят зубы. Последнее, что вы слышите, — грохот перевёрнутого грузовика."
      effects: ["var.life = 4", "die 'три жемчужины разом'"]
    - label: "Рвануть к умирающему — отдать жемчуг ☠"
      text: "Вы выкатываетесь из-под грузовика и бежите к Усатому. Лапа настигает вас на полпути, вздёргивает в воздух — и, уже падая в темноту, вы в отчаянии суёте шарики себе в рот. Судорога приходит раньше когтей."
      effects: ["var.life = 4", "set flag.tried_give", "die 'три жемчужины разом'"]

# ── случайная смерть в третьей жизни: тот же день заново ────────────────────────

- id: l3_retry
  text: |
    Ещё одна общага, ещё один рыжий сосед под одеялами, ещё один такой же день. Номер
    кластера другой, всё остальное — как под копирку.

    Вы не тратите ни минуты: шорты, бумажник, лестница, двор.
  again: "Снова общага, снова сосед под одеялами, снова тот же день. Вы уже на лестнице, пока он продирает глаза."
  extra:
    - if: "var.stage == 4"
      text: "Фляжка с портянками, двести рублей таксисту, проспект — на этот раз вы выпрыгиваете из машины ещё до удара. Шишка на голове всё та же: от судьбы не уйдёшь."
  choices:
    - label: "Дальше — по знакомой дорожке"
      goto:
        - { if: "var.stage == 4", goto: l4_city }
        - { goto: l3_yard }
