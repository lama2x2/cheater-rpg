# Главы 26–28 книги: ночь на плотине, осада, Ромео, «Нарекаю тебя…». Эпилог — крючок книги 2.
# Развилки «что если» №3 — уйти ночью (w3_) и №4 — согласиться на сделку с Ромео (w4_).

- id: l13_night
  chapter: "Исключён из отряда"
  checkpoint: true
  on_enter: ["var.stage = 13"]
  text: |
    Няша сидит в своём чёрном кресле у окна и гладит винтовку на коленях. На вас она
    не смотрит.

    Вы рассказываете, как дрался, и между делом говорите: хорошо бы достать яд —
    быстрый, чтобы мазать им пули.

    — Такого добра везде полно, — бесцветно отвечает Няша. — Хлопья. Осадок, который
    остаётся на бинте, когда процеживаешь спораны, горошины, звёзды. Щепотка внутрь —
    и на респ. Мелких мертвяков убивает сразу, крупных — парализует. Только тепла не
    выносит: пуля при выстреле нагревается, яд на ней разрушится.
  extra:
    - if: "flag.l12_foray"
      text: "Голос ровный, но вы чувствуете: она в ярости. Вы ушли, когда она велела стоять."
    - if: "not flag.l12_foray"
      text: "Она устала. Вы тоже. Царапина на руке под бинтом дёргает в такт сердцу."
  choices:
    - label: "Наточить из арматуры пики и вымазать их ядом"
      text: "Вы находите в подсобке напильник и обрезок арматуры. Четыре прутка, заточенные до иглы. Один вы с размаху вгоняете в деревянный брусок — держит. Хлопья вы соскребаете с бинтов, разводите в кашицу и обмазываете острия. Метательное оружие для читера с меткостью снайпера. Няша смотрит на это и молчит."
      effects: ["item.spikes += 4"]
      goto: l13_talk

- id: l13_talk
  text: |
    Темнеет. Вы завариваете чай и ставите кружку на подоконник перед ней.

    — Можешь меня убить, но одну я тебя не оставлю.

    — Твоё мнение тут никого не интересует, — отвечает Няша. — Утром ты уйдёшь. Я объясню,
    как дойти до стаба. А на этом всё.

    Потом, почти против воли, она рассказывает. Был до вас один новичок. Красивый, с честным
    открытым лицом, говорил так, что заслушаешься. Она учила его всему. Однажды отправила
    в стаб за бронебойными патронами — самой ей туда нельзя. Он вернулся с патронами.
    А через пару дней вышел из отряда и выстрелил ей в ногу: в отряде вредить друг другу
    почти невозможно. Его кто-то купил. Ей пришлось застрелиться самой — лишь бы не
    попасть к Ромео живой.
  choices:
    - label: "«Я не такой, как он»"
      if: "not flag.l13_knight"
      effects: ["set flag.l13_knight", "var.bond += 1"]
      text: "— Ты себя ещё не знаешь, — тихо говорит Няша. — У тебя даже памяти нет. А он мне жизнь обещал отдать. Все свои жизни."
    - label: "«Почему ты так боишься респа? У тебя же их много»"
      goto: l13_lives

- id: l13_lives
  text: |
    — Сколько у тебя жизней? — спрашивает Няша, не оборачиваясь. Голос у неё вдруг
    становится мёртвым.

    — Девяносто с чем-то. Ты же знаешь.

    — А у меня меньше десяти. Когда кончится последняя, я просто перестану появляться.
    Что будет дальше — никто не знает. Я думаю — ничего. Это будет настоящая смерть,
    Рокки. И она уже близко.

    Перед глазами вспыхивает красным: «Вы исключены из отряда».

    — Всё, — Няша поднимается на самодельные костыли. — Теперь ты сам по себе. Даже если
    тут рванёт атомная бомба, мы окажемся на разных респах.
  choices:
    - label: "Уйти прямо сейчас, ночью — раз она так хочет"
      goto: w3_leave
    - label: "Лечь и уйти утром, как договорились"
      text: "Вы ложитесь на пол у двери и долго смотрите в потолок. Няша не спит тоже: вы слышите, как скрипит кресло. Под утро вы всё-таки проваливаетесь в сон."
      goto: l14_dawn

# ── «что если» №3: уйти ночью ──────────────────────────────────────────────────

- id: w3_leave
  text: |
    Вы собираете рюкзак. Няша, опираясь на костыли, провожает вас до двери — медленно,
    будто тянет время. Или вам так кажется.

    — Иди вдоль реки на север, — говорит она. — Потом по высоковольтке. Не спеши.

    — Прощай, Няша.

    — Иди уже, придурок.

    Вы идёте всю ночь. На рассвете, когда плотина давно скрылась за лесом, далеко позади
    начинают стрелять. Глухо, много стволов. Потом хлопает граната. Потом — тишина.
  choices:
    - label: "Бегом назад, на выстрелы"
      text: "Вы бежите назад три часа. К полудню вы на дамбе. Стоянка изрыта колёсами тяжёлых машин, у станции — пятна копоти и россыпь гильз. Чёрное кресло у окна пустое. Её нет. Ни живой, ни мёртвой."
      effects: ["set flag.w3_back"]
      goto: w3_end
    - label: "Идти дальше. Она сама так решила"
      text: "Вы сжимаете лямки рюкзака и идёте дальше, на север. Не оглядываться. Она сама так решила. Она взрослая. Она знает этот мир лучше вас. Вы повторяете это до вечера."
      goto: w3_end

- id: w3_end
  text: |
    До стаба вы добираетесь через неделю — грязный, худой, с винтовкой и горстью споранов.
    Вас пускают: новичков тут не любят, но меткий стрелок пригодится всем.

    Вы растёте. Уровень, второй, пятый. Вас зовут в отряды, вы не идёте ни в один. Строка
    «Няша — Ноль» в чате давно серая: ни одного сообщения.

    Однажды в баре кто-то хвастает, что Ромео наконец взял свою беглянку — у плотины,
    без единого выстрела с её стороны. Вы допиваете и уходите, не дослушав.
  extra:
    - if: "flag.w3_back"
      text: "Вы так и не узнали, успела ли она в последний момент сделать то, что собиралась. Вы надеетесь, что успела. Это худшая надежда в вашей жизни."
    - if: "var.bond >= 4"
      text: "Иногда вам снится, как она сидит в чёрном кресле у окна и держит кружку двумя руками. Во сне вы так и не уходите."
  system: "Задание «помочь»: провалено."
  ending: { id: alone, title: "Дорога к стабу" }

# ── глава: доброе утро ─────────────────────────────────────────────────────────

- id: l14_dawn
  chapter: "Доброе утро"
  checkpoint: true
  on_enter: ["var.stage = 14"]
  text: |
    Утро серое, тихое. Няша провожает вас к выходу на костылях, медленно, будто
    растягивая прощание. Вы вешаете винтовку на плечо, с каменным лицом нагибаетесь
    за рюкзаком…

    …и не распрямляетесь, а падаете ничком. Ближнее стекло лопается, над головой
    проносится что-то тяжёлое и жужжащее. В стене, на высоте человеческого роста, —
    свежая дыра.

    — Няша, на пол!

    Она лежит на полу едва ли не раньше вас, отшвырнув костыли.

    — Эй, там, в башне! — доносится снаружи весёлый знакомый голос. — Утро доброе!
    Соскучились?

    — Глобус, — выдыхаете вы.

    — И он здесь не один, — мёртвым голосом добавляет Няша.
  choices:
    - label: "Перевернуть стол и залечь за ним"
      goto: l14_siege

- id: l14_siege
  text: |
    Пули щёлкают по стенам. — Не дёргайся, — спокойно говорит Няша. — Бесшумное оружие,
    дозвуковые патроны, стены держат. Это чтобы мертвяков из города не созвать. По мне
    они стрелять не станут: я нужна живой.

    — Няшенька! — орёт Глобус. — Дружком обзавелась? Ромео в пяти минутах! Давай по-
    хорошему, сама выйдешь — мне это зачтётся!

    — От уродов в этом мире не протолкнуться! — кричит в ответ Няша. Снаружи гогочут.

    Она поворачивается к вам: можно попробовать выскочить одному. Прыгать с плотины в воду,
    уползать на переломанных ногах. Новичкам иногда везёт.

    — Вместе прорвёмся. У тебя есть шприц. Уколешься — побежишь. Я пойду первым и отвлеку.

    — Ещё один рыцарь на мою голову.
  choices:
    - label: "«А если договориться? Ты ему нужна живой — это товар»"
      if: "not flag.l14_deal"
      effects: ["set flag.l14_deal", "var.bond -= 1"]
      text: "Няша смотрит на вас с брезгливым изумлением. — То есть ты мне советуешь продать себя этому… — Ты сама сказала, что мне ничего не светит, — пожимаете плечами вы. Она отворачивается. Похоже, вы сказали глупость."
    - label: "«Как они взяли тебя в прошлый раз?»"
      if: "not flag.l14_how"
      effects: ["set flag.l14_how"]
      text: "— Парализовали. Издали, у кого-то из них есть такое умение. Несколько секунд — и ты уже без оружия, связанная, а вокруг скалятся эти… Поэтому я и не буду ждать. Дам тебе отбежать — и попрощаюсь со всеми. Сама."
    - label: "«Ты забыла, как я стреляю? Мне хватит секунды в окне»"
      goto: l14_snipe

- id: l14_snipe
  text: |
    Вы подбираетесь к окну на корточках, резко встаёте, смотрите — и падаете за миг до
    того, как стекло разлетается. Ага. Снайпер у них один — лежит за рюкзаком у стоянки.

    Вскочить, развернуться, ствол в разбитое окно, выстрел, присесть. Вскрик. Готов.
    Соседнее окно — автоматчик на колене у кабины фуры. Выстрел. Готов.

    В ответ бьют уже не бесшумно: в стену лупит что-то крупнокалиберное, дыры с кулак.
    Но бьёт слишком высоко. Боятся задеть её.

    Няша вдруг встаёт во весь рост посреди окон. Стрельба стихает, будто выключили. — Держи
    меня за талию! — Вы держите. — Не там, придурок! — Она выдёргивает чеку и швыряет
    гранату. Взрыв. — Человек десять с этой стороны. И пикап с пулемётом в кустах на
    пригорке. Раскраска хитрая, придурки такую в упор не видят.

    Вы встаёте и снимаете пулемётчика на пикапе.
  choices:
    - label: "Пересчитать патроны и ждать следующего"
      goto: l14_romeo

- id: l14_romeo
  text: |
    — Голубки! — ревёт Глобус уже издалека. — Ромео подъезжает! Няшка, прихорашивайся!

    — Похоже, барахтаться больше не будем, — очень спокойно говорит Няша. Она смотрит
    на свою винтовку как-то нехорошо. — Рокки, а почему ты до сих пор здесь? Я тебе ещё
    вчера велела уйти.

    — С тех пор кое-что изменилось.

    — Только не моё решение. — Она кричит в окно: — Глобус! Это дело моё и Ромео! Я
    выгоняю этого нулёвку, он сейчас выйдет! Делайте с ним что хотите!

    И снова смотрит на винтовку. — Уходи. Тебя просто убьют. У тебя жизней много.
  choices:
    - label: "«Прими меня обратно в отряд»"
      if: "not flag.l14_squad"
      effects: ["set flag.l14_squad"]
      text: "— Зачем? — Она подбирается, будто вы сказали что-то опасное. — Так связь будет. — Не будет никакой связи. Иди уже и забудь, что меня видел."
    - label: "«Дай мне пять минут. Только ничего с собой не делай»"
      text: "— И почему я должна ждать? — Потому что мы всё ещё барахтаемся. — Няша долго смотрит на вас. Потом кивает — едва заметно."
      effects: ["var.bond += 1"]
      goto: l14_out

- id: l14_out
  text: |
    На лестнице вы задерживаетесь на минуту. Левая рука в бинтах — та самая царапина.
    Вы просовываете под повязку две отравленные пики, острием к локтю, и затягиваете бинт
    потуже. Если обыщут как следует — найдут. Значит, надо, чтобы обыскали не как следует.

    Винтовка на плече, пистолет за поясом, нож. Пусть забирают, пусть смотрят на них.

    Вы толкаете дверь и выходите на дамбу с поднятыми руками.
  choices:
    - label: "Идти к стоянке"
      goto: l15_beaten

# ── глава: пять минут ──────────────────────────────────────────────────────────

- id: l15_beaten
  chapter: "Пять минут"
  checkpoint: true
  on_enter: ["var.stage = 15"]
  text: |
    Бьют вас недолго и без огонька, как за маленькую зарплату. Потом волокут по грунтовке
    и ставят перед тремя.

    Глобус — скалится, как шакал у дохлого слона. Второй — серый, никакой: отвернёшься —
    и забудешь лицо. Третий — белобрысый, коротко стриженный, гладко выбритый, с холёными
    тонкими усиками. Лет тридцать пять. Ниже вас ростом, а смотрит сверху вниз, как
    колонизатор на только что открытый остров. Ромео. Не узнать невозможно.

    — Ну что, нулёвка, рад встрече? — ухмыляется Глобус. — Что при нём было?

    — Винтовка финская, пистолет, нож. Патронов маленько.

    — Щедрая подружка. Чем она там занята?
  choices:
    - label: "Нахамить Глобусу в ответ"
      text: "— Кино смотрит, — говорите вы. — Комедию. Про тебя. — Глобус перестаёт улыбаться: «Можно я ему башку оторву?» — Нельзя, — впервые говорит белобрысый. — Пока нельзя."
      effects: ["set flag.l15_rude"]
      goto: l15_romeo
    - label: "Промолчать"
      text: "Вы молчите и смотрите Глобусу в переносицу. Тот пожимает плечами: «Можно я ему башку оторву?» — Нельзя, — впервые говорит белобрысый. — Пока нельзя."
      goto: l15_romeo

- id: l15_romeo
  text: |
    — Ты, наверное, понял, кто я, — говорит Ромео. — Так вот, Рокки: ты мне не нужен.
    Могу отпустить. Могу отдать этим милым ребятам, они любят таких, как ты. Выбирай:
    стать полезным или узнать их поближе.

    — Я за любую движуху, лишь бы грела, — отвечаете вы.

    — Значит, страдать не хочется. Хорошо. Что задумала Няша? Сюрпризы будут?

    Серый человек стоит рядом и не сводит с вас глаз. Вы вспоминаете, что Няша рассказывала
    про ментатов: есть иммунные, которые слышат ложь.
  choices:
    - label: "Сказать правду: «Она застрелится, лишь бы не попасть к тебе»"
      text: "— Он сказал правду, — бесцветно сообщает серый. Ромео расплывается в улыбке: «Время идёт, а Няша всё такая же. Недотрога. Или нет? Что у вас с ней было?» — Ничего. Она со мной в недотрогу играла. — Правда, — говорит серый. Ромео доволен, как кот."
      goto: l15_test
    - label: "Соврать: «Она решила сдаться»"
      text: "— Он лжёт, — бесцветно сообщает серый. Глобус без замаха бьёт вас в живот, и вы складываетесь пополам. — Ещё раз соврёшь, — ласково говорит Ромео, — и я тебя отдам. Итак: она застрелится? — Застрелится, — хрипите вы. — Правда, — кивает серый."
      effects: ["set flag.lied"]
      goto: l15_test

- id: l15_test
  text: |
    — Глобус говорит, ты неплохо снял его ребят, — продолжает Ромео. — А они не нулёвки.
    Случайно вышло?

    — Не случайно. Я нормально стреляю. Няша хвалила.

    — Правда, — роняет ментат.

    — Устройте ему тир.

    Через двадцать секунд в пятидесяти шагах на дороге стоит пластиковая бутылка, а вам
    в руку суют пистолет: «Один патрон. Дёрнешь стволом в сторону — оторву руку».

    Вы оглядываетесь. Пикап с пулемётом на пригорке. Грузовик с бронированным кузовом и
    спаренной зениткой, стволы смотрят на лесополосу вдоль дороги. Два чёрных внедорожника,
    обваренные решётками. И человек двадцать с оружием наготове.
  extra:
    - if: "flag.l15_rude"
      text: "Глобус не сводит с вас глаз — ждёт, когда ему разрешат оторвать вам голову."
  choices:
    - label: "Попробовать незаметно довернуть ствол на Ромео"
      if: "not flag.l15_aim"
      effects: ["set flag.l15_aim"]
      text: "Ствол успевает сдвинуться на сантиметр, и на ваше запястье ложится чья-то лапа. Кость скрипит. — Нервные у меня ребята, — улыбается Ромео. — Бутылка, Рокки. Только бутылка."
    - label: "Выстрелить в бутылку"
      goto: l15_offer

- id: l15_offer
  text: |
    Вы представляете, как пуля входит бутылке в середину, — и стреляете. Бутылка подпрыгивает.

    — Браво, — за спиной редкие хлопки. — А что с рукой? Почему перевязана?

    — Не поверишь, — ухмыляетесь вы. — Зомби покусали. Они правда существуют.

    Ромео хохочет, за вашей спиной сдержанно ржут. — Он говорит правду, — скучно портит
    шутку ментат.

    — Честный человек, — улыбается Ромео. — Редкость. Поработать на меня не хочешь?
    Для начала тебя не убьют и бить перестанут. Аванс. А дальше — стреляй, ты это умеешь.

    Радист с огромными наушниками вдруг пищит: «В лесополосе нечисто. Джаба говорит —
    что-то большое и очень быстрое. Не человек». Ромео велит Джабе возвращаться и снова
    поворачивается к вам:

    — Ты мог бы помочь мне взять девочку живой?
  extra:
    - if: "flag.lied"
      text: "Он не забыл, что вы уже раз соврали: в улыбке нет ни капли тепла."
  choices:
    - label: "«Мог бы. Скажи, что делать»"
      goto: w4_deal
    - label: "Тянуть время: «Пойду к ней — она меня пристрелит»"
      text: "— Это был теоретический вопрос, — щурится Ромео. — А это был теоретический ответ. — Ты слишком скользкий. — Зато живу ровно, — отвечаете вы. И тут радист визжит."
      goto: l15_elite

# ── «что если» №4: сделка с Ромео ──────────────────────────────────────────────

- id: w4_deal
  text: |
    — Мог бы. Скажи, что делать.

    — Он говорит правду, — произносит ментат, и вы вдруг понимаете, что это так и есть.
    Вам просто хочется жить. Ровно. Сытно. Без этой колючей девчонки, которая всё равно
    гонит вас прочь.

    — Вернёшься к ней, — Ромео улыбается широко, во все зубы. — Скажешь, что вырвался.
    Она пустит: она ведь тебя жалеет, я вижу. Встанешь рядом. А дальше мои ребята всё
    сделают сами — тебе нужно только не мешать.

    Вы идёте назад по дамбе. За вами, не скрываясь, идут трое.
  choices:
    - label: "Подняться в башню"
      goto: w4_end

- id: w4_end
  text: |
    Няша стоит у окна. Она видит вас — и тех троих позади. Лицо у неё становится спокойным,
    почти скучным, как у человека, который давно знал, чем кончится кино.

    — Я так и знала, Рокки, — говорит она. — Все вы одинаковые.

    Вы не успеваете подняться даже на половину лестницы. Наверху хлопает одиночный выстрел.
    Ромео внизу морщится и пожимает плечами: «Ну, значит, в следующий раз. Жизни у неё
    ещё есть. Немного».

    Вам выдают автомат и место в машине. Ментат кивает вам, как своему.
  system: "Гуманность: падает. Задание «помочь»: провалено."
  on_enter: ["var.humanity -= 50", "var.bond -= 10"]
  ending: { id: romeo, title: "Новый рыцарь" }

# ── книжный путь: стая ─────────────────────────────────────────────────────────

- id: l15_elite
  text: |
    — Элита! Это элита!

    Со стороны лесополосы долго, без перерыва бьёт тяжёлый пулемёт — и вдруг замолкает.
    Оттуда несётся скрежет, как будто кто-то рвёт железо голыми руками. «Джаба! Джаба,
    отвечай!» — орёт Глобус в рацию. Один из стрелков матерится и даёт очередь по кустам.

    Все — абсолютно все — смотрят туда. Ромео тоже.

    Вот он, момент. Тот самый. Пальцы сами ныряют под грязный бинт и нащупывают тонкий
    холодный металл. Не одна пика — две. Обыскали не как следует.
  choices:
    - label: "Метнуть первую в Ромео, вторую — в Глобуса"
      text: "Вы косите глазом, не поворачивая головы, и взмахиваете рукой. Пика входит Ромео под ухо. Вторая — сразу следом — Глобусу в шею. Глобус ещё успевает вскинуть автомат и заорать: «Это стая! Ром, глуши их!» Но Рому уже не до того."
      effects: ["set flag.got_globus"]
      goto: l15_throw
    - label: "Метнуть обе в Ромео — наверняка"
      text: "Вы косите глазом и взмахиваете рукой — раз, другой. Обе пики входят Ромео в шею. Глобус, ничего не заметив, вскидывает автомат и орёт: «Это стая! Ром, глуши их!» Но Рому уже не до того."
      goto: l15_throw

- id: l15_throw
  text: |
    Ромео падает на колени, заваливается набок, глаза закатываются, изо рта вываливается
    язык. Няша не соврала: яд из хлопьев работает быстро.

    Он матёрый. Он десятки раз воскресал. Но здесь у него, похоже, кончился лимит: он
    очнётся где-нибудь в другом регионе, за тысячи километров отсюда. Далеко от неё.

    Пик у вас больше нет. Амбал, приставленный к вам, только сейчас разевает рот и
    тянет лапу. Вы подныриваете под неё.
  extra:
    - if: "flag.got_globus"
      text: "Глобус оседает рядом, хватаясь за шею. Если и у него кончились здешние жизни — тем лучше."
  choices:
    - label: "Прыгнуть на ментата — может, он только головой силён"
      goto: l15_mentat
    - label: "Рвануть к дамбе, к Няше"
      text: "Вы успеваете сделать пять шагов. Серый человек вдруг оказывается прямо перед вами — вы даже не видели, как он двигался."
      effects: ["set flag.ran_to_dam"]
      goto: l15_mentat

- id: l15_mentat
  text: |
    Ментат разворачивается, как волчок, и его рука размазывается в воздухе. Удара вы не
    видите. Просто в шее что-то хрустит, позвоночник взрывается болью до самого копчика,
    и мир гаснет.

    Когда он загорается снова, вы лежите в пыли на обочине. Ниже пояса тела нет. Выше —
    слушается плохо. Вокруг грохочет всё сразу. Ментат лежит рядом без руки, вырванной
    вместе с плечом. У пикапа нет пулемёта и крыши. В траве бьётся в агонии тварь, похожая
    на того кусача из деревни. Другая проносится мимо и, мимоходом, вспарывает вам живот.
    Боли нет. Тело своё отработало.

    Стая. Люди у грузовика с пулемётом отбиваются — и, кажется, отбиваются.
  choices:
    - label: "Смотреть"
      goto: l15_nyasha

- id: l15_nyasha
  text: |
    Тварей становится всё меньше. А потом из-за грузовика взмывает Она — размером с
    носорога-переростка, в пластинах и шипах, неправдоподобно быстрая для своих тонн.
    Пулемётчика она разрубает пополам на лету. Автоматчиков — за несколько секунд. Потом
    выпрямляется посреди поля и поворачивает голову, выбирая, с кого начать обед.

    Из-за грузовика выглядывает Няша. На ноге шина — но стоит она твёрдо. Предсмертный бред,
    решаете вы.

    Няша срывается с места, будто ею выстрелили из пушки. Вспрыгивает на колючий хвост,
    взбегает по шипам к загривку, и клинок в её руке вспыхивает голубым — и гаснет,
    уходя в затылок твари по рукоять. Кусака копил силу для одного удара. Хватило одного.
  choices:
    - label: "Поднять руку, чтобы она увидела"
      goto: l15_last

- id: l15_last
  text: |
    Рука поднимается еле-еле. Но Няша замечает. Подлетает, падает на колени, и лицо у неё
    серое.

    — Рокки…

    — Смешно, — хрипите вы. — Мне в тебе ничего не нравится. Ты не няша, ты пугало
    огородное. И почему-то ты лучшая. Твой Ромео улетел, Няш. Смена региона.

    — Зачем?! — В голосе у неё слёзы. — Только не говори, что ради меня! Не нужно мне это!
  extra:
    - if: "flag.ran_to_dam"
      text: "— Ты же ко мне бежал, — вдруг говорит она тише. — Я видела. Пять шагов."
  choices:
    - label: "«Ради кого мне ещё жизнь сливать?»"
      text: "— Этот неудачник мне зарплату предлагал, — вы пытаетесь засмеяться и кашляете кровью. — Убился об полный ноль. Вот кто настоящий придурок."
      effects: ["var.bond += 1"]
      goto: l15_wait
    - label: "«Я же говорил: я не такой, как он»"
      text: "— Я говорил, — повторяете вы. — Ты не поверила. Теперь веришь?"
      effects: ["var.bond += 1"]
      goto: l15_wait
    - label: "«Сам не знаю. Так вышло»"
      text: "— Само как-то, — вы пробуете пожать плечами и не можете. — Ты была права: я думаю не головой."
      goto: l15_wait

- id: l15_wait
  text: |
    — Няш. Ты дождись меня.

    — Что?!

    — Дождись. Я за тобой вернусь. И со своей головой к тому времени разберись. Не все
    мы козлы. Есть одно исключение — это я про себя.

    — Рокки, какое возвращение?! Ты же знаешь!

    — Знаю. Трудно. Почти невозможно. Но я вернусь. Пообещай. Мне это нужно.

    Она долго смотрит на вас — взглядом, которого вы у неё никогда не видели. И кивает:

    — Я дождусь.

    — Ты спеком укололась? — Ну а как бы я без него? — Бери машину и уезжай. Водишь ты как
    последняя дура, но справишься.
  choices:
    - label: "«Вот теперь и помирать можно»"
      goto: l15_name

- id: l15_name
  text: |
    — Рокки! — Няша вдруг вскрикивает совсем другим голосом. — Погибших в одном бою часто
    выбрасывает рядом! Ты можешь попасть в один регион с Ромео! Он знает твоё имя!

    Перед глазами — строчка: «Няша предлагает вам сменить имя на Читер. Текущее имя — Рокки.
    Для согласия скажите „да“».

    — Скажи «да»! Я твоя крёстная, мне можно поменять в первую неделю! Без меня ты не
    сможешь! Ну пожалуйста!
  choices:
    - label: "«Да…»"
      goto: l15_squad

- id: l15_squad
  text: |
    Вы теперь Читер.

    И следом — ещё одна строчка: «Няша предлагает вам вступить в её отряд. Распределение
    добычи: свободное».

    — Так мы найдём друг друга, — торопится она. — Между регионами чаты не работают, через
    черноту тоже. Но в настройках отряда видно, что с человеком. Смерть сразу заметна.

    — Вступить, — скорее думаете, чем говорите вы. — Улыбнись. У тебя хорошая улыбка.
    Жаль, я уже ничего не вижу.

    — Ради меня никто никогда такого не делал, — шепчет Няша. И вдруг кричит: — Придурок!
    Неужели нельзя было это сделать и выжить?!
  system: "Имя «Читер» принято. Вы вступили в отряд Няши."
  choices:
    - label: "«Дождись…» ☠"
      text: "Вы шевелите губами, на пределе слышимости, одно и то же простое слово. Потом гаснет зрение, а следом и слух. Вы не видите, как ваша непробиваемая, колючая спутница стоит на коленях над вами и рыдает в голос, некрасиво, по-детски. Это совсем не в её стиле."
      effects: ["set flag.finale", "die 'яд для Ромео, рука ментата и стая — в этом порядке'"]

# ── эпилог ─────────────────────────────────────────────────────────────────────

- id: epilogue
  text: |
    Строчки на этот раз красные и злые.

    «Новичок, вы слишком быстро теряете жизни. Возможно, место, где вы находились, для вас
    слишком опасно. Начата смена региона».

    — Козлы, — говорите вы темноте.

    «Предыдущий регион — Западное Побережье. Текущий — Степи Междуречья. Смена завершена».

    Вы открываете глаза в очередной убогой общаге. Встаёте рывком, не глядя на соседа под
    одеялами. Где-то бесконечно далеко, за чернотой и болотами, осталась девчонка, которая
    обещала ждать. Значит, надо идти.

    Но сначала — лист бумаги и карандаш. Записать всё, что вы знаете. Чтобы в следующей
    жизни не начинать с нуля.
  extra:
    - if: "var.bond >= 6"
      text: "В меню, в настройках отряда, горит одна строчка: «Няша — жива». Вы смотрите на неё дольше, чем на всё остальное."
    - if: "var.bond < 6"
      text: "В настройках отряда горит строчка «Няша». Жива. Пока что — этого достаточно."
    - if: "flag.got_globus"
      text: "Ромео и Глобус где-то там тоже открыли глаза. Хорошо бы — подальше от неё. Ещё лучше — подальше от вас."
    - if: "var.level >= 3"
      text: "Между строчками мелькает: «Получен уровень {var.level}». Ромео, выходит, стоил дорого. Читер есть читер."
  system: "Возрождений: {lives}. Задания: выжить, искать, узнать тайное, помочь, задать правильный вопрос, найти игрока Няша."
  on_enter: ["var.level += 1"]
  ending: { id: cheater, title: "Читер" }
