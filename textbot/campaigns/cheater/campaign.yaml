# «Пять жизней читера» — интерактивный пересказ книги 1 цикла «Читер» (Артём Каменистый) по главам.
# Сюжет, герои и порядок событий — как в книге; все тексты написаны своими словами (D-01).
# Книжный путь проходится всегда; выборы меняют детали, отношения с Няшей и концовку.
# Четыре развилки «что если»: Слепень (w1_), Глобус (w2_), ночной уход с плотины (w3_), сделка с Ромео (w4_).
id: cheater
title: "Читер. Книга 1: Пять жизней"
version: 1
mode: system
order: 0
length: "60–90 минут"
about: "Пересказ книги «Пять жизней читера» по главам — с выборами и четырьмя развилками «что если»."
teaser: >
  Вы просыпаетесь на продавленной койке студенческой общаги и не помните даже своего имени.
  Перед глазами висит строка: «Текущее количество возрождений — 99». Город за окном ещё живёт
  обычной жизнью. До вечера.
start: wake

vars:
  luck:     { start: 0, label: "Удача", show: true }
  humanity: { start: 0, label: "Гуманность", show: true }
  level:    { start: 0, label: "Уровень", show: true }
  bond:     { start: 0 }      # отношения с Няшей — скрыто
  life:     { start: 1 }      # какая по книге жизнь идёт — для возрождений
  stage:    { start: 1 }      # глава, куда вернуться после случайной смерти

items:
  knife:   { name: "Нож из берца", keep_on_death: false }
  rebar:   { name: "Арматурина", keep_on_death: false }
  pistol:  { name: "Пистолет полицейского", keep_on_death: false }
  rifle:   { name: "Охотничья винтовка", keep_on_death: false }
  spores:  { name: "Споран", keep_on_death: false }
  spikes:  { name: "Отравленная пика", keep_on_death: false }

death:
  lives: 99
  respawn: respawn
  time_cost: 0
  message: "Внимание, вы погибли: {cause}. Часть прогресса потеряна. Осталось возрождений: {lives}. Обратный отсчёт пошёл."
