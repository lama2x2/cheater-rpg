# Глава 1. Тьма: клиника, юрист и три выхода. Развилка «что если»: кома.

- id: dark
  chapter: "Тьма"
  checkpoint: true
  text: |
    Темноты, как оказалось, не бывает совсем. Даже сейчас под веками плавают бледные пятна —
    будто кто-то крутит засвеченную плёнку. Вы помните ангар, приборы, лица ребят из
    команды. И вспышку. Последнее, что вы видели.

    Тела не чувствуется вовсе. Ни рук, ни дыхания, ни боли. Значит, повреждено всё, до чего
    дотянулся взрыв, и, похоже, мозг тоже. Странно только, что думается ясно.

    И тут в пустоте начинает говорить голос — ровный, металлический, словно из дешёвого
    синтезатора: «День девяносто восьмой. Проверка связи. Если слышите — ответьте».
  choices:
    - label: "Ответить голосу"
      goto: edkins

- id: edkins
  text: |
    — Слышу, — говорите вы, сами не зная чем. Голос подстраивается, хрипит, наконец
    поздравляет: вы вернулись с того света. С вами говорит Стив Эдкинс — тот самый кадровик,
    что когда-то набирал людей в ваш проект. Его, оказывается, повысили. Пока вы три месяца
    лежали в коме. Юрист компании уже идёт к вам из административного корпуса — обсудить
    «тонкости».

    Эдкинс говорит вежливо и много. Травма рабочая, лечение компания оплачивает — но в
    пределах договора. Никаких зарубежных клиник, никаких донорских органов из-за границы.
    Держать вас живым надёжно получалось только в коме, а вы взяли и очнулись. Нарушили
    планы.
  again: "Эдкинс терпеливо ждёт, что вы ответите. Его голос по-прежнему звучит как синтезатор."
  choices:
    - label: "«Что от меня осталось?»"
      if: "not flag.ask_body"
      effects: ["set flag.ask_body"]
      text: "— Это лучше обсудить с врачами, — уклоняется Эдкинс. По тому, как старательно он подбирает слова, ответ понятен и так: осталось немного."
    - label: "«Чего вы хотите?»"
      if: "not flag.ask_want"
      effects: ["set flag.ask_want"]
      text: "— Предложить вам искусственную кому, — оживляется Эдкинс. — Совершенно безопасно. Подождать, пока медицина шагнёт вперёд. Юрист всё оформит за полчаса."
    - label: "«Юриста не надо. Мне нужен мой юрист»"
      text: "— Вашего юриста разверните обратно. Свяжитесь с «Моррисоном и Фентоном», — говорите вы. — Это во Фриско. Скажите, что у меня беда. Платить за меня никто не просит. — Эдкинс пытается возразить, но вы перебиваете: времени, похоже, у вас совсем мало."
      goto: wait_john

- id: wait_john
  text: |
    Ожидание тянется вечность. Пока Эдкинс дозванивается, вы просите соединить вас с врачами
    — и тут же жалеете. Тот же мёртвый голос перечисляет, чего у вас больше нет. Список
    длинный. Зрения нет, слуха нет, вместо лёгких — машина. Счёт идёт на дни, а то и на
    часы: без звуков и света рассудок начинает рисовать во тьме что-то голодное.

    Потом голос меняется — не тембром, тембр всё тот же, — а словами.

    — Женя? Слышишь меня? Это Джон.

    Джон Вайт, лучший юрист фирмы Моррисона, человек, который выведет вас из газовой камеры
    через парадную дверь. И который вам кое-что должен.
  choices:
    - label: "Проверить, правда ли это он"
      text: "— Чем я подкупил твоего кота? — Сметаной. После того как отдавил ему хвост, — без паузы отвечает голос. — Привет, Джон, — выдыхаете вы. — Привет, Женя. Хотел бы я, чтобы мы встретились не так."
      goto: three_ways
    - label: "«Джон, у меня мало времени. Сразу к делу»"
      text: "— Понял, без лирики, — отвечает голос, и по этой фразе вы узнаёте его вернее, чем по любому паролю. Так коротко умеет только Джон Вайт."
      goto: three_ways

- id: three_ways
  text: |
    — Вариантов три, — говорит Джон. — Первый: соглашаешься на кому, тебя кладут в
    криостат. Лет тридцать, может, сорок. Деньги — твои, родителей и остатки обязательств
    компании. Второй: закон о добровольном уходе. Тихо и дёшево.

    — А третий?

    — Ты слышал про «Второй Мир»? Игра с полным погружением. Сотни миллионов игроков. Там
    сейчас крутятся деньги больше, чем в иных странах, и игровое золото меняют на
    настоящее. Есть случаи, когда тело умирало, а человек оставался там. Если хочешь жить —
    тебе туда.
  again: "Джон ждёт. Три варианта, и времени выбирать почти нет."
  choices:
    - label: "«Игра? Я в последний раз играл в самолётики»"
      if: "not flag.ask_game"
      effects: ["set flag.ask_game"]
      text: "— Самолётики, — тяжело повторяет Джон. — А ролевые игры? Эльфы, гномы? — В самолётах эльфов не было. — Тяжёлый случай, — вздыхает юрист. — Ладно. Там разберёшься. Ты умный."
    - label: "«На что там жить? Чем платить за тело?»"
      if: "not flag.ask_money"
      effects: ["set flag.ask_money"]
      text: "— Аккаунт для работяг, двести с небольшим в месяц. Денег хватит на десять месяцев: тело в коме, ты — там. За это время найдёшь заработок. Контракт мы тебе подыщем, — обещает Джон. — Моррисон с тебя не возьмёт ни цента. Он умеет помнить, кто его выручал."
    - label: "Выбрать «Второй Мир»"
      goto: connect
    - label: "Выбрать кому: подождать, пока медицина догонит"
      goto: coma_choice

- id: coma_choice
  text: |
    — Ты уверен? — спрашивает Джон после долгой паузы. — Кома — это не сон. Тебя не будет
    тридцать лет. Может, сорок. Может, вообще не будет: из криостата живым пока не
    возвращался никто.

    Вы думаете о тьме вокруг, о том, как она шевелится, если долго в неё смотреть. Кома
    хотя бы избавит от этой тьмы.
  choices:
    - label: "Подписать согласие на кому"
      text: "Электронная подпись ставится мыслью — одна из немногих вещей, на которые вы ещё способны. Эдкинс заметно веселеет."
      goto: end_sleep
    - label: "«Нет. Альтернатива есть всегда». Выбрать игру"
      text: "— Вот это ты, — с облегчением говорит Джон. — Я так и знал."
      goto: connect

- id: end_sleep
  text: |
    Врачи работают быстро. Голоса отдаляются, тьма густеет и перестаёт шевелиться. Последнее,
    что вы слышите, — как Джон что-то ругательски говорит Эдкинсу.

    Проходят годы. Родители продают дом, чтобы платить за криостат. Джон седеет и однажды
    перестаёт приходить. Где-то во «Втором Мире» кто-то другой спускается в шахту и находит
    там то, что могло быть вашим. Мир крутится без вас.

    А вы лежите в холоде и ждёте медицину, которая всё никак не придёт.
  ending: { id: sleep, title: "Долгий сон" }

- id: connect
  text: |
    Дальше всё делается в спешке. Обычно регистрация занимает три дня: заявка, медицинские
    тесты, оплата. У вас столько нет. Моррисон лично едет в офис игры, а Джон договаривается
    с врачами, чтобы оборудование привезли прямо в клинику: дорогу вы можете не пережить.

    Пять или шесть часов вам читают вслух что попало, лишь бы тьма молчала. Какой-то парень из
    конторы Джона торопливо объясняет про игру и путается сам. Запоминается одно: просили
    взять расу покрепче, для работы под землёй.

    — Сиди там тихо и жди, — говорит напоследок Джон. — Найдём тебе хороший контракт.
    Завтра. Самое позднее — послезавтра.
  choices:
    - label: "Подключиться"
      goto: void
