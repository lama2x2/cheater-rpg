# Глава 9. Чистый лист: сон о сером плаще, форум, новое лицо, легендарный пояс, прыжки с уступа.

- id: dream
  chapter: "Чистый лист"
  checkpoint: true
  text: |
    Впервые в этом мире вам снится сон. Вы лежите рядом с мёртвым Наместником, а в арке входа
    стоит человек в серебристом плаще. Половина его лица словно вытесана из гранита и полна
    величия, вторая — холодная, отрешённая, и если вглядеться, расчерчена тончайшей сеткой на
    мелкие клетки.

    — Поздравлять не стану, — говорит он. — Поздравлений и так прозвучало достаточно. Это я не давал тебе стать героем. Достижения третьей ступени дают это звание, ты дошёл
    до четвёртой — и не получил ничего. Из-за меня.
  again: "Человек в серебристом плаще ждёт, глядя на вас половиной каменного и половиной клетчатого лица."
  choices:
    - label: "«Ты мой враг?»"
      if: "not flag.ask_enemy"
      effects: ["set flag.ask_enemy"]
      text: "— Я собирался возместить упущенное сам. Ради эмоциональной привязанности. Или чтобы показать, на кого я ставлю. — Он чуть улыбается одной половиной рта. — Сегодня многие друг друга не понимают."
    - label: "«Зачем ты пришёл?»"
      goto: dream_gift

- id: dream_gift
  text: |
    — Я дам тебе умение, — говорит человек в плаще. — Не уникальное. Невозможное. Иногда я
    умею творить чудеса, если готовлюсь заранее. И второе — слова: не считай мой дар
    пустышкой. Не спеши уходить отсюда. Отдохни. Добудь руду. Узнай себя получше. И поищи ответы.
    Первый: почему тебе дали именно это и именно сейчас.

    — А этот сон — не настоящий?
    — Нет. После боя твою сущность придавила магия школы Разума. Извиняться не стану: иначе
    этот разговор был бы невозможен. Слушать ты пока не готов. Это пройдёт.
  choices:
    - label: "Провалиться в настоящий сон"
      goto: mine_burns

- id: mine_burns
  text: |
    — А вот и дерьмо, — почти равнодушно говорит Гриди и закрывает глаза: смотреть на то, что
    его убьёт, ему не хочется.

    Частокол рудника превращается в пыль, пыль — в огонь. За несколько секунд та же участь
    постигает избы, печи и навес. Пламя вылизывает всё. Высокоуровневые бойцы превращаются в головешки, а горстка ошарашенных нубов в подштанниках раз за разом возрождается в луже лавы, в которую превратился каменный круг.

    А вас будят логи. «Ваш тайник обнаружило существо высокого уровня». Ещё. И ещё. Тайники
    растут, как на дрожжах: по пещерам и штольне, набитым вашим хламом, носятся толпы.
  choices:
    - label: "Открыть характеристики"
      goto: wake_legend

- id: wake_legend
  text: |
    Вы едва не получаете инфаркт. Сила, о двадцати единицах которой вы мечтали, — семьдесят
    пять. Выносливость тоже. Удача — девяносто. Харизма — двадцать одна. Шесть новых
    дополнительных характеристик. За одну ночь нулевка превратился в восемьдесят девятый уровень. Четыреста сорок пять свободных очков.

    Вы не поймали удачу за хвост. Она у вас дрессированная и, кажется, сгоняет за пивом, если
    пнуть.

    Спешить с очками вы не станете: один раз уже поторопились. Сначала — туша босса. Потом —
    расширенный интерфейс: копирование текста, списки друзей и врагов. И доступ к сайту и
    форуму игры прямо отсюда. Те самые гайды, в которые вас тыкали носом с первого дня.
  choices:
    - label: "Открыть форум"
      goto: forum

- id: forum
  text: |
    В восьми темах из десяти самых горячих — ваш ник. «„Камелот“ хорошо заплатит за сведения об игроке…» — и ещё три таких же, с другими кланами. Красные мировые
    сообщения о ваших достижениях видел весь мир. Китаец с трёхсотым уровнем на их фоне —
    засохший плевок на мраморной стене небоскрёба.

    Второй лагерь спорит о богах: при разработке никаких богов не было, только безликие «высшие
    силы». Через пару часов после смерти Наместника на рудник напали «Последние корсиканцы» —
    пятнадцать тысяч игроков. Их выбили «джапы» из «J-P», десятки лучших. Пленных нубов
    допрашивают. В гильдиях наёмников приспущены флаги: бойцов для найма не осталось.

    Кто-то, похоже, уже знает, кто вы в реале.
  choices:
    - label: "Подумать, что с этим делать"
      goto: clean_think

- id: clean_think
  text: |
    Кланам вы нужны, чтобы решать их задачи, а не ваши. Написать в лоб: «Вот он я, давайте
    тридцать миллионов»? Ни одна гильдия даже не назвала сумм — только «взаимовыгодное
    сотрудничество». А у вас восемь месяцев, потом тело перестанут держать в коме и
    заморозят.

    Вы — уникальная вещь, которая пока не принадлежит никому, кроме себя. Вы уже насиделись в
    клетках: закрытые проекты, секретность до идиотизма, а потом взрыв, потому что кто-то из
    безопасников решил, что вентиляция уязвима.

    Хватит. Вы побегаете сами. Только как спрятаться, если ник над головой видит каждый?
  choices:
    - label: "Посмотреть на новое умение"
      goto: clean_slate

- id: clean_slate
  text: |
    «Редчайшее умение: Чистый лист. Носителей — не больше трёх. Второе рождение: смена
    расы, внешности, голоса, ника. Можно скрыть звания и достижения. На другого персонажа —
    снимает запреты на рост характеристик, при повторе — на рост уровней. Перезарядка: семь
    дней».

    Теперь понятно, почему человек в плаще велел не спешить. Мяса в сумке дней на семь-восемь.
    Как раз столько перезаряжается дар.

    Кем стать? Человеком нельзя: у людей склонность к некромантии, а про ваших крыс и лепра на
    руднике расскажут быстро. Гном-шахтёр — первое, что станут проверять.
  choices:
    - label: "Светлым эльфом с луком: их полно, а с луком меня не видели"
      goto: elf

- id: elf
  text: |
    Светлых эльфов вы недолюбливаете на подсознательном уровне — тем приятнее будет потом
    сменить этот облик. Раса популярная, а лучники среди них — каждый второй. Ваш новый ник —
    JohnArcher44, безликий, как номер в очереди. Рабочего «червяка» вы стираете и рисуете
    значок обычного аккаунта по скидке. Флажки и звёзды прячете.

    Под ушастой внешностью остаётся ррох со всеми его талантами. Почти все очки за уровни
    уходят в силу и ловкость: руду этого подземелья лучше бить с двух-трёх ударов.

    Потом — добыча. Из Наместника выпал пояс с ярко-красным описанием. Легендарный пояс
    Верховного Мага Первой Цитадели: интеллект, сила мысли, броня, слоты для зелий — и четыре
    слота для вещей, которые теряют в них девять десятых веса. Он не теряется, не крадётся и
    чинит себя сам. Похожие на форуме уходили за восемьдесят девять тысяч долларов.
  on_enter: ["item.belt = 1"]
  choices:
    - label: "Сунуть в слоты все три сумки — и ограбить подземелье как следует"
      goto: boss_cache

- id: boss_cache
  text: |
    Первый тайник — прямо под барабаном Наместника. Сапоги из набора Наместника сил Хаоса,
    зелёный текст: всего на ступень хуже легендарного. Таких на рынке нет вообще: всё, что
    выбивали, осело в запасниках топовых кланов. И свиток телепорта — в любое место, где
    вы уже бывали.

    Три дня вы чистите ярусы от руды: аметисты, олово, цитрины, наконец аквамарины, для
    которых горного дела едва хватает. Кусок серебряной руды. Изумруд. Ни разу не виданный
    ауритовый самородок. Удача у вас ненормальная.

    Потом сидите на седьмом ярусе и читаете форум. Восемь кланов дерутся за никому не нужный
    рудник. Кто-то применил тектоническую магию, всё обвалилось, и теперь бьются за право
    раскапывать завалы с чужими доспехами. «Мечи» затаились: когда дерутся слоны, траве
    положено страдать молча.
  on_enter: ["item.boots = 1"]
  choices:
    - label: "Почитать, что пишут про рроха"
      goto: rroh_forum

- id: rroh_forum
  text: |
    Про расу ни слова в открытую, но в десятке тем кто-то осторожно расспрашивает: что за
    «ррох»? В базе знаний есть картинка, а выбрать нельзя. Отвечают те, кто выбирал: бонусы
    вкусные, но едва начнёшь играть, приходит сообщение об ошибке в описании и предложение
    сменить персонажа с компенсацией. Все соглашались.

    А вам ничего не предлагали. Почему?

    И ещё одна тема, с почти пустыми ответами: «ПРОКЛЯТЫЙ СУПЕРНУБ — ВЕЛИКОМУ ИМПЕРАТОРУ НУБОВ!!!» Внутри — несколько строк. Виват нашему владыке. Помнишь дуэль мага с
    глупым бафером? Не появляйся там: нам самим лягушек не хватает. И прекрати уже меня
    проклинать.
  choices:
    - label: "Улыбнуться: «Я тебя и не проклинал, Цифра»"
      effects: ["var.cifra += 1"]
      text: "Ответить нельзя: регистрироваться на форуме даже под новым ником опасно. Но Цифра явно рисковал, предупреждая вас, — парализованному выйти на форум из реала непросто. Человек он, похоже, неплохой. Странный, но неплохой."
      goto: ledge_go
    - label: "Запомнить: Цифра мог выдать — и предупредил"
      text: "Он наверняка рассказал искателям всё, что знал: это ведь он привёл вас к вербовщику «мечей». И всё же нашёл способ предупредить. Доверять ему пока рано, но забывать — нельзя."
      goto: ledge_go

- id: ledge_go
  text: |
    Мясо кончается. Пора наружу. На форуме новая горячая тема: «Русские идут!» Восточные
    славяне, мол, всегда устраивают набеги туда, где кто-то из западных секторов взял великое
    достижение. Шумно и грубо, но вам только на руку: чем больше постороннего шума, тем меньше
    ищут вас.

    Одно выдаёт: уровень. Восемьдесят девять — точно в диапазоне, который вычислили какие-то
    очень умные люди. Перед входом в червоточину пусто. Вы карабкаетесь на выступ над
    пропастью, втыкаете в трещину трофейную алебарду и привязываетесь к ней. Раздеваетесь до
    подштанников и прячете сумку в слот пояса.

    Дар последнего рроха: потерянные уровни не отнимут характеристик. А каждый уровень,
    набранный заново, принесёт ещё по очку.
  on_enter: ["set flag.ph_ledge"]
  choices:
    - label: "Встать на краю"
      goto: ledge

- id: ledge
  text: |
    Внизу — каменная осыпь, далеко и очень твёрдо. В голове крутится дурацкий детский стишок
    про мальчика, который хотел стать птичкой. Паранойя? Возможно. Но вы будете
    последовательны в своей паранойе.
  again: "Уступ, ветер, алебарда в трещине. Осыпь внизу всё такая же твёрдая."
  extra:
    - if: "var.jumps == 1"
      text: "Минус одиннадцать процентов опыта — и уровень вниз. Ещё."
    - if: "var.jumps == 2"
      text: "Уровней становится заметно меньше. Привыкнуть к этому полёту нельзя."
  choices:
    - label: "Разбежаться и прыгнуть ☠"
      text: "Разбег, край, пустота под ногами — и камни летят навстречу."
      effects: ["var.jumps += 1", "var.level -= 26", {if: "var.level < 10", then: ["var.level = 10"]}, "die 'прыжок с уступа'"]
    - label: "Хватит. Десятый — ниже не бывает. Спускаться с гор"
      if: "var.jumps >= 3"
      locked: "Уровень ещё слишком высок"
      effects: ["clear flag.ph_ledge"]
      goto: road
