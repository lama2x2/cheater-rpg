# Глава 5. Безумный одиночка: зомби-крыса, птер, ловушка на лепра, ночной набег.

- id: zombie_day
  chapter: "Безумный одиночка"
  checkpoint: true
  text: |
    Новая крыса-зомби семенит за вами, как собачонка: вы стоите — и она стоит, вы садитесь — и
    она садится. Управлять ею проще, чем стиральной машиной. Вы зовёте её Анфиской.

    Скоро выясняется подвох. Анфиска дерётся, вы её лечите — и растёт только интеллект. Сила
    не прибавляет ни капли: она растёт, лишь когда бьёшь сам. Значит, тактика такая: Анфиска
    вцепляется в моба, а вы обходите сцепившихся и бьёте сзади. В половине случаев удар
    ломает хребет.

    В очередной тушке среди когтей и зубов лежит зачарованное медное кольцо: маскировка +1.
    Зачем крысе кольцо — загадка, которую своим умом не осилить.
  on_enter: ["item.ring_mask = 1"]
  choices:
    - label: "Отнести находку Пупу"
      goto: pup_ring

- id: pup_ring
  text: |
    — Не стучи рядом, — останавливает вас Пуп, едва вы берётесь за кирку. — Чем ближе шахтёры,
    тем вернее обвал. Тут не рудник, а отстой.

    Про кольцо он объясняет: из мобов падает не только требуха. Вещи бывают дешёвыми и
    редкими, есть даже легендарные — меч из рейд-босса недавно ушёл за одиннадцать миллионов.
    Боссов валят толпой. Есть логова Хаоса: первооткрыватель там получает больше. Есть
    кольца, прибавляющие уровень, — нулевки так и выкручиваются.

    — А опыт у тебя копится, — говорит он. — Сними замок, и сразу станешь третьим. Каждый уровень
    даёт пять очков. Доплати сотню за аккаунт на месяц — выправишь перса. Или подвиг соверши.
    Завали, например, рейд-босса один. Шучу.
  choices:
    - label: "Подарить кольцо Пупу за науку"
      effects: ["item.ring_mask -= 1", "var.pup += 1", "set flag.gave_ring"]
      text: "— Серьёзно? — Пуп вертит кольцо. — Оно копейки стоит, честно. Но мне в самый раз: оставляю тело на ночь внизу, а с маскировкой твари меня хуже заметят. Спасибо, Рос. Спрашивай, когда захочешь."
      goto: pter
    - label: "Оставить кольцо себе"
      text: "— Правильно, — одобряет Пуп. — Качать надо всё. Маскировка тоже когда-нибудь пригодится."
      goto: pter

- id: pter
  text: |
    На этот раз вы замечаете ночную тварь заранее: по штреку бодро скачет нечто вроде
    ощипанной курицы-переростка с корявыми отростками вместо крыльев. Информация о ней
    горит ярко-красным: «Пещерный птер. Агрессивность: высочайшая».

    Красный цвет, догадываетесь вы, — это предупреждение. Моб намного выше вас.
  choices:
    - label: "«Анфиска, фас!» — и в бой ☠"
      text: "Анфиска бросается вперёд и получает клювом в лоб. Призванное существо погибло. — Партизаны не сдаются! — орёте вы и бьёте птера киркой на одну единицу урона. Птер отвечает на шестьдесят две."
      effects: ["set flag.ret_gridi_norm", "die 'пещерный птер'"]
    - label: "Отступить к вагонеткам, пока не заметил"
      text: "Вы пятитесь, затаив дыхание, и птер проскакивает мимо, к стуку чужих кирок. Анфиску вы, увы, не уберегли: она зачем-то пошла за ним. Призванное существо погибло. К вечеру вы выбираетесь наверх своим ходом."
      goto: gridi_norm

- id: gridi_norm
  text: |
    — Почему так мало? — возмущаетесь вы. — По крысе я выбиваю восемь, а по этой твари — одну!
    — Птер, — понимающе кивает Гриди. — Пятнадцатый уровень и выше. Я его с одного удара
    сношу, а ты защиту своей нубской киркой не пробиваешь. Да и прокачан ты криво.

    Норма, напоминает он, полторы сотни кусков в день. У вас по жетону восемьдесят четыре —
    за два дня. Есть у него интересный топорик, но для третьего уровня: в руках нулевки
    будет больше вреда ноге, чем мобу. Хочешь оружие — снимай замок.
  again: "Гриди сидит на своём насесте и смотрит на вас как на испорченную погоду."
  choices:
    - label: "«Есть тут мобы третьего-четвёртого уровня?»"
      if: "not flag.ask_mid_mobs"
      effects: ["set flag.ask_mid_mobs", "var.gridi += 1"]
      text: "— Поищи, — разрешает Гриди. — Хоть повеселишь меня, мотаясь через респ туда-сюда. Крысы — первый-второй, изредка пятый. Разница с твоей силой маленькая, вот и капает ерунда. Дурак ты, считать не умеешь."
    - label: "«Можно взять палок из костра?»"
      text: "— Да хоть всё забирай, лишь бы ты исчез. — Вы долго и придирчиво выбираете жерди. Охрана у ворот даже не спрашивает зачем. Палки исчезают в сумке, занимая по три-четыре ячейки. Хватит подыхать от зубов и клювов нарисованных тварей — пора думать головой."
      goto: trap_build

- id: trap_build
  text: |
    Вы находите тупиковый штрек с рудой и весь день чередуете медь, охоту и стройку: решётка
    из палок поперёк узкого места, связанная крысиными хвостами. Лучшей верёвки нет.
    Удаётся поднять крысу третьего уровня. Двух призванных одновременно не выходит: то ли
    нельзя, то ли вы нуб.

    Ближе к вечеру, на остатках бодрости, вы слышите треск дерева. Решётку ломает жуткая
    тварь: недоразвитый безбородый гном с лапами перекачанного орка и челюстями бульдога.
  system: "Дикий лепр. Агрессивность: высокая. Социальность: высочайшая."
  choices:
    - label: "Воткнуть кол ему в плечо и принять бой ☠"
      text: "Кол входит в плечо, кирка ломает запястье — крит! Но лепр сносит решётку целой лапой и, почти не глядя, отталкивает вас к стене. Этого толчка хватает."
      effects: ["set flag.ret_gridi_lepr", "die 'дикий лепр'"]
    - label: "Бросить всё и бежать к выходу"
      text: "Лепр застревает в обломках решётки ровно настолько, чтобы вы успели нырнуть в штольню. Сзади ещё долго ревёт. Наверх вы выбираетесь в темноте."
      goto: gridi_lepr

- id: gridi_lepr
  text: |
    — Этих тварей вообще реально убить?
    — Кого?
    — Дикого лепра.
    — Эй, Мак! — кричит Гриди к воротам. — У наших лепров какие уровни?
    — Видал одного за сорок! — отвечают оттуда.
    — Лепр сорокового тебя разделает одним ударом, — подытоживает Гриди. — Жизни у него сотни
    две. Лучше сразу сдавайся, меньше мучиться.

    «Хрен тебе», — думаете вы. И просите ещё деревяшек. И верёвку, если найдётся.
    — Ты там что, виселицу строишь? — Гриди ворчит, но жердей даёт. — И не ходи туда, где
    его встретил. У них хорошая память: будет приходить на это место каждый день.
  choices:
    - label: "Пойти именно туда"
      goto: trap2

- id: trap2
  text: |
    На этот раз ловушка хитрее. В решётке оставлен узкий лаз — такой, что лепру придётся
    извиваться червяком. А под лазом — расчёска из заточенных кольев. У входа в штольню вы
    давно приметили большой камень со сквозной дырой; насаженный на крепкую палку, он
    превращается в уродливый молот.

    Лепр приходит, когда наверху, по вашим расчётам, стемнело. Ломать решётку он не стал —
    полез в лаз, дёргаясь, когда колья цеплялись за брюхо, и не сводя с вас злобных глаз.
  again: "Знакомый тупик, решётка с лазом, колья. Лепр приходит снова — у них хорошая память."
  on_enter: ["set flag.ret_trap2"]
  choices:
    - label: "Молотом по шее — пока он в лазе"
      goto: trap_fight
    - label: "Подождать, пока залезет поглубже ☠"
      text: "Вы ждёте лишний миг — и лепр рвётся вперёд, ломая колья, прежде чем вы замахнулись. Молот так и остаётся поднятым."
      effects: ["die 'дикий лепр'"]

- id: trap_fight
  text: |
    Удар приходится по шее и не только ранит: тело лепра дёргается вниз и насаживается на
    колья. Раны неглубокие, но их много, и тварь застревает. Второй удар — по голове. Ваша
    новая крыса бросается в драку, хоть толку от неё как от мыши.

    Вы вбиваете лепра в колья, как кривой гвоздь. Системные строки мелькают быстрее, чем их
    успеваешь читать. Вы — Моська, которая не лает на слона, а пытается его загрызть.

    Руки повисают. Молот падает. Бодрость — ноль.
  choices:
    - label: "Флягу! Глоток — и ещё удар"
      text: "Вы выхватываете флягу, жадно глотаете, отшвыриваете её не глядя и бьёте — рекордно, как ещё ни разу. Камень слетает с рукояти и больно катится по голени. Решётка рушится, и лепр под собственным весом насаживается на колья глубже — так, что острия выходят из спины. Он пытается отжаться от пола, дрожит — и обвисает."
      goto: lepr_win
    - label: "Достать эликсир бодрости новичка — тот самый"
      if: "item.elixir > 0"
      effects: ["item.elixir -= 1"]
      text: "Эликсир из стартовой сумки — недаром берегли. Двадцать пять бодрости, двадцать секунд. Хватает на один удар, но какой: камень слетает с рукояти, решётка рушится, и лепр насаживается на колья так глубоко, что острия выходят из спины. Он дрожит — и обвисает."
      goto: lepr_win

- id: lepr_win
  text: |
    А потом на вас обрушивается водопад сообщений. Лепр истёк кровью от ловушки. Сила +1,
    бодрость +1, призыв +1. Вы в одиночку убили монстра выше вас больше чем на тридцать
    уровней — «Безумный одиночка». В десять раз выше — «Ужас монстров», плюс две удачи. Пять
    дополнительных характеристик разом: знаток ловушек, изобретатель, плотник, охотник,
    хитрец. «Ваши деяния достойны героя!»

    И в самом конце: чудовищам подземелья нанесена смертельная обида. Такого они не прощают.
    Всегда оглядывайтесь.
  on_enter: ["var.str += 1", "var.luck += 2", "var.summon += 1"]
  choices:
    - label: "Обыскать тушу"
      text: "И тут вы бьёте себя кулаком по лбу. Осёл! Ишак! «Капкан» — вы забыли кинуть «Капкан»! Четверть шанса получить душу такой твари, и всё псу под хвост. Крыса, будто прочитав ваши мысли, испускает дух. С лепра — когти, зубы и, о ужас, язык."
      goto: sneak_up

- id: sneak_up
  text: |
    Обратно вы идёте, вжимая голову в плечи. Шахта будто вымерла: только шаги и капель со
    свода. Из провала выбираетесь осторожно, сразу за угол. Гриди сидит на своём насесте и
    ждёт, когда вы прилетите на очередное перерождение. Гномы видят в темноте хуже ррохов.

    Пусть ждёт. Сегодня вы вернулись своим ходом.
  choices:
    - label: "Спать в пустой избе"
      goto: raid

- id: raid
  text: |
    Вас будит рёв. За мутным окошком темно, снаружи крики и вспышки. Глазам рроха ночь не
    помеха, и вы видите всё. Из провала по серпантину одна за другой выбегают твари — лепры,
    и почти каждый не мельче убитого. Рушится навес Гриди. Вылетает дверь соседней избы. У
    кола твари застряли намертво: убивают сидящих без сознания гномов, те возрождаются — и
    падают снова.

    От ворот идёт процессия: три воина в сверкающих латах, за ними тощий маг с лицом
    влюблённого в себя человека, а следом босиком, в ослепительно белых подштанниках,
    семенит Гриди и орёт что-то воинственное.

    Маг швыряет огненный шар в круг у кола. Когда вы проморгались, там нет ни кола, ни
    камней — только пламя и горящие лепры.
  choices:
    - label: "Смотреть дальше из-за двери"
      goto: raid_elite

- id: raid_elite
  text: |
    — Босс! — визжит Гриди. Из провала вылезает лепр крупнее всех, кого вы видели.
    — Это не босс, тупица! — кричит маг. — Элитник, просто очень крутой. Пусть стоит во сне,
    сначала мелочь.

    Огромный лепр застывает статуей, по коже бегут голубые искры. Воины перемалывают его
    сородичей, потом наваливаются на него втроём. Он успевает очнуться и свалить одного, но
    силы неравны.

    А вы думаете о другом. Подойти к туше вам не дадут. Но тот, кто не владеет магией мёртвых,
    кристалла души просто не заметит. Он увидит его, только если кристалл окажется в руке
    специалиста.
  choices:
    - label: "Вытянуть руку и кинуть «Капкан» издалека"
      text: "Вы не уверены, что достанет на таком расстоянии, но шанс упускать глупо. Синяя полоска пустеет. Лепр рушится, воин добивает его двуручником."
      system: "Интеллект +1. Текущее значение: 3."
      goto: raid_after

- id: raid_after
  text: |
    Подходит второй отряд: гном в латах, орк-шаман в короне из перьев, две лучницы в
    обтягивающей коже. Командир хохочет, узнав, что Гриди гоняли нубские мобы, и хочет
    завалить шахты. Гриди отговаривает: гора дырявая, как сыр, у лепров сотня выходов. Один
    охранник когда-то бросал в ручей склянки с записками — одну нашли аж у Сакаша, под
    Чертовыми Пальцами.

    — Вчера они нашего рабочего убили, — встревает Гриди. — Вечером.

    Вы ждёте, пока воины закончат мародёрство, выскальзываете из избы и касаетесь
    изрубленной головы элитника. Ну же! Сегодня ваш день!
  system: "В добыче: кристалл души — дикий лепр."
  on_enter: ["item.crystal_lepr = 1"]
  choices:
    - label: "Спрятать кристалл и вернуться в избу"
      goto: morning_after
