# Глава 2. Вместилище: ник, раса, характеристики. Развилка «что если»: гном.

- id: void
  chapter: "Вместилище"
  checkpoint: true
  text: |
    Свет. Вы зажмуриваетесь — и только потом понимаете, что зажмуриваться нечем. Глаз нет. А
    свет есть.

    — Добро пожаловать во Второй Мир, лучший из трёх миров, — щебечет женский голос, живой,
    озорной, такой, что хочется немедленно познакомиться с его хозяйкой. — Желаете
    прослушать краткую историю мира?

    Голос повторяет вопрос слово в слово, с той же интонацией. Автомат. Но после
    металлических голосов клиники и автомат кажется подарком.
  choices:
    - label: "«Нет. Подключите меня как можно быстрее»"
      goto: nick
    - label: "«Давайте, только коротко»"
      text: "Голос рассказывает о трёх мирах: Первом, давно погибшем, Втором — этом, и Третьем, откуда приходят духи, ищущие вместилищ. Третий мир, как вы с опозданием соображаете, — это ваша Земля. Звучит красиво и ничего не объясняет."
      goto: nick

- id: nick
  text: |
    Из пустоты соткался голубоватый манекен и неторопливо поворачивается вокруг оси.

    — Вы — дух, ищущий вместилище. Как назовёте вместилище?
    — Евгений. Можно Женя. Друзья зовут Рос — от фамилии.
    — Аккаунт у вас рабочий, выбирать имя в нём нельзя, — сообщает голос. — Имя из
    двух частей подберёт система. Разрешено задать три первые буквы.
    — Тогда «Рос».
    — Ваше имя: Росфаматултос Негиромандуст. Сменить? У вас две попытки.

    Вы представляете эту надпись над своим самолётом. Не фотогенично.
  choices:
    - label: "«Меняйте»"
      text: "— Новое имя: Ростендрикс Потерентакс. Сменить? Осталась одна попытка."
      goto: nick2

- id: nick2
  text: |
    Ростендрикс Потерентакс. Звучит как болезнь из учебника ветеринара, но хотя бы
    выговаривается с третьего раза. Манекен терпеливо крутится.
  choices:
    - label: "«Беру этот»"
      goto: races
    - label: "«Давайте последнюю попытку»"
      text: "— Новое имя: Роскатумбрис Хлопентрапиус, — радостно объявляет голос. Вы просите вернуть предыдущее. Голос не возражает: из трёх зол второе режет слух меньше всего."
      goto: races

- id: races
  text: |
    — Ростендрикс Потерентакс, выберите расу вместилища, — продолжает голос. — Перед вами
    расы, доступные для вашего аккаунта по запросу: «приспособленные к подземному труду».

    Список жиденький, два десятка строк. Вы касаетесь первой — и манекен оплывает в
    коренастую бородатую фигурку с лицом бывалого пропойцы. Гном: много силы, крепкая
    спина, всё лучшее раскрывается под землёй. Юрист как раз советовал гнома.

    И тут поверх всего вспыхивает надпись огромными кроваво-красными готическими буквами:
    «Эксклюзивно, только сегодня: для вас открыта раса ррох».
  choices:
    - label: "Посмотреть на рроха"
      goto: rroh
    - label: "Не отвлекаться: гном, как советовал юрист"
      goto: gnome

- id: rroh
  text: |
    Манекен мгновенно становится другим: высокий, тощий, с огромной головой на тонкой шее и
    глазищами размером с блюдце. Лицо всё того же пропойцы, зато без бороды.

    Описание длинное и путаное. Ррох — житель глубоких подземелий, видит во тьме. В схватке на
    топорах смешон, зато из засады бьёт так, что не встают. Умеет ловить души побеждённых в
    кристаллы и поднимать их обратно. И последнему представителю расы, если он погибнет и
    потеряет уровень, полагается не терять очков характеристик.

    Вы понимаете из этого главное: драться — не его. Значит, ему не поможет. Зато интеллекта
    дают целую единицу. Умному человеку неприятно быть тупицей даже в игре.
  choices:
    - label: "«Беру рроха»"
      text: "— Поздравляем: отныне вы единственный ррох во Втором Мире, расу больше никто не выберет, — сообщает голос. О таком вас не предупреждали. Приз или ловушка для совсем уж безнадёжных — пока не понять."
      goto: stats
    - label: "«Нет, всё-таки гном»"
      goto: gnome

- id: gnome
  text: |
    Гном так гном. Коренастый, бородатый, с силой в плечах и спиной, созданной для мешков с
    рудой. Распределение характеристик вы проходите быстро и правильно — так, как написано
    во всех руководствах для шахтёров: сила, перенос грузов, бодрость.

    Мир встречает вас мостовой, толпой таких же гномов и биржей труда. Через сутки Джон
    находит контракт — гильдия «Великая Армада», копи на медь и олово, честная оплата,
    кормёжка три раза в день и охрана в штреках.
  on_enter: ["var.str = 26", "var.agi = 0", "set flag.gnome"]
  system: "Раса: гном. Сила: 26. Горное дело: доступно. Подходящих вакансий: 112."
  choices:
    - label: "Подписать контракт и взять кирку"
      goto: gnome_life

- id: gnome_life
  text: |
    Дни сливаются в один. Подъём, бафы, забой, вагонетка, отбой. Норма двести восемьдесят пять
    кусков, премия за перевыполнение. Вы быстро становитесь лучшим в смене: голова работает,
    и вы считаете удары точнее остальных.

    Денег хватает ровно на аккаунт и на то, чтобы тело в клинике дышало дальше. Иногда в
    общем чате мелькают красные строки о чьих-то великих подвигах, и вы читаете их, сидя на
    вагонетке, пока восстанавливается бодрость.

    Однажды в дальнем штреке кирка пробивает стенку в пещеру, где мерцает непонятный туман.
    Бригадир велит немедленно заделать дыру: не наше дело, у нас норма.
  choices:
    - label: "Заделать дыру и вернуться к норме"
      goto: end_gnome
    - label: "Заглянуть в туман одним глазом ☠"
      text: "Вы суёте голову в туман. Что-то длинное, с головой кузнечика и алебардой, смотрит на вас красными глазами — и бьёт. Гном вы крепкий, но не настолько."
      effects: ["die 'страж в тумане'"]

- id: end_gnome
  text: |
    Дыру заделывают в тот же день. Через месяц контракт продлевают, через год вас переводят на
    олово, через два — на железо. Вы честный, надёжный, хороший гном. Тело в клинике
    дышит, счета оплачены.

    Только иногда, засыпая на нарах, вы вспоминаете красную надпись про расу, которую так и
    не посмотрели. И туман в дальнем штреке. Интересно, что там было?
  ending: { id: gnome, title: "Честный гном" }

- id: stats
  text: |
    — Распределите свободные очки характеристик, — требует голос. — Без этого вместилище
    будет отторгнуто аурой мира.
    — А можно потом, уже в игре?
    — Условия вашего аккаунта этого не позволяют.

    Часики тикают. Вы снова и снова пробегаете описание рроха и цепляетесь за одну строку: за
    каждые три очка ловкости ррох получает единицу силы. Математика простая: чем больше
    ловкости, тем больше всего сразу. Смущает только бодрость — без неё, сказано, устаёшь
    от любой работы.
  choices:
    - label: "Почти всё — в ловкость, но шесть очков оторвать в бодрость"
      effects: ["var.agi = 27", "var.str = 9", "var.luck = 2", "set flag.vigor"]
      text: "Вы скрепя сердце бросаете шесть очков в бодрость. Ловкость — двадцать семь, сила — девять. Вторичные раскидываете не глядя: немного удачи, немного наблюдательности, скорость, грузы."
      goto: observers
    - label: "Всё до последнего — в ловкость: сила приложится"
      effects: ["var.agi = 33", "var.str = 11", "var.luck = 2"]
      text: "Ловкость — тридцать три, сила — одиннадцать за счёт расовой прибавки. Бодрость остаётся почти на нуле, но что там той работы. Вторичные раскидываете не глядя: немного удачи, немного наблюдательности, скорость, грузы."
      goto: observers

- id: observers
  text: |
    — Поздравляю, — говорит голос. — Перед вами распахнётся дверь в мир героев и
    невероятных возможностей.

    Где-то в дата-центре в это же время двое дежурных ругают регистратор рабочих аккаунтов:
    тот опять сходит с ума, список доступных рас скачет от двадцати строк до одной. Контакт
    окислился, решают они. Лишь бы не в нашу смену.

    А где-то ещё — непонятно где — два голоса без интонаций обсуждают только что сделанный
    выбор. Первый называет кандидата смешным и бесперспективным: его тело заперто в клетке.
    Второй возражает: у всякой клетки есть дверца, иначе в ней нет смысла.
  choices:
    - label: "Шагнуть в мир"
      goto: arbenna
