# Глава 4. Рудник Равенас: Гриди, Пуп, первая руда, первые крысы и первые смерти.

- id: mine_gate
  chapter: "Рудник Равенас"
  checkpoint: true
  text: |
    — Эй, ты! Просыпайся!

    Вы и не заметили, как заснули — прямо в трясущейся повозке. Выходит, и здесь без сна
    никак. Утро. Утоптанная до камня площадка, за спиной мрачный ельник, впереди — бревенчатый
    частокол поперёк узкого ущелья и единственные ворота, обитые ржавым железом.

    Над частоколом показывается голова в глухом шлеме. Возница Тарор торгуется с ней насчёт
    обратного груза, а на вас шлем смотрит с весёлым презрением:

    — А ты кто такой? Это я лошадь спросил, не тебя. Свежее мясо привезли! Гриди, принимай!
  choices:
    - label: "«Я ваш новый рабочий»"
      text: "— Спасибо, что пояснил, — гудит шлем. — А то я тебя за императора принял. — Знал бы он, насколько попал в точку."
      goto: gridi_meet
    - label: "Молча слезть с повозки"
      goto: gridi_meet

- id: gridi_meet
  text: |
    Ворота скрипят, и выходит плечистый гном с лицом человека, который только что съел ведро
    лимонов без сахара. Над головой — Гридиус Наппи, и вместо рабочего «червяка» у ника
    ромбик и значок, похожий на лопату в могильном холмике.

    — Ростендрикс Потерентакс, — читает он над вами. — Долго придумывал? Ладно, будешь Росом,
    червяк. Твоё согласие не спрашивают. За мной и не отставай.

    За второй, более высокой оградой ущелье раздаётся вширь, будто кратер вулкана: отвесные
    стены, одинаковые избы, две дымящие печи, а дальше дно проваливается в огромную яму.
  choices:
    - label: "Идти за Гриди"
      goto: bind

- id: bind
  text: |
    Гриди подводит вас к кругу из нетёсаных камней с невысоким колом в центре.

    — Привязывайся.

    — Зачем?

    — Затем, червяк, что если тебя привалит в шахте, ты появишься там, где начинал игру. И
    пойдёшь сюда пешком, через леса, где тебя скушают. И опять пойдёшь. А кто будет работать?
    Никто. Положи руку на кол и скажи, что хочешь сделать это место своей точкой.
  choices:
    - label: "Коснуться кола и привязаться"
      text: "Строка спрашивает, уверены ли вы. Уверены."
      system: "Точка привязки: посёлок рудника Равенас, владелец — гильдия «Сила меча». Опасная зона: высок риск нападения монстров и игроков."
      goto: gear
    - label: "«А если привязаться над пропастью?»"
      text: "— Можешь хоть в сортире привязаться, — радушно разрешает Гриди. — Тебе, ненаглядному, тут везде будут рады. — Вы вздыхаете, кладёте ладонь на кол и привязываетесь там, где все."
      system: "Точка привязки: посёлок рудника Равенас, владелец — гильдия «Сила меча». Опасная зона: высок риск нападения монстров и игроков."
      goto: gear

- id: gear
  text: |
    Вам выдают ворох тряпья и кирку. Куртка рудокопа — изношена на две трети. Кирка — урон
    по камню два-четыре, ржавчина, трещина в рукояти. Каска треснутая. Всё «новичковое», и
    всё — на последнем издыхании.

    — Авансов нет, — сообщает Гриди. — Кормёжка утром и вечером, баня вечером. Порвёшь робу —
    выдадим новую, но вычтем. Сегодня руду не примем, оформим тебя только к вечеру. Внизу
    полно бывалых шахтёров — у них и учись.

    При слове «бывалых» он нехорошо ухмыляется.
  again: "Гриди уже отвернулся: инструктаж окончен."
  choices:
    - label: "«У меня кривые характеристики. Меня вообще можно в шахту?»"
      if: "not flag.ask_stats_gridi"
      effects: ["set flag.ask_stats_gridi"]
      text: "— Твои проблемы — ты ими и занимайся, — отмахивается гном. — Кирку поднимешь? Значит, годен. Жетон с доски не забудь, гений."
    - label: "«А инструктаж?»"
      if: "not flag.ask_brief"
      effects: ["set flag.ask_brief"]
      text: "— Так я его только что провёл, — удивляется Гриди. — Всё бывает в первый раз, нуб. Запомни это. Особенно в бане, если уронишь мыло."
    - label: "Взять жетон и спуститься в провал"
      goto: descent

- id: descent
  text: |
    Узкий серпантин вьётся вниз. Навстречу орки толкают деревянные вагонетки по бороздам в
    камне, и вас для них не существует: приходится вжиматься в скалу. Внизу ещё две печи,
    мостик через ручей и чёрные дыры штолен.

    — Где найти старшего? — вежливо спрашиваете вы орка у печи.

    — Приходи вечером в барак, пятки мне почешешь — тогда скажу, — радушно отвечает зелёный
    громила. Его напарник ржёт.

    В самой большой штольне светло от факелов. Дальше, где факелы реже, глаза рроха видят и
    без них. Хоть какая-то польза от выбора.
  choices:
    - label: "Пообещать орку подумать над предложением"
      text: "— Спасибо, обдумаю, — говорите вы со всей вежливостью. Ржут уже оба. Ну хоть повеселили народ."
      goto: dwarves
    - label: "Молча пройти мимо"
      goto: dwarves

- id: dwarves
  text: |
    По звуку кирок вы находите узкий лаз. Первый гном под факелом, не оборачиваясь, велит
    свалить. Второй сидит у стены с закрытыми глазами.

    — Ну ты и урод, — сообщает он, не открывая глаз. — Небось тебя увидел мой папаша перед
    тем, как его увезли лечиться. Что за раса? Совсем нуб?

    — Совсем.

    — Не переживай, ты не первый. Меняй перса. Не можешь? Затирай. Тоже нет? Тогда бери кирку
    и руби руду. Это проще, чем в носу ковырять.
  choices:
    - label: "«Как её рубить? Я ни разу не пробовал»"
      goto: pup1

- id: pup1
  text: |
    Гном объясняет. Ходишь по выработке и смотришь на стены, пока не мелькнёт табличка. Бьёшь,
    пока кусок не отвалится. Кончилась бодрость — сиди: чем меньше двигаешься, тем быстрее
    растёт. Набил сумку — тащи к вагонетке, перекидывай всё разом. Жетон запомнит.

    — Я Рос.

    — А я просто Пуп. Иди, мне долбить пора.

    Пуп играет не с полным погружением, а с экрана: зажал клавишу — и персонаж долбит сам.
    Дешевле, говорит. На этом руднике каждая монета — удача.
  again: "Пуп долбит скалу так ровно, будто его персонаж — заводная игрушка. Отчасти так и есть."
  choices:
    - label: "«Почему у всех почти одинаковые голоса?»"
      if: "not flag.ask_voices"
      effects: ["set flag.ask_voices"]
      text: "— Ты что, с погружением играешь? — удивляется Пуп. — Зря, переплачиваешь. Мы почти все с экрана, через программу говорим, вот и голоса одни на всех."
    - label: "Пойти искать руду"
      goto: ore

- id: ore
  text: |
    Руды нет. Все стучат, а вы бродите, как слепой дурак, и не видите в скале ничего.
    Отчаявшись, начинаете водить взглядом во все стороны — и на миг выскакивает окошко:
    «Никуда не годный чёрный сланец с признаками меди. Шанс добыть кусок — семьдесят девять
    процентов».

    Вы бьёте со всей дури. Кирка высекает искры, отскакивает и бьёт вас по каске. Мир плывёт,
    вы садитесь на пятую точку.
  system: "Медному проявлению нанесено 10 единиц урона. Вам нанесена 1 единица урона."
  choices:
    - label: "Бить дальше, но осторожно"
      text: "Шесть, семь урона за удар. У проявления над табличкой полоска: тысяча сто сорок восемь из тысячи ста шестидесяти четырёх. Двести ударов на кусок. Вы стучите. Иногда кирка бьёт вхолостую, иногда снимает вдвое больше. Камень размером с кулак отваливается и бьёт по сапогу: кусок медной руды, металла три с половиной процента."
      goto: ore_tired

- id: ore_tired
  text: |
    На шестом куске руки наливаются свинцом, ноги становятся ватными, и кирка падает сама.
    Полоска бодрости пуста: все её очки куда-то испарились, вы даже не заметили. Восстанавливается
    она раздражающе медленно.

    Вы добредаете до Пупа и садитесь рядом. Пуп, к счастью, тоже выдохся.

    — Опять сто вопросов? — бурчит он. — Узнаю нуба. Сам таким был.
  extra:
    - if: "not flag.vigor"
      text: "С вашей бодростью кирки хватает куда меньше, чем на шесть кусков. Пуп смотрит на вас с жалостью."
  choices:
    - label: "Расспросить Пупа обо всём"
      goto: pup2

- id: pup2
  text: |
    Пуп отвечает обстоятельно. Вода из ручья даёт бодрость, но раз в час — носи флягу, Гриди
    продаст за цену бриллианта. Чем выше сила, тем сильнее удар; чем выше меткость, тем реже
    промахи; ловкость — к критам. Иногда вместе с медью выпадает «неожиданный ресурс»: олово,
    малахит, в теории хоть алмаз. Это уже твоё.

    — А ещё есть мобы, — говорит он. — Шкуры, когти, зубы — лут. Характеристики на них растут
    быстрее, чем на руде. Только из рудника тебя не выпустят: вдруг сбежишь с киркой. Через
    месяц привязка спадёт — убьёшься и очнёшься у ближайшего храма. Договор у «мечей»
    гнилой, так что здесь ты, считай, в рабстве.
  again: "Пуп ждёт, когда восстановится бодрость, и терпит ваши вопросы."
  choices:
    - label: "«Где тут водятся мобы?»"
      goto: far_drifts_talk
    - label: "Вернуться к руде и долбить до вечера, как все"
      if: "not flag.honest_day"
      effects: ["set flag.honest_day"]
      text: "Вы долбите, пока не стемнеет у вас в глазах, — хоть в шахте и так темно. К вечеру набирается десятка два кусков. Сила не прибавила ни сотой. Пуп сочувственно хмыкает: на меди с вашими статами вы застрянете тут навсегда."

- id: far_drifts_talk
  text: |
    — Если идти по штольне вглубь, пойдут брошенные штреки, — говорит Пуп. — Там никто не
    работает, там и бегают. Чем дальше, тем их больше, а совсем далеко такие страхолюдины,
    что убьют одним взглядом. Ночью они вылезают, иногда до самого посёлка, поэтому к вечеру шахта затихает: тварей манит стук кирок.

    — Руду долби, — советует он напоследок. — Полезнее для кошелька и здоровья.
  choices:
    - label: "Поблагодарить и уйти вглубь"
      effects: ["var.pup += 1"]
      text: "— Спасибо, Пуп. Ты первый, кто тут хоть что-то объяснил. — Гриди ты за такого не считаешь, — понимающе кивает гном. — Тот ещё вонючий скунс."
      goto: far_drifts
    - label: "Молча уйти вглубь"
      goto: far_drifts

- id: far_drifts
  text: |
    Звуки работы остаются позади, гаснет последний факел. Выработка как декорация к фильму
    ужасов: со свода свисают клочья, похожие на паутину, под ногами камни и светящиеся
    грибы твёрдостью с дубовый пень.

    И вот шевеление. Самая обыкновенная крыса — размером с собаку.
    «Шахтная крыса. Агрессивность низкая, социальность высокая». Увидев вас, она
    шмыгает в боковой штрек.
  choices:
    - label: "За ней! Штрек же кончится тупиком ☠"
      text: "Вы мчитесь следом — и резко тормозите: крыс уже три, и новые заметно крупнее. Они набрасываются разом. Одна хватает за голень, другая вгрызается в бедро — и это уже по-настоящему больно. Здесь всё настоящее, даже боль. Кровотечение, темнота."
      effects: ["die 'шахтная крыса'"]
    - label: "Не гоняться: кинуть в неё куском руды"
      goto: rat_lure

- id: rat_bargain
  text: |
    — Мне нужны фляга и кирка получше, — говорите вы, едва придя в себя.

    — А может, тебе ещё и маму мою в кружевах?

    — Она симпатичная?

    — Страшнее тебя.

    — Тогда, пожалуй, воздержусь.

    Гриди даже слегка уважительно хмыкает, но флягу не даёт: фляга денег стоит. Кирку — только
    в счёт добычи, а добычи пока нет. Вы мысленно плюёте ему в рожу и спускаетесь обратно.
  choices:
    - label: "На этот раз — без гонок"
      goto: rat_lure

- id: rat_lure
  intro:
    - if: "from == 'rat_bargain'"
      text: "В дальних штреках новая крыса находится быстро — такая же серая и наглая."
  text: |
    Крыса держится на расстоянии. Первый кусок руды пролетает мимо — и она не удирает, а
    подходит обнюхать камень. Второй попадает в лапу. Визг, волчок — и тварь летит на вас.

    Вы встречаете её ударом сверху, припав на колено, но она шарахается, и кирка входит не в
    шею, а в бок. Брызги, укус в голень, ещё удар, ещё. Челюсти разжимаются.
  system: "Шахтная крыса убита. Опыт: 10. Достижение «Первое убийство»: +1 свободное очко. В списке новое достижение — «Крысиный страх»: тысяча крыс."
  choices:
    - label: "Обыскать тушку"
      effects: ["var.str = var.str + 1"]
      text: "Брезгливо касаетесь пальцем — и видите сетку ячеек, как в своей сумке: шкурка, когти, хвост, зубы. Не сокровища, но вы забираете всё. Свободное очко уходит в силу."
      goto: soul_trap

- id: soul_trap
  text: |
    Пока здоровье восстанавливается, вы копаетесь в интерфейсе. Пассивные умения, бесполезные
    для рабочего. Активных два: «Капкан для души» за двадцать магии и «Поднять давно
    умершего» за тридцать. Магии у вас двадцать одна. Значит, пока только первое.

    Вы смотрите на крысу, что роется вдали в грибах, и жмёте «Капкан». Иконка кристалла
    мигает, синяя полоска уходит в ноль — а крыса с визгом бросается на вас. Боковым
    ударом вы сбиваете её с курса, второй ломает ей лапу, третий — точка.
  system: "Достижение «Чистая победа»: противник убит без урона, +1 стойкость. В добыче: кристалл души — шахтная крыса."
  on_enter: ["item.crystal_rat += 1"]
  choices:
    - label: "Теперь у меня есть приманка"
      goto: rat_grind

- id: rat_grind
  text: |
    Руда — крысы, руда — крысы. «Капкан» бесит грызунов так, что они сами летят навстречу.
    Иногда это слишком хорошо работает: вслед за одной разъярённой тварью из штрека
    выскакивают ещё четыре.

    Гриди в конце концов сдаётся вашему упорству: фляга — за пятьдесят крысиных шкурок (вы
    торговались с двухсот), простая кирка — в счёт добычи. С ней дело идёт быстрее, и после
    третьего куска открывается дополнительная характеристика: горное дело. В награду —
    единица интеллекта.

    Сумка тяжелеет. Перегруз: минус к скорости, минус к ловкости. А сдать руду сегодня нельзя.
  again: "Снова штрек, снова медь, снова крысиная вонь. Сумка тяжела."
  on_enter: ["set flag.ret_grind", "item.flask = 1"]
  choices:
    - label: "Ещё одна ходка, последняя ☠"
      text: "Вы склоняетесь над очередным проявлением. За спиной коротко вспыхивает красным — и всё. Ни боли, ни понимания. Только строчка о том, что вас убил шахтный демон-проказник, нанеся урона втрое больше, чем у вас было жизни."
      effects: ["set flag.ret_night", "die 'шахтный демон-проказник'"]
    - label: "Хватит на сегодня — наверх"
      goto: night1

- id: night1
  intro:
    - if: "from == 'rat_grind'"
      text: "Наверх вы выбираетесь затемно. Гриди, как всегда, торчит на своей лавке под факелом."
    - if: "from == 'respawn'"
      text: "Солнце, оказывается, давно село."
  text: |
    У ворот горит костёр. В круге
    у кола — пара гномов с остекленевшими глазами: ушли в реал прямо отсюда. Остальные
    бросили тела внизу, в штреках, — экономят время на подъём. Избы почти пустые.

    В котле для ужина нашлась бурда, которая явно уже не раз через кого-то прошла. Но голод
    грозит штрафами, и вы давитесь. Вода в бане чуть тёплая. На крыльце вы открываете свой
    прогресс: горное дело — единица с четвертью, сила подросла на сотые. Интеллект — на
    двенадцать сотых: это «Капкан».

    Магии теперь тридцать две. А «Поднять давно умершего» стоит тридцать.
  choices:
    - label: "Достать кристалл крысы и попробовать"
      effects: ["item.crystal_rat -= 1", "var.summon = 1"]
      goto: zombie_rat

- id: zombie_rat
  text: |
    Кристалл шуршит и осыпается песком. Песчинки не падают — кружатся крошечным смерчем, хотя
    ветра нет, и втягивают в себя пыль, камешки, мусор. Хлопок тьмы — и перед вами сидит
    упитанная крыса. Кожа в залысинах, одно ухо отгрызено, глаза мутные.

    Вы замахиваетесь — и опускаете кирку: крыса смотрит в никуда и не нападает.
  system: "Крыса-зомби, призванное существо, уровень 2. Достижение «Вы стали призывателем»: открыт «Призыв», получено «Малое лечение призванного»."
  choices:
    - label: "Полюбоваться творением"
      text: "Налюбоваться не выходит. Из-за угла появляется Гриди, коротко ругается и отвешивает крысе пинка. Ваше первое творение молча улетает в провал. — Тебя даже тут твари находят, нубяра, — бурчит гном. — Иди уже в дом. Мне твоя харя надоела больше тёщиной."
      goto: latrine

- id: latrine
  text: |
    — Гриди, у меня вопрос.

    — Ты, кроме вопросов, вообще что-нибудь умеешь?

    — Вопрос тебе понравится. Я здесь ел, спал, мылся и пил. А в туалет ни разу не хотелось.
    Здесь без этого обходятся?

    Гриди задумывается всерьёз. Игра сделана как реальность, говорит он, так что всё съеденное
    куда-то девается. Ходят слухи: когда в боях персонажа разрывает на куски, внутри можно
    заметить крошечную арку телепорта. Пища уходит в неё — и где-то в мире есть огромный
    нужник, всем сортирам сортир, куда валится всё это добро от сотен миллионов игроков.

    — Если и дальше будешь находить неприятности на ровном месте, — заключает он, — не
    удивлюсь, если ты и этот нужник найдёшь. Ты у нас парень талантливый.
  choices:
    - label: "Спать"
      goto: zombie_day
