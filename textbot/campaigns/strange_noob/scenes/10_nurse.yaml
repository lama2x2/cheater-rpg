# Глава 10. Нуб среди нубов: русские на дороге, ювелир Штарбонис, «Полог загадочности»,
# медсестра NurseLady и Погибший город.

- id: road
  chapter: "Нуб среди нубов"
  checkpoint: true
  text: |
    С гор спускается нуб десятого уровня в потасканных сапогах и видавшей виды кирасе, с
    простеньким луком и сумкой новичка. Сокровища — в невидимом поясе. Все заработанные
    характеристики при нём.

    Три дня вы идёте лесом, шарахаясь от каждого шороха, — и зря: никого. Знаменитый охотник
    рудника питается ягодами, а нож достаёт, только чтобы срезать полезную травку. Открывается
    «травник», за ним «путешественник». Если спросят, что вы тут делаете, — травы для алхимии.

    На четвёртый день — дорога, уже в соседней провинции Ливории. Спрятать дерево проще всего
    в лесу. Спрятаться проще всего среди нубов.
  on_enter: ["var.level = 10"]
  choices:
    - label: "Пойти по дороге направо"
      goto: russians

- id: russians
  text: |
    Час, другой — ни души, хотя дорогой явно пользуются часто. Праздник, что ли? Из-за поворота
    вылетают трое: дорогие доспехи с клановыми гербами, вычурное оружие. Ники кириллицей —
    такое вы здесь видите впервые: Челябинск-ты-суров, Нубарь111 и третий, совсем
    неприличный.

    — Гля, нубик топает! — радуется Нубарь111. — Здорово, пиндосик!
  choices:
    - label: "Крикнуть по-русски: «Мужики, я свой!»"
      text: "— Свои так не одеваются, — ржёт Челябинск-ты-суров. Молния в грудь, арбалетный болт следом. Уже из темноты вы слышите: «Тугой какой-то нуб, не лёг сразу»."
      effects: ["set flag.shouted_ru"]
      system: "Вас убил игрок Челябинск-ты-суров. Личной точки нет: вы перенесены к ближайшему алтарю светлых сил."
      goto: altar
    - label: "Молча поднять руки"
      text: "Молния бьёт в грудь, ослепляя и оглушая, следом прилетает тяжёлый болт. Уже из темноты вы слышите: «Тугой какой-то нуб, не лёг сразу»."
      system: "Вас убил игрок Челябинск-ты-суров. Личной точки нет: вы перенесены к ближайшему алтарю светлых сил."
      goto: altar

- id: altar
  text: |
    Вы приходите в себя у плоского стоячего камня, исписанного стёртыми знаками, на краю
    пшеничного поля. Алтарь деревни Сакта. Вокруг сидят и лежат два десятка игроков.

    — Опа, и этого русские приласкали! Кто тебя? Где они?

    Русские, говорят нубы, режут всех, как тараканы набежали. В Раллии их ещё больше: война из-за
    того нуба, что взял пачку достижений. Добравшийся до алтаря гном в дымящихся доспехах
    называет врага: клан «Партизаны», лесная рейд-группа. Маг-электрик, баферы прыгают по
    деревьям, как ниндзя. А потом добавляет: говорят, тот нуб тоже русский. Русские пришли
    его вытаскивать.
  again: "У алтаря всё те же нубы обсуждают русских и дожидаются, кто кого."
  extra:
    - if: "flag.shouted_ru"
      text: "Хорошо, что никто тут не слышал, на каком языке вы кричали на дороге."
  choices:
    - label: "Сходить с одним из нубов в деревню, к торговцу"
      goto: ans

- id: ans
  text: |
    Попутчика зовут ANSVT, можно просто Анс. Он ворчит на ваш ник: лучников-Джонов столько, что пришлось цифру приписывать. «Меня и в жизни так зовут». С девушкой Анс познакомился здесь, в игре, и
    какая она в реале — ему всё равно: здесь она лучше всех.

    По единственной улице деревни шагает отряд в три шеренги, со знаменем и барабанами,
    отбивающими что-то вроде джаза. «Чёрная братва», говорит Анс. Крутые. Хана русским.

    У крыльца лавки сидит в позе лотоса алхимик десятого уровня с бутылочками. Анс сворачивает к
    нему, а вы поднимаетесь по ступенькам.
  choices:
    - label: "Зайти в лавку"
      goto: shhor

- id: shhor
  text: |
    — Закрывай дверь! Сквозняки мне тут не нужны!

    Торговец Шхор — непись с кислым лицом — отпускает девочке-неписи катушки ниток, требуя
    доплатить двенадцать медяков. Неписи торгуют друг с другом так же, как с игроками. Ни
    эликсиров, ни алхимических наборов у него нет, а за потасканную сумку на тридцать мест,
    тетиву и кусок ткани он заламывает восемьдесят серебрушек.

    — За такие деньги легендарки продают!

    — Вот и ступай к тем, кто продаёт…

    Тут Шхор осекается, вглядывается в ваше лицо и сокрушённо качает головой:

    — Совсем мухи окна засидели, не признал я вас. Что ж вы сразу не представились? Винца?
  choices:
    - label: "Принять скидку и не задавать лишних вопросов"
      goto: shhor_kind

- id: shhor_kind
  text: |
    Всё — за двадцать четыре серебрушки, а перчатку племянника отдаст вечером даром. Ночлег —
    на террасе или на сеновале, молоко лучшее в деревне. Неписи, похоже, как-то видят ваши
    достижения. Интересно, могут ли они выдать вас игрокам?

    Учителей в деревне, вздыхает Шхор, нет. Разве что недавно поселился старичок, пчёл
    разводит. Как-то они распили вина да медовухи, и старый проболтался: бывший королевский
    ювелир. Глазами ослаб, ушёл на покой в глушь.

    — Отнесите ему бутылочку от меня. Может, подобреет.
  on_enter: ["var.silver -= 24"]
  choices:
    - label: "Пойти к старику с бутылкой"
      goto: starbonis

- id: starbonis
  text: |
    Забор у старика глухой и высокий, как у крепости. На третий стук калитка приоткрывается:
    существо неопределённой расы, ростом с гнома, с плечами вдвое шире, серой кожей и длинными
    волосатыми ушами. Мастер Йода, только сердитый. Тощая рука требовательно тянется к бутылке.

    — Штарбонис я. Чего тебе, нахал мелкий?

    — Разговор о вашем прошлом. Старухи напротив уже уши греют.

    — Чтоб они погорели вместе с ушами. Заходи.

    В доме всё просто и чисто до последней пылинки. Проблем у него нет, говорит старик, ему
    тут хорошо. Но вы разбередили душу. Огранщиком он был не последним, камнем жил. А раз
    разбередили — заглаживайте: тысяча камней двенадцати видов на этом столе к утру. И
    горным хрусталём не отделаться.
  choices:
    - label: "«Зачем ждать утра?» — и открыть шахтёрскую сумку"
      goto: gems

- id: gems
  text: |
    Вы опустошаете ячейку за ячейкой, по двести пятьдесят камней в каждой. Только бы выдержали стол и стариковское сердце: челюсть у него отвисает ниже пола, а вы ещё только начали.

    Штарбонис запирает дверь на засов, задёргивает занавеску, зажигает лампу от пальца и долго
    молча смотрит, как в жёлтом свете переливается груда.

    — Пять тысяч восемьсот сорок два камня шестнадцати видов, — произносит он наконец. — У тебя, внучок, не сумка — казна королевская. Чаю?

    «Внучок» — хороший признак.
  choices:
    - label: "«Вы видите, кто я на самом деле?»"
      goto: starbonis_teach

- id: starbonis_teach
  text: |
    — Вижу. И что расу скрыл — тоже. Из ваших, нынешних, вряд ли кто углядит, а из старого
    народа умельцы найдутся. Выучи «Полог загадочности» в гильдии магов: никому не нужное
    заклинание, а тебе в самый раз.

    Ювелирное дело без огранки, говорит он, — как нитка без иголки: учить будет обоим. И не повторяй моих ошибок, говорит, — освой зачарование. Инструмент не дам: работать
    будешь магией.

    На стол ложатся две толстые книги: «О душе камня и её освобождении» и «Ювелирная магия для упрямых». Читать здесь, за один присест, не вставая.
  choices:
    - label: "Читать всю ночь, не вставая"
      goto: jeweler
    - label: "Сначала расспросить, почему он ушёл из столицы"
      if: "not flag.ask_starb"
      effects: ["set flag.ask_starb"]
      text: "— Глаза ослабли, — коротко отвечает старик. — И устал. А ещё там слишком много желающих, чтобы старый мастер работал только на них. Здесь пчёлы. Пчёлы ничего не требуют. Читай давай."

- id: jeweler
  text: |
    Диаграммы, углы граней, способы огранки. Посреди книги заглядывает старик: снаружи бегают
    чёрные люди, некоторые в одном исподнем, и орут такое, чего даже он не слыхал. Это
    «братва» нашла русских — точнее, русские дали себя найти. Деревенский пропойца ходит
    за ними и запоминает каждое слово.

    К полудню вы закрываете вторую книгу и потягиваетесь, как проснувшийся кот.

    — Вижу, не обманываешь, — говорит Штарбонис.
  system: "Новые характеристики: ювелир, огранщик, магический преобразователь — и, по свойствам вашего персонажа, сразу по шесть единиц."
  choices:
    - label: "Поблагодарить и обещать молчать о нём"
      text: "— Ни одной живой душе про меня не рассказывай, — напутствует старик у калитки. — Я тебе помог. Не забывай."
      goto: cutting

- id: cutting
  text: |
    На сеновале у Шхора вы гранёте камни, пока не кончается магия: около двухсот, четверть —
    в песок. Хороший камень на форуме — три-четыре золотых, отличный — больше десятка. По
    дороге к городу Пегуру вы пробуете то же на руде: сжимаете кусок меди, представляете
    металл — и в ладони остаётся маленький слиток. Знаток металла, литейщик, металлург,
    рудознатец. И акробатика: оказывается, игроки прыгают при ходьбе не просто так.

    В плечо прилетает стрела. Пузатый гном с красноватым ником стреляет с опушки из
    плохонького лука, мажет раз за разом и с воплем бросается врукопашную с дубиной.
  choices:
    - label: "«Ты смешной!» — и «Стрелой Хаоса»"
      text: "Сто шестьдесят девять урона, две трети его жизни. Гном с проклятиями удирает в лес — и добегает до своей точки перерождения уже покойником: стрела догоняет. Его дешёвые вещи вы раскидываете в траве вдоль дороги. Тайники."
      goto: glavulin

- id: glavulin
  text: |
    Мигает приват. Гном Главулин Атронастархум очнулся и жаждет общения:

    — Тронешь вещи — пожалеешь!

    — Поздно, я уже тронул.

    — Урод! Я тебя в реале найду!

    Гном с луком: у этой расы к стрельбе ни одного бонуса. Наверное, тоже не читал гайдов. Через
    час от вас безуспешно гоняются ещё трое красных; потом маг одной банды останавливает вас
    на месте, и спасает только «Стрела» по ногам набегающим воинам.
  choices:
    - label: "Ответить: «С нетерпением жду» — и в игнор"
      text: "— С нетерпением жду. И спасибо за вещи, — пишете вы и добавляете гнома в список игнорируемых. Всё, что он хотел сказать, он уже сказал."
      goto: pegur
    - label: "Ничего не отвечать — сразу в игнор"
      goto: pegur

- id: pegur
  text: |
    К воротам Пегура вы прибегаете на остатках бодрости. Стражи шестеро и маг-непись: «война
    идёт, имена записываем». Маг проводит ладонью над вашей головой и приподнимает бровь:

    — Вы очень странный человек. Для героя у вас странное имя.

    — А девушке моей нравится.

    Его долгий взгляд в спину вам не нравится.

    Камни уходят в гильдии ювелиров и ремесленников: интенданты чуть не дерутся. Шесть с
    половиной тысяч серебром. У гильдии магов, едва вы ступаете на лестницу, вас обступают трое
    высокоуровневых.

    — Пати прими! Мы тебя бафнем.
  on_enter: ["var.silver += 6500"]
  choices:
    - label: "«Не нужен мне ваш баф» — и вверх по лестнице"
      goto: errou

- id: errou
  text: |
    — Совсем разум потерял? Бегом пати, или в чёрный список захотел?

    — Засунь его себе куда-нибудь.

    Грубая рука хватает за плечо, вы выворачиваетесь, и страж наверху строго спрашивает,
    мешают ли вам эти люди.

    — Пристали прямо на лестнице. Ненормальные какие-то.

    Errou, клан «J-P». Те самые «джапы». Вломиться в гильдию, полную неписей, втроём они не
    рискнут — будут ждать. Телепортироваться из здания нельзя. Выйти, выйти из игры или
    убиться — вот всё, что вам оставляют. Внутри вас колотит.
  choices:
    - label: "Найти кабинет с «Пологом загадочности»"
      goto: polog

- id: polog
  text: |
    — Мне нужен «Полог загадочности»!

    — Потише, молодой человек, — морщится сухонький старичок-непись. — Квитанцию.

    — Какую квитанцию?!

    — Умения бесплатно не раздаём. Касса у выхода.

    Девятьсот восемьдесят гиней, квитанция, белоснежный свиток с розовой ленточкой.

    — А корешок?! — кричит старичок вслед.

    — Повесьте на гвоздик в уборной!

    Заклинание прячет вашу сущность от тех, чей уровень меньше половины вашего интеллекта. По
    дороге вы покупаете у эльфийки её кокетливую шапочку — «для подруги». На втором этаже, за
    статуей героя в развевающемся плаще, можно спрятать корову. Вас — тем более.
  on_enter: ["item.polog = 1", "var.silver -= 1000"]
  choices:
    - label: "«Чистый лист» — и на этот раз без стеснения"
      goto: nurse

- id: nurse
  text: |
    Интеллект — до шестисот с поясом: теперь даже китаец с трёхсотым уровнем ничего лишнего
    не увидит. Облик — флайтинг, раса поддержки, отрядная аптечка, которой мало кто хочет
    играть. «Изменить пол персонажа?» Служебный функционал, тест на сто дней. Говорят, сыграть
    персонажем не своего пола невозможно. После такого вас перестанут подозревать совсем.

    Маленькая, болезненно-хрупкая, черноволосая девочка-подросток, босиком, в кирасе из
    пластин коры с юбкой из того же материала. Значок «внешность как в реале». Голосок —
    почти комариный писк. Ник — NurseLady.

    В гильдию входил светлый эльф. Больше его никто никогда не видел. Выходит из неё NurseLady.
  on_enter: ["var.level = 14"]
  choices:
    - label: "Спуститься по лестнице к «джапам»"
      goto: jp_check

- id: jp_check
  text: |
    Внизу шеренга «J-P»: «Идёт розыск. Всем принять пати и открыть характеристики, иначе — чёрный список». Приглашение прилетает и вам. Вы принимаете его с растерянным видом
    школьницы, которая не понимает, что происходит.

    «Вы были изгнаны из отряда».

    — Девчонок-то зачем дёргаешь, балбес?

    — Рука сама нажала… Эй, ты! Некр! Пати принимай!

    Никому и в голову не приходит, что маскироваться можно настолько радикально. Вы
    покупаете свитки бафов и малое лечение — для достоверности, — сбываете медь кузнецам и
    уезжаете из города на телеге крестьянского каравана. Флайтингам, говорит старший
    возчик, у нас всегда рады.
  choices:
    - label: "Ехать до деревни Айпа"
      goto: aipa

- id: aipa
  text: |
    На рассвете возница высаживает вас у развилки и советует не ходить в Айпу: там был большой
    город, его засыпало, когда маги делили стихии, а жители… умерли, но не совсем.
    Восставшие мертвецы — ровно то, что вам надо: здесь качаются с двенадцатого по
    двадцать пятый.

    Айпа — столица нубов. Толпы бегают, ругаются, торгуют хламом втридорога. Едва вы
    доходите до первого дома, загорается приват с сердечками и розой. Потом «Добавь в друзья».
    Потом — такое, что лучше не читать. Значок «как в реале» действует на людей сильнее
    любой красоты.

    В чате — «Танк двадцать третьего уровня соберёт пати в Погибший город, особенно нужен
    хилер!»
  choices:
    - label: "Написать танку: «Бафер-флайтинг, четырнадцатый, хил есть»"
      goto: party

- id: party
  text: |
    Лидер — гном Барри Бар, болтливый танк. Эльфийка-лучница МалышкаСекси79 — ник вполне
    предсказуемый. И Маррак: зелёный, почти карлик, с руками до колен, гоблин-полукровка с
    двумя кинжалами. Ещё у холма добирают Сатитанкура, воина пятнадцатого уровня в тряпье и с
    зазубренным мечом.

    — Нурся, бафы выучены? — Барри разглядывает значок у вашего ника. — Блин, образ реальный.
    Тебе сколько лет-то? Не люблю ходить с детьми. Сагришь мобов на себя — выкину из пати.

    Маррак требует честной делёжки лута, Барри ставит «случайное распределение». Смешно:
    у вас в сумках хватит скупить пол-Айпы, а вы участвуете в споре о добыче из нубских
    мобов.
  choices:
    - label: "Повесить на всех бафы и встать сзади"
      goto: mummies

- id: mummies
  text: |
    Холм весь в чёрных норах. Барри ведёт отряд мимо всех в свою, «классную»: длинный коридор
    без ответвлений, сзади никто не зайдёт. Мумии мелких гоблинов с дубинками выскакивают
    стайками. Барри ловит их на щит, Маррак добивает в спины.

    Потом гном приводит на хвосте целую орду и орёт:

    — Хил мне! Хи-и-ил!

    Вы бросаете лечение — и двое мертвецов, оставив гнома, бросаются к лекарю.

    — Тикай, Нурся!
  choices:
    - label: "Встретить первого посохом по лбу, второму — подножку"
      text: "Первый садится на пятую точку, второй катится по полу. Вы бросаете лечение на гнома, а Маррак, не отвлекаясь на общую кучу, уже бежит вам на помощь."
      effects: ["var.marrak += 1"]
      goto: mummies2
    - label: "Убежать за спину Маррака, как велел Барри"
      text: "Вы отскакиваете за Маррака, и тот принимает обоих на кинжалы. Лечить его приходится непрерывно."
      goto: mummies2

- id: mummies2
  text: |
    Из мрака вываливается орава побольше, и все как один огибают гнома: лекарь важнее. В
    принципе они правы. Маррак смотрит на далёкий выход, на набегающих мобов и бросает:

    — Беги, Нурся. Я их задержу.

    Он крутится зелёной юлой, цепляя кинжалами каждого, и мумии наваливаются на него. Хил, хил,
    хил. Жизнь Маррака скачет от минимума до верха. Барри орёт «Хил!», хотя не потерял и
    четверти. Малышка, взвизгнув «извини!», попадает гному в спину. Иконка Сатитанкура
    становится серой: его сложили в два удара.
  choices:
    - label: "«Заткнись, Барри! Он танчит, а не ты!»"
      text: "Барри наконец соображает, что без помощи кинжальщику хила ему не видать, и вдвоём они вырезают мумий одну за другой. Маррак дерётся одной рукой — вторая висит плетью."
      goto: marrak_warn
    - label: "Молча держать Маррака лечением"
      text: "Вы держите полоску Маррака наверху, пока Барри не понимает сам: если не помочь кинжальщику, лечить будет некого. Маррак дерётся одной рукой — вторая висит плетью."
      goto: marrak_warn

- id: marrak_warn
  text: |
    — Ты чего меня не хилила?! — ревёт гном.

    — Притухни, — устало говорит Маррак. — Нормально она лечит. Лучше всех, кого я видел. Всех вытянула.

    У деревни Малышка уходит к знакомым, Барри зовёт вас завтра снова в пати. А Маррак
    тихо говорит:

    — Не ходи с ним больше. В конце он специально сбросил мобов на тебя. Браслет у тебя
    непростой, и маны слишком много для твоих статов. Будет уговаривать привязаться у входа —
    чтобы валить тебя раз за разом, пока не выпадет. Такое нам часто устраивают.
  choices:
    - label: "«Спасибо, Маррак. Если что — позову»"
      effects: ["var.marrak += 1"]
      text: "— Позови, — кивает полугоблин. — Ты очень хороший бафер. — И уходит, ссутулившись. Надо же: и у нубов свои интриги."
      goto: night_solo
    - label: "Кивнуть и проводить его взглядом"
      goto: night_solo

- id: night_solo
  text: |
    Ночью в Погибшем городе живых нет: эти часы принадлежат тварям из нижних ярусов. Но
    сегодня по норам спускается одна маленькая флайтинг. Не совсем одна.

    «Восставший тильбит-командир. Уровень 52». Кристалл из подземелья Хаоса. Для нор, где
    мобы редко выше двадцать пятого, — чума. Ночью снизу лезут тридцатые, сороковые, иногда
    элитники за пятьдесят — тогда приходится лечить питомца без перерыва. В остальное время
    вы качаете «Стрелу Хаоса». И открытие: бафы можно вешать на пета, и они тоже растут.

    К рассвету у вас двадцать седьмой уровень. Хватит, чтобы надеть простенький посох
    тильбита-мага. А дальше — дорога, город за городом. Флайтинга должны запомнить везде.
  on_enter: ["var.level = 27", "var.summon += 1"]
  choices:
    - label: "Уйти от Айпы прочь, пока все спят"
      goto: bug
