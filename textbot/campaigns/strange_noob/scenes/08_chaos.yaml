# Глава 8. Червоточина: подземелье Хаоса, тильбиты, баррикада, семь ярусов и Наместник.

- id: waterfall
  chapter: "Червоточина"
  checkpoint: true
  text: |
    К выходу вы добираетесь через день. По дороге ещё один теневик откусывает вам ухо —
    отрастает за полтора часа, а заодно открывается регенерация. Сила наконец доходит до
    долгожданных двадцати. Свод в последней пещере чёрный от летучих мышей.

    А потом — солнце. Вы стоите на крошечном уступе и моргаете. Река с рёвом падает с высоты
    небоскрёба, внизу клубится водяная пыль, а до горизонта тянется лесистая равнина. Всё
    как на карте. Только тропа вниз такая, что и обезьяна сломает ногу: то ли обвал, то ли
    картограф поскромничал.

    На карте рядом с водопадом есть ещё одна пометка, похожая на подкову: «Червоточина».
  on_enter: ["var.str = 20"]
  choices:
    - label: "Поискать «Червоточину»"
      goto: arch

- id: arch
  text: |
    Узкая расщелина под пластом мха, сырой проход, где лепр едва протискивается. Потом
    коридор — и зал, стены которого затянуты светящимся мхом, а пол идеально ровный и сухой.
    В одной стене — арка в три человеческих роста. За ней клубится непроглядный туман, и в нём
    изредка вспыхивают огоньки.

    Вы подходите ближе, и перед глазами разворачивается предупреждение. Червоточина —
    место, где силы Хаоса проторили путь во Второй Мир. Шагнёте внутрь — дверь закроется:
    выйти можно, лишь победив всех созданий Хаоса или погибнув. Первооткрывателю — повышенный
    шанс на ценные вещи. Рекомендуется: не меньше десяти товарищей не ниже сорок пятого
    уровня.
  choices:
    - label: "Сесть на пол и подумать"
      goto: arch_think

- id: arch_think
  text: |
    Это то самое, о чём рассказывал Пуп. Логово, которое кланы искали в этих горах и не нашли.
    За туманом — сильные монстры, боссы, смерть, слава и богатство. Одиночке там делать
    нечего.

    Но вы и не совсем одиночка. А у входа, если игра взяла от предшественников лучшее, должна
    быть безопасная зона. В худшем случае просидите там, пока не спадёт привязка у кола Гриди,
    — и убьётесь. Через юриста снять замок и вернуться потом? Без лепра это бессмысленно. А
    подземелье за это время может найти кто-то другой.
  extra:
    - if: "deaths >= 3"
      text: "Умирать вы уже привыкли. Но умирать сейчас — значит очнуться у кола, где ждёт одетый и очень злой Гриди."
  choices:
    - label: "Шагнуть в туман"
      goto: chaos_in

- id: chaos_in
  text: |
    Злых мобов за туманом нет. Есть такой же зал, только без мха, а у стены — опрокинутая
    вагонетка без колёс. Подземелье похоже на шахту: штольня уходит вглубь, и далеко впереди
    горит одинокий факел.

    — Красавчик, мы пока что живём, — шепчете вы.

    Лепр выглядит обеспокоенным.
  system: "Подземелье закрыто: подкреплений не будет. Получено звание «Первооткрыватель источника Хаоса». Прибавка: по единице к наблюдательности, тайным знаниям и сущности вещей."
  choices:
    - label: "Красться к факелу"
      goto: tilbit_first

- id: tilbit_first
  text: |
    Под факелом на перекрёстке прохаживается существо с телом человека и головой кузнечика.
    Красные глаза, короткий чёрный плащ, алебарда. «Неизвестное существо, порождение сил
    Хаоса». Информация горит красным.

    — Красавчик, оглушить. Потом души.

    «Кузнечик» застывает в волне искр, лапы лепра смыкаются на его шее, что-то хрустит. Тварь
    полосует лепра роговыми шипами на запястьях, но здоровье питомца только вздрагивает. Вы
    мечете пику, потом заходите со спины с киркой.
  system: "Тильбит-стражник убит. Вы открыли существо, которого нет в мировом бестиарии: открыта характеристика «знаток монстров»."
  choices:
    - label: "Дальше по штольне"
      goto: tilbit_rush

- id: tilbit_rush
  text: |
    На каждом перекрёстке — один-три стража, в штреках — до дюжины разведчиков и лучников.
    Двое разведчиков в тупике и вовсе играют в кости: никакой дисциплины. Стрела, прилетевшая
    из темноты, впервые учит вас бегать зигзагом. За каждого нового тильбита бестиарий дарит
    что-нибудь: бодрость, ловкость, жизнь.

    В штреках — аметисты, но не мутные, а насыщенно-сиреневые, необычайной чистоты. Здесь не
    только мобы богатые, но и ресурсы. Сорок тильбитов за час, каждый раз в тридцать выше
    крысы. Уровни не растут — растут характеристики.

    К вечеру подкашиваются ноги, и на очередном перекрёстке ждёт новое: тильбит-командир в
    надраенной кирасе и два мечника.
  on_enter: ["var.str += 2", "var.agi += 1"]
  choices:
    - label: "Оглушение, удары по всем трём — и душить по очереди"
      text: "Стандартный сценарий срабатывает и тут. Новые бестиарные открытия, «Исследователь монстров» закрыт, открыт «знаток ядов». А потом из штрека валит целая толпа, и становится не до наград."
      goto: arrow

- id: arrow
  text: |
    Наутро, на очередном штреке, сыплются странные строки. Закрыт «Рок великанов». И ещё одно:
    «Закрыто достижение: ошибка базы достижений. Бонус: уникальное умение — Стрела Хаоса». А
    новое открытое достижение называется так же — «ошибка базы», и награда за него —
    «ошибка базы».

    Описание умения: сгусток первичного Хаоса, бьёт в цель, игнорирует любую защиту,
    тратит магию и ярость — ту самую жёлтую полоску, с которой вы так и не разобрались. Растёт
    с использованием, потом превращается в «Копьё Хаоса». Носитель может быть только один.

    Где-то в дата-центре в это время ведущий разработчик кричит на дежурных: после пожара
    управляющий искин не запускается. Носители целы — а искина нет.
  choices:
    - label: "Идти туда, где впереди разгорается свет"
      goto: camp

- id: camp
  text: |
    Штольня выводит в огромный зал. Посредине — провал, уменьшенная копия того, что на руднике
    Равенас, с серпантином вниз. По краю стоят палатки из зелёного брезента, у костров
    сидят тильбиты, один подкармливает огонь досками от вагонеток. Потолка нет — только
    туманное марево.

    Тильбитов двадцать пять. Если кинутся разом — вам не жить: хватит одного, который
    побежит не на лепра, а на вас.
  choices:
    - label: "Отползти назад: «А не податься ли нам в революционеры на баррикадах?»"
      goto: barricade
    - label: "Ударить в лоб — Красавчик всех разметает ☠"
      text: "Красавчик врезается в толпу, и первые тильбиты летят в стороны. Но их слишком много, и пятеро бегут не на него, а на вас. Последнее, что вы видите, — алебарда, а за ней туман вместо неба. Тело падает за дверью, которая не откроется."
      effects: ["set flag.chaos_dead", "die 'тильбиты в лагере'"]

- id: barricade
  text: |
    Вагонетки старые, иные рассыпаются от касания, но в дело идёт всё. Самое тяжёлое таскает
    лепр. Вы вытёсываете ножом колья из расколотых досок и ставите их на гребень. Так себе
    преграда, но лучше, чем никакой.

    Потом подкрадываетесь к лагерю и выбираете почётного первого испытателя — разведчика у
    ближайшего костра. Наводите руку. Из ладони срывается чернильно-чёрный сгусток и
    вытягивается на лету в тончайшее веретено.
  system: "Урон по тильбиту-разведчику: 37."
  choices:
    - label: "Бежать к баррикаде зигзагом"
      text: "Тридцать семь! Киркой вы выбивали восемь. Об этом вы думаете уже на бегу, под хоровое цоканье. Стрелы свистят мимо: с ловкостью у вас лучше, чем у них с меткостью."
      goto: barricade_fight

- id: barricade_fight
  text: |
    — Красавчик! Встань в проход! Бей с ходу! Не уходи с места!

    Лепр перекрывает проход телом. Первый разведчик отлетает, за ним накатывает толпа.

    — Паника!

    Почти все в ужасе разбегаются, двое остаются драться. Возвращаются — «Оглушение!» — и
    застывают, а те, что пытались пролезть у лепра между ног, знакомятся с его когтями.
    Но потом полоска жизни Красавчика вдруг проседает на десятую часть. Сразу. И ещё раз. Из-за
    его спины не видно, кто так бьёт.
  choices:
    - label: "Лечить, лечить, лечить"
      if: "not flag.heal_spam"
      effects: ["set flag.heal_spam"]
      text: "Вы бросаете лечение раз, другой, третий. Лепр грызёт врага, восполняя себе жизнь, — а полоска всё равно ниже прежнего. Так вы проиграете. Надо увидеть, кто бьёт."
    - label: "Забраться на баррикаду и посмотреть"
      goto: tilbit_mage

- id: tilbit_mage
  text: |
    За толпой, в кольце лучников, стоит тильбит выше командиров. На голове — что-то вроде
    вороньего гнезда из проволоки, утыканного гвоздями, серое пончо до земли, белый посох с
    синими огоньками. Он взмахивает посохом, и в лепра через головы своих летит сочный
    зеленовато-серый плевок. Жизнь Красавчика проваливается до середины.

    Маг. Маги — это зло.
  choices:
    - label: "«Стрела Хаоса» — в мага"
      goto: mage_duel

- id: mage_duel
  text: |
    Тридцать четыре урона, и маг мгновенно теряет интерес к лепру. Вы едва успеваете
    пригнуться: «плевок» шелестит над головой. Три лечения на пета подряд. Над гребнем
    баррикады показывается голова мага — шапка набекрень, в левом глазу торчит ваш кол.

    Вы, не раздумывая, втыкаете пику в уцелевший глаз. Крит: ослепление. Маг начинает
    поливать «плевками» всё вокруг, попадая по своим. Брызги кислоты обжигают вам щёку.

    — Красавчик! Хватай этого! Ломай ему лапы! Души мага!
  choices:
    - label: "Слить всю магию на лечение и добивать мелочь киркой"
      goto: mage_loot

- id: mage_loot
  text: |
    Маг умирает последним: когда лепр, разделавшись с мелочью, пускает в ход обе лапы. Системная
    лавина — сила, интеллект, стойкость, атака, сила мысли сразу на две, призыв — на две.

    Тильбит-маг — не рядовой элитник, а что-то вроде «босика». С него — костяной посох,
    танталовый браслет и золотое кольцо. Вещи одного набора, вместе дают прибавку. Кольцо без
    требований вы тут же надеваете. Посох на тридцать восьмой уровень в руках нулевки
    бесполезен: штрафы съедают всё.

    Лепр с торчащими из спины стрелами похож на ежа-переростка. Стрелы вы вынимаете сами.
  on_enter: ["var.str = 27", "var.summon = 15"]
  choices:
    - label: "Спуститься по серпантину ниже"
      goto: levels

- id: levels
  text: |
    Вы ошиблись, решив, что подземелье кончилось. Ярусов семь. Чистить их приходится
    одиннадцать дней. На втором дежурят маги с командирами, в тупике — рейдеры с широкими
    саблями. На третьем вместо лучников — арбалетчики, по сотне урона за выстрел. На
    четвёртом стихийник, на пятом двое убийц — одного перехватил лепр, второй оставил вам
    сто четырнадцать жизни. На шестом архимаг, и на нём у Красавчика поднимается уровень. Вы
    и не знали, что питомцы растут.

    На нижнем ярусе — озерцо чистейшей воды. Мясо Шото всё ещё не кончилось: орк тогда
    набил сумку от души. Тильбитов есть не тянет совсем.

    Ещё одна «ошибка базы» дарит «Ауру Хаоса» и четыре странные характеристики: общая память,
    познаватель, провидец, мудрец.
  on_enter: ["var.str = 37", "var.agi = var.agi + 10", "var.summon = 19"]
  choices:
    - label: "Пройти в последний зал"
      goto: boss

- id: boss
  text: |
    «Наместник сил Хаоса Тратказир Первый». Первое именное существо в вашем бестиарии, и
    награду дают за один взгляд. Неспроста.

    Он сидит в дальнем конце овального зала на огромном барабане, обитом красным. К нему через
    колоннаду из исполинских сталактитов тянется красная ковровая дорожка. Свет волнами
    идёт от стены за его спиной. Даже сидя, он ростом под три метра, и рядом с ним лепр
    выглядит щенком.

    Наместник поворачивает голову к входу и что-то насмешливо стрекочет. Вас давно заметили.

    Тридцать дней прошли, привязка у кола Гриди спала. Умрёте здесь — очнётесь у какого-нибудь
    храма далеко отсюда. Без лепра. Уйти? Не за тем вы сюда шли.
  choices:
    - label: "«Ну, Красавчик, я в тебя верю. Вперёд! Оглушение!»"
      goto: boss_fight

- id: boss_fight
  text: |
    Наместник, не вставая, небрежно машет рукой. Воздух перед ним сгущается в кисельный ком и
    бьёт лепра в грудь. Красавчик отлетает на несколько шагов, теряет десятую часть жизни.
    Встаёт — и снова катится по дорожке.

    Начнёте лечить — босс заметит вас. Вы, может, выдержите один такой удар. Второй — нет.
  choices:
    - label: "«Стрелу Хаоса» в босса — и за сталактит"
      text: "Тридцать шесть урона. Вы отпрыгиваете за каменную сосульку, и она дрожит, как от отбойного молотка. Ещё удар. Сталактит кренится, вы перебегаете за следующий. Босс встаёт с барабана и неспешно идёт к вам. И тут Красавчик, очнувшись, нападает на него сзади, по-подлому, и по привычке пытается задушить."
      goto: boss_grip
    - label: "Лечить Красавчика из-за колонны"
      text: "Вы бросаете лечение из-за сталактита — и Наместник тут же поворачивается к вам. Каменная сосулька содрогается от его ударов, сыплется крошка. Но это и нужно: пока он ломает колонну, лепр подбирается сзади и вцепляется ему в шею, по привычке пытаясь задушить."
      goto: boss_grip

- id: boss_grip
  text: |
    Шея у Наместника толщиной с бревно: душить его — что обнимать дуб. Но лепр держится одной
    лапой, другой рвёт, а пастью грызёт — и вампиризм тянет жизнь из босса в питомца.
    Наместник пятится и бьёт лепра о сталактит. Ещё раз. Красавчик висит, как клещ.

    Потом босс тонко свистит, и от него по полу расходится волна вздыбленного камня. Вас
    сбивает с ног, булыжник бьёт по спине, другой — по голове. «Вы дезориентированы, чтение
    заклинаний вдвое медленнее».
  choices:
    - label: "Эликсир — себе, лечение — ему. «Каменная кожа!»"
      goto: boss_fire
    - label: "«Не души — рви его!» И лечить, лечить"
      goto: boss_fire

- id: boss_fire
  text: |
    Каменную кожу лепр перенял у одного из магов — она перезаряжается так долго, что в бою её
    хватает один раз. Сейчас самое время. Жизнь Красавчика снова ползёт вверх, а у босса —
    вниз: пятнадцать процентов, десять…

    Наместник воет почти человеческим голосом. Воздух мерцает, дышит жаром — и от него
    расходятся огненные круги. Вспыхивает ковровая дорожка, вспыхивает барабан. Вас задевает
    краем, и боль такая, что подобные игры следовало бы запретить ещё до выхода. В центре,
    где катаются два сцепившихся тела, пламя ревёт, как голодный тигр.

    «Призванное существо погибло».
  choices:
    - label: "Выглянуть из-за камня"
      goto: boss_end

- id: boss_end
  text: |
    Пол дрожит. Сцепившись, босс и лепр кувыркались по залу, задевая сталактит за
    сталактитом, и те, подточенные магией Наместника, падали один за другим. Последний решил
    упасть, когда босс выбирался из-под обгорелого тела Красавчика. И снёс Наместнику
    верхушку черепа.

    Тварь ворочается под каменной глыбой. Жизни — меньше процента. Вы подходите, волоча
    раненую ногу, вынимаете из сумки свою мирную шахтёрскую кирку, суёте её в разверстый
    череп и крутите, как насадку миксера.
  system: "Наместник сил Хаоса Тратказир Первый убит."
  choices:
    - label: "Сесть рядом с тем, что осталось от Красавчика"
      goto: legend

- id: legend
  text: |
    У вас сорок шесть жизни и пустота внутри. Вы победили — и не можете обрадоваться. Слишком
    долго под землёй. И жалко лепра почти до слёз: привязались к набору цифр.

    «Сбой базы данных. Объединение сценариев. Отладка. Развёртка логов займёт до сорока минут.
    Вывести упрощённо?» — Да.

    Строки летят. Вы — первый, кто убил воплощение этого существа. Впервые одиночка очистил
    червоточину. Вы — герой. Блокировка уровней снята. Вы — легенда. Вы — великая легенда.
    Уровень, уровень, уровень… Глаза слипаются.
  on_enter: ["var.level = 89", "var.str = 75", "var.luck = 90"]
  choices:
    - label: "Уснуть"
      goto: gridi_reads

- id: gridi_reads
  text: |
    В это время на руднике Равенас Гриди сидит на своём насесте и щурится на заходящее солнце.
    О том, что его убил не моб, а «игрок Ростендрикс Потерентакс», он никому не рассказал:
    быть убитым нулевкой — позор. Он выгнал Шото и велел охране никого не пускать вглубь.
    Рано или поздно у нуба кончится еда.

    Штрафник Дарчит как раз рассказывает ему тупой анекдот — и замирает на полуслове. Замирают
    все на руднике. Перед глазами у каждого плывут огромные красные буквы.
  system: "Небывалое достижение! Боги обратили внимание на игрока Ростендрикс Потерентакс!"
  choices:
    - label: "Посмотреть на Гриди"
      goto: gridi_doom

- id: gridi_doom
  text: |
    — Это глюк? — спрашивает Дарчит.

    — Нет, Дарчит, — с ледяным спокойствием отвечает Гриди. — Помнишь мою загадку про то, куда
    девается всё, что здесь съедают? Так вот. Теперь я знаю, куда польётся всё дерьмо этого
    мира. Сюда. Оно заполнит штольню, перехлестнёт через провал и смоет мой навес, твою
    караулку и тебя вместе с ней. Беги. Не выходи из игры — уходи ногами. А в реале гуляй на все. И когда явятся с вопросами — отвечай очень вежливо.

    Где-то очень далеко, в комнате без окон, люди, которые не дают интервью, обсуждают
    потерю контроля. Игрок найден: тело в коме. Но в игре его нет. Если он в подземелье Хаоса,
    его не найти и с ним не связаться. Таковы законы Второго Мира.
  choices:
    - label: "…"
      goto: dream
