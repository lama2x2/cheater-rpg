# Глава 11. Баг: неисправный квест, Тираум, Огненная Расселина и встреча с Цифрой.
# Финал: «Свитки дорого стоят» (по книге) или развилка «что если» — «Один в поле».

- id: bug
  chapter: "Баг"
  checkpoint: true
  text: |
    Вы ночуете под огромной елью: ветви опускаются до земли, и внутри сухо, как в шалаше. По
    форумной карте здесь нет ничего, кроме леса, — но цену таким картам вы уже знаете. Их
    рисуют, разок глянув на местность с дальнего холма.

    Вы просыпаетесь до рассвета — что-то разбудило. Провидец, характеристика, обещает иногда
    угадывать будущее. Трещит ветка, качается соседняя ель, над кустами показываются рога.
    Лесной лось, тридцать пятый уровень. Испугаться лося — смешно.
  choices:
    - label: "Три «Стрелы Хаоса» — будет мясо на завтрак"
      text: "Первая в шею — лось взвивается на дыбы. Вторая — крит по передней ноге, он падает и катится, ломая подлесок. Третья добивает. Для достижения на тысячу разных видов мобов годится всякий, а ягоды и грибы уже поперёк горла."
      goto: bug_arrives
    - label: "Пусть пасётся: шуметь незачем"
      text: "Лось объедает куст и неторопливо уходит. Вы доедаете последние ягоды, сворачиваете лежанку и идёте дальше, к Тирауму. Лес тих, как и обещала карта."
      goto: robbers

- id: bug_arrives
  text: |
    Разжечь костёр нечем: ни спичек, ни огненной магии. Пока вы думаете, тереть ли палочки, к
    туше выходят два волка, скалятся — и вдруг, поджав хвосты, удирают со всех ног.

    Треск, шаги, как будто сваи заколачивают. Шумный вдох, словно стадо слонов высморкалось.
    Деревья расступаются, и выходит Колобок высотой с двухэтажный дом, на крошечных кривых
    ножках, весь в нечёсаной рыжей шерсти. Широкий безгубый рот, глазки-бусинки.

    «Неисправный квест. Уровень: нет данных».

    — Иду, значит, птичек слушаю, — гудит он басом. — А тут мясцо бесхозное лежит.
  choices:
    - label: "«Эй, круглый! Это моё мясо!»"
      goto: bug_tickle
    - label: "Тихо отползти: пусть забирает"
      text: "Вы пятитесь за ёлку. Колобок довольно жмурится, берёт лося двумя крошечными лапками и уходит жевать за деревья. Ну и ладно. Позавтракаете ягодами."
      goto: robbers

- id: bug_tickle
  text: |
    — Ух ты! Червячок, а разговаривает! — изумляется Колобок. — Не скользкий, не извивается.
    Наверное, вкусный. Жалко даже, но придётся съесть. Ты чем питался последние дни?
    — Ягоды, грибы.
    — Это хорошо. А то один дрянь какую-то в городе съел, с перцем да с корицей, — я потом полдня икал.

    «Стрела Хаоса» в губу — он только почёсывается: щекотно. Восставший тильбит-командир
    бросается в атаку и исчезает от небрежного взмаха мохнатой ручонки. У вас восемь тысяч
    магии — и её не хватит снять четверть его полоски. Урон проходит, а полоска не
    шевелится. Зато бегает он медленнее вас.
  choices:
    - label: "Кружить вокруг туши и щекотать его дальше"
      goto: bug_deal

- id: bug_deal
  text: |
    — Хватит, червячок! Это уже не щекотно, это раздражает!
    — Я с тебя шкуру спущу и постелю ковром в своём замке!
    — Какой у тебя замок, ты же крошечный! — Будет! Когда-нибудь!

    В конце концов Колобок обижается: мясо у вас, мол, желчью пропитано. Признаёт, что был
    слегка не прав, и предлагает честно поделиться:
    — Ты мелкий, а мяса у тебя много. Несправедливо. Бери, сколько сможешь унести, остальное —
    моё.
  choices:
    - label: "«Договорились» — и спрятать тушу целиком в слот пояса"
      text: "Семьсот килограммов в слоте весят в десять раз меньше. Вы машете рукой: — Пока, мохнатый, не болей. Колобок оседает на подогнувшихся ножках и превращается в смайлик глубокой депрессии: — Я чувствую себя обворованным!"
      goto: bug_talk
    - label: "Отрезать ему окорок — справедливость дороже"
      text: "Вы отрезаете от бедра приличный кусок и кладёте перед ним. Колобок удивлённо моргает бусинками: — Червячок, который делится? Таких я ещё не ел. То есть не встречал."
      goto: bug_talk

- id: bug_talk
  text: |
    — Сначала ответы, — говорите вы. — Ты кто?
    — Баг. Ошибка программы. Так меня назвал червячок, который пришёл, когда я всё забыл.

    Он должен был стоять в лесу и ждать, пока ему принесут мясо, а потом чем-то помочь. Скучно
    было и голодно. Пришли червячки — он их съел. Потом очутился в месте, где много света и
    нет деревьев, и там червяк сказал: непись с функцией бессмертия, уцелел с бета-теста и
    почему-то не отключается. На вкус пресноватый, кислинки не хватало.
    — Хочу к деревьям — и появляюсь у деревьев.
  choices:
    - label: "Накормить Бага и спросить про тайну"
      goto: bug_call

- id: bug_call
  text: |
    Баг жуёт неспешно, жмурится и мурлычет.
    — Тайну я знал великую. Должен был рассказать за мясо. Забыл. — Он вздыхает. — Ты
    странный. Как я. Хорошо, что я тебя не съел. Захочешь поболтать — скажи вслух служебные слова. — И Баг старательно выговаривает длинную фразу: позывной администратора, номер объекта, номер рапорта об ошибке. Только часто не зови. И чтобы еда была.

    Он уходит, и ещё долго трещат кусты: уходит ошибка, которую не сумел исправить даже администратор.
  system: "Получено умение «Вызов неисправного квеста». Перезарядка: 75 дней. Открыта характеристика: красноречие."
  on_enter: ["set flag.bug_friend"]
  choices:
    - label: "Почитать на форуме, кто он такой"
      text: "Баг когда-то был ключевым неписем длинной цепочки заданий. Дальше него не прошёл никто: он ел всех, кто приходил сдавать этап отрядом. Рейды не сняли с него и процента. Администрация извинилась и объявила квест нерабочим. С тех пор он бродит по лесам всех секторов и ест тех, кто не успел убежать. А в игре, если верить форуму, администраторов нет. Интересная игра."
      goto: robbers

- id: robbers
  text: |
    Дорог, деревень и мест активного кача вы избегаете, и всё равно на подходе к Тирауму,
    столице провинции Дукатан, из кустов выходят четверо чернокожих с никами густо-кровавого
    цвета. Профессиональные душегубы.

    — Опля! Привет, цыпочка, — скалится лучник. — Не спеши, порадуй нас сначала.
    — Чего это вы в лесу собрались? Нулевых нубов боитесь? — спрашиваете вы, готовясь лететь
    на перерождение.
  choices:
    - label: "«Стрелу Хаоса» — лучнику прямо в лицо"
      goto: robbers_run

- id: robbers_run
  text: |
    Крит: ослепление. Лучник воет, прижимая ладони к лицу. Вы бросаетесь мимо остальных,
    размахивая посохом. Воин с алебардой ревёт боевой клич, и по коже прокатывается дрожь —
    но срабатывает свойство пояса: оглушение отражается на него самого. Двое оставшихся бегать
    не умеют.

    К воротам Тираума вы, следуя складывающейся традиции, прибегаете бегом.
    — Разбойники! Еле ушла!
    Маг-непись смотрит долго, но спрашивает только, не видели ли вы чего странного. Не
    видели. А где тут банк?
  choices:
    - label: "Обустроиться в Тирауме"
      goto: tiraum

- id: tiraum
  text: |
    Большой город: тысячи игроков и неписей, затеряться легче, чем иголке в стоге сена.
    Шестьсот гранёных камней — пять с лишним тысяч серебром, металл — ещё тысяча. В гильдии
    магов — щит от магии, «Очищение», «Оживление», «Лечение травм», «Корни», «Сон» и «Огненный
    шар»: попеременно с «Стрелой Хаоса» можно бить без пауз. В банке — ячейка, привязанная к
    владельцу.

    Торговля на рядах — провал: за день четыре сотни. Определённо коммерческого таланта у вас
    нет. Сюда бы Шото — но с ним теперь нельзя: за орком наверняка следят. Зато аукцион
    анонимный: ящики, кольцо-ключ, лоты, и почти восемь тысяч за вещи. Камни там уходят вдвое
    дороже, чем у неписей. Вы сглупили, торгуя с ними.

    Как же непросто одному.
  on_enter: ["var.silver += 14000"]
  choices:
    - label: "Нанять отряд в гильдии наёмников"
      goto: mercs

- id: mercs
  text: |
    — Здесь логово матёрых бойцов, милашка, а не магических лечилок, — ухмыляется воин на
    входе. — Ничего, я как раз пришла нанять воинов. Если их тут сроду не было — дико
    извиняюсь.

    Гном-клерк чешет пером ухо: после войны за рудник бойцов мало, цены выросли. Восемь
    наёмников уровнем от ста двадцати — четыре тысячи за день. Добираться до Огненной Расселины
    два дня? Нет: у королевского форта есть армейский телепорт, гильдия им пользуется. Ещё две
    с половиной тысячи. И взятка, чтобы пропустили вас, — вы ведь не из гильдии.

    Даже бездушные неписи берут взятки.
  on_enter: ["var.silver -= 7200"]
  choices:
    - label: "Оплатить всё"
      goto: rift

- id: rift
  text: |
    Огненная Расселина — узкий карьер в полтора километра глубиной: древние маги когда-то
    тушили вулкан, и потушили вместе с городом. Внизу дым и языки пламени. Огненных тварей
    сколько ни бей — меньше не становится.

    У начала тропы нубы видят отряд неписей и маленькую флайтинг.
    — Ты наняла неписей на кач?! Мы бы втрое дешевле прокачали!
    — Папа нанял. Он сказал, неписи качают качественнее.

    За спиной шепчут: дура при богатом папаше. Именно этот образ вы и создаёте: нубка,
    летающая дорогими телепортами, выглядит странно, а нубка с богатым папой — нет.
  choices:
    - label: "Спускаться за командиром Матдуном"
      goto: mantis

- id: mantis
  text: |
    На третьем уступе твари толстые и нападают по двое-трое из-за груд шлака. Вы рассеиваете,
    лечите, иногда добиваете «Стрелой», а на самых сильных бросаете «Капкан». Не ради опыта
    вы потратили столько денег.

    — Элитник! Сто семидесятый, не меньше! — кричит маг.

    Багровый богомол в три метра. Танки окутываются щитами, из пасти твари бьёт фонтан искр и
    слизывает щиты одним касанием. Четыре воина с оглушениями держат его в плотном контроле,
    маг кладёт в сон. Наёмники своё дело знают.
  choices:
    - label: "Бросить на богомола «Капкан», пока его держат"
      goto: mantis_end

- id: mantis_end
  text: |
    — Всё, уходим из этой печи, — Матдун вытирает пот. — До темноты надо выбраться: снизу,
    бывает, такое поднимается, что нам не по зубам.
    — Идите. Договор выполнен. Я уйду свитком.

    Наёмники кланяются и уходят. Вы остаётесь на краю уступа над россыпью огней. Где-то внизу
    бродят боссы, до которых не добраться и десятку таких отрядов. С друзьями в этой игре
    возможностей куда больше.

    В туше богомола, кроме лута, лежит кристалл души. Высокоуровневый питомец.
  on_enter: ["item.crystal_mantis = 1"]
  choices:
    - label: "Подумать, куда теперь"
      goto: crossroads

- id: crossroads
  text: |
    Облик вы так и не сменили, хоть и собирались. «Чистый лист» перезаряжается неделю, и у вас
    появился на него другой план. Есть человек в похожей клетке — или в худшей. Он мечтает о
    большем.

    Может, вы непроходимо глупы и вас тут же сдадут со всеми потрохами. Ну и что? Уйти
    телепортом, переждать неделю, сменить лицо. Этот образ не жалко: тошнит уже от приватов,
    где взрослые дяди истекают слюной на «девочку».

    Свиток телепорта в руке. Вы можете представить любое место, где уже бывали.
  extra:
    - if: "var.cifra >= 2"
      text: "Вы вспоминаете, как Цифра рисковал, предупреждая вас на форуме, и как молчали вы с ним на улице Арбенны."
  choices:
    - label: "Представить ров под стенами Арбенны"
      goto: cifra_moat
    - label: "Нет. Одному надёжнее: сменить облик и уйти в русский сектор"
      goto: end_alone

- id: end_alone
  text: |
    Через неделю маленькая флайтинг исчезает так же бесследно, как светлый эльф. В русский
    сектор уходит коренастый гоблин с мешком камней — один из миллионов. Деньги копятся:
    камни, слитки, аукционы, червоточины, которые вы чистите раз в месяц, никому о них не
    рассказывая. Тело в клинике дышит, счета оплачены на годы вперёд.

    Вы самый богатый нуб, которого никто не знает. Иногда по вечерам вы ловите себя на том,
    что открываете список друзей, — а там пусто. Второй Мир — командная игра. А вы всё один да
    один.

    Где-то у рва под Арбенной горбатый уродец в трусах в горошек бросает камешки в лягушек и
    так и не узнаёт, что кто-то однажды чуть не пришёл сказать ему спасибо.
  extra:
    - if: "var.marrak >= 2"
      text: "Однажды в русском секторе вы встречаете зелёного полугоблина с двумя кинжалами. Маррак вас, конечно, не узнаёт. А вы так и не решаетесь позвать его в отряд."
  ending: { id: alone, title: "Один в поле" }

- id: cifra_moat
  text: |
    Арбенна. Город, в котором два месяца назад на мостовую шлёпнулся ошарашенный нуб. Нуб ли вы
    теперь? Тридцать четвёртый уровень — несерьёзно. Огромные характеристики? Топовый игрок
    снесёт вас парой умений. Богатство? До миллиона далеко. Великие достижения? От них одни
    неприятности. Вы не играете — вы выживаете, бросаясь от одного к другому. Не хватает
    времени, сил. И рук.

    Цифра там, где вы и думали: на узкой полосе между стеной и рвом. Вечер — пора охоты. Он
    подбрасывает на ладони камешек и выбирает лягушку пожирнее.
  on_enter: ["var.level = 34"]
  choices:
    - label: "Подойти неслышно и поздороваться"
      goto: cifra_hello

- id: cifra_hello
  text: |
    — Добрый вечер. Я тебя так ни разу и не проклял, можешь успокоиться.

    Цифра оборачивается, уже открыв рот для шутки про девочку-флайтинга, — и его пробирает.
    Челюсть перекашивает, в глазах мелькает столько всего сразу, что не разобрать.
    — Это маскировка под женского перса?
    — Ты меня за кого принимаешь? Значок «как в реале» видишь?
    — Называя тебя императором нубов, я невероятно поскромничал.

    Потом взгляд у него становится собранным и цепким.
    — Сбегаю-ка я к телепорту. Там ребята за новости о тебе отвалят немало.
  choices:
    - label: "«Беги-беги. Пока тебя не опередили»"
      goto: cifra_why
    - label: "«Заплатят. Тысяч двадцать золотом. Но у меня есть предложение лучше»"
      effects: ["var.cifra += 1"]
      goto: cifra_why

- id: cifra_why
  text: |
    — Один маленький вопрос, — говорит Цифра. — Зачем? Поиздеваться за старое?
    — Не за что. Не попади я на тот рудник — мыл бы сейчас окна в городе. Ты меня выручил. И
    честно предупреждал. Я пришёл сказать спасибо.

    Вы поднимаете руку и активируете «Чистый лист».

    Ноги у Цифры подгибаются, он садится на землю и моргает.
    — Что… что ты со мной сделал?
    — Это было моё «спасибо». А теперь можешь идти к телепорту.
  choices:
    - label: "Развернуться и уйти по мосту"
      goto: cifra_run

- id: cifra_run
  text: |
    — Да стой ты! — догоняет вас запыхавшийся голос. — Приват открой! Я выдохся!
    — Это же хорошо. Бодрость на нуле качается быстрее, ты сам меня учил.
    — Учил на свою голову! И перестань скакать как лошадь!
    — Акробатику качаю.
    — По-нубски ты её качаешь! — Он останавливается. — У меня слетели замки с характеристик.
    Первый раз вижу, чтобы после «спасибо» такое случалось.

    — Через неделю сниму замок и с уровней, — говорите вы. — Раньше не могу.
  choices:
    - label: "«Мне нужен напарник, который знает игру»"
      goto: cifra_deal

- id: cifra_deal
  text: |
    — Пусть ты за год и не наскрёб на аккаунт, — говорите вы, — но в игре понимаешь куда больше меня.
    — На рабочий я уже накопил, — обижается Цифра. — Мне для плана нужен с прокачкой до
    десятки. А бета-тестерам, знаешь ли, срезали уровни и статы, но не умения.

    Его раса задумывалась как чистые дебаферы. «Полное разрушение»: на восемь секунд цель
    получает на двадцать процентов больше урона от всего. Растёт с прокачкой, игнорирует
    защиты, снять его почти невозможно.
    — Вкусно, — признаёте вы.
    — Но главную причину ты так и не назвал.
  choices:
    - label: "«Ты калека и здесь, и там. Это неправильно»"
      goto: cifra_reason
    - label: "«Одному здесь слишком трудно. Мне нужны руки»"
      goto: cifra_reason

- id: cifra_reason
  text: |
    — Наши миры переполнены несправедливостью, — тихо говорит Цифра. — Кем ты был в реале? — Он
    тут же машет рукой. — Нетактичный вопрос. Считай меня профессором, если хочешь кем-то
    считать. В Мексике можно найти почти всё и всех, не только картели. А про тебя на форуме
    писали — русский?
    — Правда.
    — Это многое объясняет. На вас частенько накатывает.

    — Я уйду зарабатывать, — говорите вы. — Мне нужно много денег. Ты можешь пойти со мной.
    Или к телепорту. Я даже не обижусь.
    — Тянет разболтать, — вздыхает Цифра. — Только чутьё говорит: рядом с тобой выйдет выгоднее. Жадность — мой порок. Куда идём?
    — Чистить подземелье Хаоса.
    — Вдвоём?!
  choices:
    - label: "«В прошлый раз я был один». Принять его в отряд"
      goto: cifra_party

- id: cifra_party
  text: |
    — Мама моя! — Цифра хватается за голову, читая, что получил в отряде. — Это как?!
    — Маленькие бонусы от моих достижений. Плюс семнадцать к первичным, четыре ко вторичным,
    опыта на сорок процентов больше. С героями ходить приятно.
    — Ты не герой. Ты монстр. Симпатичный такой монстрик.
    — Попрошу без намёков на маскировку.

    Вы выдаёте ему кольца и браслеты на здоровье: в подземелье его задача одна — выжить. И
    кирку. Не спину чесать: потом добудете камни, а огранка у вас высокая. Месяц подземелье
    восстанавливается, потом — русский сектор.
    — Зачем?
    — Я всё-таки русский. Какая-никакая, а Родина.
    — Ладно, — Цифра закатывает глаза. — Только не становись зелёным орком с клыками.
  choices:
    - label: "Открыть портал без свитка"
      goto: end_together

- id: end_together
  text: |
    Вы активируете умение, которое досталось вместе с легендарными достижениями: раз в сутки.
    Перед вами вспыхивает широкая арка телепорта — больше, чем от любого свитка, в жёлтых
    отсветах.
    — Как ты это сделал без свитка?! — поражается Цифра.
    — Свитки нынче дороги. Экономлю.

    Вы шагаете в арку вдвоём. Где-то впереди — снова тильбиты, снова семь ярусов. И Запертые
    Земли за краем Раллии, куда, как говорят, ходу нет. Но об этом — в другой раз.
  extra:
    - if: "var.shoto >= 2"
      text: "В кармане — записка, переданная через аукционный ящик: «Принят в „Зрячие“. Свадьба осенью. Если будут птеры — знаешь, где меня искать. Ш.»"
    - if: "flag.hushed_shoto"
      text: "Говорят, когда кланы трясли рудник, Шото на всех допросах твердил, что знать ничего не знает про какого-то нуба. Тот тихий разговор у провала не пропал даром."
    - if: "flag.told_john"
      text: "Вечером вы напишете Джону через Дутита: контракт больше не нужен. Опахало пусть машет кто-нибудь другой."
    - if: "var.pup >= 2"
      text: "Где-то на форуме гном по имени Пуп хвастается: он знал, что тот нуб станет миллионером. Он вообще-то сразу так и сказал."
    - if: "flag.bug_friend"
      text: "А в списке умений тихо ждёт своего часа длинный номер, которым можно вызвать с технической локации огромный рыжий смайлик. Нужно только мясо."
    - if: "var.marrak >= 2"
      text: "В списке друзей — первый ник: Маррак. «Если что, зови». Обязательно позовёте."
  ending: { id: together, title: "Свитки дорого стоят" }
