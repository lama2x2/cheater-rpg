# Глава 3. Арбенна: первый день нуба, юрист в чате, Цифра и «работа, за которую проклянёшь».

- id: arbenna
  chapter: "Арбенна"
  checkpoint: true
  text: |
    Вас оглушает разом: цвета, звуки, запахи. Вы сидите на булыжной мостовой перед
    перекрёстком двух узких улочек, и один булыжник неприятно давит в копчик. Двухэтажные
    каменные дома, белые занавески, рыжий кот на карнизе изображает хищника для голубей.
    Пахнет выпечкой. Звонит колокол.

    Это не похоже на игру. Это похоже на старый европейский городок в хороший летний день.

    — Я сошёл с ума, — говорите вы — и пугаетесь собственного голоса: тонкого, тягучего,
    шипящего, совершенно чужого.

    Из-за угла вылетает гном, едва не спотыкается о вас и басит на бегу:

    — Расселся тут, нуб!
  system: "Добро пожаловать во Второй Мир. Город Арбенна, провинция Раллия. Точка возрождения: площадка новичков."
  choices:
    - label: "Отползти к обочине"
      text: "Второй гном возникает прямо из воздуха и спрашивает дорогу к какому-то бюро. Третий врезается в вас с разбегу и советует смыться в канализацию. Вы благоразумно перебираетесь к стене. Мимо, втянув голову в плечи, шагает речной огр."
      goto: bureau
    - label: "Окликнуть ближайшего прохожего"
      text: "Прохожим оказывается речной огр — серый, огромный, шагающий быстро и сгорбившись. Он единственный за утро не обзывает вас нубом, а просто велит: — В бюро — за мной."
      goto: bureau

- id: bureau
  text: |
    Огр приводит вас на полукруглую площадь перед длинным зданием с безвкусными колоннами.
    Внизу толпятся гномы, орки и огры, все на одно лицо. Наверху, на лестнице, светловолосый
    здоровяк в чёрной мантии читает из папки что-то вроде: «Два ишака на лес, посуточно,
    роба и элики наши, баф в обед».

    — Я! — кричит знакомый огр. С пальцев здоровяка срывается жёлтый светлячок, тает над его
    головой, и огр уходит за угол — видимо, нанятый.

    По дороге огр успел решить, что вы школьник на мамином аккаунте, и посоветовать читать
    гайды. Похоже, слово «нуб» здесь вместо «здравствуйте».
  again: "Толпа у бюро всё так же галдит, здоровяк в мантии всё так же читает вакансии."
  choices:
    - label: "Спросить у толпы, где тут можно поесть"
      if: "not flag.ask_food"
      effects: ["set flag.ask_food"]
      text: "Над вами ржут всей толпой. Один огр даже снимает «кино про нуба» для форума. Гном сжаливается: едят в тавернах, за деньги, которых у нубов не бывает. Или за городом, где дичи полно, — но там скорее съедят вас. «Загляни в свою сумку, гений»."
    - label: "Спросить, почему у здоровяка в мантии нормальное имя"
      if: "not flag.ask_npc"
      effects: ["set flag.ask_npc"]
      text: "Хохот такой, что здоровяк на лестнице сбивается и удивлённо смотрит вниз. — Грендис — непись, дубина нубская, — объясняет огр. Что такое «непись», вы так и не понимаете, но переспрашивать уже неловко."
    - label: "Отойти в сторону и рассмотреть себя"
      goto: self

- id: self
  text: |
    Руки длинные — ниже середины бедра, — пальцы как паучьи лапки, ногти синюшные. Кожа серая,
    будто с залежавшегося покойника. Голова вытянута дыней, глаза огромные. Тот ещё красавчик.
    Остальные, впрочем, тоже не фотомодели.

    Стоит пристально посмотреть на вещь — выскакивает табличка. Сумка новичка, куртка
    новичка, штаны новичка. В сумке эликсир бодрости и два пайка, которые нельзя ни продать,
    ни выбросить. Кошелёк на поясе пуст. По краям зрения висят полоски: жизнь, магия,
    бодрость и пустая жёлтая — «ярость».

    А в углу мигает окошко чата. Кто-то по имени Дутитнаил Притенгуар давно и отчаянно пишет
    вам: «Джон? Женя! Ответь!»
  on_enter: ["item.ration = 2", "item.elixir = 1"]
  choices:
    - label: "Ответить в чат — мысленно"
      goto: john_chat

- id: john_chat
  text: |
    Строка послушно заполняется словами, стоит только подумать. Ответ прилетает мгновенно:

    — Женя, ты меня напугал! Почему молчал?

    — Джон?

    — А кто ещё зовёт тебя Женей?

    Джон объясняет: персонаж Дутит — служебный, контора пишет с него с ноутбука по очереди, в
    упрощённом режиме, а владелец сидит рядом в браслете на коротком шнуре. Вы в
    Американо-канадском секторе, до русского далеко. Контракт ребята пробивают, может, уже
    завтра. А пока — сидеть тихо. Дутит вон сидит на одном месте уже несколько месяцев, и
    ничего ему не делается.
  choices:
    - label: "Пообещать сидеть тихо — и честно попробовать"
      text: "Вы садитесь у стены и ждёте. Хватает вас минут на десять. Вокруг слишком много непонятного, чтобы смотреть в одну точку."
      goto: town
    - label: "«Сидеть сутки? Не выдержу. Погуляю»"
      text: "— Только никуда не влипни, — пишет Джон. Вы обещаете — и сами в это не верите."
      goto: town

- id: town
  text: |
    Арбенна оказывается маленькой, но запутанной, как лабиринт. Бегать по ней тяжело:
    полоска бодрости тает, а потом наваливается такая слабость, что приходится стоять минут
    десять, пока она не подрастёт хоть до четверти. Неписи — так, оказывается, зовут здешних
    жителей — ходят степенно и одеты куда лучше игроков. Игроки же носятся, прыгают и
    пыхтят.
  again: "Вы снова бредёте по кривым улочкам Арбенны."
  extra:
    - if: "not flag.vigor"
      text: "Бодрости у вас кот наплакал: вы выдыхаетесь уже на третьем перекрёстке."
  choices:
    - label: "Дойти до городских ворот"
      if: "not flag.saw_gate"
      effects: ["set flag.saw_gate"]
      text: "Ворота распахнуты, решётка поднята. Два стражника с копьями подпирают стену, рядом на высоком табурете грустит тощий тип в шляпе ведьмы и розовых лосинах. Снаружи поля, лес и ров, заросший кувшинками. Вместо вони — лягушачий хор."
    - label: "Почитать газету на стенде"
      if: "not flag.saw_paper"
      effects: ["set flag.saw_paper"]
      text: "«Вестник Раллии»: вечеринка на площади Первого Герцога с фонтаном алкоголя и боями на тортах; клану срочно нужен ландшафтный дизайнер от пятидесятого уровня. Это реклама. Знающий человек вычитал бы из неё всё о здешней жизни. Вы — не знающий."
    - label: "Пойти туда, где кричат «Дуэль!»"
      goto: duel

- id: duel
  text: |
    На маленькой площади ушастый эльф в зелёном берете вызывает на дуэль парня с лицом
    фотомодели и резным посохом. Из-за спины вам комментирует урчащий голос: эльф сорок
    шестого уровня, человек — тридцать восьмого, но эльф — бафер-песенник, усилитель для
    отряда, а без отряда бафер против мага — что таракан под ботинком.

    Эльф с поклоном выхватывает шпагу, маг окутывается сияющим коконом. Огненная клякса — в
    грудь, огромная сосулька — в голову. Песен не будет.

    Эльф стоит живой, только закопчённый. Дуэль кончается на последнем очке жизни.
  system: "Дуэль окончена. Победитель — Флай Капиб, проигравший — Риголис Алитрюль."
  choices:
    - label: "Обернуться к комментатору"
      goto: cifra_meet

- id: cifra_meet
  text: |
    Рост и борода как у гнома, но на этом сходство кончается. Козлиная раздвоенная бородка,
    голова грушей, глаза навыкате, уши как пожёванные пирожки. Из одежды — синие трусы в белый
    горошек до колен. Над головой у него не имя, а набор цифр.

    — Динозавр этого мира, — представляется он. — Бета-тестер. Наши аккаунты так и не
    закрыли — забыли, наверное. Ник у меня сам видишь какой. Зови Цифрой.

    И улыбается — неожиданно хорошо, без капли уродства.
  again: "Цифра в своих трусах в горошек терпеливо ждёт, что вы скажете."
  choices:
    - label: "«Ты непись?»"
      if: "not flag.ask_cifra_npc"
      effects: ["set flag.ask_cifra_npc"]
      text: "— Неписи — это фон для игры, как Кролик для Алисы, — объясняет Цифра. — Ими управляют программы. А мной управляю я. Почти."
    - label: "«Я Рос. И я не просто нуб — я впервые в такой игре»"
      text: "— Всё в первый раз, — мечтательно тянет Цифра. — Знаешь, я тебе даже завидую. Пойдём, мне до темноты еду найти надо, а ты поспрашиваешь."
      goto: cifra_walk

- id: cifra_walk
  text: |
    По дороге Цифра учит: не верь никому, и ему тоже. Нуба нельзя ударить, зато можно
    привести на него «паровоз» — стаю злых волков — и уйти в невидимость. Сумку порвут,
    пайки выпадут.

    Его собственный персонаж — инвалид: всех бета-тестеров перед стартом обнулили и повесили
    замки, у него сила и бодрость по единичке, и качать нельзя. Новый персонаж — платный, а
    денег нет. В жизни он парализован. Мексика, взрыв в кафе, мимо которого шёл домой.
    Лечение съело всё, теперь он лежит в центре среди таких же, а оборудование для игры ему
    когда-то оставили по доброте.

    — Хотя даже так, уродцем, — говорит он, — мне нравится бродить по Арбенне и подглядывать, как она меняется.
  choices:
    - label: "Помолчать с ним рядом"
      effects: ["var.cifra += 1"]
      text: "Вы молчите. Вы-то знаете, каково это — лежать и не чувствовать тела. Цифра косится на вас и, кажется, понимает, что молчание не равнодушное."
      goto: cifra_house
    - label: "«Меняется? Это как?»"
      goto: cifra_house

- id: cifra_house
  text: |
    — Город задуман саморазвивающимся, — рассказывает Цифра. — Когда-то тут было ровное
    место и тестовые боты. Потом вырос город. Вон в том доме раньше неписи раздавали
    новичкам задания: дров наколоть, ворону на огороде убить. Потом они исчезли, а новые
    жители квестов не дают. Зато каждый расскажет историю, в которой спрятано что-то
    ценное. Нубы рыдают на форуме.

    Вы смотрите на дом — и перед глазами послушно выскакивает табличка: камень, кирпич,
    два этажа, чердак, подвал, жильцов до двадцати четырёх.

    — Постой, — Цифра останавливается. — Ты прочёл его, не трогая? С какой
    наблюдательностью?
  choices:
    - label: "Честно назвать свои характеристики"
      goto: emperor

- id: emperor
  text: |
    Наблюдательность — двойка, интеллект и сила мысли — по единичке, всё остальное ушло в
    ловкость. Цифра переспрашивает число и останавливается посреди улицы.

    — Ты не ошибся, — медленно говорит он. — Ты влип. Угодил прямиком в ту яму, куда
    сливаются все ошибки этого мира. Парень, я почти восхищаюсь. Ты не нуб. Ты — император
    нубов.
  extra:
    - if: "not flag.vigor"
      text: "— И бодрость почти ноль, — добавляет он, утирая слезу. — Ты же упадёшь, пока дойдёшь до работы. Если тебя на неё возьмут."
  choices:
    - label: "«Перераспределю потом»"
      goto: frogs

- id: frogs
  text: |
    — Сброс характеристик стоит двадцать тысяч золотом, — говорит Цифра. — И делает его
    только вице-король или архимаг. Очередь на приём — месяца три, могут отказать без причин.

    Вы выходите за ворота. Цифра садится на край рва, где на кувшинках сидят жирные
    лягушки, и швыряет в них камешки. Это его еда: лапки, говорит, объедение. Шахтёрам нужна
    сила двадцать и грузы десять. У вас девять и четыре — даже ведро в деревенском сортире не
    поднимете.

    В чате загорается сообщение от Джона: персонажа сменить нельзя — для этого нужно живое
    тело, а ваше в коме. Ребята ищут: может, в уборщики. Или махать опахалом над одним
    богатым игроком, который вообразил себя персидским шахом.
  choices:
    - label: "«Цифра, а если просто работать, статы ведь растут?»"
      goto: curse_offer

- id: curse_offer
  text: |
    — Растут, — кивает Цифра. — Медленно, но растут. Рубишь дерево — капает к силе. Таскаешь
    груз до изнеможения — к бодрости. Только низкие растут легко, а высокие ползут.

    Он заносит руку для очередного броска и вдруг опускает её.

    — Есть для тебя работа. И даже платить будут. Но ты меня за неё проклянёшь. Не сейчас —
    потом. И, может, не один раз.
  choices:
    - label: "«Согласен. Лучше так, чем опахало»"
      effects: ["var.cifra += 1"]
      text: "— Опахало? — Цифра хохочет так, что распугивает всех лягушек. — Ладно, император, пошли. Только потом не говори, что я не предупреждал."
      goto: recruit
    - label: "Сначала ответить Джону, что от опахала отказываетесь"
      text: "«Спасибо, но опахало подождёт, — пишете вы. — Я влез в это сам и выберусь сам». Джон отвечает не сразу: «Узнаю тебя. Береги себя, Женя». Цифра ждёт, подбрасывая камешек."
      effects: ["set flag.told_john"]
      goto: recruit

- id: recruit
  text: |
    Дальше всё как в тумане. В тесной конторке, заваленной бумагами, гном-непись при виде вас
    произносит речь, в которой «ни на что не годный кусок» — самое ласковое. Потом приходит
    чернокожий эльф, принимает вас в отряд, смотрит ваши характеристики и хохочет до слёз:
    «Цифра, где ты таких находишь?»

    Вы уже понимаете, что Цифра помогает не совсем бескорыстно. Но отступать поздно — да и
    не хочется.

    К ночи вас усаживают в одноосную повозку. Возница бурчит, что если заснёте намертво,
    как вы все любите, — сбросит и уедет. Зря волнуется. Выходить вам некуда.
  choices:
    - label: "Ехать"
      goto: mine_gate
