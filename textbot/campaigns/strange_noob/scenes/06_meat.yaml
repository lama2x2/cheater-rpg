# Глава 6. Мясо: Пуп и красные ники, Шото и его сковородка, Гриди и пика, Красавчик.

- id: morning_after
  chapter: "Мясо"
  checkpoint: true
  text: |
    Утром посёлок непривычно людный: от пары изб дымятся головешки. У столовой вы
    сталкиваетесь с Пупом. Лепры прошлись и по ближним штрекам, говорит он: всех, кто
    ночевал внизу, отправили на перерождение раз десять подряд, одежду порвали в лоскуты.

    — Зато Гриди своё получил, — хмыкает гном. — Побегал ночью в подштанниках.
  again: "Пуп жуёт и косится на дымящиеся головешки."
  choices:
    - label: "«А почему он был в одних подштанниках?»"
      if: "not flag.ask_undies"
      effects: ["set flag.ask_undies"]
      text: "— Видел, что ники у него и у охраны красные? — Пуп понижает голос. — Это значит: убивал игроков, которые не отвечали. Нубов с замком. Таких тут держат для тёмных дел клана, подальше от людей, пока ник не побелеет. А с красным ником при смерти вещи сыплются, как из мешка Санты. Остаётся только бельё: его снять нельзя. Цензура. Вот и бегал всю ночь голышом. Знатно опозорился."
    - label: "«Шахты теперь завалят?»"
      if: "not flag.ask_collapse"
      effects: ["set flag.ask_collapse"]
      text: "— Без толку, — отмахивается Пуп. — Выработки сами «рассасываются», маги так защитили. А шахта у «мечей» вышла раз в десять больше, чем надо: штреки ушли на километры вглубь и вскрыли целую сеть пещер. Там даже логово искали."
    - label: "Пойти вниз вместе с Пупом"
      goto: crystals

- id: crystals
  text: |
    По дороге Пуп учит жизни: нечего жрать бурду из котла, которую потом вычтут по цене икры.
    Крысятина — нормальное мясо, если правильно приготовить. Внизу печи — жарь на них.
    Хорошая еда ещё и лечит, и бодрость даёт, раз в час. Он суёт вам маленький нож с
    деревянной ручкой: бери, работяги должны помогать друг другу.

    В сумке у вас два кристалла: крыса и лепр. Руки чешутся поднять лепра. Но первую
    крысу-зомби Гриди пнул в пропасть, а вторую, оставленную на ночь в штольне, наутро не
    нашли. Если оживлять лепра, ночевать придётся в шахте. А для этого нужна еда.
  choices:
    - label: "Пока поберечь кристалл лепра и заняться мясом"
      goto: shoto_meet

- id: shoto_meet
  text: |
    Пара крысиных лапок на прутиках шипит над печью, когда за спиной раздаётся голос:
    — Охотой занимаешься?

    Орк. Первый из зелёных, кто сам заговорил с вами. Гномы и орки на руднике держатся
    врозь — традиция такая, сам не знает откуда. Он качает кулинарию и предлагает жарить
    ваше мясо: с маринадом и специями будет вкуснее, а ему — опыт.
    — Как тебя звать?
    — Шото. Или как над головой написано. Но предупреждаю: все, кто пытался это выговорить,
    попадали к врачу с переломом языка.
  choices:
    - label: "Отдать Шото все восемь лапок"
      effects: ["var.shoto += 1"]
      text: "— Неси ещё, — Шото уже раскладывает лапки. — Тушки тащи, я сам разделаю. Через два часа подходи."
      goto: pup_luck
    - label: "Пожарить самому — хочу и кулинарию открыть"
      text: "Мясо выходит жёстким, пригоревшим с одного бока, но съедобным. Шото морщится, глядя на это издевательство над продуктом, но не уходит: — Если надумаешь — неси мне. Я и тебе пожарю, и опыта наберу. — Вы отдаёте ему оставшиеся лапки."
      goto: pup_luck

- id: pup_luck
  text: |
    Пуп пробует мясо Шото и присвистывает: жареная крысятина со специями даёт +1 к силе на
    час. Это повар минимум второго уровня кулинарии.

    Потом он вертит в руках ваши находки: мутный горный хрусталь, бронзовый браслет,
    серебряную заколку. Расспрашивает: горное дело? Интеллект? Наблюдательность? Удача — не
    два, а уже четыре? Пуп долго смотрит на вас.

    — Самоцветы находят с высокой удачей и наблюдательностью. Лут тоже от удачи. А её
    качать почти нереально, иные до сотого уровня с тройкой ходят. Знаешь, Рос, — говорит
    он наконец, — ты самый странный нуб, какого я встречал.
  choices:
    - label: "«Звучит почти как комплимент»"
      text: "— Так оно и есть, — кивает Пуп. — Я сразу заподозрил неладное, когда нулевка начал валить крыс. Ладно, твои секреты — твои. Мне хватит того, что у меня теперь баф на силу."
      goto: shoto_deal

- id: shoto_deal
  text: |
    Шестой день вы живёте под землёй, ночуете в гроте на склоне провала и показываетесь Гриди
    как можно реже. Однажды из темноты бесшумно выходит Шото — бесшумность качает, извиняется
    он, — присаживается рядом с вашей крысой-зомби и качает головой:
    — Так ты некромант. Вот почему нулевка столько крыс таскает.

    Ему всё равно, кто вам помогает. Мясо с баффом стало популярным, и народ решил: бросай руду.
    Двести кусков руды в день от горняков в обмен на мясо — и монеты. Торговать будет он сам.
    — Двести кусков и серебрушка медью. Договорились?
  choices:
    - label: "«Договорились»"
      effects: ["var.silver += 1"]
      text: "— Вот это по-нашему, — ухмыляется Шото. Позже вы прикинете, сколько он с этого имеет, и поймёте, что продешевили раз в десять. Но орк хотя бы останется вам благодарен."
      goto: shoto_gifts
    - label: "«Десять серебрушек. И не медью»"
      goto: shoto_haggle

- id: shoto_haggle
  text: |
    — Ну ты загнул!
    — Сколько гномов на руднике?
    — Без малого три сотни.
    — Почём порция?
    — Два медяка.
    — Значит, медяков пятнадцать с человека в сутки. Полторы тысячи монет за день — даже если
    вычесть руду. Я беру на себя кровожадных монстров, ты греешься у печи и качаешь любимую
    кулинарию. Половина мне. Согласись, ты не в обиде.

    Шото долго молчит, шевеля губами. Считает.
    — Пока покупают не все, — говорит он наконец.
    — Тогда пять. Пока.
  choices:
    - label: "Ударить по рукам"
      effects: ["var.silver += 5", "var.shoto += 1"]
      text: "— Совесть у меня есть, — говорит орк, — и твой первый вопрос, чем я буду расплачиваться, я помню."
      goto: shoto_gifts

- id: shoto_gifts
  text: |
    Шото достаёт потасканную шахтёрскую сумку на сорок ячеек — у вашей нубской всего
    двадцать пять. Потом стальной охотничий нож: разделывать удобнее. И обещает точило:
    кузнечное дело тоже капает, если подтачивать убитое лезвие.

    — Загоняй вагонетку как можно дальше в штольню, — говорите вы. — Забирай в полдень и к
    вечеру. И если найдётся — брезент и старый плащ. Буду ночевать внизу.
    — Там же сожрут. — Договорюсь. — Это как? — Вежливо попрошу не трогать.
  choices:
    - label: "Подняться к Гриди — закрыть долги"
      goto: gridi_debt

- id: gridi_debt
  text: |
    — Ну надо же, своим ходом! — Гриди изображает изумление. — Что-то ты давно у кола не появлялся. Где пропадал?
    — По бабам ходил.
    — Баб у нас целый ноль. Рука хоть не устала?
    — Чередую. Сначала левая, потом правая.

    Шкурки за флягу вы отдаёте сполна. Потом молча высыпаете кучу хлама из крыс: заколки,
    кольца, зеркальце, вилку без зубцов. Гриди морщится, но берёт. И объясняет, почему нулевке
    не бывает приличного оружия: виртуально вы первого уровня, и это сделано нарочно, чтобы
    никто не получил достижение «Ужас монстров» за убийство моба в десять раз выше себя. Это
    почти невозможно.

    Вы молчите. Очень выразительно молчите.
  choices:
    - label: "Показать браслет +1 к уровню из крысиного гнезда"
      goto: pike

- id: pike
  text: |
    — Чего сразу не сказал? — бурчит Гриди. — За то, что забыл, забираю весь хлам.

    Он приносит палку чуть выше вашего роста с длинным наконечником. Короткая орочья пика: и
    колоть, и рубить, и метать. Ими тут сокращают поголовье крыс.
    — Коли и держи. Крути древко, наматывай кишки. Для крыс сойдёт. С элитным лепром не связывайся.

    Он шутит, но сам вдруг мрачнеет. Видно, вспомнил ночь в подштанниках.
  on_enter: ["item.pike = 1", "var.level = 1"]
  choices:
    - label: "Спуститься в самый дальний штрек"
      goto: raise

- id: raise
  text: |
    Хорошо, что пищеварение у персонажей особенное. Тварь, выбравшаяся из облака пыли и мрака,
    выглядит так, что испачкать штаны было бы не стыдно.

    «Восставший дикий лепр. Уровень: 126. Умения: ошеломление, удушение, паника».

    Глаза у него не мутные, как у крыс. В них кровавые разводы и жажда смерти. Чужой.
  system: "Призвано существо, которое выше вас по уровню в сотню с лишним раз. Такого во Втором Мире ещё не делал никто. Ваше лечение восстанавливает призванным на 15% больше."
  on_enter: ["item.crystal_lepr -= 1", "var.summon = 3"]
  choices:
    - label: "«Ну что, Красавчик, пойдём убивать?»"
      goto: slaughter

- id: slaughter
  text: |
    — Души! Да стой ты, тупая скотина!

    Поздно: ещё одна крыса разлетается в клочья, ни шкуры, ни мяса. Вы быстро учите Красавчика
    душить — тушки остаются целыми, и лут валит потоком. Четверть сумки — шкурки, когти,
    черепа. Бижутерии с прибавками набирается на одиннадцать единиц силы, но вы носите ту,
    что прибавляет выносливость: на случай внезапной твари.

    Четвёртый день вы проходите штрек за штреком до самого конца. Закрывается «Крысиный
    страх», открывается «Крысиный ужас»: пять тысяч хвостов. Призыв растёт, всё остальное —
    почти нет. Всю работу делает лепр. И становится скучно.
  choices:
    - label: "Идти дальше, чем кто-либо ходил"
      goto: cave

- id: cave
  text: |
    Пару километров спустя в стене штольни открывается неровный лаз. За ним — пещера, не
    рукотворная: каменные сосульки, журчание ручья, сухой воздух. Среди сталактитов мелькает
    что-то быстрое — чешуйчатая лиса с головой крокодила — и отлетает к стене от удара лепра.

    Надпись над тварью ярко-красная. Наконец-то приключение.

    Дальше — аметисты в известняке, бледные и мутные, но дороже хрусталя. Птеры, которых лепр
    душит один за другим, пока они долбят его клювами. И вдруг — удар в спину на шестьдесят
    две единицы: пещерный теневик, плоский мохнатый медведь с когтями страшнее лепровых,
    сливается с полом так, что даже пет его не заметил.
  choices:
    - label: "Откатиться в сторону — пусть лепр работает"
      text: "Вы катитесь по камням, а лепр уже держит теневика за длинную шею. Тот молотит его лапами, но не пробивает. Вы выбираетесь из боя с половиной жизни и новыми достижениями: монстр выше вас на сорок уровней, выносливость +1."
      goto: cave_loot
    - label: "Ткнуть теневика пикой, пока лепр держит"
      text: "Тычок пикой выходит больше для самоуважения, чем для дела, но атака впервые растёт: ведь бьёте вы сами. Лепр ломает теневику шею. Вы с половиной жизни и новыми достижениями: монстр выше вас на сорок уровней, выносливость +1, атака +1."
      goto: cave_loot

- id: cave_loot
  text: |
    С теневика — когти, клыки и желчный пузырь, шкура не снимается: свежевание слишком
    низкое. С птеров — клювы, яйцо и неожиданно кожаная перчатка лучника на двадцать восьмой
    уровень. В сумке всё меньше места.

    К вагонетке вы успеваете точно к сроку. Лепра прячете в штреке, а Шото показываете тушу
    птера.
    — Ох ты ж! Как ты его завалил?! — Охотничья тайна.

    Перчатку, по словам орка, можно толкнуть серебрушек за сорок, пузырь теневика — за
    двадцать пять. За короткую прогулку — как четырнадцать настоящих долларов.
  on_enter: ["var.silver += 70"]
  choices:
    - label: "«Нужна сумка побольше. Найдёшь?»"
      text: "— Чтобы Гриди подарил тебе свои подштанники и миллион в придачу, не надо? — фыркает Шото. — Поспрашиваю. Через штрафников и возчиков, но дорого выйдет."
      goto: pter_meat

- id: pter_meat
  text: |
    Назавтра Шото встречает вас как родного: мясо птера — бомба. Белое, мягкое, +2 к силе на
    два часа и бодрость рекой. За него готовы платить втрое. Очередь стоит.
    — Сколько тебе в день?
    — А сколько сможешь? Три? А пять?

    Вагонетку теперь катит лепр. В пещере вы устраиваете логово: проходы между сталактитами
    перекрыты решётками, сверху ещё одна. Красавчик сидит в засаде на тропе. Сон приходит
    мгновенно, глубокий, как омут.

    В это время в далёком дата-центре дежурный показывает напарнику странную строку лога:
    невыполнимое достижение взял персонаж без уровня, зарегистрированный меньше месяца назад.
    «Глюк», — решают они. Нынешними логами только зад подтирать.
  choices:
    - label: "Проснуться"
      goto: pile

- id: pile
  text: |
    Первое, что вы видите, — лавина системных строк. Очередное достижение до вас не брал никто из живущих. Призыв подскочил на три. Хитрость — на две.

    Вокруг засады Красавчика — горы тушек птеров и трумусов. Кажется, сюда всю ночь ходили по
    одному. Среди добычи — улучшенные шлем и пояс и колечко: зачарованное серебряное кольцо
    грузчика, плюс десять килограммов к переносимому весу.

    Шото оценивает: шлем — тридцать пять, пояс — сто с хвостиком, кольцо — сотня сразу. План
    такой: пока Гриди с бандой где-то в отъезде, Шото платит охране, едет в город с караваном,
    всё продаёт и привозит сумку.
  on_enter: ["var.summon += 3"]
  choices:
    - label: "Отдать кольцо грузчика на продажу — сумка важнее"
      effects: ["var.silver += 100"]
      goto: world_msg
    - label: "Оставить кольцо себе — перегруз надоел"
      effects: ["item.ring_loader = 1", "set flag.kept_ring"]
      text: "Кольцо тихо сливается с пальцем и становится невидимым. Минус сотня серебра на сумку, зато плюс десять килограммов — и вы уже чувствуете разницу."
      goto: world_msg

- id: world_msg
  text: |
    Вдруг поле зрения перекрывают огромные красные буквы: Сон Травы, игрок из Срединной Империи, первым во всём мире взял трёхсотый уровень.

    — Что это было? — спрашиваете вы.
    — Героическое достижение, — пожимает плечами Шото. — Китайские фермеры опять отличились.
    Ни сна, ни еды, ни девушек — один кач. Лишь бы к нам с войной не пришли.
  choices:
    - label: "«Тогда до завтра»"
      text: "— Приготовь столько же птеров. Можно больше, — Шото подмигивает. — Выбей там легендарку, ладно? Ну или хоть раритет."
      goto: demon
