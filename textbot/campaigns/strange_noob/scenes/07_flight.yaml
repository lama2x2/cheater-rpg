# Глава 7. Странный нуб: демон-проказник, омры, кости картографа, засада Гриди, бегство по реке.
# Развилка «что если»: сдаться Гриди — «хомячок клана».

- id: demon
  chapter: "Странный нуб"
  checkpoint: true
  text: |
    Вас тянет вниз по ручью: если Гриди не врал, вода из горы где-то выходит наружу. Вы
    добываете аметисты, лепр душит птеров. И вдруг — странная строка: «Ваш тайник
    обнаружило существо высокого уровня. Открыта характеристика: специалист по тайникам».

    Какой ещё тайник? Ах да. Громоздкий хлам с мобов, который вы присыпали камнями среди
    сталактитов. Не сокровища, но дело принципа.

    Вы мчитесь назад и издали слышите лязг. Лысая краснокожая тварь размером с бычка — помесь
    обезьяны и демона из фильмов ужасов — от души колотит вашим бронзовым шлемом о стену.
    Шахтный демон-проказник. Тот самый, что когда-то убил вас со спины.
  choices:
    - label: "«Красавчик, души его!» — и метнуть пику"
      goto: demon_fight

- id: demon_fight
  text: |
    Пика втыкается демону в бедро, и тот, передумав удирать, решает сперва наказать наглеца.
    Из его лапы вырывается сгусток огня — и одновременно от лепра расходится кольцо жёлтых
    искр, оглушение. Вы падаете ничком. Пламя ревёт над головой, трещат волосы на затылке,
    вспыхивает спина.

    «Вы горите. Вы быстро теряете здоровье».
  choices:
    - label: "Бежать к ручью — сто метров!"
      text: "Сто метров вы пролетаете быстрее спринтера и плюхаетесь в воду, подняв тучу брызг. Успели: жизни меньше половины. А когда возвращаетесь, лепр уже бежит навстречу, целёхонький. Проказник оказался не таким уж серьёзным — для Красавчика."
      goto: demon_loot
    - label: "Кататься по камням, сбивая пламя"
      text: "Камни не вода: пламя сбивается неохотно, и полоска жизни проседает почти до самого низа. Когда вы встаёте, демон уже мёртв, а лепр стоит над ним целёхонький. Проказник оказался не таким уж серьёзным — для Красавчика."
      goto: demon_loot

- id: demon_loot
  text: |
    Системные строки: опыт, призыв — до десяти, ловкость, выносливость сразу на две,
    стойкость, меткость. «Безумный одиночка, четвёртая часть»: монстр выше на шестьдесят
    уровней. Свободные очки вы бросаете в силу — теперь её восемнадцать. Почти как у
    нормального шахтёра.

    С демона нет шкуры, зато есть клыки, когти, третий глаз, похожий на мутный стеклянный шарик, хвост и косточки пальцев. Редкая тварь — может, и лут подороже.

    Красавчик притаскивает на волокуше четырнадцать птеров разом. Вы забрасываете в
    вагонетку и тушу демона: вдруг Шото пригодится. Тот кривится — на вид такое есть нельзя, —
    но после крыс, говорит, вас уже трудно чем-то напугать.
  on_enter: ["var.str = 18", "var.agi = var.agi + 2", "var.summon = 10"]
  choices:
    - label: "Проводить Шото в город и заняться тайниками"
      goto: caches

- id: caches
  text: |
    Описание нового умения обещает: чем чаще мимо вашего тайника ходят, не замечая его, тем
    быстрее оно растёт. А если найдут — достаётся утешительная прибавка.

    Вечером вы три часа рассовываете хлам — сломанные доспехи, осколки оружия, побрякушки без
    свойств — на перекрёстках, где ходят шахтёры. Потом то же в пещере: под камнями, на
    уступах, под мхом. Тайники завязаны на удачу и наблюдательность, туда тоже капнет.
    Качать надо всё, говорил Шото.

    Наутро вы идёте в большую разведку вниз по ручью. Через несколько часов сливаются три
    реки, и вода с рёвом бьётся о каменный мыс, усыпанный костями.
  choices:
    - label: "Подойти к мысу"
      goto: omrs

- id: omrs
  text: |
    Лепр утробно рычит, глядя на реку. То, что вы приняли за валун, поднимается в полный рост и
    ревёт. Что-то вроде тюленя на коротких лапах — пресноводный омр. Он не обращает внимания
    на лепра и упрямо прёт на вас. Душить его не выходит: шея толще головы, вся в жиру. Клыки
    у омра тонкие и пустые внутри, как иглы для шприца.

    А на берег вылезают ещё двое. И ещё.
  choices:
    - label: "«Красавчик, не души — бей!» — и бегать кругами"
      goto: omrs_fight
    - label: "Отступить, пока не поздно"
      text: "Вы пятитесь в пещеру, Красавчик отходит следом, отмахиваясь от самых прытких. Омры дальше берега не идут. Вы садитесь за поворотом и думаете. По одному их можно выманивать «Капканом»."
      goto: omrs_lure

- id: omrs_lure
  text: |
    План работает, хоть и медленно. «Капкан» на крайнего омра, тот ползёт к вам, лепр
    встречает его ударом. Ещё одного. Ещё. Вы швыряете пику, кидаете камни — меткость
    скачет на глазах. Наконец стая редеет настолько, что лепр добивает остальных на берегу.

    Лута почти нет: Красавчик бил когтями, а не душил. Зато интеллект от «Капканов» растёт, и
    мыс теперь ваш.
  on_enter: ["var.str += 1", "var.agi += 1"]
  choices:
    - label: "Перейти реку к мысу с костями"
      goto: cape

- id: omrs_fight
  text: |
    Это и называется паровоз. По-хорошему надо уносить ноги, но вас заклинило. Вы бегаете от
    неповоротливых тварей и орёте команды. Клочья мяса, брызги крови: от когтей у омров
    защиты нет. Но их всё больше, и полоска жизни лепра впервые за всю охоту начинает
    сползать.

    — Давай, Красавчик! Я в тебя верю! Ошеломление!

    Два десятка омров застывают в волне искр. Лечение, ещё лечение. Пика, камни. Когда на
    ногах остаются четверо израненных, вы бегаете у них за спинами с киркой, пока не
    кончается магия.
  system: "Сила +1 (19), ловкость +1, интеллект +1, сила мысли +1, меткость +1, скорость +1."
  on_enter: ["var.str += 1", "var.agi += 1"]
  choices:
    - label: "Перейти реку к мысу с костями"
      goto: cape

- id: cape
  text: |
    Вы переходите реку, едва удерживаясь в струе. На мысу кости знакомых тварей и незнакомых —
    и два человеческих скелета. Игроки после себя скелетов не оставляют. Значит, неписи.

    Ржавый короткий клинок, топор со сгнившим топорищем. С шеи одного из скелетов вы снимаете знак на шнурке:
    «Нагрудный знак картографа Энуиза Читария. Передайте в гильдию картографов». А в крошечной
    сумке на одну ячейку — книжка в кожаном переплёте, окованном металлом. Карандашные
    наброски подземелий и какой-то открытой местности.

    Через полтора часа встречается вторая стая. В конце боя приходит неожиданное: «Питомец перенял у жертвы умение: вампиризм». Два процента шанса перенять умение жертвы — сработали.
  on_enter: ["item.notebook = 1"]
  choices:
    - label: "Вернуться к вагонетке — завтра Шото"
      goto: bag

- id: bag
  text: |
    — Шото! Помогай!
    — Я тут уже час торчу! Думал, тебя сожрали!

    Новости у орка такие, что вы садитесь на вагонетку. Демон — тварь редчайшая: его мясо
    нужно алхимикам для зелий некромантов, жилы хвоста — на тетиву дорогих луков. За всё —
    около тысячи ста серебром. Сумку Шото купил отменную, хоть и потасканную: «малая сумка
    бродячего торговца», сто ячеек, вес снижает на четверть, в воде не тонет, еда в ней почти
    не портится. Ещё кирка из хорошей стали и по десятку нубских эликсиров на ману и
    здоровье. И семьдесят монет сдачи.
  on_enter: ["item.bag_trader = 1", "var.silver += 70"]
  choices:
    - label: "«А ты-то зачем сюда пошёл, раз тут не заработать?»"
      goto: shoto_story

- id: shoto_story
  text: |
    — Мне кач важнее, — говорит Шото. — Я слепой. В реале, здесь вижу прекрасно. В Раллии
    есть клан слепых, «Зрячие». Денежный, но берут не всех: надо доказать, что ты не овощ на
    пособии, а что-то умеешь. Три месяца я делаю из нулевки конфетку, открываю всё подряд,
    потом сниму замок. Тут хоть балду пинай, хоть паши — «мечам» всё равно. Удачно я с тобой
    кулинарию прокачал.

    И жениться он собирается. Денег — в обрез на самый дешёвый аккаунт.
  choices:
    - label: "«Удачи тебе со „Зрячими“. Ты заслужил»"
      effects: ["var.shoto += 1"]
      text: "Шото на миг теряет свою вечную ухмылку. — Спасибо, Рос. Подходи к вечеру к провалу — со сковородки новой угощу."
      goto: pup_warn
    - label: "Кивнуть и пообещать подняться вечером"
      goto: pup_warn

- id: pup_warn
  text: |
    Пупа вы находите в его любимом штреке.
    — Великий охотник снизошёл до забытого приятеля! — Он охотно берёт мясо, а потом
    становится серьёзным. — Про тебя уже нехорошо болтают. Народец тут — шваль на швали.
    Охране всё равно, но Гриди вернётся, ему нашепчут, а он цепной пёс клана.

    Вещи в игре делятся по цвету, объясняет Пуп. Белые, синие, фиолетовые — для всех. А
    розовые, коричневые, оранжевые, зелёные, красные — из-за таких предают друзей. Ты сейчас
    с претензией на розовый. Нуб, который умеет то, чего не умеет никто. Хомячок, который
    грызёт кошек. Такого любая гильдия захочет — и ничего ему не позволит.
  extra:
    - if: "flag.gave_ring"
      text: "Он трогает палец, на котором носит ваше кольцо маскировки. — Ты хороший парень, Рос, хоть и странный."
  choices:
    - label: "«Что мне делать?»"
      text: "— Если Гриди не вернётся до конца контракта — исчезни, — говорит Пуп. — А если вернётся — сам думай, голова у тебя не для красоты. Стелись под кого угодно, только не под «мечей». Гнилой клан."
      goto: fame

- id: fame
  text: |
    Наверху, у провала, вас ждёт сюрприз: народу как никогда. Шото разболтал, что великий
    охотник выйдет на белый свет. Незнакомые игроки хлопают по плечу, кто-то улыбается, а
    кто-то смотрит с завистью, а то и с угрозой. За что — непонятно: много ли вы
    зарабатываете на этом несчастном мясе?

    — Ещё пяток птеров к обеду принесёшь? — кричит вслед Шото на всю округу, красуясь: вот,
    мол, какой у меня приятель. Нулевка, а птеров одной левой валит.
  choices:
    - label: "Молча кивнуть и уйти вниз"
      goto: ambush
    - label: "Вернуться и тихо сказать Шото пару слов"
      effects: ["set flag.hushed_shoto"]
      text: "— Ещё раз так заорёшь на весь рудник — останешься без птеров, — говорите вы негромко. Шото моргает, потом кивает. Кажется, понял. Кажется, поздно."
      goto: ambush

- id: ambush
  text: |
    В полдень вы сидите у гружёной вагонетки и готовите речь для Шото. До конца контракта
    десять дней. Даже без выплаты — плакать не о чем: трофеи стоят больше любой нормы.

    Красавчик выскакивает из штрека и бросает к вашим ногам придушенную крысу. И тут из темноты
    раздаётся голос Гриди:
    — Это кого ты тут приручил, нуб? Мамочку свою привёл?

    Гном словно соткался из мрака.
    — Удивлён? Мы, гномы, тоже можем освоить теневое искусство. Ну, нуб, поговорим о твоих
    странностях. Сначала со мной, а потом…
  choices:
    - label: "Молчать и смотреть, что он сделает"
      goto: gridi_strike
    - label: "«Красавчик, души его!»"
      text: "Приказ застревает в горле: нулевка не может нападать на игроков — тело сковывает, как тогда, когда Пуп для смеха разрешил ударить себя киркой. Гриди, заметив, как вы дёрнулись, ухмыляется шире."
      goto: gridi_strike
    - label: "«Красавчик, лежать!» — и поднять руки"
      goto: gridi_deal

- id: gridi_strike
  text: |
    Договорить Гриди не успевает. Он неспешно подходит к вагонетке и с резким выдохом рубит
    лепра секирой по боку. Полоска жизни Красавчика едва вздрагивает. Лапа — и кожаная кираса
    на груди гнома рвётся, как бумага. Гриди воет, замахивается снова, но лепр быстрее:
    гном летит на спину, и питомец опускается ему на грудь.
  system: "Гридиус Наппи убит. Достижение «Первая кровь»: побеждён игрок. Открыто достижение «Убийца игроков»."
  choices:
    - label: "«Красавчик… ну ты даёшь. Мы влипли»"
      goto: gridi_dead

- id: gridi_dead
  text: |
    Нулевка напасть на игрока не может. Но Гриди сам напал на питомца — и питомец ответил. А
    тело гнома почему-то не исчезает: уровень у него за десятку, ник красный, так что
    полежит.

    Вы выгребаете из него всё — проще, чем из крысы, — и оставляете в одних подштанниках.
    Вещи разбрасываете вокруг. Гриди, очнувшись у кола в исподнем, сразу сюда не побежит:
    сперва оденется. Потом позовёт охрану. Потом, может быть, тех серьёзных ребят, что
    приходили ночью.

    С рудником пора прощаться.
  choices:
    - label: "Вниз по реке — бегом"
      goto: river_run

- id: gridi_deal
  text: |
    Красавчик послушно ложится. Гриди долго смотрит на него, потом на вас, и его ухмылка
    становится почти ласковой.
    — Умный нуб. Редкость.

    Через час в провал спускаются те самые серьёзные ребята из ночного набега, а с ними
    кто-то из руководства «Силы меча». Вас не бьют. Вас разглядывают, как диковинку на
    ярмарке, открывают ваши характеристики и долго молчат. Потом говорят о контракте.
    Длинном. Очень выгодном — для них.
  choices:
    - label: "Подписать — выбора всё равно нет"
      goto: end_hamster
    - label: "«А если откажусь?»"
      text: "— Привязка у тебя здесь ещё на две недели, — пожимает плечами гном-командир. — Будешь умирать у кола, пока не передумаешь. Мы терпеливые. — Гриди за его спиной улыбается так, что всё становится ясно."
      goto: end_hamster

- id: captured
  text: |
    У кола вас ждут. Гриди, полностью одетый, с секирой на коленях, и четверо охранников. Над
    его головой краснее прежнего горит ник.
    — Ну наконец-то, — говорит он. — Я уж думал, ты насовсем в горе поселился.

    Привязка у вас здесь. Умирать вы будете у этого кола столько, сколько им захочется. Пета
    нет — он остался там, внизу, и, наверное, уже рассыпался прахом.
  choices:
    - label: "Сдаться"
      goto: end_hamster

- id: end_hamster
  text: |
    «Сила меча» оказалась не такой уж нубской, когда дело дошло до редкой зверушки. Вас держат
    на руднике, как держат породистую собаку: кормят, не обижают и никуда не выпускают.
    Кристаллы души, высокоуровневые питомцы, мясо, самоцветы — всё уходит клану. Вам
    оставляют ровно столько, чтобы тело в клинике дышало.

    Через полгода «мечи» продают ваш контракт одной из топовых гильдий за сумму, о которой не
    пишут на форуме. Хомячок, грызущий кошек, переезжает в клетку побольше.

    Пуп как-то присылает весточку: держись. Больше от него ничего не приходит.
  ending: { id: hamster, title: "Хомячок клана" }

- id: river_run
  text: |
    Сутки вы почти без отдыха идёте вниз по подземной реке: то бегом, то быстрым шагом.
    Бодрость ни разу не поднимается выше половины — и за это даже прибавляет единицу. Мерещится
    погоня. Наконец вы понимаете: ещё час, и начнёте делать глупости.

    Омры держатся каждый своего участка реки. Убить стаю — и у её логова будет тихо. Через
    десять минут вы уже отмываете в реке разодранную руку, а Красавчик стоит над
    телами. Ложе из мха на плоском камне. «Охранять!»
  extra:
    - if: "flag.kept_ring"
      text: "Кольцо грузчика на пальце окупается с лихвой: с полной сумкой и перегрузом далеко бегом не уйдёшь."
  choices:
    - label: "Спать"
      goto: river_wake

- id: river_wake
  text: |
    Будит вас боль. «Пещерный теневик: минус пятьдесят девять. Минус шестьдесят восемь. У вас сломана левая рука». Этот гад ходит где хочет, даже стаю омров не боится.

    — Красавчик! Оглушение! Души! Оттащи его!

    Пока лепр душит теневика, вы жуёте мясо и запиваете водой из реки. Потом — снова лавина:
    выносливость, стойкость, «Безумный одиночка, третья часть», закрыты «Истребитель
    великанов» и «Погибель монстров». «Вы первый из ныне живущих… Герой, вы на верном пути!»
  on_enter: ["var.luck += 3"]
  choices:
    - label: "Вбить все пять свободных очков в выносливость"
      text: "Сила подождёт. Сейчас каждая единица жизни на вес золота: умирать с привязкой у кола Гриди очень нежелательно."
      goto: map_open
    - label: "Пять очков — в силу: она решает перегруз"
      effects: ["var.str += 5"]
      text: "Сила растёт, сумка становится легче. Ещё одна такая побудка, правда, может оказаться последней."
      goto: map_open

- id: map_open
  text: |
    Дожидаясь, пока затянется полоска жизни, вы снова листаете книжку картографа — на этот раз
    медленно, вникая в каждый штрих. И на последней странице мир вздрагивает.

    «Открыты характеристики: картография, дальновидение, зрительная память». Карта в
    интерфейсе — уже не каракули, а чёткий цветной план. Клочки пещер, связанные «кишкой» —
    путём погибших картографов. Красная точка — вы. А вот и выход: водопад, тропа, по
    которой не прошли лошади. Деревни, дорога и, наконец, Арбенна.

    Одно плохо: с непобедимым лепром придётся расстаться. Стража в городе таких зрелищ не
    любит.
  choices:
    - label: "Идти к водопаду"
      goto: waterfall
