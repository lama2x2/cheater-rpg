# Перерождение: точка привязки зависит от того, где герой сейчас по сюжету.
# Возврат — в сцену, где он погиб (по флагам ret_*, сначала самые поздние).

- id: respawn
  text: |
    Ничего не болит. Здесь смерть — просто дорога домой, к точке привязки.
  again: "Привыкнуть можно ко всему. Даже к этому."
  intro:
    - if: "flag.gnome"
      text: "Тьма длится один удар сердца — и вот вы стоите в круге у кола посреди шахтёрского лагеря «Армады». Бригадир косится неодобрительно: не наше дело — значит, не наше."
    - if: "flag.ph_ledge"
      text: "Тьма на удар сердца — и снова уступ над пропастью, воткнутая в трещину алебарда, ветер и зелёный горизонт. Опыт тает, как снег, а характеристики — на месте."
    - if: "not flag.gnome"
      text: "Тьма длится один удар сердца. Потом — свет, каменный круг и невысокий кол, а на лавке под навесом у края провала — Гриди. Он даже не встаёт: смотреть, как нубы возвращаются с того света, — его любимое развлечение."
  extra:
    - if: "not flag.gnome and not flag.ph_ledge and deaths == 1"
      text: "— Что, нуб, день не задался? — ухмыляется гном. — Поздравляю с почином. Кто это тебя? Или сам себе киркой в лоб? — В углу зрения мигает строчка: достижение «Первая смерть», плюс пять к жизни. Здесь награждают даже за это."
    - if: "not flag.gnome and not flag.ph_ledge and deaths == 2"
      text: "— Давно не виделись, — радушно тянет Гриди. — Я уж почти соскучился."
    - if: "not flag.gnome and not flag.ph_ledge and deaths == 3"
      text: "— Упорный дурак, — Гриди качает головой. — Таких тупых нубов я ещё не встречал. Мне даже нравится."
    - if: "not flag.gnome and not flag.ph_ledge and deaths >= 4"
      text: "— Ты, случаем, не из мазохистов? — интересуется Гриди. — Главное, нуб, никогда не изменяй себе."
    - if: "flag.ph_ledge and var.jumps >= 3"
      text: "Уровни сыплются, как листья. Ещё немного — и вы будете таким же мелким, как любой нуб в лесу."
  choices:
    - label: "Встать и идти"
      goto:
        - { if: "flag.gnome", goto: end_gnome }
        - { if: "flag.ph_ledge", goto: ledge }
        - { if: "flag.chaos_dead", goto: captured }
        - { if: "flag.ret_trap2", goto: trap2 }
        - { if: "flag.ret_gridi_lepr", goto: gridi_lepr }
        - { if: "flag.ret_gridi_norm", goto: gridi_norm }
        - { if: "flag.ret_night", goto: night1 }
        - { if: "flag.ret_grind", goto: rat_grind }
        - { goto: rat_bargain }
