# «Кисляк над Перекрёстком» (короткая) — одна ночь расследования в стабе, который вот-вот сбросится.
# Вор — Клим (Совет): спрятал якорь в старом автопарке, подбросил улики на Пепельных, хочет продать якорь Институту.
id: kislyak
title: "Кисляк над Перекрёстком"
version: 1
mode: system
order: 3
length: "30–40 минут"
about: "Стабильный кластер получает таймер сброса. Одна ночь, чтобы узнать почему."
teaser: >
  Стабы не перезагружаются никогда — на этом держится вся жизнь на Континенте. Но этим вечером
  у каждого в стабе «Перекрёсток» загорается одна и та же строка: «Перезагрузка через 24:00».
  Вы здесь всего вторую неделю. Вам не верят, вас не жалко — поэтому именно вас и пошлют туда,
  куда своих не пошлют.
start: evening
ask_name: "Как вас окрестили в стабе? Напишите имя сообщением."
default_name: "Нулёвка"

vars:
  luck:     { start: 2, label: "Удача", show: true }
  humanity: { start: 1, label: "Гуманность", show: true }
  t_council: { start: 0 }   # доверие Совета
  t_inst:    { start: 0 }   # доверие Института
  t_ash:     { start: 0 }   # доверие Пепельных
  evidence:  { start: 0 }   # улик против Клима (считается при обвинении)
  saved:     { start: 0 }   # сколько выведено при Исходе (в десятках)

items:
  spores: { name: "Споран" }
  salts:  { name: "Нюхательная соль Мирры" }
  pearl:  { name: "Чёрная жемчужина" }
  anchor: { name: "Якорь", keep_on_death: false }

time:
  limit: 12
  label: "Ночь: {time} ч из 12"
  on_limit: final_choice

death:
  lives: 2
  respawn: respawn
  final: final_death
  time_cost: 2
  message: "Жизнь {deaths} закончилась. Причина: {cause}. Осталось жизней: {lives}. Ночь не ждёт: прошло два часа."
