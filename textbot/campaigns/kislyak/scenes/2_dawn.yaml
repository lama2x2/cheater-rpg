# Глава 2. Слежка, автопарк, обвинение, рассвет. Концовки.

- id: follow_klim
  text: |
    За полночь Клим выходит из лавки с фонарём и, озираясь, идёт к задним воротам. Охранник
    у ворот отворачивается раньше, чем Клим подходит. Дальше — пустырь, ржавые остовы
    автобусов и бетонный забор старого автопарка.
  choices:
    - label: "Красться следом, держась тени ☠"
      roll:
        chance: "50 + var.luck * 10"
        success:
          text: "Клим не оборачивается. Он заходит в бокс номер четыре и выходит через минуту — уже без сумки. Вы знаете, где искать."
          effects: ["set flag.knows_depot"]
          goto: square
        fail:
          text: "Под ногой хрустит стекло. Клим оборачивается — и свистит. Из темноты выходят двое с обрезами."
          goto: caught_klim
    - label: "Отстать и не рисковать"
      text: "Вы видите только, что фонарь уходит в сторону старого автопарка."
      effects: ["set flag.knows_depot"]
      goto: square

- id: caught_klim
  text: |
    — Нулёвочка, — Клим вздыхает, как над разбитой витриной. — Ну зачем ты так. Мы же могли
    договориться. Места в грузовике, жемчуг. А теперь…
  choices:
    - label: "Принять его предложение"
      effects: ["item.pearl += 1", "set flag.bribed", "var.humanity -= 1"]
      text: "Клим кладёт вам в ладонь чёрную жемчужину. — Молчи до рассвета. Потом — первое место в первом грузовике."
      system: "Гуманность: −1."
      goto: square
    - label: "Бежать к воротам ☠"
      roll:
        chance: "40 + var.luck * 10"
        success: { text: "Выстрел мимо, второй — по забору. Вы влетаете в ворота стаба, и охранник наконец поворачивается куда надо.", effects: ["set flag.knows_depot"], goto: square }
        fail: { effects: ["die 'обрез у задних ворот'"] }

- id: depot
  chapter: "Автопарк"
  checkpoint: true
  text: |
    Старый автопарк — бетон, ржавчина, ряды пустых боксов. В четвёртом горит свет. Внутри —
    ящик из-под патронов, и двое людей Клима играют на нём в карты, положив обрезы рядом.

    Из ящика сквозь щели пробивается ровное тёплое свечение.
  on_enter: ["set flag.depot_done"]
  choices:
    - label: "Отвлечь их — бросить камень в соседний бокс"
      roll:
        chance: "45 + var.luck * 10"
        success:
          text: "Оба выбегают на грохот. Вы ныряете в бокс, хватаете якорь — он тёплый, как живой, — и уходите задами."
          effects: ["item.anchor += 1"]
          goto: square
        fail:
          text: "Один уходит на звук, второй остаётся и поднимает обрез. Придётся иначе."
          goto: depot_fight
    - label: "Ворваться, пока они заняты картами ☠"
      goto: depot_fight
    - label: "Вернуться и привести Совет"
      text: "Вы возвращаетесь. Без доказательств Совет вряд ли пойдёт за вами ночью — но вы знаете, где якорь."
      goto: square

- id: depot_fight
  text: |
    Вы бросаетесь вперёд. Обрез поворачивается к вам, и время растягивается, как резина.
  choices:
    - label: "Сбить ствол в сторону ☠"
      roll:
        chance: "45 + var.luck * 10"
        success:
          text: "Выстрел уходит в потолок. Вы бьёте — коротко, как учили на крестинах, — и человек Клима оседает. Второй бежит. Якорь — в ваших руках."
          effects: ["item.anchor += 1", "var.humanity -= 1"]
          goto: square
        fail:
          effects: ["die 'обрез в автопарке'"]

- id: accuse
  text: |
    Совет собирается снова. Ирбис смотрит на вас единственным глазом: — Ну?
    Клим откидывается на стуле и улыбается.
  again: "Совет собирается во второй раз. Ирбис смотрит тяжело, Клим — весело."
  on_enter:
    - "set flag.accused"
    - "var.evidence = 0"
    - { if: "flag.c_slip", then: ["var.evidence += 1"] }
    - { if: "flag.c_cutter", then: ["var.evidence += 1"] }
    - { if: "flag.c_tea", then: ["var.evidence += 1"] }
    - { if: "flag.c_powder", then: ["var.evidence += 1"] }
    - { if: "flag.c_ledger", then: ["var.evidence += 1"] }
    - { if: "flag.c_offer", then: ["var.evidence += 1"] }
    - { if: "flag.c_button", then: ["var.evidence += 1"] }
  extra:
    - if: "var.evidence >= 3"
      text: "У вас достаточно, чтобы сказать вслух. Ножницы, чай, жемчуг, разговор с Институтом — всё ведёт к одному человеку."
    - if: "var.evidence < 3"
      text: "Улик у вас немного. Хватит ли?"
  choices:
    - label: "«Якорь взял Клим»"
      goto:
        - { if: "var.evidence >= 3", goto: accuse_ok }
        - { goto: accuse_weak }
    - label: "«Это Пепельные»"
      effects: ["var.t_ash -= 3"]
      goto: accuse_wrong
    - label: "«Это Институт»"
      effects: ["set flag.blamed_inst", "var.t_inst -= 3"]
      goto: accuse_wrong

- id: accuse_ok
  text: |
    Вы выкладываете всё по порядку. С каждой уликой Клим улыбается чуть меньше. На
    пуговице или на жемчуге в книге Гуся — неважно на чём — он ломается: краснеет, потом
    белеет, потом говорит, что хотел как лучше. Что стаб всё равно обречён. Что он просто
    хотел вывезти людей на деньги Института.

    — Своих людей, — уточняет Ирбис. — Тех, кто заплатит. Где якорь, Клим?
  on_enter: ["var.t_council += 2", "set flag.klim_caught"]
  system: "Задание «Якорь»: вор найден."
  choices:
    - label: "Идти с охраной Ирбиса в автопарк"
      if: "item.anchor == 0"
      effects: ["item.anchor += 1", "time += 1", "set flag.depot_done"]
      text: "Бокс номер четыре. Люди Клима сдаются без выстрела, увидев Ирбиса. Якорь отдают вам — Ирбис кивает: «Ты нашёл, тебе и нести»."
      goto: square
    - label: "Вернуться на площадь"
      goto: square

- id: accuse_weak
  text: |
    Вы говорите — и слышите, как неубедительно это звучит. Клим смеётся, разводит руками:
    нулёвка, две недели в стабе, наслушался сплетен. Совет переглядывается.

    — Принеси больше, — бросает Ирбис. — Или не трать наше время.
  again: "Новая улика тонет в общем гуле. Клим уже не смеётся — скучает. — Мало, — говорит Ирбис. — Всё ещё мало."
  on_enter: ["var.t_council -= 1", "time += 1", "clear flag.accused"]
  choices:
    - label: "Уйти искать дальше"
      goto: square

- id: accuse_wrong
  text: |
    Слово сказано — и Совет хватается за него, потому что так проще.
  extra:
    - if: "not flag.blamed_inst"
      text: "Через полчаса толпа с факелами стоит у часовни. Пепельных вытаскивают на площадь. Пастух не сопротивляется; он только смотрит на вас — без злости, с жалостью."
    - if: "flag.blamed_inst"
      text: "Через полчаса охотники окружают палатки Института. Приборы летят в грязь, охрану разоружают. Ланская не спорит — только смотрит на вас поверх очков, как на неудавшийся опыт."
    - if: "flag.wrong_accused"
      text: "Якоря у них, конечно, нет. Но ночь уже потрачена, а Клим улыбается."
  on_enter: ["var.humanity -= 2", "time += 2", "set flag.wrong_accused"]
  system: "Гуманность: −2."
  choices:
    - label: "Вернуться на площадь"
      goto: square

- id: respawn
  text: |
    Респ у колодца на площади. Холодная земля, тусклые звёзды. Строка перед глазами всё та же,
    только часов в ней стало меньше. Ночь продолжилась без вас.
  choices:
    - label: "Встать"
      goto: square

# ---------- рассвет ----------

- id: final_choice
  chapter: "Рассвет"
  checkpoint: true
  text: |
    Рассвет. Совет собирается в последний раз. Люди стоят на площади с узлами и детьми.
    Кто-то молится, кто-то пьёт, кто-то просто смотрит на строку перед глазами.

    Все ждут, что скажете вы.
  system: "Кластер «Перекрёсток»: перезагрузка через 12:00. Внимание: дальнейшие решения пересмотру не подлежат."
  extra:
    - if: "item.anchor > 0"
      text: "Якорь у вас в руках — тёплый, гудящий. Ланская из Института не сводит с него глаз. Пастух — тоже."
    - if: "item.anchor == 0"
      text: "Якоря у вас нет. Значит, выбор у стаба небольшой."
    - if: "flag.klim_caught"
      text: "Клим сидит под охраной у стены штаба и не поднимает глаз."
  choices:
    - label: "Вернуть якорь на место"
      if: "item.anchor > 0 and (var.t_inst >= 1 or flag.mirra_knows)"
      locked: "Нужен якорь и тот, кто знает, как его вернуть (Институт или Мирра)"
      goto: ritual
    - label: "Отдать якорь Пепельным — пусть отпустят"
      if: "item.anchor > 0"
      effects: ["set flag.gave_ash"]
      goto: ashes_end
    - label: "Продать якорь Институту и уйти богатым"
      if: "item.anchor > 0 and not flag.blamed_inst"
      effects: ["set flag.sold", "item.pearl += 3"]
      goto: ashes_end
    - label: "Уводить людей — Исход"
      goto: exodus_prep
    - label: "Остаться с Пепельными встречать сброс ☠"
      if: "item.anchor == 0"
      effects: ["set flag.joined_ash"]
      goto: ashes_end

- id: ritual
  text: |
    Подвал под башней. Мирра держит фонарь. Якорь ложится в нишу — и ничего не происходит.

    — Ему нужен проводник, — говорит Мирра. — Живой. Кто-то должен взяться за него и не
    отпускать, пока шов не схватится. Мама так сделала. Значит, и я смогу.
  extra:
    - if: "var.t_inst >= 1"
      text: "Ланская из Института сверяется с приборами и кивает: всё так, без проводника шов не схватится."
    - if: "not flag.mirra_knows"
      text: "Вы не знали, что Мирра связана с якорем. Она, похоже, знала всегда."
  choices:
    - label: "Позволить Мирре"
      effects: ["set flag.mirra_paid"]
      goto: anchor_end
    - label: "«Нет. Я» (−1 жизнь) ☠"
      effects: ["set flag.self_paid", "lives -= 1"]
      text: "Вы берёте якорь в ладони. Холод входит в пальцы, в локти, в сердце. Где-то далеко Система отсчитывает что-то, похожее на жизни."
      goto: anchor_end

- id: exodus_prep
  text: |
    Колонна строится у главных ворот: тележки, рюкзаки, дети на плечах. Ирбис командует,
    охотники встают в голову и хвост. Двенадцать часов до сброса — хватит, чтобы уйти за
    границу кластера, если не мешкать.
  on_enter:
    - "var.saved = 2"
    - { if: "var.t_council >= 1", then: ["var.saved += 2"] }
    - { if: "flag.warned", then: ["var.saved += 1"] }
    - { if: "flag.klim_caught", then: ["var.saved += 2"] }
    - { if: "var.t_ash >= 1", then: ["var.saved += 1"] }
  extra:
    - if: "flag.klim_caught"
      text: "Грузовики Клима теперь везут не тех, кто заплатил, а тех, кто не дойдёт сам."
    - if: "flag.warned"
      text: "Те, кого вы предупредили в баре, собрались первыми — и помогают остальным."
    - if: "var.t_ash >= 1"
      text: "Пастух со своими несёт на носилках стариков. — Сброс — милость, — говорит он. — Но не для них."
  choices:
    - label: "Вести колонну"
      goto: exodus_end

# ---------- концовки ----------

- id: anchor_end
  text: |
    Сначала гаснет строка. Не у вас — у всех сразу: «Перезагрузка через…» мигает и пропадает,
    будто её и не было. Потом над площадью кто-то кричит — от радости. Потом ещё кто-то.

    Стаб остаётся стабом. Шов схватился.
  system: "Кластер «Перекрёсток»: статус — стабильный. Задание «Якорь»: выполнено."
  extra:
    - if: "flag.mirra_paid"
      text: "Мирра выходит из подвала седой. Ей тридцать лет, и она седая. Она улыбается и говорит, что это ничего. Вы знаете, что это не ничего."
    - if: "flag.self_paid"
      text: "Вы выходите из подвала на чужих ногах. Строка жизней перед глазами стала короче. Мирра поддерживает вас под руку и молчит — она знает цену."
    - if: "flag.klim_caught"
      text: "Клима выставят за ворота с одним рюкзаком. Ирбис говорит, что это милосердие. Наверное, так и есть."
    - if: "flag.wrong_accused and not flag.blamed_inst"
      text: "Пепельные уходят из стаба сами. Пастух на прощание кивает вам. Без злости — и от этого хуже."
    - if: "flag.blamed_inst"
      text: "Институт сворачивает лагерь в тот же день. Ланская уезжает, не попрощавшись."
  ending: { id: anchor, title: "Якорь" }

- id: exodus_end
  text: |
    Колонна выходит за ворота на рассвете и к полудню пересекает трещину в асфальте —
    границу кластера. Позади, ровно в назначенный час, воздух над «Перекрёстком» дрожит,
    как над костром, — и стаб становится просто кластером. Обычным. Перезагружаемым.
  system: "Задание «Якорь»: провалено. Задание «Исход»: выполнено."
  extra:
    - if: "var.saved >= 7"
      text: "Вы вывели почти всех. Ирбис жмёт вам руку и говорит: «Новый стаб построим. Люди — вот якорь». Звучит как из книжки. Но он прав."
    - if: "var.saved >= 4 and var.saved < 7"
      text: "Вы вывели больше половины. Остальные не поверили, не успели, не захотели. Ирбис считает потери и молчит."
    - if: "var.saved < 4"
      text: "Дошли немногие. Те, кто был рядом, когда вы позвали. Остальных сброс застал там, где они были."
    - if: "item.anchor > 0"
      text: "Якорь вы несёте с собой — тёплый и бесполезный теперь. Может, когда-нибудь он пригодится другому стабу."
    - if: "flag.bribed"
      text: "Чёрная жемчужина Клима жжёт карман. Первое место в первом грузовике вы так и не заняли."
  ending: { id: exodus, title: "Исход" }

- id: ashes_end
  text: |
    В назначенный час воздух над стабом дрожит, как над костром, — и «Перекрёсток»
    перестаёт быть стабом. Дома, склады, штаб, часовня — всё уйдёт при первом же сбросе,
    а на их месте появится что-то чужое.
  extra:
    - if: "flag.gave_ash"
      text: "Пепельные уносят якорь к реке, и вы смотрите, как Пастух опускает его в воду. — Спасибо, — говорит он и даёт вам горсть жемчуга. Вы не знаете, правильно ли поступили. Он — знает."
    - if: "flag.sold"
      text: "Ланская платит щедро: три чёрные жемчужины и место в машине Института. Вы уезжаете богатым. В зеркале заднего вида на площади стоят люди с узлами, которым места не хватило."
    - if: "flag.joined_ash"
      text: "Вы сидите в часовне вместе с Пепельными, когда воздух начинает дрожать. Пастух берёт вас за руку. Что было дальше, Система описать не может."
    - if: "flag.klim_caught"
      text: "Клима вы нашли. Но стаб это не спасло."
  system: "Кластер «Перекрёсток»: статус — обычный. Задание «Якорь»: провалено."
  ending: { id: ashes, title: "Пепел" }

- id: final_death
  text: |
    Строка жизней гаснет. Ночь над «Перекрёстком» продолжается без вас — и рассвет
    наступит без вас, и решать будут другие.
  system: "Жизни исчерпаны. Задание «Якорь»: передано другому исполнителю."
  ending: { id: final, title: "Окончательная смерть" }
