# Глава 1. Ночь расследования: площадь и места.

- id: evening
  chapter: "Вечер"
  text: |
    Вечер в стабе «Перекрёсток» начинался как обычно: бочка с огнём на площади, очередь к
    Мирре, Гусь протирает стаканы, Клим торгуется за каждый споран. Вы здесь вторую неделю —
    после крестин, после первого живчика, после того, как поняли, что Континент — это навсегда.

    А потом у всех одновременно дёрнулись глаза. Строка появилась у каждого: у торговца,
    у охранника на вышке, у ребёнка, у вас.
  system: "Кластер 749-210-03 «Перекрёсток»: перезагрузка через 24:00."
  choices:
    - label: "Посмотреть на людей вокруг"
      goto: panic

- id: panic
  text: |
    Тишина длится секунду. Потом кто-то роняет кружку, кто-то смеётся — истерично, — кто-то
    уже бежит к воротам. Стабы не перезагружаются. Никогда. На этом стоит всё.

    Старшина Ирбис, седой и одноглазый, забирается на бочку и орёт, перекрывая гул: — Тихо!
    Совет — в штаб, немедленно. Остальным — ждать. Никто никуда не бежит!

    Его взгляд падает на вас. — Новенький. Ты. За мной.
  choices:
    - label: "Идти за Ирбисом"
      goto: briefing

- id: briefing
  text: |
    В штабе пахнет табаком и страхом. Ирбис говорит коротко: под водонапорной башней, в
    старом подвале, лежал якорь — штука, которую нашли здесь основатели. Никто толком не
    знает, что это. Но пока якорь лежал на месте, стаб был стабом. Сегодня днём он пропал.

    — Своим я верить не могу, — говорит Ирбис. — Кто-то из своих и взял. А ты тут две недели,
    ни с кем не повязан. У тебя ночь. На рассвете Совет решает: уходим всем стабом или…
    — он не договаривает. — Найди мне вора. Или якорь. Лучше и то и другое.
  system: "Получено задание: «Якорь». Срок: рассвет."
  choices:
    - label: "«С чего начать?»"
      if: "not flag.asked_start"
      effects: ["set flag.asked_start"]
      text: "— С подвала, — Ирбис пожимает плечами. — Или с людей. Совет заседает до полуночи. Институт стоит лагерем за складами. Пепельные молятся в старой часовне. Гусь знает всё, что говорят в баре. Мирра знает всё, что у людей болит."
    - label: "Выйти на площадь"
      goto: square

- id: square
  chapter: "Ночь"
  checkpoint: true
  text: |
    Площадь стаба. Огонь в бочке, тени людей, шёпот. Кто-то уже грузит скарб на тележки,
    кто-то сидит на земле, обхватив голову. Над всем этим висит строка, которую видит каждый.
  again: "Вы снова на площади. Огонь в бочке, шёпот, строка над головами."
  extra:
    - if: "time >= 8"
      text: "Небо на востоке светлеет. До рассвета — считанные часы."
    - if: "flag.c_frame"
      text: "Вы знаете: воск в подвале подбросили, чтобы подумали на Пепельных."
    - if: "flag.knows_depot"
      text: "Якорь, скорее всего, в старом автопарке за задними воротами."
    - if: "item.anchor > 0"
      text: "Якорь у вас. Тёплый, тяжёлый, и вам кажется, что он гудит."
  choices:
    - label: "Совет в штабе (1 ч)"
      if: "not flag.v_council"
      effects: ["set flag.v_council", "time += 1"]
      goto: council
    - label: "Подвал под башней (1 ч)"
      if: "not flag.v_tower"
      effects: ["set flag.v_tower", "time += 1"]
      goto: tower
    - label: "Знахарка Мирра (1 ч)"
      if: "not flag.v_healer"
      effects: ["set flag.v_healer", "time += 1"]
      goto: healer
    - label: "Бар Гуся (1 ч)"
      if: "not flag.v_bar"
      effects: ["set flag.v_bar", "time += 1"]
      goto: bar
    - label: "Лагерь Института (1 ч)"
      if: "not flag.v_inst"
      effects: ["set flag.v_inst", "time += 1"]
      goto: institute
    - label: "Часовня Пепельных (1 ч)"
      if: "not flag.v_ash"
      effects: ["set flag.v_ash", "time += 1"]
      goto: ashen
    - label: "Проследить за Климом (2 ч)"
      if: "(flag.c_slip or flag.c_cutter) and not flag.followed and item.anchor == 0"
      effects: ["set flag.followed", "time += 2"]
      goto: follow_klim
    - label: "В старый автопарк за якорем (2 ч)"
      if: "flag.knows_depot and item.anchor == 0 and not flag.depot_done"
      effects: ["time += 2"]
      goto: depot
    - label: "Назвать вора Совету"
      # улик больше, чем при прошлом обвинении (var.evidence — их число тогда; в начале 0)
      if: "not flag.accused and flag.c_slip + flag.c_cutter + flag.c_tea + flag.c_powder + flag.c_ledger + flag.c_offer + flag.c_button > var.evidence"
      locked: "Нужна улика — хотя бы одна новая"
      goto: accuse
    - label: "Лавка Клима, пока хозяин на Совете (1 ч)"
      if: "not flag.v_shop"
      effects: ["set flag.v_shop", "time += 1"]
      goto: shop
    - label: "На стене кричат — бежать на помощь (1 ч) ☠"
      if: "time >= 4 and not flag.v_wall"
      effects: ["set flag.v_wall", "time += 1"]
      goto: wall
    - label: "Послушать, о чём шепчутся у бочки (1 ч)"
      if: "not flag.sat_fire"
      effects: ["set flag.sat_fire", "time += 1"]
      text: "Огонь трещит. Люди вокруг шепчутся о грузовиках Клима и о том, что Пепельные что-то знают. Час уходит, как вода в песок."
    - label: "Посидеть у огня, подумать (1 ч)"
      effects: ["time += 1"]
      text: "Ещё час у огня. Мысли ходят по кругу, как искры над бочкой."
    - label: "Хватит. Идти к Совету с решением"
      if: "time >= 6 or item.anchor > 0"
      locked: "Ночь только началась — Совет ждёт до рассвета"
      effects: ["time = 12"]
      text: "Совет соберётся только на рассвете. Остаток ночи вы сидите на ступеньках штаба и ждёте — ждать тоже надо уметь."
      goto: final_choice

- id: shop
  text: |
    Лавка Клима заперта, но мальчишка-подмастерье Шнур, которого Клим оставил стеречь товар,
    за пару споранов пускает вас внутрь — «только ничего не трогай».

    Полки ломятся: консервы, патроны, батарейки, свечи пачками. На витрине у окна — пустое
    место с аккуратно вырезанным в бархате силуэтом. Тут что-то лежало. Что-то большое.
  choices:
    - label: "«Шнур, что лежало на витрине?»"
      if: "not flag.asked_shnur"
      effects: ["set flag.asked_shnur", "set flag.c_cutter"]
      text: "— Ножницы гидравлические, — Шнур пожимает плечами. — Хозяин днём забрал, сказал, на ремонт. Хорошие ножницы, их никто не покупал, дорогие."
    - label: "Посмотреть на свечи"
      if: "not flag.saw_candles"
      effects: ["set flag.saw_candles"]
      text: "Белые свечи, пачка надорвана, двух не хватает. Такие же капли вы видели — или ещё увидите — в подвале под башней."
    - label: "Уйти, пока Клим не вернулся"
      goto: square

- id: wall
  text: |
    На восточной стене паника: что-то лезет снаружи по сваренным листам — длинное, тощее,
    на ногах, гнущихся назад. Охранник на вышке палит в темноту, не попадая. Люди внизу
    разбегаются.

    Тварь уже на гребне стены.
  choices:
    - label: "Отвлечь её факелом из бочки ☠"
      roll:
        chance: "50 + var.luck * 10"
        success:
          text: "Вы машете огнём, тварь шипит и пятится — прямо под выстрел охранника. Падает за стену. Люди хлопают вас по плечам."
          system: "Гуманность: +1. Совет это запомнит."
          effects: ["var.humanity += 1", "var.t_council += 1"]
          goto: square
        fail:
          effects: ["die 'тварь на восточной стене'"]
    - label: "Уводить людей от стены, а не геройствовать"
      text: "Вы загоняете людей в склад и закрываете двери. Через минуту тварь срывается вниз — уже мёртвая: охранник всё-таки попал."
      effects: ["var.humanity += 1"]
      goto: square

- id: council
  text: |
    Совет: Ирбис, двое старых охотников, хозяйка складов и Клим — круглый, румяный, в
    жилетке с часами на цепочке. Клим говорит больше всех: надо уходить, у него есть
    грузовики, места хватит не всем, но он готов «взять расходы на себя». Если, конечно,
    Совет потом компенсирует.

    — Вор — Пепельные, — говорит Клим. — Кому ещё нужен сброс? Они же молятся на него.
  choices:
    - label: "«Где именно лежал якорь?»"
      if: "not flag.c_slip"
      effects: ["set flag.c_slip"]
      text: "Ирбис открывает рот, но Клим успевает первым: — В нише, за решёткой, под третьей ступенькой, все же знают. — Ирбис медленно поворачивается к нему. — Все — не знают, Клим. Знали трое. Клим смеётся: слухи, мол."
    - label: "Поддержать план Исхода"
      if: "not flag.backed_exodus"
      effects: ["set flag.backed_exodus", "var.t_council += 1"]
      text: "Ирбис кивает вам: «Хотя бы один здравый голос». Клим улыбается шире."
    - label: "Уйти"
      goto: square

- id: tower
  text: |
    Подвал под водонапорной башней: сырость, плесень, лестница в двенадцать ступенек.
    У дальней стены — ниша. Решётка срезана: срез ровный, блестящий. Не ножовка —
    гидравлические ножницы. На весь стаб такие одни, на витрине в лавке Клима.

    На полу — капли воска. Свечного, белого, свежего. На ступеньке спит охранник Сыч —
    так крепко, что не просыпается, когда вы светите ему в лицо.
  on_enter: ["set flag.c_cutter", "set flag.c_wax"]
  choices:
    - label: "Растолкать Сыча"
      if: "item.salts == 0 and not flag.c_tea and not flag.shook_sych"
      effects: ["set flag.shook_sych"]
      text: "Сыч мычит, отмахивается и снова храпит. Это не сон — это что-то посильнее. Без снадобья не разбудить."
    - label: "Сунуть Сычу под нос соль Мирры"
      if: "item.salts > 0 and not flag.c_tea"
      locked: "Нужно что-то, что поднимет его на ноги"
      effects: ["set flag.c_tea", "item.salts -= 1"]
      text: "Сыч подскакивает, кашляя. — Чего?! Я не спал! … Чай. Клим вечером чай принёс, с мятой, говорит, в такую жару самое то. А потом… потом вы."
    - label: "Осмотреть нишу внимательнее"
      if: "not flag.niche"
      effects: ["set flag.niche"]
      roll:
        chance: "40 + var.luck * 10"
        success:
          text: "В щели под нишей что-то блестит: пуговица от жилетки. Медная, с выбитым якорьком — у Клима все такие."
          system: "Удача: сработала."
          effects: ["set flag.c_button"]
        fail:
          text: "Пыль, мышиный помёт, больше ничего."
    - label: "Подняться наверх"
      goto: square

- id: healer
  text: |
    Мирра — худая, строгая, с руками в травяной пыли — перевязывает парня, который в панике
    налетел на колючку. На вас смотрит устало. — Если ты про якорь, — говорит она, не
    оборачиваясь, — то я его не брала. Я его… берегла. Моя мать была среди основателей.
  again: "Мирра снова склоняется над раненым и ждёт, что вы скажете."
  choices:
    - label: "«Кто покупал у вас снотворное?»"
      if: "not flag.asked_powder"
      effects: ["set flag.asked_powder"]
      goto:
        - { if: "var.humanity >= 2", goto: healer_trust }
        - { goto: healer_secret }
    - label: "«Теперь скажете, кто брал снотворное?»"
      if: "flag.powder_refused and var.humanity >= 2 and not flag.c_powder"
      goto: healer_trust
    - label: "Помочь ей с ранеными (1 ч)"
      if: "not flag.helped_mirra"
      effects: ["set flag.helped_mirra", "time += 1", "var.humanity += 1"]
      system: "Гуманность: +1."
      text: "Вы держите, она шьёт. Ещё одного, потом ещё. К концу часа Мирра впервые смотрит на вас как на человека, а не на нулёвку."
    - label: "«Что вы знаете про якорь?»"
      if: "not flag.mirra_knows"
      effects: ["set flag.mirra_knows"]
      text: "— Его нельзя просто положить обратно. Мама говорила: якорь держится за живого. Кто-то должен стать ему… носителем. Отдать ему часть себя. Основатели отдали. Поэтому их так мало осталось."
    - label: "Попросить средство, чтобы разбудить спящего"
      if: "item.salts == 0 and not flag.c_tea"
      effects: ["item.salts += 1"]
      text: "Мирра протягивает пузырёк: — Нюхательная соль. Мёртвого не поднимет, остальных — да."
    - label: "Уйти"
      goto: square

- id: healer_trust
  text: |
    Мирра долго молчит. Потом говорит тихо: — Вчера. Клим. Сонный порошок, двойную дозу.
    Сказал — бессонница от жары. Я дала. Я не думала… — она сжимает губы. — Не говори,
    что от меня.
  on_enter: ["set flag.c_powder"]
  choices:
    - label: "Вернуться к разговору"
      goto: healer

- id: healer_secret
  text: |
    — Я знахарка, а не доносчица, — отрезает Мирра. — Кто что у меня брал — моё дело.
    Докажи, что ты не хуже тех, кого ищешь, — может, тогда поговорим.
  choices:
    - label: "Вернуться к разговору"
      effects: ["set flag.powder_refused"]
      goto: healer

- id: bar
  text: |
    В баре людно и пьяно: кто-то пропивает последнее, кто-то торгует местами в грузовиках
    Клима. Гусь за стойкой вытирает один и тот же стакан уже пятую минуту. Он вас боится —
    это видно.
  choices:
    - label: "«Гусь, кто ходил к задним воротам днём?»"
      if: "not flag.c_ledger and not flag.gus_shut"
      roll:
        chance: "35 + var.luck * 10"
        success:
          text: "Гусь сглатывает и подвигает вам амбарную книгу. В ней — запись его рукой: «Задние ворота, полдень, без вопросов — 1 чёрный». — Клим заплатил. Жемчугом. Сказал, вывезет хлам в старый автопарк. Я не спрашивал. За жемчуг не спрашивают."
          effects: ["set flag.c_ledger", "set flag.knows_depot"]
        fail:
          text: "— Не знаю, не видел, не помню, — Гусь отворачивается. По-хорошему он больше ничего не скажет."
          effects: ["set flag.gus_shut"]
    - label: "Надавить на Гуся при всех"
      if: "not flag.c_ledger"
      effects: ["var.humanity -= 1", "set flag.c_ledger", "set flag.knows_depot"]
      system: "Гуманность: −1."
      text: "Вы хватаете его за ворот при всём баре. Гусь бледнеет и бормочет: Клим, полдень, задние ворота, чёрная жемчужина, «хлам в автопарк». Бар затихает. Теперь об этом знают все — и Клим тоже узнает."
    - label: "Предупредить людей в баре, чтобы собирались заранее"
      if: "not flag.warned"
      effects: ["set flag.warned"]
      text: "Вы встаёте на стул и говорите: собирайте воду, живчик, детей. Кто бы ни победил на Совете, к рассвету надо быть готовыми. Над вами смеются — но начинают собираться."
    - label: "Уйти"
      goto: square

- id: institute
  text: |
    Лагерь Института за складами: три палатки, генератор, приборы на складных столах и
    охрана в одинаковой серой форме. Старшая — Ланская, сухая женщина в очках — принимает
    вас за раскладным столом, не вставая.

    — Якорь — это не артефакт, — говорит она. — Это… шов. Место, где кластер пришит к
    Континенту крепче, чем другие. Мы изучали его пять лет. Без него стаб — обычный кластер.
  again: "Ланская снова смотрит на вас поверх приборов."
  choices:
    - label: "«Вы можете вернуть его на место?»"
      if: "not flag.asked_return"
      effects: ["set flag.asked_return", "var.t_inst += 1"]
      text: "— Можем попробовать. Но нужен проводник — живой иммунный, через которого якорь снова «схватится». Это будет стоить ему дорого. Добровольцев обычно нет."
    - label: "«Вам кто-нибудь предлагал купить что-то редкое?»"
      if: "not flag.c_offer and (not flag.inst_refused or var.t_inst >= 1)"
      goto:
        - { if: "var.t_inst >= 1", goto: inst_offer }
        - { goto: inst_closed }
    - label: "Уйти"
      goto: square

- id: inst_offer
  text: |
    Ланская снимает очки и долго их протирает. — Вчера ко мне приходил ваш торговец. Клим.
    Намекал, что может достать «нечто уникальное, связанное со стабом», если Институт
    заплатит и вывезет его отсюда первым. Я отказалась. Сегодня у вас пропал якорь.

    Она надевает очки обратно. — Я сказала вам это, потому что вы спросили первым, как его
    вернуть, а не сколько он стоит.
  on_enter: ["set flag.c_offer"]
  choices:
    - label: "Поблагодарить"
      goto: institute

- id: inst_closed
  text: |
    — Институт не обсуждает своих контрагентов, — Ланская возвращается к приборам. —
    Если у вас всё, не отнимайте у нас ночь.
  choices:
    - label: "Вернуться к разговору"
      effects: ["set flag.inst_refused"]
      goto: institute

- id: ashen
  text: |
    В старой часовне пахнет пеплом. Пепельные сидят на полу кругом, человек двадцать, и
    молчат. Их Голос — немолодой мужчина по прозвищу Пастух, лицо в серых разводах — встаёт
    вам навстречу без всякой враждебности.

    — Ты пришёл спросить, не мы ли украли якорь, — говорит он. — Нет. Но и плакать не будем.
    Сброс — это милость. Всё, что тут нажито кровью и ложью, уйдёт. Останется чистая земля.
  choices:
    - label: "«В подвале нашли свечной воск»"
      if: "flag.c_wax and not flag.c_frame"
      effects: ["set flag.c_frame", "var.t_ash += 1"]
      text: "Пастух улыбается. — Мы не жжём свечей. Только пепел — ты видишь. Свечи в стабе продаёт один человек. Тот, кто продаёт всё."
    - label: "«А если бы якорь оказался у вас?»"
      if: "not flag.ash_offer"
      effects: ["set flag.ash_offer"]
      text: "— Мы бы его отпустили, — просто говорит Пастух. — Отнесли бы к реке. И заплатили бы тому, кто принёс, — у нас есть жемчуг, нам он не нужен."
    - label: "Посидеть с ними молча"
      if: "not flag.sat_ash"
      effects: ["set flag.sat_ash", "var.t_ash += 1"]
      text: "Вы садитесь в круг. Тишина у них странная: не пустая, а густая, тёплая. Впервые за вечер у вас перестают дрожать руки."
    - label: "Уйти"
      goto: square
